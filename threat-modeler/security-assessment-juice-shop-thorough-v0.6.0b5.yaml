verdict:
  severity: red
  opening: This web shop lets unauthenticated attackers sign in as any user, including
    administrators, and reach server-side code execution. It should run only as an
    isolated training target, never with real customer data or exposure beyond a controlled
    network.
  bullets:
  - title: Login bypass and database takeover
    body: SQL injection in login and product search lets anonymous internet users
      sign in as anyone, including administrators, and read database contents.
    findings:
    - F-013
    - F-007
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Other customers' records read and changed
    body: Missing ownership checks (IDOR) let any signed-in customer read or modify
      another customer's baskets, orders and exported data.
    findings:
    - F-001
    - F-009
    - F-006
    weaknesses:
    - W-002
    verified_attack_path: true
  - title: Anyone can forge logins
    body: Signing secrets committed to source code let anyone with repository access
      mint valid sessions with any role.
    findings:
    - F-005
    - F-016
    weaknesses:
    - W-007
    - W-008
    verified_attack_path: true
  - title: Self-made administrator accounts
    body: Registration accepts privileged fields (mass assignment), so a new visitor
      can create an account with administrator rights.
    findings:
    - F-038
    weaknesses:
    - W-023
    verified_attack_path: true
  - title: Server takeover through code execution
    body: User-supplied text is evaluated as code in the B2B order and profile handlers,
      risking arbitrary code execution on the server.
    findings:
    - F-048
    - F-033
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Active login stolen from customers
    body: Stored cross-site scripting (XSS) combined with session tokens kept in browser
      storage lets attackers hijack a victim's account.
    findings:
    - F-004
    - F-003
    weaknesses:
    - W-005
    - W-006
    verified_attack_path: false
  closing: Fixing these needs structural changes to data access, authorization and
    secret handling before any use beyond an isolated training setting.
