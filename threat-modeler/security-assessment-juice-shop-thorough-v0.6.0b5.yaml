  - id: AC-T-002
    title: Bulk Data Exfiltration via Broken Object Authorization
    source: mandatory
    actor: Internet Attacker — authenticated low-privilege user
    goal: Enumerate and exfiltrate other users' records, then escalate own permissions
      via unguarded mass assignment.
    prerequisite: Attacker holds a valid, non-privileged user account.
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-006
    - F-038
    blocking_mitigation_ids:
    - M-028
    - M-047
    steps:
    - step: 1
      outcome: Attacker enumerates and retrieves records for arbitrary object IDs;
        no ownership comparison is performed.
      verdict: confirmed
      finding_id: F-006
      evidence:
        file: routes/basket.ts
        line: 19
      controls_found: []
      unverified: false
    - step: 2
      outcome: Update endpoint persists an unfiltered `role` (or equivalent) field
        supplied in the request body.
      verdict: confirmed
      finding_id: F-038
      evidence:
        file: server.ts
        line: 503
      controls_found: []
      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-038
    blocking_mitigation_ids:
    - M-047
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so
        a client-supplied `role` (or `isAdmin`) field is written verbatim.
      verdict: confirmed
      finding_id: F-038
      evidence:
        file: server.ts
        line: 503
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a
      public repo, served by an unauthenticated route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-005
    - F-015
    blocking_mitigation_ids:
    - M-027
    - M-031
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the
        source repository or served without authentication.
      verdict: confirmed
      finding_id: F-005
      evidence:
        file: lib/insecurity.ts
        line: 21
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token
        signed with it (or the leaked credential) is accepted as authentic.
      verdict: confirmed
      finding_id: F-015
      evidence:
        file: routes/chat.ts
        line: 45
      controls_found: []
      unverified: false
  - id: AC-T-007
    title: Privileged Action via Prompt Injection into a Tool-Calling Model
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Make the model invoke a privileged tool or return data the attacker is not
      entitled to, using the application's own authority.
    prerequisite: Attacker can place text into a conversation, document, or record
      that the application later sends to a language model.
    combined_risk: Medium
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-086
    blocking_mitigation_ids:
    - M-091
    steps:
    - step: 1
      outcome: The handler builds the prompt by interpolating request or stored text
        into the same string as the system instructions, so attacker text is read
        as instruction.
      verdict: confirmed
      finding_id: null
      evidence:
        file: routes/chat.ts
        line: 83
      controls_found: []
      unverified: false
    - step: 2
      outcome: Tools exposed to the model run with the application's authority; a
        manipulated model turn therefore performs actions the caller could not.
      verdict: confirmed
      finding_id: F-086
      evidence:
        file: routes/chat.ts
        line: 184
      controls_found: []
      unverified: false
