tier_root_causes:
  edge:
  - Untrusted data rendered via sanitizer bypass or document.write
  - Session JWT kept in script-readable localStorage
  - Client-side trust of unverified claims and client-built credentials
  - OAuth flow lacks state/PKCE; secrets placed in URLs
  - Query parameters concatenated into URLs without encoding
  server:
  - Ownership not enforced; identity taken from request body
  - Auth middleware missing on sensitive routes
  - Request input reaches SQL, NoSQL, template or eval sinks
  - JWT verification lacks signature check and algorithm allowlist
  - Hardcoded secrets, weak crypto, unpinned CI/CD, no rate/size limits
  data:
  - Sensitive data stored unencrypted at rest
