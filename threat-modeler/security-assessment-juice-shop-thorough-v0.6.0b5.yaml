  affected_components:
  - component-191fd03d5dfa5985
  description: Document-store queries take operators or JavaScript predicates from
    application values instead of fixed query structures with typed values. Callers
    can change what a query selects, for example through injected operators or evaluated
    expressions.
  structural_recommendation: build document queries from fixed operator structures,
    coerce request values to the expected scalar types, and disable server-side JavaScript
    evaluation in the database
