- local_id: sqlite-auth-store-006
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded findAll with per-call connection (LegacySqliteUserStore.java:77)
  scenario: findAll() at line 77 issues SELECT without a LIMIT clause, returning every row in legacy_users. The connection()
    helper at line 134 opens a new JDBC connection via DriverManager.getConnection() on every invocation; there is no connection
    pool. An attacker flooding GET /api/legacy-sqlite/users (unauthenticated) causes the application to open a new file handle
    and perform a full table scan on each request, exhausting OS file descriptors and thread pool capacity under sustained
    load.
  attack_steps: null
  evidence_summary: findAll() at line 77 issues 'SELECT ... ORDER BY id' with no LIMIT; connection() at line 134 calls DriverManager.getConnection()
    on every method call with no pool. Architecture confirms the endpoint is unauthenticated.
  impact_description: Sustained request flooding can exhaust application thread pool and OS file descriptors, causing the
    service to stop accepting new connections until the attack subsides.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None — no rate limiting, connection pool, or query result limit is implemented.
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  mitigation_title: Add LIMIT clause to findAll and use a shared connection or connection pool
  remediation:
    effort: Medium
    steps:
    - Add LIMIT ? to the findAll() SELECT statement and expose a page-size parameter capped at a reasonable maximum (e.g.,
      100 rows) to prevent unbounded result sets.
    - Replace the per-call DriverManager.getConnection() in connection() with a SQLite connection pool (e.g., HikariCP configured
      with maximumPoolSize matching the thread pool size) to bound file handle usage.
    - Apply rate limiting on the /api/legacy-sqlite/users endpoint at the Spring Security or API gateway layer (e.g., bucket4j
      or a filter limiting requests per IP per second).
    code_example: null
    verification: Run a load test (e.g., `ab -n 5000 -c 50 http://localhost:8080/api/legacy-sqlite/users`) and confirm the
      application remains responsive (p99 latency stable) and OS file descriptor count does not exceed twice the pool size.
    reference: https://cwe.mitre.org/data/definitions/400.html
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
    line: 77
  violated_requirements: []
  evidence_check: ambiguous
  prior_finding_ref: null
