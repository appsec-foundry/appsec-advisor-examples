  stride: Tampering
  cwe: CWE-89
  title: SQL Injection via Unsanitized Query String Concatenation
  scenario: OrderLookupDao.findByOwnerEmail concatenates the caller-supplied email parameter directly into a native SQL string
    at line 22 without parameterization. An attacker crafts a malicious email value containing SQL metacharacters to alter
    the query logic, reading from or writing to arbitrary H2 tables including vault_credentials.
  attack_steps:
  - 'OrderLookupDao.findByOwnerEmail at line 22 concatenates the payload directly into the SQL string: the resulting query
    becomes a UNION query spanning customer_orders and vault_credentials.'
  - EntityManager.createNativeQuery at line 23 executes the injected SQL against the H2 database, returning vault_credentials
    rows in the response alongside order results.
  - Attacker iterates UNION payloads to dump all rows from app_users and vault_credentials, then crafts UPDATE or INSERT payloads
    to tamper with stored credential or order data.
  evidence_summary: OrderLookupDao.java:22 builds a SQL string by concatenating the `email` parameter with string literals;
    entityManager.createNativeQuery at line 23 executes this unsanitized string against the H2 in-memory database that holds
    vault_credentials and app_users.
  impact_description: An unauthenticated attacker reads or modifies any row in the H2 database, including plaintext credentials
    in vault_credentials and password hashes in app_users, and can persist unauthorized changes for the lifetime of the in-memory
    database.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Spring Data JPA parameterized queries protect auth-service, bff-web, order-service, and document-service
    consumers; OrderLookupDao.findByOwnerEmail is not covered.
  mitigation_title: Replace string concatenation with named parameter binding in OrderLookupDao.findByOwnerEmail
  remediation:
    effort: Low
    steps:
    - 'Replace line 22 in OrderLookupDao.java with a named-parameter native query: `String sql = "select o.* from customer_orders
      o join app_users u on o.owner_id = u.id where u.email = :email order by o.id";` and change line 23 to `entityManager.createNativeQuery(sql,
      CustomerOrder.class).setParameter("email", email).getResultList();`.'
    - Add a unit test for findByOwnerEmail with an input containing SQL metacharacters (e.g., `' OR '1'='1`) and assert that
      the result set contains only records matching that literal email string, not all rows.
    code_example: null
    verification: Call /api/orders/search?email=%27+OR+%271%27%3D%271 and confirm the response contains zero or only legitimately
      matching orders, not all customer_orders rows.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
