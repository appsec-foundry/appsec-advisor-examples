  attack_steps: null
  evidence_summary: XmlPreviewController.java line 22 calls DocumentBuilderFactory.newInstance() with no setFeature('http://apache.org/xml/features/disallow-doctype-decl',
    true) and no entity expansion limit (factory.setAttribute(XMLInputFactory.IS_REPLACING_ENTITY_REFERENCES, false) is absent).
