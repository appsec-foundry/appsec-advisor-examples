tier_root_causes:
  server:
  - Secrets and credentials hardcoded in source files and container config
  - Authentication and authorization absent or bypassed on sensitive endpoints
  - User input concatenated directly into SQL, shell commands, and file paths
  - Non-standard cryptographic primitives (XOR, MD5, ECB) with static keys
  - No rate limiting, size caps, or query bounds on unauthenticated endpoints
  data:
  - Superuser credentials hardcoded in version-controlled compose files
  - Data stores reachable via unauthenticated HTTP console with blank password
  - Passwords stored without hashing in SQLite and H2 schema definitions
  - Unpinned image tags allow supply-chain substitution of data containers
  - No resource limits on database containers allow host resource exhaustion
