  - Elevation of Privilege
  stride: Tampering
  cwe: CWE-22
  title: Path Traversal in File Upload (web/BusinessFileStorage.java:23)
  scenario: An authenticated user submits POST /documents with a multipart body whose Content-Disposition filename contains
    '../' sequences such as '../../../../etc/cron.d/evil'. BusinessFileStorage.store() assigns the raw client-supplied name
    to fileName via getOriginalFilename() at line 17 without stripping directory components, then calls directory.resolve(fileName)
    at line 23. Java's Path.resolve() propagates relative traversal sequences, producing a resolved path outside the intended
    'runtime/uploads/' root. file.transferTo(target) at line 24 writes attacker-controlled bytes to that resolved path, overwriting
    any file the process has permission to write.
  attack_steps:
  - 'Attacker authenticates as a regular user and submits POST /documents with Content-Disposition: form-data; name="upload";
    filename="../../../../etc/cron.d/evil" containing a malicious cron payload.'
  - BusinessFileStorage.store() at line 17 stores the raw client filename in fileName without filtering; directory.resolve(fileName)
    at line 23 resolves to a path outside 'runtime/uploads/'.
  - file.transferTo(target) at line 24 writes the attacker-controlled content to the resolved path, overwriting the target
    file.
  - If the resolved path falls in a cron directory or servlet deployment directory, the attacker achieves persistent code
    execution as the application process.
  evidence_summary: getOriginalFilename() at line 17 returns the unmodified client filename; directory.resolve(fileName) at
    line 23 applies no Path.getFileName() normalization or '../' rejection before passing the result to file.transferTo(target)
    at line 24, confirming directory escape.
  impact_description: An authenticated document owner can overwrite arbitrary files reachable by the application process.
    Writing to cron job directories or servlet deployment paths escalates to server-level code execution. Writing to application
    configuration overwrites service for all users. This finding matches the known vulnerability recorded in the component
    manifest.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Strip directory components from uploaded filenames before path resolution in BusinessFileStorage
  remediation:
    effort: Low
    steps:
    - At line 23, replace 'directory.resolve(fileName)' with 'directory.resolve(Path.of(fileName).getFileName())' to discard
      any leading path components. Reject the upload with HTTP 400 if getFileName() returns null or the resulting name is
      blank.
    - Add an integration test that uploads a file named '../../etc/passwd' via POST /documents and asserts the file is written
      only inside 'runtime/uploads/' and that no file appears outside that directory root.
    code_example: "Path safeName = Path.of(fileName).getFileName();\nif (safeName == null || safeName.toString().isBlank())\
      \ {\n    throw new ResponseStatusException(HttpStatus.BAD_REQUEST, \"Invalid filename\");\n}\nPath target = directory.resolve(safeName);"
