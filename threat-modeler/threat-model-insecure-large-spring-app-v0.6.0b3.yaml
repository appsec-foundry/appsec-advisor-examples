  additional_categories:
  - TH-12
  stride: Denial of Service
  cwe: CWE-611
  title: XXE entity expansion DoS via default DocumentBuilderFactory in parseXml
  scenario: An attacker with SUPPORT or OPERATIONS role submits a billion-laughs XML payload to /api/landscape/support-cases,
    /knowledge-base, /notifications, or /workflows; parseXml() processes it with a default DocumentBuilderFactory that has
    no entity expansion limit, causing exponential memory allocation that exhausts the JVM heap and crashes the service.
  attack_steps: null
  evidence_summary: parseXml() at lines 42-44 creates a DocumentBuilderFactory with DocumentBuilderFactory.newInstance() and
    no subsequent calls to setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true) or setExpandEntityReferences(false); this
    default configuration resolves XML external entities and performs unbounded entity expansion; LandscapeServiceController.java:44-47
    exposes four authenticated routes that pass the caller-supplied `xml` parameter to this method.
  impact_description: A single crafted request exhausts the JVM heap, crashing the Landscape Orchestrator and taking offline
    all 30 portfolio management endpoints and the 50-service landscape it coordinates, causing a full service outage.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: '@PreAuthorize(''hasAnyRole(ADMIN, SUPPORT)'') on /support-cases and /knowledge-base; @PreAuthorize(''hasAnyRole(ADMIN,
    OPERATIONS)'') on /notifications and /workflows; no parser hardening present'
  actor_ids:
  - ACT-D-04
  - ACT-D-05
  primary_actor: ACT-D-05
  mitigation_title: Harden DocumentBuilderFactory against entity expansion in parseXml()
  remediation:
    effort: Low
    steps:
    - After DocumentBuilderFactory.newInstance(), call factory.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true) and
      factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true) before building the DocumentBuilder;
      this disables DOCTYPE declarations and external entity processing entirely.
    - Add a test that submits a billion-laughs payload (nested entity definitions expanding to >100 MB) and asserts the parse
      throws an exception rather than allocating that memory.
    code_example: null
    verification: Run the test with the billion-laughs payload and confirm a SAXParseException is thrown within 100 ms with
      heap usage below 50 MB.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
