  title: SSRF via unvalidated RestTemplate URL (serverside/IntegrationController.java:23)
  scenario: An unauthenticated attacker issues GET /api/integration/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/ec2-role.
    IntegrationController.fetch() passes the raw url parameter directly to restTemplate.getForObject(url, String.class) on
    line 23 without scheme restriction, host allowlist, or private-range blocking. The Spring application server makes an
    outbound HTTP request to the attacker-supplied address and returns up to 2000 bytes of the response body. On a cloud host
    this yields IAM role credentials granting AWS API access.
  attack_steps:
  - Attacker issues GET /api/integration/fetch?url=http://169.254.169.254/latest/meta-data/ with no credentials to the publicly
    accessible unauthenticated endpoint.
  - RestTemplate.getForObject() initiates an outbound HTTP request to the cloud metadata endpoint, receiving the role name
    from the instance metadata service.
  - Attacker follows up with the role-specific URL to retrieve temporary AWS credentials (AccessKeyId, SecretAccessKey, Token)
    returned verbatim in the JSON response body.
  - Attacker uses the harvested credentials to call AWS APIs, pivot to S3 buckets or RDS instances, and escalate within the
    cloud account.
  evidence_summary: IntegrationController.java line 23 calls restTemplate.getForObject(url, String.class) where url is the
    raw @RequestParam value from line 22. No allowlist, scheme filter, or private-IP block is applied. Line 26 echoes the
    attacker-supplied url string back in the response, confirming end-to-end attacker control.
  impact_description: On a cloud-hosted deployment, the attacker extracts instance metadata service credentials enabling full
    cloud account compromise. On any deployment, internal services behind the firewall (databases, admin consoles, monitoring
    agents) become reachable, exposing internal state and enabling lateral movement.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  actor_ids:
  - ACT-D-07
  - ACT-D-04
  primary_actor: ACT-D-07
  mitigation_title: Enforce scheme and host allowlist on RestTemplate outbound fetch in IntegrationController
  remediation:
    effort: Medium
    steps:
    - Before the restTemplate.getForObject() call in IntegrationController.java, validate that the parsed URL uses only https://
      scheme and that the host matches an explicit allowlist of permitted external domains. Reject or throw a 400 for any
      other scheme (file://, http://, ftp://) or host. For cloud deployments additionally block 169.254.169.254 and the IMDSv2
      range at the OS level via iptables.
    - Write an integration test that sends url=http://169.254.169.254/latest/meta-data/ and asserts a 400 or 403 response
