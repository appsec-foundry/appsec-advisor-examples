security_controls:
- domain: Identity and Authentication Controls
  control: Form-Based Authentication with BCrypt Password Hashing
  effectiveness: Partial
  kind: mechanism
  assessment: Spring Security form login configured with BCryptPasswordEncoder (SecurityConfig.java:131). All 14 in-memory
    accounts share the hardcoded password 'password' (SecurityConfig.java:71-127). A parallel legacy path (legacy-auth-service)
    compares cleartext passwords with no hashing. BCrypt is sound; the surrounding user store is not.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
- domain: Identity and Authentication Controls
  control: Signed JWT Authentication (HS256)
  effectiveness: Adequate
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: SignedJwtService issues and verifies HS256 JWTs with an explicit algorithm whitelist check at verify() (SignedJwtService.java:38).
    SignedJwtAuthenticationFilter validates tokens before dispatch to /api/secure-jwt/**. The signing key is ephemeral (lost
    on restart) and not externalized, which is a management weakness but not an exploitable bypass.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/SignedJwtService.java
- domain: Identity and Authentication Controls
  control: Legacy Unsigned JWT Verification
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: LegacyJwtVerifier.readClaims() calls Jwts.parserBuilder().build().parseClaimsJwt() with no signing key (LegacyJwtVerifier.java:15-18).
    JJWT accepts any unsigned token here; an attacker submits a crafted token with arbitrary claims and the verifier returns
    them without signature validation.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacyJwtVerifier.java
- domain: Identity and Authentication Controls
  control: Homegrown Session Token
  effectiveness: Unsafe
  kind: mechanism
  assessment: HomegrownSessionService.issueToken() encodes only the numeric user ID as Base64 with no HMAC or signature (HomegrownSessionService.java:21).
    Any caller who knows a valid user ID constructs a valid session token without authenticating.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/HomegrownSessionService.java
- domain: Identity and Authentication Controls
  control: Legacy SQLite Authentication
  effectiveness: Unsafe
  kind: mechanism
  assessment: LegacySqliteAuthController maps /api/legacy-sqlite/** as permitAll (SecurityConfig.java:40). GET /api/legacy-sqlite/users
    returns all rows including the cleartext password field with no authentication (LegacySqliteAuthController.java:49-54).
    GET /api/legacy-sqlite/login-raw concatenates username and password into raw SQL (LegacySqliteUserStore.java:64), combining
    SQL injection with credential enumeration.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteAuthController.java
- domain: Logging and Monitoring
  control: Credential Exposure in Application Logs
  effectiveness: Unsafe
  kind: mechanism
  assessment: CredentialLoggingFilter.doFilterInternal() logs the plaintext username and password on every POST /login request
    at INFO level (CredentialLoggingFilter.java:25). Every user credential is written to the application log.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Missing
  kind: cross-cutting
  assessment: No structured security event logging is present for authentication failures, authorization denials, privilege
    operations, or anomalous input. The only logging filter present logs cleartext credentials rather than security events.
- domain: Authorization Controls
  control: Route-Level Authentication Enforcement
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHN-001
  assessment: 'SecurityFilterChain closes routes with anyRequest().authenticated() (SecurityConfig.java:48), but permits:
    /h2-console/**, /actuator/**, /api/admin/report, /api/orders/search, /api/documents/search, /api/integration/fetch, /api/files/read,
    /api/tools/lookup, /api/legacy-sqlite/**, /legacy/admin/**, /api/xml/preview, /api/crypto/**, /api/legacy-crypto/** —
    all of which expose sensitive data or destructive operations without authentication.'
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
- domain: Authorization Controls
  control: Object-Level Ownership Authorization (IDOR Prevention)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: OrderAccessController GET /api/orders/{id} returns any order by primary key without ownership verification (OrderAccessController.java:24-29).
    A separate endpoint GET /api/orders/{id}/owned implements an ownership and admin check (OrderAccessController.java:32-44).
    The unprotected primary endpoint is the IDOR surface.
  implementation: src/main/java/com/example/appsecverificationtarget/accesscontrol/OrderAccessController.java
- domain: Authorization Controls
  control: Admin Endpoint Protection
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: LegacyAdminBoardController serves GET /legacy/admin, POST /legacy/admin/users/{id}/promote, and POST /legacy/admin/users/{id}/delete
    with no authentication or authorization (SecurityConfig.java:41, LegacyAdminBoardController.java:22-40). Any unauthenticated
    caller can promote an arbitrary user to admin role or delete accounts.
  implementation: src/main/java/com/example/appsecverificationtarget/legacyadmin/LegacyAdminBoardController.java
- domain: Authorization Controls
  control: Centralised Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHZ-001
  assessment: '@EnableMethodSecurity is present (SecurityConfig.java:22) and some landscape routes carry @PreAuthorize. ProfileController
    PUT /me (line 34) and GET /admin-preferences (line 53) have no confirmed authorization gate. AdminReportController /api/admin
    (line 14) and AdminUserController /api/admin/users (line 12) are marked permitAll, making role checks unreachable for
    those routes.'
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
- domain: Input Handling
  control: Parameterized Database Access (SQL Injection Prevention)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: OrderLookupDao.findByOwnerEmail() concatenates the email parameter into a native SQL string (OrderLookupDao.java:22).
    LandscapeExposureSupport.searchPortfolio() concatenates both serviceCode and query (LandscapeExposureSupport.java:30-32).
    LegacySqliteUserStore.authenticateRaw() concatenates username and password into SQL (LegacySqliteUserStore.java:64). All
    three are reachable without authentication.
  implementation: src/main/java/com/example/appsecverificationtarget/inputvalidation/OrderLookupDao.java
- domain: Input Handling
  control: OS Command Injection Prevention
  effectiveness: Missing
  kind: mechanism
  assessment: ToolController.lookup() passes the caller-supplied 'name' parameter into sh -c via string concatenation (ToolController.java:18).
    LandscapeExposureSupport.runTool() does the same (LandscapeExposureSupport.java:48). No shell escaping, allowlist validation,
    or safe process API is used. Both endpoints are unauthenticated.
