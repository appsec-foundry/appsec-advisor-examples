- local_id: sqlite-auth-store-003
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-312
  title: Cleartext password storage (LegacySqliteUserStore.java:31)
  scenario: The legacy_users table schema at line 31 defines the password column as plain `text`, and save() inserts passwords
    as received without hashing. readUser() at line 130 retrieves the plaintext password field and includes it in every LegacySqliteUser
    object returned by authenticate() and findAll(). Anyone who reads the SQLite file or calls findAll() obtains all user
    passwords in cleartext without needing to crack a hash.
  attack_steps:
  - Attacker obtains runtime/legacy-auth.sqlite via path traversal, an exposed backup, or the unauthenticated metadata endpoint
    that reveals the file's absolute path.
  - The attacker opens the file with any SQLite client and reads the legacy_users table; all passwords appear as plaintext
    (e.g., 'password', 'admin') with no hashing.
  - Attacker reuses the recovered credentials directly against the legacy login endpoint and any other service that shares
    the same password, achieving account takeover without cracking.
  evidence_summary: Line 31 defines `password text not null` in the CREATE TABLE statement — no hashing column, no constraint.
    Lines 37-40 insert 'password' and 'admin' as literal strings. readUser() at line 130 returns `resultSet.getString("password")`
    directly from the database row.
  impact_description: All user credentials including the ADMIN account password are exposed in full whenever the SQLite file
    or the findAll() result is accessible, enabling complete account compromise and credential-stuffing attacks on other services.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — passwords are stored and returned as cleartext with no hashing.
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  mitigation_title: Hash passwords with BCrypt before storage and verify with BCryptPasswordEncoder
  remediation:
    effort: Medium
    steps:
    - Add a BCryptPasswordEncoder bean (spring-security-crypto) and inject it into LegacySqliteUserStore; update save() to
      store BCryptPasswordEncoder.encode(password) instead of the raw string.
    - Update authenticate() to retrieve the stored hash and compare using BCryptPasswordEncoder.matches(rawPassword, storedHash)
      rather than SQL equality on the password column; drop the password column from the WHERE clause to avoid leaking timing
      info.
    - Drop and recreate the legacy_users table on next startup (or migrate existing rows) so no plaintext passwords remain;
      update authenticateRaw() if kept to also use hash comparison.
    - Add a test asserting that no value in the password column of a freshly initialised database begins with a printable
      ASCII character run shorter than 59 characters (BCrypt hashes always start with '$2a$').
    code_example: null
    verification: Run `sqlite3 runtime/legacy-auth.sqlite 'SELECT password FROM legacy_users LIMIT 5'` against the running
      application's database and confirm every row starts with the BCrypt prefix `$2a$`.
    reference: https://cwe.mitre.org/data/definitions/312.html
