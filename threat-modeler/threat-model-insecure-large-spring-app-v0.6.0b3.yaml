- id: web-spa
  name: Web Frontend (nginx)
  description: nginx 1.25 reverse proxy and static content server at the internet edge. Terminates HTTP/HTTPS from browsers
    and forwards traffic into the dmz. No browser-side SPA code exists; all rendering is server-side Thymeleaf.
  paths:
