    allowing injection of additional shell commands via semicolons, pipes, or backticks; LandscapeServiceController.java:48-49
    exposes this via two @PreAuthorize-protected routes accepting `name` as a request parameter.
  impact_description: Full host OS compromise as the JVM service account, with read/write access to all files, the ability
    to exfiltrate service credentials, install persistent malware, and pivot laterally to any of the 50 downstream services
    the orchestrator manages.
