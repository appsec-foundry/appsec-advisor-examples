- local_id: postgres-primary-004
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-798
  title: Hardcoded Credentials Committed to Version Control
  scenario: The postgres superuser password `fixture-local-admin-token` is committed in plaintext to docker-compose.yml at
    line 366. Any developer with repository read access, any CI/CD pipeline secret, or any process that reads the container's
    environment discovers the credential. An attacker then uses it to authenticate directly to the postgres-primary service
    from the data network and exfiltrates the entire crown-jewel database.
  attack_steps:
  - Attacker with repository read access (or CI log access) reads docker-compose.yml and extracts POSTGRES_PASSWORD value
    `fixture-local-admin-token` from line 366.
  - 'Attacker connects to postgres-primary from any container in the data network: `psql -U postgres -h postgres-primary -d
    appsec_primary` using the extracted password.'
  - Attacker issues `\COPY (SELECT * FROM users) TO '/tmp/dump.csv' WITH CSV` and `pg_dump -U postgres appsec_primary` to
    exfiltrate all crown-jewel business records.
  evidence_summary: 'docker-compose.yml line 366 contains `POSTGRES_PASSWORD: **** (25 chars)` in plaintext. This value is
    VCS-committed, appears in `docker inspect` output, and is identical to DB_PASSWORD on auth-service (line 80), confirming
    the password is broadly known within the deployment environment.'
  impact_description: 'Full exfiltration of all business records in the `appsec_primary` database (classified crown-jewel:
    all business records) including user credentials, order data, and project records, exploitable by any actor with repository
    or deployment environment access.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — password is in cleartext in a VCS-committed file with no rotation mechanism.
  actor_ids:
  - ACT-D-05
  primary_actor: ACT-D-05
  mitigation_title: Replace hardcoded POSTGRES_PASSWORD with a Docker secret or vault-injected credential
  remediation:
    effort: Medium
    steps:
    - 'Remove `POSTGRES_PASSWORD` from the environment block in docker-compose.yml; replace with `POSTGRES_PASSWORD_FILE:
      /run/secrets/postgres_superuser_password` and declare a `secrets:` block referencing an externally managed Docker secret
      or vault-agent sidecar.'
    - Rotate the current `fixture-local-admin-token` password immediately with `ALTER USER postgres PASSWORD '<new-random-64-char-value>';`
      and update all service DB connection strings via the same secrets mechanism.
    - Add a CI pre-commit hook or CI lint step using `truffleHog` or `detect-secrets` that fails on any new hardcoded credential
      pattern in docker-compose.yml.
    code_example: null
    verification: Run `grep -r 'fixture-local-admin-token' docker-compose.yml`; expect zero matches. Confirm `docker compose
      config` resolves POSTGRES_PASSWORD_FILE to a secrets mount, not a literal value.
    reference: https://docs.docker.com/compose/how-tos/use-secrets/
