    deserializes the full AppUser from the request body. At line 44 it checks incoming.getRole() != null (true), and at line
    45 sets current.setRole(incoming.getRole()), persisting ''ADMIN''. At line 47 it unconditionally sets current.setAdmin(incoming.isAdmin()),
    persisting admin=true. The updated record is saved to the database. On the user''s next request any ROLE_ADMIN check passes,
    granting full admin access to AdminUsersPageController and AdminReportController endpoints.'
  attack_steps:
  - Attacker registers or authenticates as a regular user (non-admin) and obtains a valid session or JWT token.
  - 'Attacker sends PUT /api/profile/me with Content-Type: application/json body {"role": "ADMIN", "admin": true}.'
  - ProfileController.update() at lines 44-47 applies incoming.getRole() and incoming.isAdmin() to the current user record
    without checking the caller's existing role, then saves via appUserRepository.save(current).
  - Attacker's next authenticated request carries ROLE_ADMIN, passing all @PreAuthorize("hasRole('ADMIN')") checks on AdminUsersPageController
    and any other admin-gated endpoint.
  evidence_summary: 'ProfileController.java lines 44-47 accept arbitrary ''role'' and ''admin'' values from the request-deserialized
    AppUser without authorization check: line 44-46 sets role unconditionally when non-null; line 47 always overwrites the
    admin flag. No @PreAuthorize annotation restricts which callers may set these fields.'
  impact_description: Any authenticated user can self-promote to ADMIN role, gaining access to user management (create, update,
    delete all accounts), the admin report, and admin UI, fully compromising the authorization boundary of the user administration
    plane.
