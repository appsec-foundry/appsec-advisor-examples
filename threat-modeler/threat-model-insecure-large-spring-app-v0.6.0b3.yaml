- local_id: web-spa-006
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-250
  title: Nginx master process runs as root (docker-compose.yml:29)
  scenario: 'An attacker exploiting a vulnerability in nginx:1.25 — or leveraging a supply-chain-substituted image — gains
    code execution within the nginx master process, which runs as uid 0 (root) because no user: directive is set in the Docker
    service definition, granting root-level access to the container filesystem and any mounted secrets.'
  attack_steps: null
  evidence_summary: 'The web-spa service at docker-compose.yml line 29 specifies `image: nginx:1.25` with no `user:` directive
    in the service definition; Docker containers default to running as root (uid 0), and nginx:1.25 starts its master process
    as root to bind privileged ports 80 and 443.'
  impact_description: Code execution in the nginx master process provides root (uid 0) access to the container filesystem,
    enabling reading of any secrets mounted in the container, modification of nginx configuration, and — if the Docker socket
    or privileged capabilities are accessible — potential container escape to the host.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: 'Docker containerization provides process isolation from the host; no privileged: true or host network
    visible in the service definition'
  mitigation_title: Set user directive and drop unnecessary capabilities for nginx container
  remediation:
    effort: Low
    steps:
    - 'Add `user: "101:101"` (nginx uid/gid in the official image) to the web-spa service in docker-compose.yml, and configure
      the nginx.conf `user nginx;` directive to run worker processes as nginx.'
    - 'Add `cap_drop: [ALL]` and `cap_add: [NET_BIND_SERVICE]` to the service to limit Linux capabilities to only what is
      needed to bind privileged ports.'
    code_example: null
    verification: '`docker exec <container> id` must report a non-root uid (e.g., uid=101); verify nginx still serves traffic
      on ports 80 and 443.'
    reference: https://nginx.org/en/docs/ngx_core_module.html#user
  evidence:
  - file: docker-compose.yml
    line: 29
