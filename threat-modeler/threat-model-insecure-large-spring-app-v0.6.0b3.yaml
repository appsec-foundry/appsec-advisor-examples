assets:
- id: A-001
  name: User Credentials (H2 / JPA)
  classification: Confidential
  description: 'AppUser records stored in the H2 in-memory database: username, email, password_hash (BCrypt for JPA users),
    role, and admin flag. The /h2-console is publicly accessible, making the full table reachable without authentication.'
  linked_threats: []
  component_refs:
  - component_id: h2-datastore
    relation: stored
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/domain/AppUser.java
      line: 20
  - component_id: auth-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/RegistrationController.java
      line: 40
- id: A-002
  name: Legacy SQLite User Credentials
  classification: Restricted
  description: Legacy user records in runtime/legacy-auth.sqlite containing username and cleartext password. The /api/legacy-sqlite/users
    endpoint returns all rows including plaintext passwords to any caller without authentication.
  linked_threats: []
  component_refs:
  - component_id: sqlite-auth-store
    relation: stored
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
      line: 22
  - component_id: legacy-auth-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteAuthController.java
      line: 25
- id: A-003
  name: JWT Signing Key
  classification: Restricted
  description: Hardcoded JWT signing secret (JWT_SIGNING_KEY=hardcoded-legacy-jwt-secret) baked into the Dockerfile ENV layer
    and set as a docker-compose environment variable for api-gateway and auth-service. Any image holder can forge arbitrary
    JWT tokens.
  linked_threats: []
  component_refs:
  - component_id: auth-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/SignedJwtAuthenticationFilter.java
      line: 38
  - component_id: api-gateway
    relation: processed
    evidence:
    - file: Dockerfile
      line: 13
- id: A-004
  name: Customer Order Records
  classification: Confidential
  description: CustomerOrder JPA entities stored in the H2 database, representing customer transactions with ownership linkage
    to AppUser. IDOR vulnerability in OrderAccessController allows any authenticated user to retrieve any order by ID.
  linked_threats: []
  component_refs:
  - component_id: h2-datastore
    relation: stored
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/domain/CustomerOrder.java
      line: 1
  - component_id: order-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/accesscontrol/OrderAccessController.java
      line: 14
- id: A-005
  name: Uploaded Document Files
  classification: Confidential
  description: User-uploaded document files managed by BusinessFileStorage and tracked as DocumentRecord JPA entities. Path
    traversal risk exists when user-supplied filenames are used in disk operations. Files stored under the application runtime
    directory.
  linked_threats: []
  component_refs:
  - component_id: document-service
    relation: stored
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/web/BusinessFileStorage.java
      line: 1
  - component_id: document-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/web/DocumentManagementController.java
      line: 60
- id: A-006
  name: Hardcoded AWS and DB Credentials
  classification: Restricted
  description: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and DB_PASSWORD baked into the Dockerfile ENV layer. These secrets
    are embedded in every built container image and appear in process environment on all docker-compose services.
  linked_threats: []
  component_refs:
  - component_id: api-gateway
    relation: processed
    evidence:
    - file: Dockerfile
      line: 12
- id: A-007
  name: Application Session Tokens
  classification: Confidential
  description: Spring Security HTTP session tokens and homegrown session identifiers generated by HomegrownSessionService.
    Redis session cache (redis-session-cache in docker-compose) holds unencrypted session data. Credential logging filter
    may log session-related headers.
  linked_threats: []
  component_refs:
  - component_id: auth-service
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/HomegrownSessionService.java
      line: 1
  - component_id: bff-web
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/csrf/CsrfTokenService.java
      line: 1
- id: A-008
  name: Service Portfolio and Landscape Metadata
  classification: Internal
  description: 50-service landscape portfolio data including client credentials, entitlement records, tenant provisioning
    data, and billing references managed by LandscapePersistence. Accessible via landscape endpoints with weak or absent authorization.
  linked_threats: []
  component_refs:
  - component_id: landscape-orchestrator
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/landscape/persistence/LandscapePersistence.java
      line: 1
- id: A-009
  name: Actuator Endpoints and Environment Variables
  classification: Confidential
  description: 'Spring Boot Actuator exposes all endpoints publicly (include: *), including /actuator/env with show-values:
    ALWAYS and /actuator/configprops with show-values: ALWAYS, revealing all environment variables including hardcoded secrets
    to any caller.'
  linked_threats: []
  component_refs:
  - component_id: bff-web
    relation: processed
    evidence:
    - file: src/main/resources/application.yml
      line: 25
- id: A-010
  name: H2 Database Console
  classification: Confidential
  description: H2 web console publicly accessible at /h2-console/** per SecurityConfig line 32. Provides direct SQL query
    execution against the in-memory database containing all user credentials, order records, and vault credentials.
  linked_threats: []
  component_refs:
  - component_id: h2-datastore
    relation: processed
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
      line: 32
