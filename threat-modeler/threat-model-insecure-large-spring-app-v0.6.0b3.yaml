verdict:
  severity: red
  opening: 'The application has no meaningful access boundary: credentials are committed to source, authentication gates are
    absent from database consoles and admin paths, and user input reaches the database and operating system without validation.
    Any network-reachable attacker can take full server control or exfiltrate all customer data today.'
  bullets:
  - title: Server takeover
    body: An unauthenticated caller who reaches the landscape tool service runs arbitrary operating system commands on the
      server (OS command injection).
    findings:
    - F-021
    weaknesses: []
    verified_attack_path: false
  - title: Customer data exfiltration
    body: An unauthenticated attacker sends crafted login and search requests that read every record from the database (database
      query injection).
    findings:
    - F-001
    - F-011
    weaknesses: []
    verified_attack_path: false
  - title: Account takeover
    body: Credentials and signing keys committed to source code let any repository reader authenticate as any user (secrets
      hardcoded in source).
    findings:
    - F-002
    - F-006
    - F-007
    weaknesses: []
    verified_attack_path: false
  - title: Admin impersonation
    body: Any logged-in user forges an admin-role token because the verifier accepts unsigned tokens (missing signature verification).
    findings:
    - F-012
    - F-018
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Privilege escalation
    body: Any registered user promotes their account to administrator by submitting an extra field in a profile update (mass
      assignment).
    findings:
    - F-017
    weaknesses: []
    verified_attack_path: true
  - title: Data destruction
    body: An unauthenticated caller reaches the unprotected database console and drops tables, destroying all in-memory order
      and user data.
    findings:
    - F-019
    - F-020
    weaknesses:
    - W-001
    verified_attack_path: false
  closing: Until these gaps are closed, any network-reachable attacker can read all customer data, take administrator control,
    or run commands on the server.
  bullets_intro: 'What an attacker can do today, worst first:'
