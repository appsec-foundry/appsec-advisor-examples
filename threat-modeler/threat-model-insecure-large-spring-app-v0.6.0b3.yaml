  - T-039
  - T-044
  - T-059
- id: api-gateway
  name: API Gateway
  description: Spring Boot 3.2 service acting as the primary API entry point with TLS termination on port 8443. Routes authenticated
    API traffic across the dmz, carries JWT signing keys in environment variables, and validates CORS origins.
