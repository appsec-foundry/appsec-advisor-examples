tier_root_causes:
  server:
  - Security filter chain grants permitAll to privileged endpoints
  - Homegrown token schemes lack cryptographic integrity verification
  - Untrusted input concatenated into SQL, shell, file, and URL sinks
  - Credentials and signing keys hardcoded in source or config files
  - Defensive controls (CSRF, actuator ACL, login throttle) globally disabled
  data:
  - Authentication disabled on data stores, admitting anonymous requests
  - Single superuser accounts eliminate per-service privilege boundaries
  - Service credentials committed in plaintext to version-controlled files
  - Mutable image tags on data-tier containers enable supply-chain swap
  - No container memory or query limits allows resource-exhaustion DoS
