- local_id: redis-cache-db-006
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-306
  title: Unauthenticated Redis allows FLUSHALL-based session — docker-compose.yml:397
  scenario: An attacker with access to the Docker data network connects to redis-session-cache without credentials and executes
    `FLUSHALL`, instantly destroying all active session tokens; all currently logged-in users lose their sessions simultaneously,
    causing a complete application-level denial of service.
  evidence_summary: The redis-session-cache service (lines 397-404) has no Redis AUTH configured and no maxmemory directive,
    meaning the FLUSHALL command is available to any unauthenticated connection. The data-classification label confirms session
    tokens are the stored data. A zero-hit search for requirepass in docker-compose.yml confirms the absence of authentication.
  impact_description: All active user sessions are destroyed in a single unauthenticated command, logging out every user and
    requiring all users to re-authenticate; dependent services relying on cached session state also fail.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Redis is in the `data` Docker network with no host port mapping, restricting the attack to containers
    on that network.
  mitigation_title: Enable Redis AUTH and disable or restrict dangerous commands via ACL
  remediation:
    effort: Low
    steps:
    - Enable Redis AUTH as described in redis-cache-db-001; unauthenticated FLUSHALL will then be rejected.
    - Apply a Redis ACL that denies FLUSHALL, FLUSHDB, DEBUG, and CONFIG REWRITE to all non-administrator roles.
    - Set a `maxmemory` value in the Redis command (e.g., `--maxmemory 256mb --maxmemory-policy allkeys-lru`) to prevent unbounded
      memory growth from an unauthenticated flood of SET commands.
    - 'Verify: from a container on the data network run `redis-cli -h redis-session-cache FLUSHALL`; expect `NOAUTH Authentication
      required`.'
    code_example: null
    verification: Execute `redis-cli -h redis-session-cache FLUSHALL` without credentials; the response must be `NOAUTH Authentication
      required`, not `OK`.
    reference: https://redis.io/docs/management/security/acl/
