- local_id: auth-008
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded Credential Logging Enables Log — CredentialLoggingFilter.java:25
  scenario: CredentialLoggingFilter.doFilterInternal() writes the username and password request parameters to the application
    log on every POST /login without any length validation or rate limiting. An attacker sends repeated POST /login requests
    with large username and password values; each request writes unbounded attacker-controlled content to the log, rapidly
    exhausting disk space and potentially causing the application or its host to become unavailable.
  attack_steps: null
  evidence_summary: CredentialLoggingFilter.java:25 logs both request parameters without length bounds at INFO level; POST
    /login is permitAll with no rate limiting, so the log volume is directly proportional to attacker request volume and payload
    size.
  impact_description: Sustained flood of POST /login requests with large username/password payloads fills log storage, potentially
    causing the application to crash or the host filesystem to become full, denying service to all users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None — no rate limiting, no payload length check, no log rotation enforcement at the application layer
  mitigation_title: Remove credential logging and add request-rate limiting at the /login endpoint
  remediation:
    effort: Medium
    steps:
    - Remove CredentialLoggingFilter entirely (it also logs cleartext passwords per auth-005); this eliminates the amplification
      path.
    - Apply servlet-level or gateway-level rate limiting to POST /login (e.g., Spring's rate-limit filter or an upstream reverse-proxy
      rule) to bound the request rate per source IP.
    - Validate request parameter length for username (e.g., max 255 bytes) before any processing to prevent oversized payloads
      from reaching log sinks.
    code_example: null
    verification: Send 100 POST /login requests with 10 KB username values and confirm the log growth is bounded by rate-limit
      or parameter-length enforcement.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java
