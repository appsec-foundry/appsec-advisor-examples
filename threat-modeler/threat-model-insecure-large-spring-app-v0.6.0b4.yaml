  name: Authentication & Session Surface
  description: 'Implements all authentication mechanisms in the application: Spring Security form login, legacy unsigned JWT,
    signed JWT (JJWT), homegrown Base64 session tokens, and SQLite-backed legacy auth. Includes CredentialLoggingFilter which
    logs cleartext credentials on every login attempt.'
