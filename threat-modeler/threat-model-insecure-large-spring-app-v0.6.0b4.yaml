- local_id: sqlite-legacy-db-006
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded JDBC connection creation per request — LegacySqliteUserStore.java:134
  scenario: An attacker floods the unauthenticated GET /api/legacy-sqlite/login-raw endpoint with concurrent requests. Each
    request triggers a new DriverManager.getConnection() call at line 134, opening a new file handle on legacy-auth.sqlite.
    Under sufficient concurrency this exhausts OS file descriptors or causes SQLite write-lock contention, returning 500 errors
    to legitimate users.
  evidence_summary: LegacySqliteUserStore.java:134 calls DriverManager.getConnection() with no connection pool, no semaphore,
    and no request throttle. Every authenticate(), authenticateRaw(), findAll(), countUsers(), and save() invocation opens
    a separate JDBC connection. The /api/legacy-sqlite/login-raw endpoint is permitAll and accepts unlimited concurrent requests.
  impact_description: Sustained flooding of the public login endpoint degrades or stops the legacy authentication service
    for legitimate users; because every request creates a new connection, file-descriptor exhaustion can affect the broader
    JVM process.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None — no connection pool, no rate limiter, no concurrency cap in the store or its controller
  mitigation_title: Introduce a SQLite connection pool and rate-limit the unauthenticated authentication endpoints
  remediation:
    effort: Medium
    steps:
    - Replace DriverManager.getConnection() with a HikariCP DataSource configured with a maximum pool size (e.g. maximumPoolSize=5)
      appropriate for single-file SQLite access.
    - Apply a Spring rate-limiting filter (e.g. Bucket4j or a servlet filter) on /api/legacy-sqlite/login and /api/legacy-sqlite/login-raw
      to cap requests per IP per minute.
    - Write a test that fires 50 concurrent requests to /api/legacy-sqlite/login and asserts the JVM file-descriptor count
      does not grow unboundedly and the response time stays below a threshold.
    code_example: null
    verification: Under load (50 concurrent requests), confirm via /actuator/metrics or lsof that open file handles on legacy-auth.sqlite
      do not exceed the pool size plus one.
    reference: https://cwe.mitre.org/data/definitions/400.html
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
    line: 134
