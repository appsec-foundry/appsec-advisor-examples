security_controls:
- domain: Identity and Authentication Controls
  control: Spring Security Form Login
  effectiveness: Partial
  kind: mechanism
  assessment: Spring Security UsernamePasswordAuthenticationFilter enforces credential validation via BCrypt comparison before
    session issuance. However CSRF is globally disabled (SecurityConfig.java:28), and CredentialLoggingFilter fires on every
    POST /login and writes plaintext username and password to the application log (CredentialLoggingFilter.java:25), defeating
    the confidentiality of submitted credentials on every login attempt.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:26 — src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java:25
  rule_id: ARCH-AUTHN-001
- domain: Identity and Authentication Controls
  control: Cleartext Credential Logging
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'CredentialLoggingFilter is an active, registered filter in the Spring Security chain (SecurityConfig.java:63).
    On every POST /login it reads username and password from request parameters and emits them at INFO level: `log.info("Processing
    sign-in for username={} password={}", username, password)` (CredentialLoggingFilter.java:25). Any log collector, log file,
    or log-aggregation pipeline receives cleartext credentials for every authentication attempt including failures.'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java:25
  status_note: Active filter logs every submitted password in cleartext on POST /login.
- domain: Identity and Authentication Controls
  control: Homegrown Session Token
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'HomegrownSessionService.issueToken() produces a token by Base64-encoding the numeric user ID: `Base64.getEncoder().encodeToString(userId.toString().getBytes(...))`
    (HomegrownSessionService.java:20). No HMAC, no secret, no expiry. Any caller who knows or can enumerate a target user''s
    numeric ID (e.g. 100 for alice) can forge a token and impersonate that user. The resolve() path decodes the Base64 value
    and looks up the user by ID with no signature verification (HomegrownSessionService.java:24-30).'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/HomegrownSessionService.java:20
  status_note: Base64-encoded user ID — no MAC, trivially forgeable.
- domain: Session and Token Controls
  control: Unsigned JWT (Legacy)
  effectiveness: Unsafe
  kind: mechanism
  assessment: LegacyJwtVerifier.readClaims() calls Jwts.parserBuilder().build().parseClaimsJwt(token) with no signing key
    set (LegacyJwtVerifier.java:15-17). JJWT's parseClaimsJwt() accepts unsigned (alg=none) JWTs without requiring a signature.
    Any attacker can craft a JWT with arbitrary sub and role claims and have them accepted as valid.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacyJwtVerifier.java:14
  status_note: No signing key configured; unsigned tokens accepted.
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Session and Token Controls
  control: Signed JWT (JJWT HS256)
  effectiveness: Partial
  kind: mechanism
  assessment: SignedJwtService generates an ephemeral HS256 key at startup via Keys.secretKeyFor(SignatureAlgorithm.HS256)
    (SignedJwtService.java:19) and enforces an algorithm whitelist in verify() (SignedJwtService.java:38). The algorithm check
    prevents algorithm confusion. The key is not persisted — it is regenerated on every application restart, invalidating
    all previously issued tokens. The 15-minute expiry (900 seconds) is set.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/SignedJwtService.java:19-42
  rule_id: ARCH-JWT-001
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: SQLite Legacy Auth — Cleartext Password Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'LegacySqliteUserStore seeds the legacy_users table with plaintext passwords (LegacySqliteUserStore.java:37-39):
    legacy_alice and legacy_bob use ''password''; legacy_admin uses ''admin''. Passwords are stored and compared as cleartext
    strings. Any read access to the SQLite file or the authenticate() / findAll() return values exposes all credentials.'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java:37
- domain: Authorization Controls
  control: Route Authentication (Spring Security permitAll)
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'SecurityConfig applies anyRequest().authenticated() as a catch-all, but carves out unauthenticated access for:
    /legacy/admin/**, /h2-console/**, /actuator/**, GET /api/admin/report, GET /api/orders/search, GET /api/documents/search,
    GET /api/documents/safe-search, GET /api/documents/public-feed, GET /api/orders/status-feed, GET /api/integration/fetch,
    GET /api/files/read, GET /api/tools/lookup, GET /api/output/preview, GET /api/output/plain-preview, GET /api/legacy-admin/audit,
    GET /api/legacy-session/orders, /api/legacy-sqlite/**, POST /api/xml/preview, /api/auth/**, /api/crypto/**, /api/legacy-crypto/**.
    This exposes SQL injection, SSRF, XXE, command injection, H2 console, actuator, and admin report surfaces without requiring
    a session.'
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:31-48
  rule_id: ARCH-AUTHN-001
  status_note: Numerous privileged surfaces exposed to unauthenticated callers via permitAll.
- domain: Authorization Controls
  control: Object-Level Ownership Check (IDOR/BOLA)
  effectiveness: Unsafe
  kind: mechanism
  assessment: OrderAccessController.get() at GET /api/orders/{id} fetches any order by numeric ID without checking whether
    the caller owns the record (OrderAccessController.java:24-29). A safe ownership-checking variant exists at GET /api/orders/{id}/owned
    (OrderAccessController.java:32-45) but the primary route is unprotected. Any authenticated user can read any order by
    enumerating IDs. Document and user access controllers likely have corresponding IDOR paths.
  implementation: src/main/java/com/example/appsecverificationtarget/accesscontrol/OrderAccessController.java:24
  rule_id: ARCH-BOLA-001
  status_note: GET /api/orders/{id} fetches records with no caller-ownership verification.
- domain: Authorization Controls
  control: Legacy Admin Board Authentication
  effectiveness: Unsafe
  kind: mechanism
  assessment: SecurityConfig.java:41 lists /legacy/admin and /legacy/admin/** as permitAll. LegacyAdminBoardController performs
    privileged operations — GET /legacy/admin returns all users, POST /legacy/admin/users/{id}/promote sets admin=true and
    role=ADMIN, POST /legacy/admin/users/{id}/delete removes the user — with no authentication or authorization check anywhere
    in the controller or the filter chain.
  implementation: src/main/java/com/example/appsecverificationtarget/legacyadmin/LegacyAdminBoardController.java:22 — src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:41
  rule_id: ARCH-AUTHN-001
  status_note: Unauthenticated privilege escalation and user deletion via /legacy/admin/**.
- domain: Authorization Controls
  control: H2 Console Access Control
  effectiveness: Unsafe
  kind: mechanism
  assessment: SecurityConfig.java:32 permits all requests to /h2-console/**. The H2 in-memory database console is reachable
    without authentication by any caller that can reach the application network port. The console provides full SQL read/write
    access to all application tables including user credentials, vault_credentials, orders, and documents.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:32
- domain: Authorization Controls
  control: Actuator Endpoint Protection
  effectiveness: Unsafe
  kind: mechanism
  assessment: SecurityConfig.java:33 permits all requests to /actuator/**. Spring Boot Actuator endpoints (health, env, beans,
    mappings, and potentially heapdump/threaddump) are accessible without authentication, exposing configuration values, internal
    component topology, and potentially heap contents.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:33
  rule_id: ARCH-MGMT-001
- domain: Authorization Controls
  control: Admin Report Authentication
  effectiveness: Unsafe
  kind: mechanism
  assessment: SecurityConfig.java:34 permits GET /api/admin/report without authentication. AdminReportController returns sensitive
    aggregated data to any unauthenticated caller.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:34
  rule_id: ARCH-MGMT-001
- domain: Authorization Controls
  control: Centralised Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: Spring Security @EnableMethodSecurity and @PreAuthorize role guards are used on landscape orchestrator routes.
    The general application relies on route-by-route authentication matches in SecurityConfig with ad-hoc ownership checks
    in controllers. No centralized ownership enforcement mechanism exists; authorization logic is duplicated per endpoint
    with inconsistent results (e.g. /api/orders/{id} vs /api/orders/{id}/owned).
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
  rule_id: ARCH-AUTHZ-001
- domain: Cross-Site Request Forgery Protection
  control: CSRF Token Enforcement
  effectiveness: Unsafe
  kind: mechanism
  assessment: Spring Security CSRF is globally disabled via AbstractHttpConfigurer::disable (SecurityConfig.java:28). The
    homegrown CsrfTokenService generates a SecureRandom token and stores it in the HTTP session on GET /csrf/settings (CsrfTokenService.java:15-21).
    However, CsrfSettingsController.update() only validates that the submitted formToken is non-null and non-blank (CsrfSettingsController.java:47)
    — it never retrieves the session-stored token via csrfTokenService.currentToken() and never compares submitted to stored
    values. Any POST to /csrf/settings with any non-empty string as formToken succeeds regardless of session.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:28 — src/main/java/com/example/appsecverificationtarget/csrf/CsrfSettingsController.java:47
  status_note: Spring CSRF disabled; homegrown token generated but never compared server-side.
- domain: Browser and Cross-Origin Controls
  control: CORS Origin Validation
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'CorsPolicyFilter.isTrustedOrigin() accepts any Origin header value that starts with the string ''http'' (CorsPolicyFilter.java:32).
    It then reflects that origin verbatim into Access-Control-Allow-Origin and also sets Access-Control-Allow-Credentials:
    true (CorsPolicyFilter.java:17-20). Any attacker-controlled origin (e.g. http://attacker.example) is accepted. Combined
    with Allow-Credentials, this allows cross-origin requests carrying the victim''s cookies to be made from attacker-controlled
    pages.'
  implementation: src/main/java/com/example/appsecverificationtarget/cors/CorsPolicyFilter.java:31
  rule_id: ARCH-CORS-001
  status_note: 'Reflects any http:// origin with Allow-Credentials: true — universal CORS bypass.'
  audit_flags:
  - control_domain_reclassified_from_Cross-Origin Resource Sharing Controls
- domain: Input Validation Controls
  control: SQL Query Construction
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'DocumentLookupDao.findByTag() constructs a native SQL query by string concatenation: `"select * from documents
    where tag = ''" + tag + "'' order by id"` (DocumentLookupDao.java:18). The tag parameter is the raw user-supplied search
    value from GET /api/documents/search which is permitAll. LegacySqliteUserStore.authenticateRaw() similarly concatenates
    username and password directly into a SQLite query (LegacySqliteUserStore.java:64). Both paths are reachable from unauthenticated
    HTTP requests.'
  implementation: src/main/java/com/example/appsecverificationtarget/inputvalidation/DocumentLookupDao.java:18 — src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java:64
  rule_id: ARCH-SQLI-001
  status_note: String-concatenation SQL in DocumentLookupDao and LegacySqliteUserStore.authenticateRaw() on unauthenticated
    routes.
- domain: Input Boundary Validation Controls
  control: Schema / Allowlist Input Validation
  effectiveness: Weak
  kind: cross-cutting
  assessment: No centralized schema or allowlist validation framework is present. Individual endpoints perform no type, range,
    or format checks before using input in SQL, file paths, shell commands, or XML parsers. LandscapeOperations.java:63 applies
    value.trim() as the sole visible validation in the landscape package. Spring Boot's @RequestParam binding provides basic
    type coercion but no value constraints.
  implementation: src/main/java/com/example/appsecverificationtarget/landscape/LandscapeOperations.java:63
  rule_id: ARCH-INPUT-001
  audit_flags:
  - control_domain_reclassified_from_Input Validation Controls
- domain: File Parser and Outbound Request Controls
  control: Outbound URL Validation (SSRF)
  effectiveness: Unsafe
  kind: mechanism
  assessment: IntegrationController.fetch() receives a url request parameter and passes it directly to restTemplate.getForObject(url,
    String.class) (IntegrationController.java:23) with no allow-list, scheme restriction, or host validation. The endpoint
    is GET /api/integration/fetch which is permitAll. Any caller can direct the server to fetch internal network resources,
    cloud metadata endpoints (169.254.169.254), or internal services.
  implementation: src/main/java/com/example/appsecverificationtarget/serverside/IntegrationController.java:23
  status_note: User-controlled URL passed to RestTemplate on a permitAll route — no SSRF guard.
  audit_flags:
  - control_domain_reclassified_from_Server-Side Request Forgery Controls
- domain: Input Validation Controls
  control: XML External Entity (XXE) Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: XmlPreviewController.preview() creates a DocumentBuilderFactory and DocumentBuilder with default settings (XmlPreviewController.java:22-24).
    No features are set to disable DOCTYPE declarations, external general entities, or external parameter entities. POST /api/xml/preview
    is permitAll. Any unauthenticated caller can submit a crafted XML document that reads local files (file:// XXE) or performs
    SSRF via external entity resolution.
  implementation: src/main/java/com/example/appsecverificationtarget/serverside/XmlPreviewController.java:22
  status_note: Default DocumentBuilderFactory with no XXE protection on a permitAll POST endpoint.
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing (Spring Security BCrypt)
  effectiveness: Adequate
  kind: primitive
  assessment: SecurityConfig registers a BCryptPasswordEncoder bean (SecurityConfig.java:131) and uses it for the InMemoryUserDetailsManager.
    BCrypt is a memory-hard, salted password hashing algorithm appropriate for credential storage.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java:131
  audit_flags:
  - control_domain_reclassified_from_Cryptography Controls
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing (Legacy MD5)
  effectiveness: Unsafe
  kind: primitive
  assessment: LegacyPasswordService.hashForAudit() uses MessageDigest.getInstance("MD5") with no salt (LegacyPasswordService.java:15).
    MD5 is cryptographically broken; unsalted MD5 password hashes are trivially reversed using rainbow tables or GPU cracking.
  implementation: src/main/java/com/example/appsecverificationtarget/crypto/LegacyPasswordService.java:15
  rule_id: null
  status_note: Unsalted MD5 — trivially reversed via rainbow table.
  audit_flags:
  - control_domain_reclassified_from_Cryptography Controls
- domain: Cryptography Secrets and Data Protection
  control: Vault Credential Encryption (HomegrownCipher)
  effectiveness: Unsafe
  kind: primitive
  assessment: 'HomegrownCipher uses a fixed XOR key ''orderdesk-legacy-key'' hardcoded in the source (HomegrownCipher.java:8).
    XOR with a repeating key is a Vigenère cipher: key length is 20 bytes; any ciphertext longer than 20 bytes exposes key
    material via crib-dragging. The key is in the repository and therefore known to anyone with read access. CustomCryptoService
    and VaultCredential store credentials encrypted with this mechanism.'
  implementation: src/main/java/com/example/appsecverificationtarget/crypto/HomegrownCipher.java:8
  status_note: Hardcoded XOR key in source — equivalent to cleartext storage.
  audit_flags:
  - control_domain_reclassified_from_Cryptography Controls
- domain: Secrets and Credential Management
  control: Hardcoded Service Credentials (MinIO)
  effectiveness: Unsafe
  kind: lifecycle
  assessment: MinIO object store credentials are hardcoded in docker-compose.yml (docker-compose.yml:322) as noted in the
    component registry sensitive_data evidence. AWS-style access key and secret key are committed to source control, allowing
    any repository reader to authenticate to the MinIO instance.
  implementation: docker-compose.yml:322
  status_note: MinIO access credentials committed to docker-compose.yml.
- domain: Cryptography Secrets and Data Protection
  control: Transport Encryption (TLS)
  effectiveness: Missing
  kind: cross-cutting
  assessment: No TLS configuration appears in application.yml, SecurityConfig, or the application source code. The deployment
    topology references an edge-waf-proxy (nginx) as a possible TLS terminator, but that is an unmodelled workload outside
    the repository source. TLS termination at the deployment edge cannot be confirmed or denied from repository evidence alone.
  implementation: null
  rule_id: ARCH-TLS-001
  status_note: No application-layer TLS configuration found; deployment-layer enforcement unknown.
  audit_flags:
  - control_domain_reclassified_from_Transport Security
- domain: Logging and Monitoring Controls
  control: Security Event Logging
  effectiveness: Weak
  kind: mechanism
  assessment: The only confirmed security-event logging is CredentialLoggingFilter which logs cleartext passwords on every
    POST /login (CredentialLoggingFilter.java:25). No login success/failure audit events, no authentication error logging,
    and no access control violation logging were found in the repository source. Cleartext password logging is harmful and
    does not constitute meaningful security monitoring.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java:25
- domain: Dependency Lifecycle Controls
  control: Third-Party Dependency Management
  effectiveness: Partial
  kind: lifecycle
  assessment: The project uses Maven (pom.xml) for dependency management. No dependency-lock file, vulnerability scanner configuration
    (e.g. OWASP dependency-check plugin), or Dependabot configuration was found in the repository. Supply-chain pinning and
    automated vulnerability scanning are not evidenced.
  implementation: pom.xml
