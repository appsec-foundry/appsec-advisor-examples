threats:
- local_id: minio-object-store-001
  threat_category_id: TH-03
  additional_categories:
  - Information Disclosure
  - Elevation of Privilege
  - TH-02
  - TH-06
  stride: Spoofing
  cwe: CWE-798
  title: Hardcoded Root Service Credentials in Repository
  scenario: An attacker with repository read access extracts the hardcoded MINIO_ROOT_PASSWORD value from docker-compose.yml,
    authenticates to the MinIO API as the default root principal 'minioadmin', and gains unrestricted read/write/delete access
    to all stored documents and bucket policies.
  attack_steps: null
  evidence_summary: docker-compose.yml line 422 sets MINIO_ROOT_PASSWORD to a static string 'fixture-local-admin-token' with
    no MINIO_ROOT_USER override, leaving the default 'minioadmin' username active. The combination constitutes a publicly
    known, non-rotating admin credential.
  impact_description: 'Full MinIO administrative access including read and deletion of all uploaded files and documents (data-classification:
    uploaded files, documents) stored in the internal data zone.'
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no secrets manager integration, no credential rotation, no vault reference
  mitigation_title: Load MinIO root credentials from Vault or environment-injected secrets at startup
  remediation:
    effort: Medium
    steps:
    - Remove MINIO_ROOT_PASSWORD and MINIO_ROOT_USER from docker-compose.yml and source control entirely
    - Inject the credential pair at deployment time from the co-located vault-secrets service or a secrets manager (e.g.,
      MINIO_ROOT_USER and MINIO_ROOT_PASSWORD via Docker secrets or env_file excluded from VCS)
    - Rotate the credential immediately in all existing deployments; audit MinIO access logs for unauthorized root sessions
    - Add a CI check that fails if MINIO_ROOT_PASSWORD appears as a literal string in docker-compose.yml
    code_example: null
    verification: Run `grep -r 'MINIO_ROOT_PASSWORD' docker-compose.yml` and confirm no literal value; verify MinIO starts
      successfully with injected credentials and rejects the old static value.
    reference: https://min.io/docs/minio/linux/administration/identity-access-management/minio-user-management.html
