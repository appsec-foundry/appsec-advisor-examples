      role scoped to the specific databases they require, rather than the root role.
    - Update all application connection strings to use the scoped accounts, then remove or disable the root account from normal
      application access paths.
    - Restrict the root account to DBA maintenance tasks only and supply its credential through a secrets manager rather than
      the compose file.
