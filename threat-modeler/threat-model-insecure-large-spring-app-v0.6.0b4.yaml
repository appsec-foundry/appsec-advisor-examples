  - Attacker reads docker-compose.yml from version control or a CI artifact and extracts POSTGRES_PASSWORD 'fixture-local-admin-token'.
  - Attacker compromises or pivots to a container on the data Docker network (e.g., through a vulnerable co-located service).
  - Attacker connects to postgres-primary as the postgres superuser using the extracted credential, bypassing JPA-layer authorization.
  - Attacker reads or exfiltrates all business records from appsec_primary, modifies data, or drops tables without trace in
    application logs.
  evidence_summary: docker-compose.yml line 366 sets POSTGRES_PASSWORD to a static shared value 'fixture-local-admin-token'
    committed in the repository. This same value is reused for MongoDB, Redis, Vault, RabbitMQ, and MinIO, confirming it is
    a fixture-wide shared secret stored in plaintext source.
  impact_description: Attacker gains direct postgres superuser access to the crown-jewel persistent store holding all landscape
    service catalog and invocation count records, with full DDL and DML privileges, with no application-layer audit trail.
