trust_boundaries:
- name: 'external -> auth: Spring Security form-login filter chain'
  kind: network
  assumption: A session is issued only after Spring Security's authentication filters successfully validate the submitted
    credentials.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 26
  - file: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth
  enforcement_point: Spring Security UsernamePasswordAuthenticationFilter
  assumption_legs:
  - leg: validation
    condition: Every credential submitted to /login and /register is structurally validated before being passed to the authentication
      provider.
  - leg: authentication
    condition: A session cookie is issued only after UsernamePasswordAuthenticationFilter or SignedJwtAuthenticationFilter
      succeeds.
  - leg: authorization
    condition: /api/auth/signed-jwt/token requires authenticated(); /api/auth/** and /register are permitAll per SecurityConfig.
  surface: network
  transition: []
  id: tb-4
  assumption_verdict: refuted
