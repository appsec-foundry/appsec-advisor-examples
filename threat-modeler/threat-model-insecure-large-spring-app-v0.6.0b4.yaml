  stride: Spoofing
  cwe: CWE-347
  title: Improper Signature Verification — LegacyJwtVerifier.java:15
  scenario: An attacker submits an unsigned JWT (payload only, no signature) to GET /api/auth/legacy-jwt/claims. LegacyJwtVerifier.readClaims()
    calls Jwts.parserBuilder().build().parseClaimsJwt() — the unsigned-token variant that requires no signing key — and returns
    all attacker-supplied claims as verified. Any caller that relies on this endpoint to authenticate a JWT identity receives
    a forged identity.
  attack_steps:
  - Attacker constructs a JWT with forged payload (e.g., sub=admin, roles=[ROLE_ADMIN]) and no signature, yielding a two-part
    or dot-terminated string.
  - Attacker submits GET /api/auth/legacy-jwt/claims?token=<unsigned-jwt>; the endpoint is permitAll and network-accessible.
  - LegacyJwtVerifier.java:15 calls parseClaimsJwt() — which explicitly rejects signed tokens and accepts only unsigned ones
    — and deserialises the attacker claims without any integrity check.
  - Server returns the forged claims as a valid JSON map; any consumer treating this response as authoritative trusts the
    attacker-controlled identity.
  evidence_summary: LegacyJwtVerifier.java:15 calls Jwts.parserBuilder().build().parseClaimsJwt(), which accepts tokens with
    no signing key and rejects signed tokens, making every claim in the token attacker-controllable.
  impact_description: Attacker forges any identity, role, or claim returned by the legacy JWT verifier endpoint; downstream
    callers that trust the response accept the forged identity as valid.
  likelihood: High
  impact: Critical
  risk: High
  controls_in_place: None — no signing key is configured on the parser
  mitigation_title: Replace parseClaimsJwt with parseClaimsJws and enforce a signing key in LegacyJwtVerifier
  remediation:
    effort: Low
    steps:
    - Replace Jwts.parserBuilder().build().parseClaimsJwt(token) with Jwts.parserBuilder().setSigningKey(key).build().parseClaimsJws(token)
      where key is loaded from external configuration or a key-management service.
    - Add a unit test that asserts readClaims() throws JwtException for a token with an empty or missing signature.
    code_example: null
    verification: Submit a JWT with no signature to GET /api/auth/legacy-jwt/claims and confirm the response is HTTP 400/401
      with a JwtException error; a signed token with the correct key must succeed.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
