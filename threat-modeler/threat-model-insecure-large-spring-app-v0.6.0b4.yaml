meta_findings:
- id: MF-001
  title: Insufficient Secret Management
  category: Insufficient Secret Management
  summary: '5 findings trace to secrets, keys, or tokens stored directly in source code. The architectural concern is not
    the individual values — they can be rotated — but the absence of a secret-management substrate: no env-var convention,
    no vault/KMS integration, no pre-commit scan. Rotating individual secrets addresses symptoms; instituting the substrate
    addresses the gap.'
  derived_from:
  - T-003
  - T-023
  - T-032
  - T-038
  - T-045
  severity: High
  recommended_mitigation_id: null
verdict:
  severity: red
  opening: Account takeover, unauthorized administrative control, and full data access are directly exploitable from the internet
    without chaining weaknesses; the assessed scope has no enforced authentication perimeter on its administration board or
    backing data services.
  bullets:
  - title: Account takeover without credentials
    body: Any caller forges a session for any user, including administrators, without a password by supplying only a chosen
      user ID.
    findings:
    - F-007
    - F-015
    - F-011
    - F-028
    - F-013
    weaknesses:
    - W-001
    - W-002
    verified_attack_path: true
  - title: Admin controls open to anonymous callers
    body: An anonymous internet caller can list all accounts, promote any account to admin, and delete any account with no
      credential required.
    findings:
    - F-009
    - F-019
    - F-012
    - F-014
    weaknesses:
    - W-001
    - W-002
    verified_attack_path: false
  - title: Database fully accessible from the network
    body: No password protects the embedded database console; any network-reachable caller reads all user credentials and
      documents or destroys the schema.
    findings:
    - F-016
    - F-018
    - F-008
    - F-047
    weaknesses:
    - W-001
    - W-002
    verified_attack_path: false
  - title: Superuser credentials exposed in source
    body: The primary database superuser password and privileged service credentials are committed to version control and
      readable without database access.
    findings:
    - F-010
    - F-017
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Any user self-promotes to admin
    body: Mass assignment on the account update path lets any authenticated user permanently set their own role to admin in
      the database.
    findings:
    - F-005
    weaknesses: []
    verified_attack_path: true
  - title: Session store and search cluster unprotected
    body: Active session tokens and all indexed search data are accessible to any container in the network because no credentials
      are required.
    findings:
    - F-022
    - F-024
    - F-048
    weaknesses:
    - W-001
    verified_attack_path: false
  closing: Every account, every stored record, and all administrative functions are reachable by anonymous internet callers
    with no defensive perimeter in place.
