  title: Forgeable Base64 Session Token — HomegrownSessionService.java:21
  scenario: HomegrownSessionService.issueToken() encodes only the userId as Base64 with no HMAC or other integrity protection.
    An attacker who knows or enumerates any userId constructs a valid session token by Base64-encoding the ID and submits
    it to any endpoint that calls HomegrownSessionService.resolve(), obtaining authenticated access as that user.
  attack_steps:
  - Attacker learns target userId values (e.g., 102 for admin) from public documentation, the /api/legacy-sqlite/users endpoint,
    or sequential enumeration.
  - Attacker calls Base64.getEncoder().encodeToString("102".getBytes()) locally or online, producing the token MTAy.
  - Attacker submits GET /api/legacy-session/orders?token=MTAy; HomegrownSessionService.resolve() at line 24 decodes the token,
    parses the Long, and loads the admin AppUser from the database.
  - Server returns admin user's order data, confirming full identity impersonation without valid credentials.
  evidence_summary: HomegrownSessionService.java:21 issues Base64.getEncoder().encodeToString(userId.toString().getBytes())
    as the session token — trivially reversible and constructable by any attacker with a target userId.
  impact_description: Attacker impersonates any application user, including administrators, by constructing a valid session
    token from the target userId alone; all data and operations available to the target user become accessible.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — no HMAC, no signature, no nonce
  mitigation_title: Replace Base64 token with HMAC-signed or cryptographically random session token in HomegrownSessionService
  remediation:
    effort: Medium
    steps:
    - Generate a cryptographically random 256-bit token using SecureRandom and store a mapping of token→userId in a server-side
      store (database or cache); remove Base64(userId) encoding entirely.
    - Update HomegrownSessionService.resolve() to look up the token from the server-side store rather than decoding it.
    - Add tests asserting that a token constructed from Base64(userId) is rejected by resolve(), and that only server-issued
      tokens succeed.
