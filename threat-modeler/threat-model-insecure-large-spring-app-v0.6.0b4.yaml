  stride: Information Disclosure
  cwe: CWE-916
  title: Plaintext password storage and retrieval — LegacySqliteUserStore.java:107
  scenario: 'An attacker who gains read access to the legacy_auth.sqlite file (via path traversal, backup exposure, or the
    unauthenticated /users API) obtains all user passwords in cleartext. Because passwords are stored without hashing, no
    brute-force step is required: the credential value is the password.'
  evidence_summary: LegacySqliteUserStore.java:107 executes statement.setString(2, password) in save(), inserting the raw
    password string into the legacy_users table. readUser() at line 130 reads it back via resultSet.getString("password")
    and populates the LegacySqliteUser record, which is returned by findAll() and authenticate().
  impact_description: All legacy user passwords are stored reversibly in the SQLite file. Any read of the database schema
    or the legacy_users table directly yields usable credentials. The /users endpoint (confirmed via discovery as permitAll)
    further surfaces this data over HTTP without requiring authentication.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Hash passwords with BCrypt before storing in legacy_users and verify against the hash on authentication
  remediation:
    effort: Medium
    steps:
    - Add a PasswordEncoder (BCrypt, cost >= 12) to LegacySqliteUserStore and apply it in save() before the INSERT statement.
    - In authenticate() replace the 'password = ?' SQL predicate with a SELECT by username only, then call passwordEncoder.matches(rawPassword,
      storedHash) on the returned row; remove the raw password comparison.
    - 'Remove the password column from all API responses: delete LegacyUserResponse.password and its mapping in LegacySqliteAuthController.'
    - Write a test that calls save() with a known password, reads the stored value directly via JDBC, and asserts the stored
      bytes do not equal the raw password.
    code_example: null
    verification: 'After migration, query the SQLite file directly: SELECT password FROM legacy_users LIMIT 1; the value must
      begin with ''$2a$'' (BCrypt prefix) and not equal the cleartext password.'
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
