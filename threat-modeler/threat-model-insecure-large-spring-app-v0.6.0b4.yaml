    the built-in MongoDB 'root' role; any connecting service or attacker that authenticates acquires userAdminAnyDatabase,
    dbAdminAnyDatabase, and readWriteAnyDatabase privileges across all databases simultaneously, eliminating least-privilege
    separation between read, write, and administrative operations.
  evidence_summary: Line 390 sets MONGO_INITDB_ROOT_PASSWORD without a corresponding application-scoped user account or a
    restricted role definition; no MONGO_INITDB_DATABASE, additional user creation scripts, or mongod configuration limiting
    the initial account's roles are present in the service definition (lines 386-395).
  impact_description: Any application service or attacker that connects to MongoDB using the root credential can create or
    delete databases, add new administrative users, read documents from unrelated collections, and execute arbitrary administrative
    commands — privileges that should be restricted to the DBA role alone.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no least-privilege application user is defined; all access is via the root account.
  mitigation_title: Create least-privilege application accounts and revoke root credential from application use
