- local_id: postgres-primary-db-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-770
  title: No Resource Limits on Database Container
  scenario: An attacker who compromises any service on the data Docker network (or who exploits a vulnerability in the landscape-orchestrator
    through the tb-16 trust boundary) can issue long-running or resource-intensive queries against postgres-primary without
    any connection count cap or memory/CPU bound. This can exhaust host memory and CPU, causing the database to become unresponsive
    and denying service to all legitimate consumers of the crown-jewel store.
  attack_steps: null
  evidence_summary: The postgres-primary service definition (docker-compose.yml:362-373) contains no 'mem_limit', 'cpus',
    or 'deploy.resources.limits' block, and no 'max_connections' or 'shared_buffers' tuning is passed via the 'command' key.
    A zero-hit search confirms no such controls appear anywhere in docker-compose.yml.
  impact_description: Unconstrained resource consumption by an attacker-controlled workload causes the database host to exhaust
    memory or CPU, making appsec_primary unavailable to all dependent services and potentially crashing co-located containers.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: Service is isolated to the internal data Docker network, restricting direct access to co-located containers
    only.
  mitigation_title: Set Docker resource limits and configure max_connections for the postgres-primary container
  remediation:
    effort: Low
    steps:
    - Add a 'deploy.resources.limits' block to postgres-primary in docker-compose.yml with 'memory' and 'cpus' values appropriate
      for the expected workload.
    - Pass '-c max_connections=100 -c shared_buffers=256MB' via the postgres service 'command' key to cap concurrent connections
      and memory allocation.
    - Enable connection pooling (e.g., PgBouncer) in front of postgres-primary to prevent unbounded connection exhaustion
      from application bugs or attacks.
    code_example: null
    verification: Run 'docker inspect postgres-primary | jq .HostConfig.Memory' and confirm a non-zero limit; run 'psql -c
      SHOW max_connections' and confirm a value <= 100.
    reference: 'CWE-770: https://cwe.mitre.org/data/definitions/770.html'
  evidence:
