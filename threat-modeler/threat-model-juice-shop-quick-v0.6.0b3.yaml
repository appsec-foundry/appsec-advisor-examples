    a victim opens the link, filterTable() at line 136 reads the raw q parameter, and line 143 passes it directly to bypassSecurityTrustHtml(),
    binding the result to searchValue; the template renders it as trusted HTML and the attacker script executes, exfiltrating
    the victim's JWT.
