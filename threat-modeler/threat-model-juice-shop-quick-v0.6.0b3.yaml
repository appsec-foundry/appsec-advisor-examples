  title: Missing ownership check enables cross-user — routes/updateProductReviews.ts:16
  scenario: An authenticated attacker sends a PATCH request with req.body.id pointing to a review authored by another user;
    updateProductReviews reads the authenticated user from the session but never verifies that the targeted review's author
    matches that user before calling reviewsCollection.update with multi:true, allowing the attacker to overwrite any review
    in the collection.
  evidence_summary: 'Line 16 retrieves the authenticated user via security.authenticatedUsers.from(req); lines 17–21 call
    reviewsCollection.update({ _id: req.body.id }, { $set: { message: req.body.message } }, { multi: true }) without any predicate
    comparing the review''s author to user.data.email; the multi:true option compounds this by allowing a single request to
    update multiple reviews if the _id selector matches more than one document.'
  impact_description: Any authenticated user can rewrite the message of any other user's review or, with an operator-injected
    _id value, overwrite all reviews in a single request, enabling defacement, sabotage of competitor reviews, and destruction
    of review data integrity.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — the authenticated user's email is fetched but never compared to the review author before the update
    is executed.
  mitigation_title: Add author ownership predicate and remove multi:true in updateProductReviews
  remediation:
    effort: Low
    steps:
    - 'Add author: user.data.email to the update selector so the query becomes { _id: req.body.id, author: user.data.email
      }; this restricts the update to reviews owned by the calling user.'
    - 'Remove the { multi: true } option — a user editing their own review by _id should affect exactly one document; add
      an integration test asserting that a PUT with a valid id belonging to a different user returns HTTP 403 and leaves the
      target review unmodified.'
    code_example: null
    verification: Authenticate as user-A, then PATCH /rest/products/reviews with the _id of a review authored by user-B; assert
      the response is HTTP 403 and user-B's review message is unchanged in a subsequent GET.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  evidence:
