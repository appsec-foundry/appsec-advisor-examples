  title: Event loop blocking — routes/showProductReviews.ts:36
  scenario: An attacker injects a JavaScript expression into the id parameter (e.g., '1; sleep(2000)') that calls the globally-registered
    sleep() function; MarsDB evaluates this JavaScript inside the $where clause, blocking the Node.js event loop for up to
    2000 ms per request, degrading availability for all concurrent users.
  evidence_summary: Lines 17–26 of showProductReviews.ts define global.sleep() as a synchronous busy-wait capped at 2000 ms,
    explicitly to make it accessible from $where JavaScript context; line 36 passes user-controlled id into the $where string,
    allowing any request to trigger this blocking call.
  impact_description: Sustained requests injecting sleep(2000) can monopolize the Node.js event loop for 2-second windows
    per request, starvating I/O handlers and rendering the application unresponsive to all concurrent users during the attack.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: sleep() caps the sleep duration at 2000 ms (line 21) to prevent indefinite blocking, but no rate limiting
    or authentication check prevents rapid repeat requests.
  mitigation_title: Remove global sleep and $where JavaScript evaluation from showProductReviews
  remediation:
    effort: Low
    steps:
    - Replace the $where query on line 36 with a typed structured query (see marsdb-store-002 remediation) which eliminates
      the JavaScript evaluation context and removes the DoS surface entirely.
    - Delete the global.sleep definition (lines 17–26); if timing-attack challenge detection is still needed, measure latency
      server-side using a non-blocking approach rather than synchronous busy-wait.
    code_example: null
    verification: Send 10 concurrent GET /rest/products/1;sleep(2000)/reviews requests; median response time for /rest/products/1/reviews
      on a parallel connection must remain under 200 ms.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
