    discount:100; the Zod inputSchema at routes/chat.ts:177 defines z.number() with only a description-text limit of 10, no
    z.number().max(10) constraint, so discount:100 passes schema validation and security.generateCoupon(100) executes, returning
    a valid 100%-off coupon code.
