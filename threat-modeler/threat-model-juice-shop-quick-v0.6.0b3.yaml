  title: Hardcoded RSA private key enables JWT forgery — lib/insecurity.ts:23
  scenario: Any reader of the repository extracts the RSA private key at lib/insecurity.ts:23, signs a JWT payload containing
    role:'admin' and an arbitrary user email locally using jwt.sign() with RS256, and submits the forged token to isAuthorized()-protected
    endpoints, impersonating any user or assuming the admin role without valid credentials.
  attack_steps:
  - Attacker reads lib/insecurity.ts:23 from the accessible repository and copies the complete PEM-encoded RSA private key.
  - 'Attacker calls jwt.sign({ data: { role: ''admin'', email: ''admin@juice-sh.op'' } }, privateKey, { algorithm: ''RS256''
    }) locally to produce a valid signed token.'
  - Attacker submits the forged token in the Authorization header; isAuthorized() at insecurity.ts:54 verifies it against
    the matching public key and accepts the request.
  - Attacker accesses admin-only endpoints, reads all user data, and performs privileged operations without ever supplying
    real credentials.
  evidence_summary: lib/insecurity.ts:23 contains a complete PEM-encoded RSA private key as a TypeScript string literal; authorize()
    at line 56 uses this key to sign all session JWTs with RS256, and isAuthorized() at line 54 verifies tokens with the matching
    public key at line 22.
  impact_description: 'Universal authentication bypass: any attacker who can read the source can issue self-signed admin JWTs,
    taking over any user account or the admin role across the entire application, reaching every sensitive endpoint and all
    user data.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: RS256 algorithm enforced on token issuance at line 56; express-jwt verifies tokens against public key
  mitigation_title: Remove hardcoded private key and load from runtime secret in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Delete the private key literal at lib/insecurity.ts:23; generate a new RSA-2048+ key pair outside the repository using
      openssl genrsa.
    - Load the private key from an environment variable (e.g., JWT_PRIVATE_KEY) at startup and validate its presence before
      binding any routes.
    - Update the public key reference at line 22 similarly; exclude both key files from the repository via .gitignore.
    - Invalidate all existing sessions by rotating the key pair; restart the in-memory authenticatedUsers map to revoke tokens
      signed with the old key.
    code_example: null
    verification: Sign a token with the old key and confirm the protected endpoint returns HTTP 401; confirm the old key value
      is absent from git log --all -S.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
