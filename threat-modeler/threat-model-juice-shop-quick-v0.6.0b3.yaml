    victim via phishing or stored link.
  - Victim navigates to the link; Angular loads SearchResultComponent and filterTable() reads queryParams.q at line 136.
  - Line 143 passes the raw queryParam to this.sanitizer.bypassSecurityTrustHtml(), assigning the result to this.searchValue
    which the template renders as innerHTML, executing the injected script.
  evidence_summary: Line 143 passes the raw URL query parameter queryParam directly to this.sanitizer.bypassSecurityTrustHtml()
    and assigns it to this.searchValue; Angular's default HTML sanitization is explicitly disabled for this value before it
    reaches the DOM.
