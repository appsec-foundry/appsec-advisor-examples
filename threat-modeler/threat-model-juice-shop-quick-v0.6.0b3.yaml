security_controls:
- domain: Session and Token Controls
  control: JWT Token Authentication
  effectiveness: Unsafe
  kind: mechanism
  assessment: RS256 signing is configured (lib/insecurity.ts:56), and express-jwt middleware enforces token presence on guarded
    routes. The RSA private key is committed directly to source (lib/insecurity.ts:23); any reader of the repository can issue
    valid tokens for arbitrary users, defeating the authentication primitive entirely.
  implementation: lib/insecurity.ts
  rule_id: ARCH-JWT-001
  status_note: RS256 configured but private key is public knowledge; JWT integrity guarantee is defeated.
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Password-Based Authentication
  effectiveness: Unsafe
  kind: mechanism
  assessment: Login credential verification in routes/login.ts:34 executes a raw SQL query with user-controlled input rather
    than a parameterized Sequelize call. An attacker can bypass authentication by injecting SQL. This is the primary login
    path and is relied upon as the credential gate.
  implementation: routes/login.ts
- domain: Identity and Authentication Controls
  control: Two-Factor Authentication (TOTP)
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP-based 2FA setup and verification are implemented (routes/2fa.ts). The control covers users who enroll but
    is not enforced as a required step for all sessions or for high-privilege operations. 2FA bypass is a tracked challenge
    in the application.
  implementation: routes/2fa.ts
- domain: Authorization Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  assessment: express-jwt middleware is registered for guarded API segments (server.ts:605, 633). POST /file-upload, POST
    /profile/image/file, POST /profile/image/url, POST /rest/memories, POST /api/Feedbacks, GET /rest/admin/application-version,
    GET /rest/admin/application-configuration, and PUT /rest/continue-code-findIt/apply/:continueCode all show authn=unknown
    (server.ts:309-312, 405, 605-606, 611). The coverage gap is broad enough to enable unauthenticated exploitation of file
    upload and admin surfaces.
  implementation: server.ts
  rule_id: ARCH-AUTHN-001
  status_note: JWT middleware present but 8 state-changing or sensitive routes lack confirmed authentication gating.
- domain: Authorization Controls
  control: Object-Level Authorization (BOLA/IDOR Prevention)
  effectiveness: Weak
  kind: mechanism
  assessment: express-jwt middleware confirms the caller's identity on object-addressing routes but no ownership check is
    present. PUT /api/Products/:id, DELETE /api/Products/:id, PUT/DELETE /api/Recycles/:id, PUT /api/BasketItems/:id, PUT
    /api/Feedbacks/:id, PUT/DELETE /api/Cards/:id, PUT/DELETE /api/Addresss/:id all carry authz=unknown (server.ts:369-450).
    Any authenticated user can modify or delete another user's records by guessing or enumerating integer IDs.
  implementation: server.ts
  rule_id: ARCH-BOLA-001
  status_note: Authentication present; per-object ownership verification absent on at least 8 sensitive object endpoints.
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: Authorization is enforced per-route via ad-hoc checks with no centralized policy engine. Approximately 19 sensitive
    PUT/DELETE/PATCH routes show authz=unknown in server.ts (lines 369-633) including basket coupon application, wallet balance
    modification, delivery status update, and product review mutation. The absence of a centralized policy makes exhaustive
    coverage review impractical.
  implementation: server.ts
  rule_id: ARCH-AUTHZ-001
- domain: Input Boundary Validation Controls
  control: Centralized Input Validation
  effectiveness: Partial
  kind: cross-cutting
  assessment: URL de-duplication (server.ts:204) and field trimming on registration fields (server.ts:410-412) are present.
    No schema validation library (Joi, Zod, express-validator) is evidenced as a centralized gate. Input from untrusted callers
    reaches handler logic without allowlist or type enforcement beyond per-field ad-hoc checks.
  implementation: server.ts
  rule_id: ARCH-INPUT-001
  audit_flags:
  - control_domain_reclassified_from_Input Handling
- domain: Query Construction and Data Access Controls
  control: Parameterized Database Access
  effectiveness: Unsafe
  kind: mechanism
  assessment: Sequelize ORM model methods provide parameterized access for the majority of queries (models/index.ts:30, 41).
    The login route (routes/login.ts:34) deliberately bypasses the ORM and executes a raw SQL query with user-supplied credentials,
    defeating the parameterization control at the most security-critical database access point.
  implementation: routes/login.ts, models/index.ts
  rule_id: ARCH-SQLI-001
  status_note: ORM covers most queries; login path executes unparameterized raw SQL with user-controlled input.
  audit_flags:
  - control_domain_reclassified_from_Input Handling
- domain: Session and Token Controls
  control: JWT Token Storage
  effectiveness: Weak
  kind: mechanism
  assessment: JWT bearer tokens are read from localStorage by the Angular request interceptor (frontend/src/app/Services/request.interceptor.ts:13)
    and stored there after login (frontend/src/app/Services/basket.service.ts:64). localStorage is accessible to any JavaScript
    running in the page context, meaning a successful XSS attack yields immediate token theft and session hijack.
  implementation: frontend/src/app/Services/request.interceptor.ts
  audit_flags:
  - control_domain_reclassified_from_Session and Token Management
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Missing
  kind: mechanism
  assessment: The application uses bearer JWT tokens in localStorage rather than cookie-based sessions. There are no HttpOnly
    or Secure cookies to harden. The ARCH-COOKIE-001 rule found preconditions present but no positive signal; the control
    family is inapplicable in its traditional form, and the alternative (localStorage tokens) is weaker than hardened cookies.
  rule_id: ARCH-COOKIE-001
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: The RSA private key used for JWT signing is committed verbatim to source (lib/insecurity.ts:23). A BIP39 wallet
    mnemonic is committed to source (routes/checkKeys.ts:10). Both values are publicly readable from the repository, defeating
    the secret property of each. No runtime secret injection mechanism (environment variable, vault, cloud secret manager)
    is evidenced for these values.
  implementation: lib/insecurity.ts, routes/checkKeys.ts
  rule_id: ARCH-SECRET-001
  status_note: Two high-value secrets (JWT signing key, wallet mnemonic) committed to public source; secret property is fully
    defeated.
- domain: Cryptography Secrets and Data Protection
  control: Transport Encryption (TLS)
  effectiveness: Partial
  kind: surface
  assessment: No TLS termination or certificate configuration is present in application source or Dockerfile. TLS is expected
    at the deployment layer (reverse proxy, CDN). The application does not enforce HTTPS redirects or HSTS headers within
    its own request handling. Database transport encryption is not configured in the Sequelize connection (models/index.ts).
  rule_id: ARCH-TLS-001
  audit_flags:
  - control_domain_reclassified_from_Transport
- domain: Cryptography Secrets and Data Protection
  control: Password Storage (Hashing)
  effectiveness: Partial
  kind: primitive
  assessment: The User model stores a password field (models/user.ts:28). The specific hashing algorithm and work factor are
    not confirmed from the available evidence in architecture coverage. Security questions are used as a password recovery
    mechanism (data/static/securityQuestions.yml), which provides weaker account recovery protection than token-based reset
    flows.
  audit_flags:
  - control_domain_reclassified_from_Data Protection
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  assessment: Socket.io CORS is explicitly restricted to http://localhost:4200 (lib/startup/registerWebsocketEvents.ts:20),
    appropriate for a development default. The main Express API CORS policy is not confirmed from available source evidence.
    The hardcoded localhost origin will be incorrect in production deployments unless overridden.
  implementation: lib/startup/registerWebsocketEvents.ts
  rule_id: ARCH-CORS-001
  audit_flags:
  - control_domain_reclassified_from_Deployment Configuration
- domain: Deployment Configuration
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: surface
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration expose application metadata
    (server.ts:605-606) with authn=unknown. These endpoints disclose version and configuration details to unauthenticated
    callers, aiding targeted exploitation. Whether admin role is enforced inside the handlers cannot be determined from route
    registration alone.
  implementation: server.ts
  rule_id: ARCH-MGMT-001
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Missing
  kind: cross-cutting
  assessment: No evidence of structured security event logging for authentication failures, authorization rejections, account
    lockout triggers, or anomalous access patterns is present in the available source evidence. The absence of audit logging
    prevents detection and forensic analysis of exploitation attempts.
- domain: Dependency Lifecycle
  control: Third-Party CI/CD Action Pinning
  effectiveness: Partial
  kind: lifecycle
  assessment: The CI workflow uses coverallsapp/github-action@v2 pinned to a mutable semantic version tag (.github/workflows/ci.yml:202).
    A tag mutation on the upstream repository would execute arbitrary code in the build context with GITHUB_TOKEN access.
    Other workflow steps' pinning status is not confirmed from the available evidence.
  implementation: .github/workflows/ci.yml
  rule_id: ARCH-SUPPLY-001
- domain: Output Encoding and Rendering Controls
  control: Output Encoding (XSS Prevention)
  effectiveness: Unsafe
  kind: mechanism
  assessment: Angular's DomSanitizer is deliberately bypassed at 8 locations using bypassSecurityTrustHtml(). Affected surfaces
    include feedback comments rendered on the About page (about.component.ts:119), last-login IP (last-login-ip.component.ts:39),
    user email display in admin panel (administration.component.ts:73), feedback comments in admin (administration.component.ts:91),
    product descriptions in search results (search-result.component.ts:110), search query reflection (search-result.component.ts:143),
    order tracking results (track-result.component.ts:48), and captcha image (data-export.component.ts:57). User-controlled
    HTML content is rendered unsanitized across multiple application surfaces.
  implementation: frontend/src/app/
  rule_id: ARCH-XSS-001
  status_note: Angular sanitization defeated at 8 confirmed locations; user HTML rendered without encoding as intentional
    training vulnerabilities.
  audit_flags:
  - control_domain_reclassified_from_Trust Boundary Enforcement
- domain: Trust Boundary Enforcement
  control: LLM Output Trust and Prompt Injection Prevention
  effectiveness: Partial
  kind: mechanism
  assessment: The Vercel AI SDK routes chat input to an external LLM provider (routes/chat.ts:9). The tb-6 trust-boundary
    assumptions require that chat input does not exfiltrate sensitive state, that the endpoint URL cannot be overridden by
    user input, and that LLM response is treated as untrusted. No evidence of system prompt boundary enforcement, input length
    bounding, or output sanitization before rendering is present in the available source evidence.
  implementation: routes/chat.ts
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
