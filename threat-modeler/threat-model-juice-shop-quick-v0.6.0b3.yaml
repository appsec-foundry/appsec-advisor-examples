  description: Browser rendering paths write HTML or DOM content directly without one enforced contextual-encoding or sanitisation
    boundary. Safety depends on each individual component using the right API.
  structural_recommendation: use framework-safe rendering by default and isolate any required raw HTML behind one reviewed
    sanitisation and Trusted Types policy
- id: W-011
  weakness_class: outdated_deps
  kind: design
  title: Build pipeline trusts mutable third-party references
  statement: Third-Party Action Pinning is not consistently enforced.
  severity: Medium
  severity_basis: design-risk
  observable_backing:
    absent_control_signal:
    - Commit-SHA Action Pinning
    - Dependency Provenance Verification
  mechanism_id: build-pipeline-mutable-refs
  description: CI/CD workflows resolve third-party actions and other build dependencies to mutable tags or branches instead
    of immutable commit digests, so a retagged or compromised upstream runs inside the pipeline with its token and secret
    scope.
  structural_recommendation: pin every third-party action and build dependency to an immutable commit SHA (or a vetted internal
    mirror) and enforce SHA-pinning in CI
meta_findings:
- id: MF-001
  title: Insufficient Secret Management
  category: Insufficient Secret Management
  summary: '2 findings trace to secrets, keys, or tokens stored directly in source code. The architectural concern is not
    the individual values — they can be rotated — but the absence of a secret-management substrate: no env-var convention,
    no vault/KMS integration, no pre-commit scan. Rotating individual secrets addresses symptoms; instituting the substrate
    addresses the gap.'
  derived_from:
  - T-003
  - T-008
  severity: High
  recommended_mitigation_id: null
verdict:
  severity: red
  opening: 'Juice Shop cannot be deployed safely: any internet user can log in as admin without a password, anyone who reads
    the source code can impersonate any account, and authenticated customers can access each other''s payment and order records.'
  bullets:
  - title: Account takeover without a password
    body: Database query injection on the login form bypasses credential checks and hands a valid admin session to any unauthenticated
      caller.
    findings:
    - F-005
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Admin access without valid credentials
    body: The committed authentication key lets anyone forge admin sessions offline without knowing any user's password.
    findings:
    - F-003
    - F-004
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Cross-customer data access
    body: Any authenticated customer reads or modifies other users' payment cards, addresses, and orders by supplying a different
      object ID.
    findings:
    - F-007
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Customer data exposed via product search
    body: Database query injection in the product search exposes all stored credentials and payment records to any unauthenticated
      caller.
    findings:
    - F-006
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Wallet assets exposed in source code
    body: A cryptocurrency seed phrase committed to the public repository makes wallet private keys trivially derivable by
      any source-code reader.
    findings:
    - F-008
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Admin access via profile update
    body: Mass assignment on the profile update route lets any authenticated user set their own role to admin without admin
      credentials.
    findings:
    - F-009
    weaknesses: []
    verified_attack_path: false
  closing: Deploying this application puts every customer account and payment record at risk until hardcoded secrets are removed,
    authentication bypasses are closed, and all data access is restricted to the requesting user.
  bullets_intro: 'What an attacker can do today:'
