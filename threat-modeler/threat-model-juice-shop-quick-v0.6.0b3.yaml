trust_boundaries:
- name: 'external → backend: security.isAuthorized() expressJwt'
  kind: network
  assumption: Every state-changing route is registered behind security.isAuthorized() expressJwt middleware before processing.
  evidence:
  - file: server.ts
    line: 605
  - file: server.ts
    line: 633
  - file: lib/insecurity.ts
    line: 54
  - file: lib/startup/registerWebsocketEvents.ts
    line: 20
  - file: server.ts
    line: 640
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: backend
  enforcement_point: security.isAuthorized() expressJwt
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is schema-checked before it reaches business logic.
  - leg: authentication
    condition: Every state-changing route is registered behind security.isAuthorized() expressJwt middleware.
  - leg: authorization
    condition: Every object reference is checked against the authenticated subject's identity before access is granted.
  surface: network
  transition: []
  covers_components:
  - backend
  - socketio
  - web3-nft
  id: tb-1
- name: 'external → auth: security.authorize() RS256 JWT issuance'
  kind: identity
  assumption: A signed JWT is issued only after credential verification succeeds against the user store.
  evidence:
  - file: routes/login.ts
    line: 34
  - file: lib/insecurity.ts
    line: 56
  - file: server.ts
    line: 595
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth
  enforcement_point: security.authorize() RS256 JWT issuance
  assumption_legs:
  - leg: validation
    condition: Login request body is checked for required email and password fields before any database query.
  - leg: authentication
    condition: A JWT is signed and returned only after the password hash comparison matches a stored user record.
  - leg: authorization
    condition: The role encoded in the issued JWT reflects only the role stored on the authenticated user record.
  surface: network
  transition:
  - identity
  id: tb-2
- name: 'auth → database: Sequelize query() interface'
  kind: process
  assumption: Every query from auth components reaches SQLite through parameterized Sequelize calls rather than string interpolation.
  evidence:
  - file: routes/login.ts
    line: 34
  - file: models/index.ts
    line: 33
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: auth
  to: database
  enforcement_point: Sequelize query() interface
  assumption_legs:
  - leg: data-interpretation
    condition: Every query reaching SQLite uses Sequelize parameterized binding; no user-controlled string is interpolated
      into SQL.
  covers_components:
  - auth
  - database
  surface: in-process
  transition: []
  id: tb-4
- name: 'backend → database: Sequelize model methods'
  kind: process
  assumption: Every query from backend components reaches SQLite through Sequelize model methods with parameter binding.
  evidence:
  - file: models/index.ts
    line: 30
  - file: models/index.ts
    line: 41
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: backend
  to: database
  enforcement_point: Sequelize model methods
  assumption_legs:
  - leg: data-interpretation
    condition: Every query reaches SQLite through Sequelize model methods that bind parameters separately from query text.
  covers_components:
