  stride: Tampering
  cwe: CWE-943
  title: NoSQL $where injection in product reviews — routes/showProductReviews.ts:36
  scenario: An attacker calls GET /rest/products/1/reviews injecting a JavaScript expression in the :id segment (e.g. 1;sleep(2000))
    that MongoDB evaluates inside the $where predicate; the globally defined sleep() function (showProductReviews.ts:17-26)
    blocks the Node.js event loop, and arbitrary JavaScript can exfiltrate review data from other products.
  attack_steps: null
  evidence_summary: routes/showProductReviews.ts:36 concatenates the raw :id path parameter directly into the MongoDB $where
    predicate string 'this.product == ' + id; global.sleep is also defined at lines 17-26, making a blocking busy-wait available
    as a named function inside the $where evaluation context.
  impact_description: MongoDB executes attacker-supplied JavaScript; attacker can enumerate data beyond the requested product,
    exfiltrate review records cross-product, or stall the single-threaded Node.js event loop for up to 2 seconds per request
    causing service degradation.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: When noSqlCommandChallenge is disabled id is coerced to Number() removing injection; utils.trunc limits
    id to 40 characters when the challenge is enabled
  mitigation_title: Replace $where string concatenation with typed equality predicate in showProductReviews
  remediation:
    effort: Low
    steps:
    - 'Replace db.reviewsCollection.find({ $where: ''this.product == '' + id }) at routes/showProductReviews.ts:36 with db.reviewsCollection.find({
      product: Number(req.params.id) }) using a typed numeric equality field, eliminating the JavaScript evaluation context
      entirely.'
    - Remove the global.sleep definition (routes/showProductReviews.ts:17-26) or move it to a test-only module so it is unavailable
      in the production MongoDB $where context.
    - Add an integration test that sends a request with :id containing a sleep() call and confirms the response arrives in
      under 200 ms and contains only the expected product's reviews.
    code_example: null
    verification: Send GET /rest/products/0%3Bsleep(2000)/reviews and confirm the response arrives in under 500 ms and returns
      an empty or error response rather than a delayed result.
    reference: https://owasp.org/www-community/attacks/NoSQL_Injection
  evidence:
