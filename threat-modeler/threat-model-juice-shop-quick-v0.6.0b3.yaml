  title: Missing JWT algorithm allowlist allows HS256 confusion — lib/insecurity.ts:54
  scenario: 'isAuthorized() at lib/insecurity.ts:54 calls expressJwt({ secret: publicKey }) without an algorithms allowlist;
    the RSA public key is a static string readable from lib/insecurity.ts:22; an attacker constructs an HS256 JWT with role:''admin''
    claims signed using that public key string as the HMAC-SHA256 secret, submits it to a protected route, and the express-jwt
    library accepts it as valid because no algorithm restriction is enforced, elevating the attacker to admin.'
  evidence_summary: 'lib/insecurity.ts:54 exports isAuthorized as expressJwt({ secret: publicKey }) with no algorithms array;
    line 22 exposes the public key as a static string literal; jws.verify() at line 57 also accepts the token algorithm from
    the header without restriction, enabling RS256-to-HS256 confusion.'
  impact_description: Attacker self-signs an HS256 admin JWT using the publicly known RSA public key as the HMAC secret and
    accesses all admin-only endpoints without credentials, achieving full privilege escalation equivalent to a compromised
    admin session.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: RS256 algorithm enforced on token issuance at line 56; express-jwt validates token signature
  mitigation_title: 'Add algorithms: [''RS256''] allowlist to expressJwt and jwt.verify calls in lib/insecurity.ts'
  remediation:
    effort: Low
    steps:
    - 'Change lib/insecurity.ts:54 from expressJwt({ secret: publicKey }) to expressJwt({ secret: publicKey, algorithms: [''RS256'']
      }) to reject any non-RS256 token.'
    - 'Change the jwt.verify call at lib/insecurity.ts:191 to jwt.verify(token, publicKey, { algorithms: [''RS256''] }, callback)
      to apply the same restriction to the updateAuthenticatedUsers middleware.'
    - Replace jws.verify at line 57 with jwt.verify using the same algorithm restriction to centralise enforcement.
    - Add a test that submits an HS256-signed token and asserts the endpoint returns HTTP 401.
    code_example: null
    verification: Craft an HS256 JWT using the public key as HMAC secret and confirm the protected endpoint returns HTTP 401
      after the fix.
    reference: https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
  evidence:
  - file: lib/insecurity.ts
    line: 54
