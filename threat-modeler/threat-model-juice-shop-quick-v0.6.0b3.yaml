  title: SQL injection in login query bypasses credential check — routes/login.ts:34
  scenario: Attacker sends POST /rest/user/login with email set to "' OR '1'='1'--" and any password; routes/login.ts:34 interpolates
    req.body.email directly into the SQL string without parameterization, causing the WHERE clause to match all rows and return
    the first user (typically admin), after which afterLogin() issues a valid JWT for that account.
  attack_steps:
  - Attacker sends POST /rest/user/login with JSON body {"email":"' OR '1'='1'--","password":"x"} targeting the unauthenticated
    login endpoint.
  - routes/login.ts:34 builds SELECT * FROM Users WHERE email = '' OR '1'='1'-- AND password = '<md5>' AND deletedAt IS NULL
    and executes it via sequelize.query; the injection nullifies the email and password conditions.
  - The query returns the first user record (admin); afterLogin() at line 19 calls security.authorize() and issues a JWT for
    that user without any valid password.
  - Attacker receives an admin-level JWT and accesses all protected endpoints with full privileges.
  evidence_summary: routes/login.ts:34 passes req.body.email unescaped into a template-literal SQL string executed by models.sequelize.query();
    no prepared statement or ORM parameterization is used for the email field.
  impact_description: 'Complete authentication bypass: attacker obtains a valid JWT for any account including admin without
    knowing any password, enabling full account takeover and access to all application data.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Password is MD5-hashed before interpolation; email field is inserted raw with no escaping
  mitigation_title: Replace raw SQL template with Sequelize parameterized ORM call in routes/login.ts
  remediation:
    effort: Low
    steps:
    - 'Replace models.sequelize.query(`SELECT * FROM Users WHERE email = ''${...}''...`) at routes/login.ts:34 with UserModel.findOne({
      where: { email: req.body.email, password: security.hash(req.body.password), deletedAt: null } }) using Sequelize''s
      parameterized ORM interface.'
    - Remove the raw sequelize.query call entirely; Sequelize ORM queries use prepared statements by default for all parameters.
    - 'Add integration tests that POST SQL injection payloads (e.g., email: "'' OR ''1''=''1''--") and assert HTTP 401 is
      returned without a token in the response.'
    code_example: null
    verification: POST /rest/user/login with email="' OR '1'='1'--" must return HTTP 401 with no token; confirm with sqlmap
      -u targeting the login endpoint.
