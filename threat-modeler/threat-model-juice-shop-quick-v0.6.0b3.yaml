  title: MD5 password hashing without salt — lib/insecurity.ts:43
  scenario: All user passwords are stored as unsalted MD5 digests computed at lib/insecurity.ts:43; an attacker who reads
    the Users table via SQL injection or a database dump can recover plaintext passwords for all accounts using precomputed
    rainbow tables or GPU-accelerated cracking within minutes for common passwords, enabling account takeover and credential
    stuffing against other services.
  evidence_summary: lib/insecurity.ts:43 exports hash() as crypto.createHash('md5').update(data).digest('hex') with no salt;
    this function is called at routes/login.ts:34 for login password comparison and at routes/2fa.ts:107 for 2FA setup password
    confirmation, making MD5 the sole password storage algorithm.
  impact_description: Exposure of the Users table (e.g., via the SQL injection at routes/login.ts:34) yields unsalted MD5
    hashes; attackers recover plaintext passwords enabling account takeover and credential stuffing against external services
    where users reuse passwords.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None; unsalted MD5 applied with no adaptive cost factor
  mitigation_title: Replace MD5 hash with bcrypt or argon2 in lib/insecurity.ts:43 and all callers
  remediation:
    effort: Medium
    steps:
    - Replace crypto.createHash('md5') at lib/insecurity.ts:43 with bcrypt.hashSync(data, 12) for hashing and bcrypt.compareSync(data,
      hash) for verification; update the hash() export to reflect the new interface.
    - 'Update all callers: replace the hash comparison at routes/login.ts:34 and routes/2fa.ts:107 to use bcrypt.compareSync
      instead of comparing hash strings.'
    - On next successful login by an existing user, detect the old MD5 hash format and rehash the supplied plaintext with
      bcrypt, storing the new hash; log a rehash event.
    code_example: null
    verification: Read lib/insecurity.ts and confirm crypto.createHash('md5') is absent; confirm a bcrypt or argon2 call with
      cost factor >= 10 is present.
