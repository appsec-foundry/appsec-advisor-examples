  title: AdminGuard enforces admin access client-side only — app.guard.ts:53
  scenario: An attacker who holds a valid non-admin JWT navigates directly to /administration in the browser or calls the
    admin panel's API endpoints directly. The AdminGuard at app.guard.ts:53 decodes the JWT locally using jwtDecode without
    making a server call, and the role check at line 54 runs entirely in the browser. Any manipulation of localStorage (or
    a forged JWT from a separate attack) bypasses the guard without server interaction.
  evidence_summary: Line 53 calls this.loginGuard.tokenDecode() which runs jwtDecode on the localStorage token (app.guard.ts:38)
    with no HTTP call; line 54 then checks payload.data.role === roles.admin purely in browser memory, with no server-side
    validation request in the guard's canActivate() method.
  impact_description: An attacker who manipulates their localStorage token, obtains a forged JWT, or bypasses Angular routing
    directly gains access to the administration UI (user list with email addresses, all feedback) and can trigger admin operations
    such as feedback deletion, limited only by whether the backend independently enforces admin authorization on each API
    call.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: Client-side AdminGuard at app.guard.ts:48 (decodes JWT locally; no server revalidation; backend enforcement
    not verified from frontend source)
  mitigation_title: Add server-round-trip auth check in AdminGuard and handle 403 responses in administration.component.ts
  remediation:
