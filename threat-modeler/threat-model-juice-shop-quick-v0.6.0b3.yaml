threats:
- local_id: auth-003
  threat_category_id: TH-16
  additional_categories: []
  stride: Repudiation
  cwe: CWE-778
  title: Missing Audit Logging for Security Events
  scenario: Successful and failed login, 2FA verification outcomes, and password reset events are processed by routes/login.ts,
    routes/2fa.ts, and routes/resetPassword.ts without any security log entry; an attacker who gains unauthorized access via
    SQL injection or forged JWT leaves no attributable record in the application log, blocking incident detection and forensic
    reconstruction.
  evidence_summary: Reading routes/login.ts (84 lines), routes/2fa.ts (170 lines), and routes/resetPassword.ts (87 lines)
    reveals no import of a logging library and no log call on any authentication success or failure path; afterLogin() at
    login.ts:19-29 issues a JWT and returns a response at line 26 with no preceding log statement.
  impact_description: Unauthorized logins enabled by the SQL injection bypass or forged JWT produce no log entry; security
    operations cannot detect, alert on, or forensically reconstruct the attack sequence after the fact.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: None; no logging library imported or called in any auth route handler
  mitigation_title: Add structured security log calls to auth event handlers in login.ts, 2fa.ts, and resetPassword.ts
  remediation:
    effort: Low
