tier_root_causes:
  edge:
  - OAuth callback derives password from public identity using reversible encoding
  - Angular template binds URL query input to innerHTML via DomSanitizer bypass
  - JWT stored in localStorage readable by any same-origin script
  - Admin route guard decodes JWT locally without server-side authorization check
  server:
  - Request input interpolated into SQL and NoSQL queries without parameterization
  - Secret key material and credentials hardcoded in version-controlled source files
  - JWT verification omits algorithm allowlist enabling algorithm confusion attacks
  - Resource ownership derived from request body not session-verified identity
  - Unauthenticated endpoints accept unbounded connection and request volume
