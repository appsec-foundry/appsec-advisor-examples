  cwe: CWE-798
  title: Hardcoded wallet mnemonic exposes derivable private key — routes/checkKeys.ts:10
  scenario: Any person with read access to the repository extracts the 12-word mnemonic at checkKeys.ts:10, derives the full
    private key using ethers HDNodeWallet.fromPhrase() offline, and gains unconditional cryptographic control of the associated
    Ethereum wallet and all its on-chain assets without interacting with the application.
  attack_steps:
  - Attacker clones or browses the public repository and reads the plaintext mnemonic at routes/checkKeys.ts line 10.
  - Attacker runs HDNodeWallet.fromPhrase(mnemonic) locally, deriving the wallet's private key and address without any application
    interaction.
  - Attacker signs and broadcasts a transfer transaction using the derived private key, draining all assets held by the wallet.
  evidence_summary: checkKeys.ts:10 contains the literal string 'purpose betray marriage blame crunch monitor spin slide donate
    sport lift clutch'. The route then derives and compares privateKey, publicKey, and address from this mnemonic at lines
    11-14, confirming it is the live operational key for the challenge wallet.
  impact_description: The private key is fully recoverable from the mnemonic without brute force. Any on-chain assets in the
    wallet (current or future) are fully accessible to anyone who reads the source code, including the ability to sign arbitrary
    transactions.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — mnemonic is in plaintext in version-controlled source
  mitigation_title: Remove the hardcoded mnemonic and load it from a secret store or environment variable at runtime
  actor_ids:
  - ACT-D-01
  - ACT-D-06
  primary_actor: ACT-D-01
  remediation:
    effort: Low
    steps:
    - Replace the hardcoded mnemonic string at checkKeys.ts:10 with process.env.WALLET_MNEMONIC and add a startup validation
      that rejects a missing or empty value.
    - Rotate the current wallet by moving all assets to a new wallet whose mnemonic is provisioned only through environment
      secrets and has never appeared in source or git history.
    - Run `git log -S 'purpose betray' --all` to confirm the mnemonic is removed from reachable git history; if found, treat
      the wallet as permanently compromised and rotate assets.
    code_example: '// routes/checkKeys.ts:10 — replace literal with env secret

      const mnemonic = process.env.WALLET_MNEMONIC

      if (!mnemonic) throw new Error(''WALLET_MNEMONIC environment variable is not set'')'
    verification: Remove the env var and restart the server; GET /rest/web3/check-keys should return HTTP 500 with a configuration
      error, not expose key material.
    reference: 'CWE-798: Use of Hard-coded Credentials — https://cwe.mitre.org/data/definitions/798.html'
