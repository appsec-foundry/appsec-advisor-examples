  - component_id: juice-shop-api
    relation: processed
    evidence:
    - file: routes/updateUserProfile.ts
      line: 1
- id: A-002
  name: JWT Session Tokens
  classification: Confidential
  description: RS256-signed JWTs issued on login, stored in browser localStorage, and transmitted on every request via the
    Authorization header. The signing private key is hardcoded in lib/insecurity.ts, making every token forgeable by any party
    who reads the source.
  linked_threats: []
  component_refs:
  - component_id: juice-shop-frontend
    relation: stored
    evidence:
    - file: frontend/src/app/Services/basket.service.ts
      line: 64
  - component_id: juice-shop-frontend
    relation: transmitted
    evidence:
