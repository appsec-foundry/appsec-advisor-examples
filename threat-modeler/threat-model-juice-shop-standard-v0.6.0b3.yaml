assets:
- id: A-001
  name: User Account Records
  classification: Confidential
  description: Registered user records containing email address, username, MD5-hashed password, role flag, and profile data.
    Stored in the SQLite Users table via Sequelize. Compromise enables account takeover and PII disclosure.
  linked_threats: []
  component_refs:
  - component_id: juice-shop-db
    relation: stored
    evidence:
    - file: models/user.ts
      line: 20
  - component_id: juice-shop-auth
