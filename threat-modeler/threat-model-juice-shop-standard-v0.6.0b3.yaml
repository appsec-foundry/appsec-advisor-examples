  source_type: typescript_source
  breach_distance: 1
  mitigation_title: 'Always pass `algorithms: [''RS256'']` (or the project''s chosen alg) as the third argument''s options
    object to jwt.verify.'
  finding_type_id: FT-030
  control_scope: null
  threat_category_id: TH-02
  instances:
  - file: lib/insecurity.ts
    line: 52
    severity: Critical
    local_id: juice-shop-api-001
    scenario: 'An attacker who reads the RSA public key from encryptionkeys/jwt.pub uses it as an HMAC-SHA256 secret to sign
      a crafted JWT with alg:HS256 and arbitrary claims. Because expressJwt is called with only `secret: publicKey` and no
      `algorithms` restriction, the library may accept the HS256-signed token as valid, granting the attacker an authenticated
      session for any user.'
    component_id: juice-shop-api
    source_ref: juice-shop-api-001
  - file: lib/insecurity.ts
    line: 55
    severity: Critical
    local_id: juice-shop-auth-003
    scenario: security.verify() at lib/insecurity.ts:55 calls jws.verify with two arguments (token, publicKey) via a TypeScript
      cast that bypasses the three-argument signature; the jws library reads the algorithm from the token header rather than
      enforcing a fixed algorithm; an attacker crafts a JWT with alg:HS256 and signs it using the RSA public key as the HMAC-SHA256
      secret; jws.verify computes HMAC-SHA256 with publicKey as key and accepts the token, enabling JWT forgery without possession
      of the private key.
    component_id: juice-shop-auth
    source_ref: juice-shop-auth-003
