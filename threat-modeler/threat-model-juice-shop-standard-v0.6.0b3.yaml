- title: JWT Algorithm Confusion via Missing Algorithm Allowlist
  scenario: Without an explicit algorithm allowlist, attackers can forge tokens with alg:none (older lib versions) or use
    the public key as an HMAC secret to mint valid signatures.
  stride: Spoofing
  risk: Critical
  likelihood: Critical
  impact: Critical
  cwe: CWE-347
  evidence:
