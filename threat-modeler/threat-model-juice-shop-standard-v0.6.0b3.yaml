security_controls:
- domain: Identity and Authentication Controls
  control: JWT Token Signing and Verification
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: RS256 JWT tokens are issued via jwt.sign() at lib/insecurity.ts:54. The RSA private key used for signing is
    hardcoded at lib/insecurity.ts:21 (PEM block embedded in source). Any reader of the source repository can produce arbitrary
    valid tokens, defeating the algorithm's security guarantee entirely.
  implementation: lib/insecurity.ts:21 (hardcoded RSA private key), lib/insecurity.ts:54 (jwt.sign with RS256), lib/insecurity.ts:52
    (expressJwt verification middleware)
- domain: Identity and Authentication Controls
  control: Password Hashing
  effectiveness: Unsafe
  kind: mechanism
  assessment: User passwords are hashed with MD5 before storage (lib/insecurity.ts:38). MD5 is a general-purpose hash with
    no salt; all stored credentials are trivially reversible with precomputed rainbow tables. The MD5 hash is stored in the
    users table (models/user.ts:27).
  implementation: lib/insecurity.ts:38 (MD5 hash function applied to credentials), models/user.ts:27 (password column storing
    MD5 hashes)
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: 'expressJwt middleware (security.isAuthorized()) is applied at server.ts:356, 363, 398, 641 and covers the majority
    of protected routes. However, 8 state-changing or sensitive routes lack confirmed authentication: POST /file-upload, POST
    /profile/image/file, POST /profile/image/url, POST /rest/memories, POST /api/Feedbacks, GET /rest/admin/application-version,
    GET /rest/admin/application-configuration, PUT /rest/continue-code-findIt/apply/:continueCode.'
  implementation: server.ts:309-312 (unauthenticated upload/memory routes), server.ts:406 (unauthenticated feedback POST),
    server.ts:606-607 (unauthenticated admin info routes)
- domain: Identity and Authentication Controls
  control: Two-Factor Authentication (TOTP)
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP-based 2FA is implemented at routes/2fa.ts. Coverage is opt-in for individual users and is not enforced
    platform-wide. The 2FA path is reachable only after successful password authentication.
  implementation: routes/2fa.ts (TOTP setup and verification), lib/startup/registerWebsocketEvents.ts (2FA event handling)
- domain: Authorization Controls
  control: Object-Level Authorization (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: Eight authenticated routes accept object identifiers in the path (e.g. PUT /api/Products/:id, GET /api/Recycles/:id,
    PUT /api/BasketItems/:id, PUT /api/Cards/:id, PUT /api/Addresss/:id) but have no confirmed ownership check linking the
    requested object to the authenticated user's identity. Middleware presence at these routes confirms authentication, but
    authz=unknown for all eight.
  implementation: server.ts:370-371, 388-390, 426, 429, 433, 440-441, 450-451 (routes with authn=middleware_present, authz=unknown)
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHZ-001
  assessment: Authorization is implemented route-by-route with no centralized policy engine. 18+ sensitive PUT, DELETE, and
    PATCH routes in server.ts show authz=unknown at analysis time, including /rest/basket/:id/coupon/:coupon, /rest/wallet/balance,
    /rest/products/:id/reviews, and /rest/continue-code*/apply/:continueCode. Absent a single enforcement point, gaps are
    introduced incrementally as new routes are added.
  implementation: server.ts:370-371, 389-390, 426, 429, 433, 440-441, 450-451, 605, 612-614, 625, 627, 633-634
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration are registered at server.ts:606-607
    without confirmed authentication. These endpoints expose application version and configuration data to unauthenticated
    callers.
  implementation: server.ts:606 (GET /rest/admin/application-version authn=unknown), server.ts:607 (GET /rest/admin/application-configuration
    authn=unknown)
- domain: Input Handling
  control: Input Validation
  effectiveness: Partial
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: Input handling is limited to whitespace trimming (server.ts:411-413 for email/password/passwordRepeat fields
    at registration). No schema validation library, type coercion framework, or allowlist validation is detected for request
    bodies or URL parameters across the API surface.
  implementation: server.ts:204 (URL deduplication regex), server.ts:411-413 (trim on registration fields)
- domain: Input Handling
  control: SQL Injection Prevention
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: Sequelize ORM with model methods provides parameterized access for most application queries (models/user.ts:20).
    The login credential lookup at routes/login.ts:34 uses a raw sequelize.query call that interpolates the user-supplied
    email string directly, creating a SQL injection surface at the authentication boundary.
  implementation: routes/login.ts:34 (raw sequelize.query interpolating user-supplied email), models/user.ts:20 (Sequelize
    model methods for ORM queries)
- domain: Input Handling
  control: Output Encoding / XSS Protection
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: 'Angular''s DomSanitizer is explicitly bypassed at 8 locations using bypassSecurityTrustHtml, disabling the
    framework''s built-in XSS protection. Affected components interpolate server-returned or query-parameter values directly
    into the DOM: search-result (queryParam and product description), last-login-ip (lastLoginIp from JWT payload), administration
    (user.email and feedback.comment), about (feedback comments), data-export (captcha image data), track-result (orderId).
    Source comments mark these as intentional challenge code.'
  implementation: frontend/src/app/search-result/search-result.component.ts:110,143; frontend/src/app/last-login-ip/last-login-ip.component.ts:39;
    frontend/src/app/administration/administration.component.ts:73,91; frontend/src/app/about/about.component.ts:119; frontend/src/app/data-export/data-export.component.ts:57;
    frontend/src/app/track-result/track-result.component.ts:48
- domain: Session and Token Management
  control: JWT Token Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: The JWT bearer token is stored in localStorage (frontend/src/app/Services/basket.service.ts:64) and appended
    to every request by the HTTP interceptor at frontend/src/app/Services/request.interceptor.ts:13. localStorage is fully
    accessible to any same-origin JavaScript, making the token directly exfiltrable through XSS — particularly dangerous given
    the eight bypassSecurityTrustHtml bypass sites in the same origin.
  implementation: frontend/src/app/Services/basket.service.ts:64 (localStorage.getItem for token), frontend/src/app/Services/request.interceptor.ts:13
    (JWT header injection)
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: The primary session mechanism is JWT in localStorage rather than HttpOnly cookies. No evidence of HttpOnly,
    Secure, or SameSite cookie attributes was found. If any cookie-based sessions are used, their hardening attributes are
    not evidenced in the repository.
  implementation: null
- domain: Session and Token Management
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-CORS-001
  assessment: Socket.IO is configured with CORS origin 'http://localhost:4200' at lib/startup/registerWebsocketEvents.ts:20,
    which is a development-only restriction. The REST API's CORS configuration for cross-origin credential-bearing requests
    is not evidenced in the server source. Production CORS policy is unknown.
  implementation: 'lib/startup/registerWebsocketEvents.ts:20 (Socket.IO CORS origin: localhost:4200)'
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SECRET-001
  assessment: 'Three secrets are hardcoded directly in source: (1) RSA private key at lib/insecurity.ts:21, used for JWT signing;
    (2) HMAC signing secret at lib/insecurity.ts:39; (3) BIP39 wallet mnemonic at routes/checkKeys.ts:10 (''purpose betray
    marriage blame crunch monitor spin slide donate sport lift clutch''). All are committed to the public repository. No runtime
    secret injection or managed secret store (environment variables, Vault, cloud secret manager) is detected.'
  implementation: lib/insecurity.ts:21 (RSA private key), lib/insecurity.ts:39 (HMAC secret), routes/checkKeys.ts:10 (BIP39
    mnemonic)
- domain: Transport Security
  control: Transport Encryption (TLS)
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-TLS-001
  assessment: The application server listens on port 3000 without TLS configuration in the repository source. No TLS certificate,
    key file, or HTTPS server initialization is found. TLS may be provided by an upstream reverse proxy in deployment, but
    no evidence of that configuration exists in the repository. Data in transit from browser to port 3000 is cleartext unless
    infrastructure-layer TLS is present.
  implementation: null
- domain: LLM and AI Security
  control: LLM Prompt Injection Filtering
  effectiveness: Missing
  kind: mechanism
  assessment: routes/chat.ts:108 and :111 forward user-supplied chat messages to an Ollama/OpenAI-compatible LLM inference
    endpoint (chatBot.llmApiUrl). No input sanitization, prompt boundary enforcement, system prompt hardening, or output filtering
    is detected. An attacker can submit crafted prompts that attempt to override system instructions, exfiltrate context,
    or cause the LLM to produce harmful outputs that the application relays back to users.
  implementation: routes/chat.ts:108,111 (user content forwarded to LLM endpoint without filtering)
- domain: Supply Chain
  control: Third-Party CI/CD Action Pinning
  effectiveness: Weak
  kind: lifecycle
  rule_id: ARCH-SUPPLY-001
  assessment: 'Three GitHub Actions workflows reference third-party actions without commit-SHA pinning: calibreapp/image-actions@main
    (mutable branch reference), peter-evans/create-pull-request@v8 (version tag, mutable), coverallsapp/github-action@v2 (version
    tag, mutable). A compromised upstream action at any of these references would execute arbitrary code in the CI/CD context
    with GITHUB_TOKEN access.'
  implementation: .github/workflows/image_actions.yml:33 (calibreapp/image-actions@main), .github/workflows/image_actions.yml:42
    (peter-evans/create-pull-request@v8), .github/workflows/ci.yml:188 (coverallsapp/github-action@v2)
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Partial
  kind: cross-cutting
  assessment: No structured security event logging for authentication failures, authorization rejections, or input validation
    failures is detected in the server-side route handlers. Challenge verification events appear to be logged internally for
    training purposes. Absence of security event logging means failed attack attempts (credential stuffing, BOLA probing)
    produce no audit trail.
  implementation: null
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
    in place — the team is reactive rather than proactive without it.
