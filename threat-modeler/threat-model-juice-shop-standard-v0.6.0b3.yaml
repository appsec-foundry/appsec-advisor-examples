  stride: Information Disclosure
  cwe: CWE-321
  title: Hardcoded RSA private key enables offline JWT forgery (lib/insecurity.ts:21)
  scenario: 'An attacker who reads the source code — via public repository, git clone, or a source-disclosure vulnerability
    — extracts the RSA private key literal at lib/insecurity.ts:21 and calls `jwt.sign({ data: { id: 1, role: ''admin'' }
    }, privateKey, { algorithm: ''RS256'' })` locally. The forged JWT is accepted by all protected API routes, granting full
    admin access without any credential.'
  attack_steps:
  - Attacker clones or downloads the Juice Shop source repository and reads the 1024-bit RSA private key string literal at
    lib/insecurity.ts:21.
  - Attacker signs a JWT payload offline with the extracted private key using RS256, setting role=admin and a target user's
    id and email.
  - Attacker submits the forged token to any endpoint behind security.isAuthorized(); the server's expressJwt and jwt.verify
    functions accept it as legitimate.
  - Attacker accesses all user accounts, payment card data, and administrative functions without any prior credential.
  evidence_summary: 'lib/insecurity.ts:21: `const privateKey = ''[PEM PRIVATE KEY — REDACTED]\r\nMIICXAIBAAKBgQD...''` — the
    full 1024-bit RSA private key is a hardcoded string literal in source. The recon signal AUTHZ-007 at lib/insecurity.ts:53
    flags the signing key exposure. CRYPTO-001 signal at lib/insecurity.ts:41 corroborates crypto weaknesses.'
  impact_description: Ability to forge valid JWTs for any user with any role, exposing all user account records, payment card
    details, order history, personal data, and admin functions — the full set of sensitive assets for this component.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None; key rotation requires a source code change and redeployment
  mitigation_title: Move RSA private key to environment variable or secret store in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Remove the hardcoded private key string at lib/insecurity.ts:21 and replace with `process.env.JWT_PRIVATE_KEY` or a
      secret manager read at startup; throw on missing value to prevent silent fallback.
    - 'Rotate the key: generate a new 4096-bit RSA key pair, deploy the private key via the secret store, and store only the
      public key in encryptionkeys/jwt.pub.'
    - Revoke all existing tokens by changing the key; add a startup assertion that the loaded private key is at least 2048
      bits.
    - Add a secret-scanning CI step (e.g., trufflehog or git-secrets) that fails the pipeline if a private key pattern appears
      in any committed file.
    code_example: null
    verification: Run `grep -r 'BEGIN RSA PRIVATE KEY' .` in the repository root and assert zero matches; start the application
      without JWT_PRIVATE_KEY set and assert it exits with a non-zero code.
    reference: CWE-321 — Use of Hard-coded Cryptographic Key
