  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: No DB-level principal isolation for in-process SQLite (models/user.ts:20)
  scenario: All application components — authentication, API, and challenge engine — share a single in-process Sequelize connection
    with full read-write access to every SQLite table. A bug or injection in any one component gives the attacker read-write
    access to Users, Cards, SecurityAnswers, Baskets, and Challenges without crossing any database-level authorization boundary.
  attack_steps: null
  evidence_summary: models/user.ts:20 initialises the User model against the shared Sequelize instance passed from server.ts.
    The architecture context confirms 'juice-shop-api and juice-shop-auth access all data through the same in-process connection
    without query isolation.' The controls context states 'No independent access controls — SQLite is accessed directly by
    all in-process code without principal separation.'
  impact_description: Any code-execution or injection vulnerability in any component immediately grants unrestricted access
    to all stored data including credentials, payment cards, and personal information, with no database-layer defense-in-depth.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: None — SQLite has no multi-user principal model; the single embedded connection carries full CRUD authority.
  mitigation_title: Introduce read-only and scoped Sequelize connections per component role in models/index.ts
  remediation:
    effort: High
    steps:
    - Create a read-only Sequelize connection (SQLite URI with mode=ro) for components that require only SELECT access; wire
      it into the Sequelize model init for those components.
    - Restrict write connections to the minimal set of models that require INSERT/UPDATE/DELETE.
    - Document the intended access matrix in models/index.ts so code review can catch escalation on future model additions.
    - Add a CI check that asserts no write Sequelize method (create, update, destroy, upsert) is called from read-only component
      modules.
    code_example: null
    verification: Attempting a UserModel.update() call from a module initialised with the read-only connection throws a SQLite
      READONLY error.
    reference: https://cwe.mitre.org/data/definitions/284.html
