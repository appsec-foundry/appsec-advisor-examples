  stride: Spoofing
  cwe: CWE-522
  title: Long-lived registry publish credential (.github/workflows/ci.yml:327)
  scenario: A compromised unpinned GitHub Action (e.g. calibreapp/image-actions@main, coverallsapp/github-action@v2) executing
    in the same workflow run can read the DOCKERHUB_TOKEN from the runner environment; the attacker then uses this long-lived
    credential outside the workflow to authenticate as the project maintainer and push a backdoored image under bkimminich/juice-shop:latest
    — trusted by all downstream deployments without any integrity signal.
  evidence_summary: 'ci.yml line 327 passes `password: ${{ secrets.DOCKERHUB_TOKEN }}` to docker/login-action. No OIDC/Trusted-Publishing
    mechanism is used; the token is a long-lived credential valid beyond any single workflow run and reachable by any code
    executing in the same job.'
  impact_description: Attacker publishes a malicious Docker image under the trusted bkimminich/juice-shop identity; every
    deployment pulling :latest receives the backdoored image with no integrity indication.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: docker/login-action is SHA-pinned (line 324). Docker publish is restricted to push events on develop/master
    of the official repository (line 313 guard).
  mitigation_title: Replace DOCKERHUB_TOKEN with OIDC Trusted Publishing in the docker job
  remediation:
    effort: Medium
    steps:
