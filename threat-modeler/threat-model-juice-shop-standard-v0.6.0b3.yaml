- local_id: web3-nft-006
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-862
  title: Challenge solve granted without verifying caller performed the on-chain exploit
  scenario: An attacker monitors Sepolia blockchain events for the ContractExploited event on contract 0x413744D59d31AFDC2889aeE602636177805Bd7b0.
    When a victim's exploit transaction is visible in the mempool or confirmed on-chain, the attacker POSTs the victim's address
    as walletAddress to /rest/web3-wallet (line 15), registering it in walletsConnected. When the server's ContractExploited
    event handler fires at line 26, walletsConnected.has(exploiter) is true for the attacker's registration — the challenge
    is solved for any session that registered the address, not for the legitimate exploit author.
  evidence_summary: Line 15 reads walletAddress from req.body and line 16 adds it to walletsConnected. The ContractExploited
    handler at line 26 checks only whether the event's exploiter address appears in walletsConnected; it does not verify that
    the HTTP session that registered the address is the same party that triggered the on-chain event.
  impact_description: An attacker obtains the web3WalletChallenge solve without performing the required smart contract exploit,
    gaining challenge credit through another user's on-chain action while the legitimate exploiter receives nothing.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: JWT authentication at the route level (tb-1) confirms user login identity; no on-chain action attribution
    or wallet-ownership check is performed.
  mitigation_title: Bind challenge solve to the JWT subject that registered the wallet address, verified by wallet signature
  remediation:
    effort: Medium
    steps:
    - Replace the walletsConnected Set with a Map<string, string> keyed on walletAddress and valued on the JWT subject (req.user.email
      or sub). When ContractExploited fires at line 26, resolve the challenge for walletsConnected.get(exploiter) rather than
      for any caller.
    - Require EIP-4361 wallet-ownership proof at registration time (line 15-16) so the JWT subject is cryptographically bound
      to the wallet address before it is added to the Map.
    - 'Write a test: register address A as user U1, trigger ContractExploited for address A, confirm challenges.web3WalletChallenge
      is solved only for U1''s session and not for a different user session that also registered A.'
    code_example: null
    verification: Register address A as user U1; simulate a ContractExploited event for A; confirm that only U1's challenge
      status shows solved and that user U2 (who also registered A) does not receive credit.
    reference: https://eips.ethereum.org/EIPS/eip-4361
  evidence:
  - file: routes/web3Wallet.ts
    line: 15
  boundary_refs:
