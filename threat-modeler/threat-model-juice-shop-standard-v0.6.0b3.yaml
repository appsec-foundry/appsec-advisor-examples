  stride: Elevation of Privilege
  cwe: CWE-862
  title: Missing ownership check enables cross-user bulk review update
  scenario: 'An authenticated user sends a PATCH request with req.body.id set to another user''s review _id; the route reads
    the authenticated user at line 16 but never checks that the review belongs to that user before executing the update; with
    multi: true at line 20, supplying an _id that resolves to multiple documents updates all matching reviews in a single
    call.'
  attack_steps:
  - Attacker authenticates as any user and retrieves a victim's review _id from the public product review listing.
  - Attacker sends PATCH /rest/reviews with body.id set to the victim's review _id and body.message containing attacker-chosen
    text; the route updates the review without ownership verification.
  - 'Attacker supplies an _id value that matches multiple documents; multi: true at line 20 allows a single request to overwrite
    the message field across all matching reviews simultaneously.'
  evidence_summary: 'updateProductReviews.ts:16 reads user = security.authenticatedUsers.from(req); line 18 queries { _id:
    req.body.id } with no cross-check between user.data.email and review.author; line 20 passes { multi: true }, enabling
    bulk mutation.'
  impact_description: 'Any authenticated user can overwrite the message content of any other user''s product review and, via
    multi: true, modify multiple reviews simultaneously, escalating write privilege across the entire review collection.'
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Route requires a valid JWT. The authenticated user identity is available at line 16 but is only used
    post-update for challenge detection, not as an authorization guard.
  mitigation_title: Enforce review ownership before update and remove multi-document update permission in updateProductReviews
