  title: OAuth Implicit Flow Exposes Access Token in URL Fragment
  scenario: 'login.component.ts:148 initiates the Google OAuth flow with response_type=token, requesting the legacy implicit
    flow; Google delivers the access_token in the URL fragment (after the #); the token appears in browser history, is accessible
    to any JavaScript on the page, and may be included in Referer headers; an attacker who can observe the URL (via browser
    history access, shared session, or network interception) can steal the access_token and use it to call Google''s userinfo
    endpoint to obtain the victim''s email, then compute the deterministic Juice Shop password (finding 004) and log in as
    the victim.'
