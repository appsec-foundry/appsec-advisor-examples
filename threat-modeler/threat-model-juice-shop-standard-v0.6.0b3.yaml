- local_id: juice-shop-auth-001
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-89
  title: SQL Injection Authentication Bypass (routes/login.ts:34)
  scenario: An anonymous attacker submits a SQL injection payload such as `' OR 1=1--` as the email field in POST /rest/user/login;
    the raw template literal at routes/login.ts:34 interpolates the input directly into a sequelize.query call without parameterization;
    the WHERE clause evaluates true for all rows; the database returns the first user row (typically the admin account) and
    the server issues a valid JWT for that account without knowledge of the password.
  attack_steps:
  - Attacker sends POST /rest/user/login with body {"email":"' OR 1=1--","password":"x"} to the unauthenticated endpoint.
  - The literal query becomes SELECT * FROM Users WHERE email = '' OR 1=1-- AND ... which returns all rows; the first row
    is the admin account.
  - Server calls security.authorize() at routes/login.ts:24 to issue a 6-hour RS256 JWT for the returned user.
  - Attacker presents the issued JWT as a Bearer token and operates with full admin privileges on all subsequent API requests.
  evidence_summary: routes/login.ts:34 interpolates req.body.email directly into the query string via template literal; no
    parameterization or input sanitization is applied before the sequelize.query call; the known-threats record for this file
    confirms the SQL injection at this exact line.
  impact_description: Full authentication bypass for any account including admin; attacker reaches all sensitive_assets (RSA
    private key, TOTP seeds, MD5 password hashes) and gains complete control over all Juice Shop user accounts.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Replace raw sequelize.query with parameterized findOne in routes/login.ts
  remediation:
    effort: Low
    steps:
    - 'Replace the raw sequelize.query at routes/login.ts:34 with UserModel.findOne({ where: { email: req.body.email, password:
      security.hash(req.body.password || ''''), deletedAt: null } }) using Sequelize''s parameterized ORM query.'
    - Add an integration test that submits `' OR 1=1--` as the email value and asserts a 401 response rather than a JWT; add
      a test that confirms a valid credential pair still returns a JWT.
    code_example: null
    verification: 'curl -s -X POST http://localhost:3000/rest/user/login -H ''Content-Type: application/json'' -d ''{"email":"''
      OR 1=1--","password":"x"}'' | grep -v ''authentication'' # must return 401, not a token'
    reference: https://cwe.mitre.org/data/definitions/89.html
