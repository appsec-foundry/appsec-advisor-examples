- local_id: ci-cd-pipeline-005
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: Missing GITHUB_TOKEN permissions restriction (.github/workflows/ci.yml:1)
  scenario: ci.yml carries no top-level or per-job `permissions:` block, so GITHUB_TOKEN inherits the repository's default
    scope (write-all on non-hardened GitHub repositories). A compromised step — via any of the unpinned actions or a malicious
    postinstall hook in the same workflow — uses the write-all token to push commits to any branch, create GitHub releases
    containing backdoored artifacts, or read and exfiltrate all repository secrets accessible to Actions.
  evidence_summary: ci.yml has no `permissions:` key at the workflow level or in any of its eleven jobs. The architecture
    context explicitly assumes 'GITHUB_TOKEN scopes are minimally privileged per job' (tb-4 authorization leg), but ci.yml
    does not implement this assumption. codeql-analysis.yml correctly scopes permissions at the job level (lines 11-14), confirming
    the fix is known and applied inconsistently.
  impact_description: Any code executing in a ci.yml job (compromised action, postinstall hook, or expression injection) has
    repository-write GITHUB_TOKEN authority — can push malicious commits, create releases, modify branch protection, or overwrite
    packages — far exceeding the minimum needed for CI operations.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Docker/Heroku publish jobs are gated to the official repository and specific branches. codeql-analysis.yml
    has a scoped permissions block as a reference implementation.
  mitigation_title: 'Add explicit permissions: read-all at workflow level with per-job write grants in ci.yml'
  remediation:
    effort: Low
    steps:
    - 'Add `permissions: read-all` at the top level of ci.yml (after the `env:` block) as a deny-all default.'
    - 'Grant only the minimum needed per job: add `permissions: { contents: write, packages: write }` to the docker job; `permissions:
      { contents: read }` to test jobs; `statuses: write` or `checks: write` to coverage jobs as needed.'
    - Apply the same pattern to image_actions.yml, which also lacks a permissions block.
    - Verify with StepSecurity's harden-runner action or `actionlint` that no job inherits write-all GITHUB_TOKEN after the
      change.
    code_example: null
    verification: Run `python3 -c "import yaml,sys; w=yaml.safe_load(open('.github/workflows/ci.yml')); sys.exit(0 if 'permissions'
      in w else 1)"` — must exit 0.
    reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
  evidence:
  - file: .github/workflows/ci.yml
    line: 1
