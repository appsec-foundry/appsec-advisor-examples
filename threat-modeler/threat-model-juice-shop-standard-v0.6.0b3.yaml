    with no isAuthorized() middleware.
  - 'routes/showProductReviews.ts:36 builds `{ $where: ''this.product == 1;sleep(2000)'' }` by direct string concatenation
    of the URL parameter.'
  - MongoDB evaluates the JavaScript $where expression; global.sleep(2000) at lines 17-25 blocks the Node.js event loop for
    up to 2000ms per request.
  - Concurrent requests from the attacker starve the event loop, rendering all other endpoints including login, orders, and
    payment unresponsive.
