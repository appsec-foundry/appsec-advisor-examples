      line: 13
  - component_id: juice-shop-auth
    relation: processed
    evidence:
    - file: lib/insecurity.ts
      line: 21
- id: A-003
  name: Hardcoded Cryptographic Key Material
  classification: Restricted
  description: RSA private key (1024-bit) and HMAC secret ('pa4qacea4VK9t9nGv7yZtwmj') embedded verbatim in lib/insecurity.ts.
    These keys protect JWT integrity and coupon HMAC respectively; their exposure in the public repository negates all cryptographic
    protections.
  linked_threats: []
  component_refs:
  - component_id: juice-shop-api
    relation: stored
    evidence:
    - file: lib/insecurity.ts
      line: 21
    - file: lib/insecurity.ts
      line: 39
  - component_id: juice-shop-auth
    relation: processed
    evidence:
    - file: lib/insecurity.ts
      line: 38
- id: A-004
  name: Payment Card Records
