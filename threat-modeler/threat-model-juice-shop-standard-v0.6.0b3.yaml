- local_id: juice-shop-auth-012
  threat_category_id: TH-06
  additional_categories:
  - TH-02
  stride: Elevation of Privilege
  cwe: CWE-602
  title: Client-Side-Only Admin Role Check in AdminGuard (app.guard.ts:54)
  scenario: AdminGuard.canActivate() at app.guard.ts:52-60 uses the jwtDecode() library (which does NOT verify the JWT signature)
    to decode the token stored in localStorage and checks whether payload.data.role equals 'admin'; any script with localStorage
    write access — including a browser console, extension, or XSS payload — can replace the stored token with any JWT containing
    data.role:'admin' regardless of its signature validity; Angular Router then permits navigation to /administration and
    other admin-only UI routes; the admin interface becomes accessible to an attacker operating in the browser without the
    server issuing a legitimate admin JWT.
  evidence_summary: app.guard.ts:53-54 calls loginGuard.tokenDecode() which uses jwtDecode at line 38 (imported from jwt-decode
    at line 7); jwt-decode is a decode-only library that does not perform signature verification; any JWT payload with data.role:'admin'
    passes the guard regardless of whether the server signed the token.
  impact_description: Attacker gains access to admin UI routes including user management, challenge administration, and any
    other admin-only Angular components; combined with the hardcoded private key (finding 002), the attacker can also make
    server-side admin API calls succeed; the sensitive_asset 'RSA private key for JWT signing' becomes reachable through the
    admin UI.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: Server-side isAuthorized() at lib/insecurity.ts:52 verifies JWT signature for API calls, providing partial
    protection against server-side abuse; admin UI-only actions remain unprotected
  mitigation_title: Replace client-side jwtDecode with a server-side role validation API call in AdminGuard
  remediation:
    effort: Medium
    steps:
    - Replace the tokenDecode() call in AdminGuard.canActivate() with an HTTP call to a server-side endpoint (e.g., GET /rest/me)
      that verifies the JWT signature and returns the user role; allow navigation only if the server confirms role=admin.
    - Remove the use of jwtDecode for authorization decisions in app.guard.ts; retain it only for non-security-sensitive display
      purposes such as showing the user's email in the UI.
    - Add an e2e test that sets localStorage.token to an unsigned JWT with role=admin and asserts that navigation to /administration
      redirects to the 403 page.
    code_example: null
    verification: Set localStorage.token in the browser console to a base64-encoded JWT with data.role='admin' but no valid
      signature; navigate to /administration and assert the page redirects to 403.
    reference: https://cwe.mitre.org/data/definitions/602.html
  evidence:
  - file: frontend/src/app/app.guard.ts
    line: 54
