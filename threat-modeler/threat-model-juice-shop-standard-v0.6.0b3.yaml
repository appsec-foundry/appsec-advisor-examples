verdict:
  severity: red
  opening: The application carries eight Critical findings across authentication, data access, and session handling — any
    one of which gives an unauthenticated or authenticated attacker full account or database control without chaining.
  bullets:
  - title: Admin account takeover without credentials
    body: Database query injection in the login route lets any internet visitor authenticate as any user, including administrators.
    findings:
    - F-005
    - F-008
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Unauthorized session token forgery
    body: The token signing secret is committed to the source repository; any repository reader can issue tokens for any user
      or admin role.
    findings:
    - F-010
    - F-001
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Server process code execution
    body: The product-review route passes user input to a database query that executes arbitrary server-side code.
    findings:
    - F-009
    weaknesses: []
    verified_attack_path: false
  - title: Customer database exposed
    body: The product search route concatenates user input directly into a database query, exposing the entire data store
      to read or export.
    findings:
    - F-006
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Self-promotion to administrator
    body: Any logged-in user can promote their own account to admin by including a role field in the profile update request.
    findings:
    - F-011
    weaknesses: []
    verified_attack_path: true
  - title: Active login stolen via injected script
    body: Session tokens held in the browser script context are reachable by any injected page script; the stored cross-site
      scripting surface spans multiple sanitizer bypass points.
    findings:
    - F-002
    - F-027
    weaknesses: []
    verified_attack_path: true
  closing: No single perimeter control prevents these paths. Query hardening, secret rotation, and moving session tokens out
    of the script context are the mandatory first repairs.
  bullets_intro: 'What an attacker can do today, worst first:'
