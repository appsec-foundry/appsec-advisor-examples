tier_root_causes:
  edge:
  - Angular bypassSecurityTrustHtml passes user input as trusted HTML to the DOM
  - JWT stored in localStorage is readable by any same-origin XSS payload
  - OAuth password derived deterministically from email; computable offline
  - Socket.IO client connects without authentication token in handshake
  server:
  - User input interpolated directly into SQL and NoSQL query strings
  - Cryptographic keys and secrets hardcoded in repository source files
  - Auth middleware absent from sensitive API routes and WebSocket endpoints
  - Ownership not checked before resource mutations; session identity ignored
  - CI/CD uses mutable action refs, unpinned images, and overpermissioned tokens
  data:
  - Passwords hashed with unsalted MD5; rainbow table recovery is trivial
cross_repo_dependencies: []
weaknesses:
- id: W-001
  weakness_class: injection
  kind: design
  title: Database access relies on concatenated queries
  statement: Parameterized Database Access is not consistently enforced.
  severity: Critical
  severity_basis: confirmed
  observable_backing:
