threats:
- local_id: express-api-007
  threat_category_id: TH-01
  additional_categories:
  - Denial of Service
  - TH-06
  stride: Tampering
  cwe: CWE-943
  title: NoSQL Injection in MarsDB Query Layer
  scenario: An attacker sends GET /rest/products/:id/reviews with a JavaScript expression in the :id parameter. When the noSqlCommandChallenge
    is enabled (the default), the id is only truncated to 40 characters and concatenated into a MarsDB $where predicate. An
    attacker can inject JavaScript to exfiltrate review documents or invoke the globally defined sleep function to block the
    Node.js event loop.
  evidence_summary: 'routes/showProductReviews.ts:36 executes db.reviewsCollection.find({ $where: ''this.product == '' + id
    }). When isChallengeEnabled returns true (line 31) the id is utils.trunc(req.params.id, 40), not a Number, enabling string-concatenated
    JavaScript injection.'
  impact_description: Attacker can read any review document regardless of product association, enumerate stored user emails
    from reviews, or inject sleep(2000) to block the synchronous event loop and deny service.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: String truncation to 40 characters when challenge is enabled; Number() coercion only applied when challenge
    is disabled
  mitigation_title: Cast product ID to integer and eliminate $where in routes/showProductReviews.ts
  remediation:
    effort: Low
    steps:
    - 'Always coerce req.params.id to Number and return 400 if it is NaN: const id = Number(req.params.id); if (Number.isNaN(id))
      return res.status(400).json({error:''Invalid id''})'
    - 'Replace the $where predicate with a MarsDB query object: db.reviewsCollection.find({ product: id })'
    - Remove the global.sleep definition and the challenge-dependent code path
    code_example: null
    verification: Send GET /rest/products/1;sleep(2000)/reviews and verify the response arrives in under 100ms without the
      2-second delay
    reference: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
  evidence:
  - file: routes/showProductReviews.ts
    line: 36
  boundary_refs:
  - boundary_id: tb-5
    origin_component_id: express-api
    rationale: Attacker-controlled JavaScript in $where crosses the data-interpretation leg of the express-api to marsdb-store
      boundary.
    leg: data-interpretation
    evidence_locations:
    - file: routes/showProductReviews.ts
      line: 36
  - boundary_id: tb-5
    origin_component_id: marsdb-store
    rationale: User-controlled input from the express-api tier crosses the MarsDB Collection interface as a $where JavaScript
      expression instead of a safe typed query
    leg: data-interpretation
    evidence_locations:
