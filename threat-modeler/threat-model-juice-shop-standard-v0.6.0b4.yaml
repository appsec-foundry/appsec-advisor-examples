  title: Hardcoded RSA private key enables offline JWT forgery — lib/insecurity.ts:23
  scenario: An attacker reads the hardcoded RSA private key literal at lib/insecurity.ts:23, signs a JWT payload claiming
    any user identity with RS256, and uses that token to authenticate as any user including admin without requiring the original
    credential.
  attack_steps:
  - Attacker reads the full RSA private key literal from lib/insecurity.ts:23 in the publicly available repository.
  - Attacker calls jwt.sign({data:{role:'admin',id:<uid>,email:'admin@juice-sh.op'}}, privateKey, {algorithm:'RS256'}) offline.
  - Attacker sets the forged token in the Authorization header and sends requests to any JWT-protected endpoint.
  - All protected routes accept the token as authentic and grant admin-level access indefinitely until the key is rotated.
  evidence_summary: The complete RSA private key is assigned as a string literal at lib/insecurity.ts:23; authorize() at line
    56 signs all tokens with this key, and the key is never loaded from external configuration or a secret store.
  impact_description: Permanent, offline authentication bypass for every user and role in the application. Any actor who clones
    the repository can forge tokens granting admin privileges, access all user accounts, manipulate orders, and read all sensitive
    data — the key cannot be invalidated without a code change and deployment.
  likelihood: High
  impact: Critical
  risk: High
  controls_in_place: RS256 signing algorithm; neutralised because the private key is publicly known.
  mitigation_title: Load JWT signing key from external secret store, remove hardcoded literal at lib/insecurity.ts:23
