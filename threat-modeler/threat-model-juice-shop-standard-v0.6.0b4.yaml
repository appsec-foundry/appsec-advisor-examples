  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded WebSocket Connection Consumption — registerWebsocketEvents.ts:20
  scenario: An unauthenticated attacker repeatedly opens Socket.IO connections from many clients or in rapid succession. The
    Server instantiation at line 20 applies no per-IP connection limit, no rate limit on the upgrade handshake, and no maximum
    concurrent connection count. Each connection allocates a socket object, registers event listeners, and iterates the notifications
    array; enough simultaneous connections exhaust file descriptors or heap memory and crash the Node.js process.
  evidence_summary: 'new Server(server, { cors: { origin: ''http://localhost:4200'' } }) at registerWebsocketEvents.ts:20
    creates the Socket.IO server with no connectionStateRecovery limit, no per-connection throttle, and no maxHttpBufferSize
    override; io.on(''connection'', ...) at line 24 executes per-connection work (notifications.forEach) with no guard against
    simultaneous high-volume connections.'
  impact_description: An attacker can exhaust server file descriptors or heap memory through unauthenticated high-volume WebSocket
    connections, making the application unavailable to legitimate users.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Add connection rate limiting and maximum concurrent socket cap to the Socket.IO server in registerWebsocketEvents.ts
  remediation:
    effort: Medium
    steps:
    - Set a maxHttpBufferSize on the Server constructor to cap per-message payload size.
    - Integrate a per-IP connection rate limiter (e.g., using the socket.io-rate-limiter package or a Redis-backed express-rate-limit
      applied to the upgrade route) before the Socket.IO handshake completes.
    - Disconnect or reject connections that exceed the per-IP threshold to prevent socket exhaustion.
    - Add a load test that asserts the server remains responsive after 500 concurrent connection attempts from a single IP.
