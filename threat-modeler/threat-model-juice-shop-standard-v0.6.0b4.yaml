- local_id: sqlite-db-002
  threat_category_id: TH-01
  additional_categories: []
  stride: Tampering
  cwe: CWE-79
  title: Challenge-gated weak sanitization stores XSS HTML in Users — models/user.ts:50
  scenario: When persistedXssUserChallenge is enabled, the username setter at models/user.ts:50 applies security.sanitizeLegacy
    instead of security.sanitizeSecure. sanitizeLegacy (lib/insecurity.ts:61) strips only patterns matching <word-chars><non-word><word-char>
    via a single regex pass; payloads that avoid this pattern (e.g. <img src=x onerror=alert(1)>) survive and are stored verbatim
    in the Users.username column. Any rendering context that later outputs this username without HTML encoding will execute
    the stored script in the viewer's browser session.
  evidence_summary: models/user.ts:50 conditionally calls security.sanitizeLegacy whose regex (lib/insecurity.ts:61) does
    not neutralize all HTML injection vectors; the caller controls which sanitizer applies via a feature flag.
  impact_description: Attacker stores a persistent XSS payload in Users.username; any page rendering usernames without encoding
    — including admin UI — executes the payload in the victim's browser, enabling session hijacking or account takeover.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: security.sanitizeSecure applied when challenge flag is disabled; sanitizeLegacy (insufficient) applied
    when challenge is active.
  mitigation_title: Enforce sanitizeSecure unconditionally on all username writes in models/user.ts setter
  remediation:
    effort: Low
    steps:
    - In models/user.ts username setter, call security.sanitizeSecure(username) unconditionally and remove the isChallengeEnabled
      branch; relocate any challenge-detection logic to a route-level observer that does not weaken the storage-layer control.
    - Add a test that stores a username containing <script>alert(1)</script> and asserts the stored value contains no executable
      HTML tags.
    code_example: null
    verification: Set username to '<img src=x onerror=alert(1)>' via the registration API; confirm the stored Users.username
      value contains no onerror attribute.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  evidence:
  - file: models/user.ts
    line: 50
  evidence_tier: insecure-practice
