  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-829
  title: CI/CD Workflow Supply-Chain Risk
  scenario: package-lock.json is excluded from version control by .gitignore line 10. Every CI job runs `npm install` which
    resolves dependencies non-deterministically against the current registry state. An attacker who publishes a malicious
    version of any transitive dependency within the semver range gets it installed across every build.
  attack_steps:
  - Attacker publishes a malicious version of a transitive dependency within a semver range declared in package.json via maintainer
    account takeover.
  - CI jobs running `npm install` (ci.yml lines 65, 85, 124, 161, 217, 252) resolve the new malicious version because no lockfile
    constrains the resolution.
  - Malicious postinstall hook or module code executes in the CI runner with access to build artifacts, secrets, and source
    files.
  evidence_summary: .gitignore line 10 excludes package-lock.json. package-lock.json is absent from the repository. ci.yml
    uses `npm install` (not `npm ci`) in at least six separate jobs. Without a lockfile, semver ranges resolve to whatever
    version the registry currently serves.
  impact_description: A compromised transitive dependency executes arbitrary code in CI and on every developer workstation,
    enabling secret exfiltration, backdoored release artifacts, or persistent compromise.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Several CI jobs use `--ignore-scripts` for lint steps; however test, packaging, and e2e jobs do not.
  mitigation_title: Remove package-lock.json from .gitignore and enforce npm ci in CI
  remediation:
    effort: Medium
    steps:
    - Remove `package-lock.json` from `.gitignore` and run `npm install` locally to generate and commit the lockfile.
    - Replace all `npm install` invocations in CI jobs (ci.yml lines 65, 85, 124, 161, 217, 252; release.yml line 43) with
      `npm ci` to enforce lockfile integrity.
    - Add a CI job step that runs `npm install --dry-run` after `npm ci` and fails if the result differs from the lockfile.
    code_example: null
    verification: Run `git ls-files package-lock.json` and confirm the file is tracked; run `grep -rn "npm install" .github/workflows/
      | grep -v "ignore-scripts" | grep -v " -g "` and confirm zero results.
    reference: https://docs.npmjs.com/cli/v10/commands/npm-ci
  evidence:
  - file: .gitignore
    line: 10
  violated_requirements: []
  evidence_check: verified
  prior_finding_ref: null
  architectural_violation: false
  component_name: CI/CD Pipeline
