security_controls:
- domain: Session and Token Controls
  control: Session Token Validation (JWT Based)
  effectiveness: Weak
  kind: mechanism
  assessment: 'Tokens signed with RS256 via jwt.sign(user, privateKey, {algorithm: ''RS256''}) (lib/insecurity.ts:56). The
    isAuthorized() middleware calls expressJwt({secret: publicKey}) without an explicit algorithms option (lib/insecurity.ts:54),
    leaving algorithm-confusion and alg:none downgrade unblocked. The RSA private key is hardcoded in source (lib/insecurity.ts:23)
    and is publicly known. JWT revocation relies on an in-memory authenticatedUsers map that does not survive restarts (lib/insecurity.ts:72-93).'
  implementation: lib/insecurity.ts:54-57; routes/login.ts:24-26; lib/insecurity.ts:72-93
  rule_id: ARCH-JWT-001
  audit_flags:
  - control_name_canonicalised
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Cryptography Secrets and Data Protection
  control: Password Storage
  effectiveness: Unsafe
  kind: primitive
  assessment: Passwords stored as unsalted MD5 hashes via crypto.createHash('md5') (lib/insecurity.ts:43, models/user.ts:77).
    MD5 provides no work factor; all stored password hashes can be cracked offline in seconds. The login query compares the
    MD5 hash of the supplied password against the stored hash (routes/login.ts:34). This is the intentional weakPasswordChallenge.
  implementation: lib/insecurity.ts:43; models/user.ts:77; routes/login.ts:34
  status_note: Unsafe — MD5 is not a password KDF; all hashes immediately crackable offline.
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Multi-Factor Authentication (TOTP)
  effectiveness: Adequate
  kind: mechanism
  assessment: TOTP second-factor verification implemented in routes/2fa.ts:31. After password validation, users with a non-empty
    totpSecret receive HTTP 401 with a short-lived JWT tmpToken. The tmpToken gates the second-factor completion endpoint
    before a full session token is issued (routes/login.ts:37-46).
  implementation: routes/2fa.ts:31; routes/login.ts:37-46
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: cross-cutting
  assessment: security.isAuthorized() expressJwt middleware gates most authenticated routes. POST /file-upload (server.ts:309)
    carries authn=absent and requires no token. POST /api/Feedbacks (server.ts:401) is intentionally unauthenticated by design.
    POST /rest/memories (server.ts:312) authentication status is unresolved. POST /api/Users is unauthenticated for registration
    (by design), but three separate route registrations (server.ts:407,419,420) amplify the unauthenticated surface.
  implementation: server.ts:309,312,401-420; lib/insecurity.ts:54
  rule_id: ARCH-AUTHN-001
- domain: Authorization Controls
  control: Centralized Route Authorization
  effectiveness: Weak
  kind: cross-cutting
  assessment: expressJwt enforces authentication on many routes but authorization (role and ownership) is absent or unconfirmed
    on 18+ state-changing routes including PUT /api/Products/:id (commented out at server.ts:369), PUT /api/BasketItems/:id
    (server.ts:425), PUT /rest/wallet/balance (server.ts:626), and PATCH /rest/products/reviews (server.ts:633). No centralized
    RBAC enforcement layer was found; admin-only operations rely on JWT role claims without confirmed server-side role-check
    middleware.
  implementation: server.ts:350-640
  rule_id: ARCH-AUTHZ-001
- domain: Authorization Controls
  control: Object-Level Access Control (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  assessment: Authenticated object-addressing routes including GET /rest/basket/:id (server.ts:602), PUT /api/BasketItems/:id
    (server.ts:425), PUT /api/Feedbacks/:id (server.ts:432), and PUT /api/Cards/:id (server.ts:439) carry authentication middleware
