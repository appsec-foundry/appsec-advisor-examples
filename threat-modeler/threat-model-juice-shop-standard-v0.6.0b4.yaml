  stride: Denial of Service
  cwe: CWE-400
  title: YAML Bomb Causes CPU Exhaustion in File Upload — routes/fileUpload.ts:117
  scenario: An unauthenticated attacker uploads a small YAML file containing deeply nested alias references (a YAML bomb).
    The yaml.load(data) call at routes/fileUpload.ts:117 expands the anchors exponentially, consuming all available CPU and
    memory. Unlike the XML handler which has a 2-second vm execution timeout (routes/fileUpload.ts:83), the YAML handler has
    no explicit execution timeout wrapper, allowing the expansion to run until the process crashes or the heap is exhausted.
  evidence_summary: 'routes/fileUpload.ts:117 calls vm.runInContext(''JSON.stringify(yaml.load(data))'', sandbox, { timeout:
    2000 }). While a vm timeout is present, the YAML parser (js-yaml''s yaml.load) performs the expansion synchronously inside
    the vm context. A sufficiently large billion-laughs payload can cause memory exhaustion before the timeout fires. The
    yamlBombChallenge at line 122-125 confirms this is an exploitable DoS path.'
  impact_description: A ~1KB YAML bomb payload can cause the server process to exhaust memory or remain unresponsive for the
    duration of the timeout, denying service to all concurrent users. Multiple concurrent uploads compound the effect.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: 2-second vm execution timeout; 100KB upload size check; challenge guard can disable the vulnerable path
  mitigation_title: Add YAML parse depth and expansion limits or use a safe YAML parser in routes/fileUpload.ts
  remediation:
