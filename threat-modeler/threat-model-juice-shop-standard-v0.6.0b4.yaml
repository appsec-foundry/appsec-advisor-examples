  scenario: An attacker submits a crafted email value such as \"' OR '1'='1\" to POST /rest/user/login; the value is directly
    concatenated into a raw SQL string at routes/login.ts:34, causing the query to return the first user row and grant authentication
    as that user without a matching password.
  attack_steps:
  - Attacker sends POST /rest/user/login with body {"email":"' OR '1'='1'--","password":"x"}, exploiting the absence of parameterized
    binding at routes/login.ts:34.
  - The injected SQL causes the WHERE clause to evaluate to TRUE for every row; Sequelize plain:true returns the first user
    record, typically the admin account.
  - The server issues a valid JWT for the returned user and stores the session in the in-memory token map, completing authentication
    bypass.
  - Attacker uses the issued JWT to call all authenticated API endpoints as the hijacked user.
  evidence_summary: models.sequelize.query() is called at routes/login.ts:34 with a template literal that interpolates req.body.email
    and the MD5 hash of req.body.password directly into the SQL string without parameterized binding or escaping.
  impact_description: Unauthenticated remote attacker can log in as any user, including admin, by injecting SQL into the email
    field. Full authentication bypass, read access to all user sessions, and potential data modification via stacked queries
    (SQLite-dependent) are in scope. Declared sensitive assets — JWT signing key, TOTP secrets, MD5-hashed passwords — are
    all accessible after session establishment.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None at the SQL sink; MD5 hash applied to password field but not the email field.
