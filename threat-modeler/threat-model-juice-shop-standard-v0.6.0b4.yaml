- local_id: auth-008
  threat_category_id: TH-02
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-640
  title: Security-question password reset without lockout — routes/resetPassword.ts:41
  scenario: An attacker submits POST /rest/user/reset-password with a target email and guessed security answers; because the
    comparison at line 41 applies no request-rate limiting and no answer-attempt lockout, the attacker iterates answers from
    a targeted research effort (OSINT or dictionary) until one matches, then resets the victim's password and takes over the
    account.
  evidence_summary: resetPassword.ts:41 compares security.hmac(answer) === data.answer with no attempt counter, lockout, or
    rate-limit middleware visible in the handler or its imports. The security answer HMAC key is hardcoded (auth-006), allowing
    offline pre-computation of candidate answers.
  impact_description: Any account, including admin, can be taken over by an attacker who can research or brute-force the answer
    to the security question. The account takeover yields a full session token, bypassing password and 2FA requirements entirely
    for that account.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: HMAC comparison masks plaintext answer; neutralised by hardcoded key (auth-006). No lockout or rate limiting.
  mitigation_title: Replace security-question reset with email-token flow and add attempt lockout in resetPassword.ts
  remediation:
    effort: High
    steps:
    - Replace the security question reset flow with a time-limited, single-use email token sent to the verified address; this
      eliminates the guessable-answer attack surface entirely.
    - If the security question must be retained for legacy reasons, apply a per-email rate limit of 3 attempts per 30 minutes
      and lock the reset flow for 1 hour after 5 failures.
    - Add an integration test confirming that a 4th reset attempt within 30 minutes returns HTTP 429.
    code_example: null
    verification: Send 4 POST /rest/user/reset-password requests for the same email within 30 minutes; the 4th must return
      HTTP 429.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
