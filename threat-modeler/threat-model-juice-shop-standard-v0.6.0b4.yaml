abuse_case_analysis:
  status: completed
  reason: null
  cases:
  - id: AC-T-002
    title: Bulk Data Exfiltration via Broken Object Authorization
    source: mandatory
    actor: Internet Attacker — authenticated low-privilege user
    goal: Enumerate and exfiltrate other users' records, then escalate own permissions via unguarded mass assignment.
    prerequisite: Attacker holds a valid, non-privileged user account.
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-048
    - F-008
    blocking_mitigation_ids:
    - M-007
    - M-061
    - M-023
    steps:
    - step: 1
      outcome: Attacker enumerates and retrieves records for arbitrary object IDs; no ownership comparison is performed.
      verdict: confirmed
      finding_id: F-048
      evidence:
        file: routes/updateProductReviews.ts
        line: 16
      controls_found: []
      unverified: false
    - step: 2
      outcome: Update endpoint persists an unfiltered `role` (or equivalent) field supplied in the request body.
      verdict: confirmed
      finding_id: F-008
      evidence:
        file: routes/verify.ts
        line: 52
      controls_found: []
      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-008
    blocking_mitigation_ids:
    - M-023
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so a client-supplied `role` (or `isAdmin`)
        field is written verbatim.
      verdict: confirmed
      finding_id: F-008
      evidence:
        file: routes/verify.ts
        line: 52
      controls_found: []
      unverified: false
  - id: AC-T-006
    title: Remote Code Execution via Server-Side Injection
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Execute arbitrary code in the application process.
    prerequisite: An input reaches a server-side interpreter / template / eval.
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-006
    blocking_mitigation_ids:
    - M-021
    steps:
    - step: 1
      outcome: Attacker-controlled input is passed to `eval`, a server-side template engine, an unsafe sandbox, or an unsafe
        deserializer.
      verdict: confirmed
      finding_id: F-006
      evidence:
        file: routes/userProfile.ts
        line: 61
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a public repo, served by an unauthenticated
      route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-011
    - F-012
    blocking_mitigation_ids:
    - M-026
    - M-027
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the source repository or served without authentication.
      verdict: confirmed
      finding_id: F-011
      evidence:
        file: lib/insecurity.ts
        line: 23
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token signed with it (or the leaked credential)
        is accepted as authentic.
      verdict: confirmed
      finding_id: F-012
      evidence:
        file: lib/insecurity.ts
        line: 54
      controls_found: []
      unverified: false
  - id: AC-T-001
    title: Account Takeover via XSS + Token Hijacking
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain persistent authenticated access as an arbitrary user without valid credentials.
    prerequisite: Attacker can get markup rendered in a victim's session, through stored content (e.g. feedback, comments,
      profile fields) or a crafted link.
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-017
    - F-031
    - F-078
    blocking_mitigation_ids:
    - M-032
    - M-045
    - M-079
    steps:
    - step: 1
      outcome: Attacker JavaScript executes in the victim's browser session.
      verdict: confirmed
      finding_id: F-017
      evidence:
        file: frontend/src/app/about/about.component.ts
        line: 119
      controls_found: []
      unverified: false
    - step: 2
      outcome: Token exfiltrated from local/session storage via the Step 1 payload.
      verdict: confirmed
      finding_id: F-031
      evidence:
        file: frontend/src/app/login/login.component.ts
        line: 105
      controls_found: []
      unverified: false
    - step: 3
      outcome: Exfiltrated token accepted for a new session; absence of token binding / PKCE removes the last server-side
        revocation opportunity.
      verdict: confirmed
      finding_id: F-078
      evidence:
        file: frontend/src/app/login/login.component.ts
        line: 152
      controls_found: []
      unverified: false
  - id: AC-T-003
    title: Privilege Escalation to Admin via JWT Algorithm Confusion
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge an admin-role JWT without knowledge of the signing secret.
    prerequisite: Attacker can obtain any valid JWT issued by the system (e.g. by registering a free account).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-071
    blocking_mitigation_ids:
