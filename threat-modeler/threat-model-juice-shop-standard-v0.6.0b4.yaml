tier_root_causes:
  edge:
  - Systematic use of bypassSecurityTrustHtml disables Angular DOM sanitization
  - OAuth callback processed without state nonce validation on client
  - Session token persisted in script-readable localStorage
  - Authorization decisions delegated to client-side route guards only
  - Test credentials and client-derived secrets compiled into production bundles
  server:
  - User input concatenated directly into SQL and NoSQL query strings
  - Server routes expose state-changing operations without authentication middleware
  - Cryptographic keys and secrets committed as source literals
  - Authentication endpoints lack per-IP rate limiting and attempt lockout
  - Build pipeline resolves mutable dependencies and unpinned container images
  data:
  - Sensitive financial data persisted in plaintext without field-level encryption
