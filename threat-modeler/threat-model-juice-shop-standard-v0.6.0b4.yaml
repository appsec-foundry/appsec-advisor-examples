  stride: Tampering
  cwe: CWE-942
  title: Wildcard CORS Permits Credentialed Cross-Origin Requests — server.ts:183
  scenario: 'A malicious web page loaded in the victim''s browser sends cross-origin requests to the Juice Shop API, including
    the victim''s authentication cookie or token. The wildcard CORS configuration (app.use(cors())) returns Access-Control-Allow-Origin:
    * and Access-Control-Allow-Credentials: true, allowing the malicious origin to read the API response including the victim''s
    data and perform state-changing operations.'
  evidence_summary: server.ts:182 registers app.options('*', cors()) and server.ts:183 registers app.use(cors()) with no origin
    restriction. The known-threats context confirms this is the wildcard CORS finding.
  impact_description: Cross-origin attacker can perform arbitrary state-changing API calls on behalf of a logged-in victim
    including order placement, address modification, and fund transfers. Combined with credential exposure, this enables account
    manipulation.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None; CORS is globally open
  mitigation_title: Restrict CORS origin to the application's own domain in server.ts
  remediation:
    effort: Low
    steps:
    - 'Replace app.use(cors()) in server.ts with app.use(cors({ origin: config.get(''server.baseUrl''), credentials: true
      })) to restrict to the application origin'
