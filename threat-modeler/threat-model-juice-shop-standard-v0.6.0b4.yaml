- local_id: ci-cd-pipeline-007
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-862
  title: Missing permissions block default GITHUB_TOKEN scope
  scenario: ci.yml defines no top-level or job-level `permissions:` block. On repositories where the default token permission
    is read-write, a compromised CI step (malicious dependency, injected script, or vulnerable action) gains write access
    to repository contents, packages, and issues via the implicit GITHUB_TOKEN. The attacker uses this to push backdoored
    commits, publish modified releases, or create malicious GitHub issues pointing to the compromised branch.
  attack_steps:
  - A malicious transitive npm dependency executes code during a CI build step that has access to the GITHUB_TOKEN environment
    variable.
  - Without a restrictive `permissions:` block, the token carries write-all scopes on repositories with permissive defaults.
  - The malicious code uses the GITHUB_TOKEN to push a backdoored commit or create a GitHub release pointing to a tampered
    artifact.
  evidence_summary: ci.yml has no `permissions:` key at the workflow or job level (verified by reading the full 405-line file).
    The workflow runs on push and pull_request triggers, executing GITHUB_TOKEN-authenticated steps including publishing Docker
    images (line 351) and coverage reports (line 202). codeql-analysis.yml correctly restricts permissions at job level (line
    11); the CI/CD workflow does not.
  impact_description: A compromised CI step can write to the repository, publish releases, or access secrets beyond what the
    pipeline legitimately requires, enabling persistent code tampering or secret exfiltration under the pipeline's identity.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: codeql-analysis.yml correctly uses a restricted permissions block; ci.yml does not restrict token scope.
  mitigation_title: Add explicit least-privilege permissions block to ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level `permissions: read-all` (or `contents: read`) block to ci.yml to restrict the default GITHUB_TOKEN
      scope.'
