meta_findings:
- id: MF-001
  title: Insufficient Secret Management
  category: Insufficient Secret Management
  summary: '2 findings trace to secrets, keys, or tokens stored directly in source code. The architectural concern is not
    the individual values — they can be rotated — but the absence of a secret-management substrate: no env-var convention,
    no vault/KMS integration, no pre-commit scan. Rotating individual secrets addresses symptoms; instituting the substrate
    addresses the gap.'
  derived_from:
  - T-011
  - T-032
  severity: High
  recommended_mitigation_id: null
verdict:
  severity: red
  opening: User accounts, server processes, and the full customer database are all reachable by an unauthenticated attacker;
    several critical defects require no credentials, no configuration, and no prior access.
  bullets:
  - title: Account takeover without credentials
    body: SQL injection and a hardcoded signing key let any internet visitor log in as any user, including admin.
    findings:
    - F-003
    - F-011
    weaknesses:
    - W-002
    - W-010
    verified_attack_path: true
  - title: All customer data exfiltrated
    body: SQL injection in the product search returns every user's email and password hash in a single unauthenticated query.
    findings:
    - F-005
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Self-promotion to administrator
    body: Any visitor can register with an admin role by adding a field to the sign-up request, bypassing all privilege controls.
    findings:
    - F-008
    weaknesses: []
    verified_attack_path: true
  - title: Remote server takeover
    body: A crafted profile update triggers server-side code evaluation, giving the attacker full control of the server process
      and all its data.
    findings:
    - F-006
    weaknesses:
    - W-001
    verified_attack_path: true
  - title: Any customer's account readable and writable
    body: Missing ownership checks let a signed-in attacker read or overwrite any other customer's records and product reviews.
    findings:
    - F-004
    - F-048
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Server files exposed via file upload
    body: The file-upload handler processes external document references without restriction, letting an unauthenticated attacker
      read any file on the server.
    findings:
    - F-007
    weaknesses: []
    verified_attack_path: false
  - title: Open real-time channel and persistent stolen sessions
    body: The real-time channel admits anonymous connections, and a logged-out session token stays usable for six hours after
      logout.
    findings:
    - F-016
    - F-071
    weaknesses:
    - W-004
    verified_attack_path: true
  closing: Addressing these systemic gaps across authentication, data access, and file handling will substantially reduce
    the exposure to unauthenticated attackers and lateral movement within the application.
  bullets_intro: 'Security concerns behind this assessment:'
  business_context_note: 'Declared business impact: no material harm for 3 of 8 modeled components under the stated use-case
    assumptions. Finding severities and the verdict retain their technical security concern levels; evidence of consequences
    outside those assumptions still requires review.'
