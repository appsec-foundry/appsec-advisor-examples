  title: Npm install --unsafe-perm in Docker build stage — Dockerfile:5
  scenario: Dockerfile line 5 runs `npm install --omit=dev --unsafe-perm`. This flag causes npm to run install lifecycle scripts
    (preinstall, install, postinstall) as root instead of dropping to a lower-privilege UID. A compromised production dependency
    can execute arbitrary commands as root during the Docker image build.
  evidence_summary: 'Dockerfile line 5: `RUN npm install --omit=dev --unsafe-perm`. The flag bypasses npm''s UID/GID dropping
    for install scripts, allowing lifecycle hooks to run as root in the build context.'
  impact_description: A malicious production npm package can write to system paths, install backdoors into the built image,
    or corrupt application build artifacts before the final container layer is sealed.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: The final runtime image uses gcr.io/distroless/nodejs24-debian13 and runs as UID 65532; the installer
    stage runs as root with --unsafe-perm.
  mitigation_title: Remove --unsafe-perm from Dockerfile installer stage npm install
  remediation:
    effort: Low
    steps:
    - 'Remove `--unsafe-perm` from Dockerfile line 5: change to `RUN npm install --omit=dev`.'
    - If specific build scripts legitimately require elevated access, isolate them into a separate RUN step with explicit
      invocation rather than relying on lifecycle hooks.
    code_example: null
    verification: Run `grep -n 'unsafe-perm' Dockerfile` and confirm zero results. Build the image locally and confirm it
      succeeds.
    reference: https://docs.npmjs.com/cli/v10/commands/npm-install#--unsafe-perm
