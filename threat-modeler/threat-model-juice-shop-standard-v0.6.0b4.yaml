  stride: Elevation of Privilege
  cwe: CWE-613
  title: UpdateAuthenticatedUsers re-inserts valid JWT bypassing — lib/insecurity.ts:191
  scenario: After a user logs out and their token is removed from the in-memory authenticatedUsers tokenMap, an attacker in
    possession of the user's previously issued JWT presents it in a subsequent request; the updateAuthenticatedUsers middleware
    at insecurity.ts:191 calls jwt.verify() and, finding the token absent from the map, re-inserts it at line 193, restoring
    a full active session without any re-authentication.
  evidence_summary: lib/insecurity.ts:188-200 shows updateAuthenticatedUsers() calling jwt.verify(); on success, if authenticatedUsers.get(token)
    === undefined the token is re-inserted into the map via authenticatedUsers.put(). The check at line 193 treats map absence
    as justification for reinsertion rather than as a revocation signal.
  impact_description: A logged-out JWT remains usable for its full 6-hour lifetime against any route protected by this middleware.
    An attacker who obtains a victim's token (via XSS, network interception, or log exfiltration) retains access even after
    the victim explicitly logs out. The in-memory map also loses all sessions on server restart, meaning all previously-issued
    non-expired JWTs regain active status after a restart.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: 6-hour JWT expiry (lib/insecurity.ts:56) provides an upper bound; does not protect against replay within
    the window.
  mitigation_title: Treat tokenMap absence as revocation in updateAuthenticatedUsers; require re-login for absent tokens at
    lib/insecurity.ts:193
  remediation:
    effort: Medium
    steps:
    - 'Change the condition at lib/insecurity.ts:193 from reinsertion to rejection: if the token passes jwt.verify() but is
      absent from authenticatedUsers, do not call authenticatedUsers.put(); instead, let the request proceed without a session
      context and require explicit re-authentication.'
    - Persist the token map in a server-side store (e.g. Redis with TTL matching JWT expiry) so revocations survive server
      restarts.
    - 'Add an integration test: (1) obtain a JWT, (2) call the logout endpoint, (3) send the JWT again and confirm subsequent
      authenticated requests return HTTP 401.'
    code_example: null
    verification: Log in, call the logout endpoint, restart the server, then send the original JWT to GET /rest/basket/1;
      expect HTTP 401.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
  evidence:
  - file: lib/insecurity.ts
    line: 191
