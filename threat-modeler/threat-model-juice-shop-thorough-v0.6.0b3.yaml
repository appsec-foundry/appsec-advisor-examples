  cwe: CWE-290
  title: Unvalidated OAuth token — oauth.component.ts:28
  scenario: An attacker lures a victim to a crafted URL carrying `#access_token=<attacker's own Google token>`. The SPA matches
    the fragment, parses the token with no state or nonce comparison, and submits it as the victim's login. The victim's browser
    is silently bound to the attacker-controlled account, so subsequent orders and payment data are recorded under the attacker's
    identity.
  evidence_summary: '`oauth.component.ts:28` passes `parseRedirectUrlParams().access_token` straight into `userService.oauthLogin`;
    `parseRedirectUrlParams` (line 71) reads the raw fragment supplied by `app.routing.ts:257` and splits it on `&` and `=`
    only. `login.component.ts:148` builds the authorization request with `client_id`, `response_type=token`, `scope` and `redirect_uri`
    and emits no state or nonce, so no value exists that the callback could compare against.'
  impact_description: A victim silently logged into an attacker-controlled shop account has any basket contents, delivery
    addresses, and order history they enter afterwards stored in that account and visible to the attacker.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Redirect URI is checked against the server-provided authorizedRedirects list at login.component.ts:80,
    but no state or nonce is generated or verified.
  mitigation_title: Bind the OAuth callback in oauth.component.ts to a generated state value
  remediation:
    effort: Medium
    steps:
    - Generate a cryptographically random state (and nonce) before the redirect in login.component.ts:148, store it in sessionStorage,
      and include it in the authorization URL.
    - In oauth.component.ts:28 reject the callback unless the returned state exactly equals the stored value, and clear the
      stored value after a single use.
    - Migrate off the implicit flow to authorization code with PKCE so no access token ever traverses the URL fragment.
    - Add a test that replays a callback fragment containing an unknown state and asserts oauthLogin is never invoked.
    code_example: null
    verification: Open the app with a handcrafted '#access_token=X&state=bogus' fragment and assert no request reaches /rest/user/authentication-details
      and the user stays logged out.
    reference: RFC 6749 §10.12 — Cross-Site Request Forgery
