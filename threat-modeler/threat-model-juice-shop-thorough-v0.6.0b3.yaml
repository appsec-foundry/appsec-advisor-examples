security_controls:
- domain: Session and Token Controls
  control: Session Token Signing (JWT Based)
  effectiveness: Unsafe
  kind: mechanism
  assessment: RS256 JWT signing is implemented (lib/insecurity.ts:54) but the RSA private key is hardcoded in source at lib/insecurity.ts:21
    and committed to the repository. Any reader of the source can forge valid JWTs for any user identity without knowing the
    user's credentials.
  implementation: lib/insecurity.ts:21,54; routes/login.ts:18
  rule_id: ARCH-JWT-001
  audit_flags:
  - control_name_canonicalised
  - control_domain_reclassified_from_Identity and Authentication
- domain: Identity and Authentication
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  assessment: 'expressJwt middleware (security.isAuthorized()) protects most routes but is absent from 8 state-changing endpoints:
    POST /file-upload (server.ts:309), POST /profile/image/file (:310), POST /profile/image/url (:311), POST /rest/memories
    (:312), POST /api/Feedbacks (:406), GET /rest/admin/application-version (:606), GET /rest/admin/application-configuration
    (:607), PUT /rest/continue-code-findIt/apply/:continueCode (:612). Unauthenticated access to file-upload and admin disclosure
    routes is confirmed.'
  implementation: lib/insecurity.ts:52; server.ts:604
  rule_id: ARCH-AUTHN-001
- domain: Identity and Authentication Controls
  control: TOTP Two-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP 2FA is implemented via otplib with QR code enrollment in routes/2fa.ts. No evidence that 2FA is enforced
    as a mandatory gate for administrative operations, password changes, or high-value transactions.
  implementation: routes/2fa.ts
  audit_flags:
  - control_domain_suffix_normalised
- domain: Authorization
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: 'No centralized authorization layer exists. Route-by-route authorization is inconsistent: 19 sensitive PUT/DELETE/PATCH
    endpoints registered in server.ts (lines 370, 371, 389, 390, 426, 429, 433, 440, 441, 450, 451, 605, 612-614, 625, 627,
    633, 634) carry authz=unknown at the Express registration level, with authorization logic (or its absence) deferred to
    individual route handlers.'
  implementation: server.ts (route registrations)
  rule_id: ARCH-AUTHZ-001
- domain: Authorization
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  assessment: '8 object-addressing routes accept authentication middleware but carry no confirmed per-resource ownership check:
    PUT/DELETE /api/Products/:id (server.ts:370-371), GET/PUT/DELETE /api/Recycles/:id (:388-390), PUT /api/BasketItems/:id
    (:426), DELETE /api/Quantitys/:id (:429), PUT /api/Feedbacks/:id (:433). An authenticated user can plausibly operate on
    resources belonging to other accounts.'
  implementation: server.ts
  rule_id: ARCH-BOLA-001
- domain: Authorization
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: surface
  assessment: GET /rest/admin/application-version (server.ts:606) and GET /rest/admin/application-configuration (server.ts:607)
    expose application metadata without a confirmed authentication gate. These surfaces can disclose version strings and configuration
    that aids targeted exploitation.
  implementation: server.ts:606-607
  rule_id: ARCH-MGMT-001
- domain: Input Boundary Validation Controls
  control: Schema and Allowlist Input Validation
  effectiveness: Partial
  kind: mechanism
  assessment: Input handling is limited to string trimming (server.ts:411-413) and URL path normalization (server.ts:204,
    246). No schema-based, type-checked, or allowlist validation middleware (Joi, Zod, express-validator) is confirmed in
    the available evidence. Frontend trimming in chat.service.ts:50 and web3-sandbox:229,232 does not substitute for server-side
    validation.
  implementation: server.ts:204,246,411-413
  rule_id: ARCH-INPUT-001
  audit_flags:
  - control_domain_reclassified_from_Input Validation
- domain: Query Construction and Data Access Controls
  control: SQL Injection Prevention via Parameterized Queries
  effectiveness: Partial
  kind: mechanism
  assessment: Sequelize ORM with parameterized binding is the primary database access method, confirmed at models/index.ts:26,41
    and routes/login.ts:11. At least one route (routes/vulnCodeSnippet.ts:46) embeds a URL path parameter by template literal
    into a JSON response body. Broader raw-query usage is not ruled out from available evidence.
  implementation: models/index.ts; routes/login.ts:11
  rule_id: ARCH-SQLI-001
  audit_flags:
  - control_domain_reclassified_from_Input Validation
- domain: Output Encoding
  control: Angular Template Sanitization and XSS Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'Angular''s DomSanitizer is present but explicitly bypassed via bypassSecurityTrustHtml() in 8 component files:
    about.component.ts:119 (feedback comment), last-login-ip.component.ts:39 (lastLoginIp from JWT payload), administration.component.ts:73
    (user.email) and :91 (feedback.comment), data-export.component.ts:57 (CAPTCHA image), search-result.component.ts:110 (product
    description) and :143 (search query param), track-result.component.ts:48 (orderId). User-controlled data flows into innerHTML
    without sanitization at all eight callsites.'
  implementation: frontend/src/app/search-result/search-result.component.ts:110,143; frontend/src/app/about/about.component.ts:119;
    frontend/src/app/administration/administration.component.ts:73,91
  rule_id: ARCH-XSS-001
- domain: Session and Token Controls
  control: Session Token Storage and Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  assessment: JWTs are read from localStorage (frontend/src/app/Services/request.interceptor.ts:13) and attached to XHR requests
    via Authorization header. localStorage tokens are accessible to any JavaScript executing on the page, making them exfiltrable
    via XSS. No HttpOnly-cookie token transport is evidenced. Cookie attribute hardening (Secure, SameSite) is not applicable
    to the current localStorage design.
  implementation: frontend/src/app/Services/request.interceptor.ts:13
  rule_id: ARCH-COOKIE-001
  audit_flags:
  - control_domain_reclassified_from_Session and Token Management
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'Two high-entropy secrets are committed to source: (1) RSA private key for JWT signing at lib/insecurity.ts:21,
    which is publicly exposed and enables JWT forgery; (2) BIP39 mnemonic at routes/checkKeys.ts:10, which exposes the wallet
    private key derivation path for the Web3/NFT surface. Neither uses a managed secret store or environment-variable runtime
    injection.'
  implementation: lib/insecurity.ts:21; routes/checkKeys.ts:10
  rule_id: ARCH-SECRET-001
- domain: Cryptography Secrets and Data Protection
  control: Transport Layer Encryption (TLS)
  effectiveness: Partial
  kind: surface
  assessment: The application server binds to plain HTTP on port 3000 with no TLS configuration in application code. TLS termination
    is assumed at a deployment-layer reverse proxy or CDN. If the application is exposed directly (e.g. in a local training
    deployment), all credentials, JWTs, and payment data are transmitted in cleartext.
  implementation: server.ts (plain HTTP binding)
  rule_id: ARCH-TLS-001
  audit_flags:
  - control_domain_reclassified_from_Transport Security
- domain: Browser and Cross-Origin Controls
  control: CORS and WebSocket Origin Enforcement
  effectiveness: Partial
  kind: mechanism
  assessment: Socket.IO is initialized with CORS origin fixed to 'http://localhost:4200' (lib/startup/registerWebsocketEvents.ts:20),
    a development-only origin that will mismatch any production hostname. HTTP API CORS policy is not confirmed in available
    evidence. A deployment that does not override this origin will either block all production WebSocket connections or silently
    permit all origins if the CORS middleware falls back to permissive defaults.
  implementation: lib/startup/registerWebsocketEvents.ts:20
  rule_id: ARCH-CORS-001
  audit_flags:
  - control_domain_reclassified_from_Cross-Origin Policy
- domain: Supply Chain
  control: Third-Party CI/CD Action Pinning
  effectiveness: Partial
  kind: lifecycle
  assessment: 'Three GitHub Actions steps reference mutable identifiers: calibreapp/image-actions@main (branch reference,
    .github/workflows/image_actions.yml:33), peter-evans/create-pull-request@v8 (floating version tag, :42), coverallsapp/github-action@v2
    (floating version tag, .github/workflows/ci.yml:188). A repository owner or supply-chain attacker can update any of these
    references to execute arbitrary code in the CI environment with access to repository secrets.'
  implementation: .github/workflows/image_actions.yml:33,42; .github/workflows/ci.yml:188
  rule_id: ARCH-SUPPLY-001
- domain: Data Isolation
  control: Database Principal Separation
  effectiveness: Missing
  kind: mechanism
  assessment: SQLite is accessed through a single Sequelize connection (models/index.ts) with no separate read-only or privileged
    database principals. All application operations — reads, writes, and schema migrations — share the same connection. A
    successful SQL injection or ORM bypass grants full database access including user credentials, payment data, and administrative
    records.
  implementation: models/index.ts
  rule_id: ARCH-DBSEP-001
- domain: LLM Integration
  control: LLM Prompt Injection Prevention
  effectiveness: Partial
  kind: mechanism
  assessment: routes/chat.ts:108 forwards user-supplied chat messages to an Ollama-compatible LLM endpoint. Trust boundary
    tb-5 asserts that no attacker-controlled content reaches the provider unfiltered, but no code-level input sanitization,
    system-prompt isolation, or output validation is confirmed in available evidence. LLM response content is returned to
    the browser and is assumed untrusted per tb-5, but client-side enforcement is not confirmed.
  implementation: routes/chat.ts:108
