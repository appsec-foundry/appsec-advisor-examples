  title: Password change without current password (routes/changePassword.ts:39)
  scenario: An attacker holding only a bearer token — obtained from a logged-out shared workstation, a leaked log, or a forged
    JWT — calls /rest/user/change-password and simply omits the current query parameter; the guard at routes/changePassword.ts:39
    is conditional on currentPassword being truthy, so the check is skipped entirely and line 51 writes the new password.
  evidence_summary: routes/changePassword.ts:39 wraps the hash comparison in `if (currentPassword && ...)`, so an absent current
    parameter short-circuits the condition and execution falls through to the unconditional user.update at line 51.
  impact_description: 'Permanent account takeover from a transient token: the attacker sets a password of their choosing,
    locking the legitimate owner out of their orders, saved addresses, and payment methods, and keeping access after the original
    token expires.'
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A bearer token is required at routes/changePassword.ts:27 and must resolve to a cached session at line
    33, but no proof of current password knowledge is enforced.
  mitigation_title: Require and verify the current password in routes/changePassword.ts
  remediation:
