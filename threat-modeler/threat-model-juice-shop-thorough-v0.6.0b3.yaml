  threat_category_id: TH-13
  additional_categories: []
  stride: Spoofing
  cwe: CWE-306
  title: Unauthenticated WebSocket Channel
  scenario: An anonymous internet client completes the Socket.IO handshake on port 3000 and is accepted by the connection
    handler registered at line 23. The handler installs no io.use() middleware, never reads socket.handshake.auth, and never
    applies the JWT check that guards the REST API, so the socket is trusted without any identity. From that socket the attacker
    receives every buffered challenge-solved notification and emits the state-changing notification received and verify* events.
  attack_steps:
  - I open a Socket.IO v3 connection to the target on port 3000 with no token and the handshake succeeds.
  - I read the replayed 'challenge solved' notifications that the server pushes to my unauthenticated socket.
  - I emit 'notification received' and 'verifyCloseNotificationsChallenge' to mutate server-side game state from the same
    socket.
  evidence_summary: Line 23 is the only connection handler in the component and it performs no identity check; a grep for
    io.use, allowRequest, handshake.auth, verifyClient, isAuthorized and authenticat across the component path returns zero
    hits.
  impact_description: Any unauthenticated internet client joins the real-time channel, reads the full notification stream,
    and reaches the four server-side event handlers that mutate challenge and notification state for every user of the deployment.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None on the handshake; the cors.origin value at line 20 only affects HTTP polling response headers for
    browsers.
  mitigation_title: Add JWT handshake middleware to the Socket.IO server in lib/startup/registerWebsocketEvents.ts
  remediation:
    effort: Medium
    steps:
    - Register an io.use((socket, next) => ...) middleware before io.on('connection') that reads the token from socket.handshake.auth,
      verifies it with the same helper lib/insecurity.ts uses for security.isAuthorized(), attaches the resolved principal
      to the socket, and calls next(new Error('unauthorized')) when verification fails.
    - Add an integration test that connects a socket-io client without a token and asserts a connect_error, and a second test
      that connects with a valid token and asserts the connection succeeds.
    code_example: null
    verification: Run node -e "const io=require('socket.io-client');const s=io('http://localhost:3000',{transports:['websocket']});s.on('connect',()=>console.log('CONNECTED'));s.on('connect_error',e=>console.log('REJECTED',e.message));"
      and expect REJECTED instead of CONNECTED.
    reference: https://cwe.mitre.org/data/definitions/306.html
  evidence:
