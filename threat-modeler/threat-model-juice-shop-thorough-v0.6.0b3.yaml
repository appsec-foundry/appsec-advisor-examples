  stride: Elevation of Privilege
  cwe: CWE-732
  title: Missing workflow permissions block (.github/workflows/ci.yml:190)
  scenario: 'Neither the CI/CD Pipeline workflow nor the image-compression workflow declares a permissions: key, so every
    job runs with the repository default GITHUB_TOKEN scope instead of read-only contents. That token is handed to third-party
    actions, including the mutable coverallsapp/github-action@v2 reference. A compromised step therefore inherits whatever
    the repository default grants, and the create-pull-request step in image_actions.yml proves the inherited scope already
    includes repository write, so the step can commit code, publish packages, or create releases.'
  attack_steps: null
  evidence_summary: A zero-hit search for `permissions:` across .github/workflows/ci.yml and .github/workflows/image_actions.yml
    confirms no scope declaration in either file, while only codeql-analysis.yml, lock.yml and pr-compliance.yml declare one.
    ci.yml:190 passes secrets.GITHUB_TOKEN to the mutable-ref coverallsapp/github-action@v2 at line 188, and lines 253, 268
    and 389 pass it to further third-party actions. image_actions.yml:42 runs peter-evans/create-pull-request@v8 on the inherited
    token, which requires contents and pull-requests write to function at all.
  impact_description: Any compromised action or dependency in these workflows escalates from build execution to repository
    write, allowing an attacker to commit a backdoor to develop or master, publish packages, or create releases under the
    project's identity.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: codeql-analysis.yml, lock.yml and pr-compliance.yml declare scoped permissions blocks; ci.yml and image_actions.yml
    declare none and rely on the repository default token scope, which is not observable from the source tree.
  mitigation_title: Declare least-privilege permissions blocks in ci.yml and image_actions.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level `permissions: {contents: read}` block to .github/workflows/ci.yml and .github/workflows/image_actions.yml,
      then re-grant only the narrower scopes each job needs at job level — for example contents: write and pull-requests:
      write on the image_actions build job that runs peter-evans/create-pull-request.'
    - Set the repository and organisation default workflow permissions to read-only in GitHub settings so a future workflow
      that omits the block cannot silently inherit write access.
    - 'Add a workflow-lint step (zizmor or actionlint) that fails when a workflow file contains no permissions: key.'
    code_example: null
    verification: Run `grep -L 'permissions:' .github/workflows/*.yml`; expect ci.yml and image_actions.yml to no longer appear
      in the list of files lacking a permissions declaration.
    reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
  evidence:
  - file: .github/workflows/ci.yml
