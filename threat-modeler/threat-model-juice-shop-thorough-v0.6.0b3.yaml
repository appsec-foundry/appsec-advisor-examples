threats:
- local_id: frontend-003
  threat_category_id: TH-11
  additional_categories:
  - TH-01
  stride: Tampering
  cwe: CWE-79
  title: Cross-Site Scripting
  scenario: An attacker sends a victim a link of the form `/#/search?q=<img src=x onerror=...>`; `filterTable` reads the `q`
    query parameter straight from the route snapshot, wraps it in `bypassSecurityTrustHtml()`, and the template renders it
    as trusted markup — the attacker's script executes in the victim's origin and reads the JWT that `request.interceptor.ts`
    keeps in `localStorage`.
  attack_steps:
  - I craft a URL whose q query parameter contains an HTML event-handler payload that posts localStorage to my server.
  - I send the link to a signed-in customer, who opens it in the shop they already trust.
  - filterTable passes my q value through bypassSecurityTrustHtml, so Angular renders it as live markup instead of text.
  - My payload reads the JWT from localStorage and posts it to my server, letting me replay the victim's session against the
    REST API.
  evidence_summary: '`search-result.component.ts:136` reads `queryParam` from `this.route.snapshot.queryParams.q`; line 143
    assigns `this.searchValue = this.sanitizer.bypassSecurityTrustHtml(queryParam)`, marking the URL-controlled value as trusted
    HTML without sanitization. `request.interceptor.ts:13` shows the JWT is readable from the same document via `localStorage`.'
  impact_description: 'A single link yields full account takeover of any signed-in customer: the stolen bearer token authorises
    order history, saved addresses and payment card endpoints for the lifetime of the token.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — Angular's DomSanitizer would have escaped this value but is explicitly bypassed on the same line.
  mitigation_title: Remove the bypassSecurityTrustHtml call on the q parameter in search-result.component.ts
  remediation:
    effort: Low
    steps:
    - Delete the bypassSecurityTrustHtml call at search-result.component.ts:143 and assign the raw string to searchValue so
      the template binding escapes it, since the search term needs no markup.
    - If highlighted markup is genuinely required, build it from escaped text with a dedicated pipe rather than trusting the
      whole parameter.
    - Add a component test that sets q to '<img src=x onerror=alert(1)>' and asserts the rendered DOM contains no img element.
    code_example: null
    verification: Run the search-result component spec with q='<img src=x onerror=alert(1)>' and assert fixture.nativeElement.querySelector('img')
      is null.
    reference: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
  evidence:
  - file: frontend/src/app/search-result/search-result.component.ts
    line: 143
  evidence_check: verified
  evidence_tier: confirmed-exploitable
  prior_finding_ref: null
  cvss_v4:
    vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N
    base_score: 8.3
    severity: High
    source: stride-analyzer
