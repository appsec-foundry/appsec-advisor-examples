  title: Rate limiter keyed on client-supplied header — server.ts:346
  scenario: An attacker defeats the reset-password rate limiter by varying one request header. The keyGenerator at server.ts:346
    returns headers['X-Forwarded-For'] whenever that header is present, falling back to the socket address only when it is
    absent. Because the header is attacker-controlled and nothing validates it against a trusted proxy chain, sending a fresh
    value per request gives each attempt its own bucket, so the hundred-request window at server.ts:344 never engages against
    a single attacker.
  evidence_summary: server.ts:346 returns the raw headers['X-Forwarded-For'] value as the rate-limit key with no trusted-proxy
    validation, and server.ts:342 enables trust proxy globally without restricting which upstream addresses may set the header.
  impact_description: An attacker performs unlimited security-answer guesses against the password-reset endpoint, and the
    only rate limit protecting an account-takeover path becomes ineffective.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: An express-rate-limit window of 100 requests per five minutes on /rest/user/reset-password (server.ts:343),
    rendered ineffective by its key generator.
  mitigation_title: Key the reset-password rate limiter on the validated client address in server.ts
  remediation:
    effort: Low
    steps:
    - Remove the custom keyGenerator at server.ts:346 and let express-rate-limit derive the key from req.ip, which Express
      resolves correctly once trust proxy is restricted.
    - Replace app.enable('trust proxy') at server.ts:342 with app.set('trust proxy', <specific upstream address or hop count>)
