    when isUnintendedRedirect(toUrl) is true — a condition that requires toUrl to start with none of security.redirectAllowlist
    (lines 27-32) while having already passed isRedirectAllowed at line 16. The file therefore proves the allowlist check
    is weaker than prefix matching.
