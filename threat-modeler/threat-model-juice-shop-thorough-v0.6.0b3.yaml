  stride: Spoofing
  cwe: CWE-287
  title: OAuth implicit flow without state or nonce (login.component.ts:148)
  scenario: googleLogin() at frontend/src/app/login/login.component.ts:148 builds the Google authorization URL with response_type=token
    and no state, nonce, or PKCE parameter. The access token therefore returns in the URL fragment, where frontend/src/app/app.routing.ts:257
    copies window.location.href into route data and frontend/src/app/oauth/oauth.component.ts:71 splits it into parameters.
    Because nothing binds the returned fragment to the browser session that started the flow, an attacker can complete the
    callback with a token of their choosing and have the victim's browser adopt the resulting session.
  evidence_summary: login.component.ts:148 emits response_type=token with only client_id, scope, and redirect_uri; oauth.component.ts:71
    parses the fragment and line 28 submits access_token without any state or nonce comparison, so no request-binding value
    exists anywhere in the flow.
  impact_description: A victim can be silently logged into an attacker-controlled shop account, so orders placed and payment
    details entered afterwards land in the attacker's account; the access token also persists in browser history and any Referer
    sent from the callback page.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The redirect URI is matched against a server-supplied allowlist at login.component.ts:80 before the flow
    starts, and the button is disabled when no entry matches.
  mitigation_title: Move the Google sign-in to an authorization-code flow with PKCE and state in login.component.ts
  remediation:
    effort: High
    steps:
