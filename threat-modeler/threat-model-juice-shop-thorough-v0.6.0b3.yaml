security_controls:
- domain: Identity and Authentication Controls
  control: JWT Token Issuance and Verification (RS256)
  effectiveness: Weak
  kind: mechanism
  assessment: RS256 algorithm is configured for JWT signing and verification (lib/insecurity.ts:54), which is architecturally
    sound. However, the RSA private key is hardcoded in source (lib/insecurity.ts:21), making the signing key effectively
    public to anyone with repository access. Any party who has read the repository can forge arbitrary valid tokens. The algorithm
    choice is correct; the key management is defeated.
  implementation: lib/insecurity.ts:54 — jwt.sign with RS256 and 6h expiry; lib/insecurity.ts:21 — RSA private key literal
    committed to source
  rule_id: ARCH-JWT-001
- domain: Identity and Authentication Controls
  control: Password Hashing
  effectiveness: Unsafe
  kind: primitive
  assessment: MD5 is used for password hashing as documented in the auth component (lib/insecurity.ts). MD5 is a general-purpose
    hash with no cost factor, no salt separation, and is trivially invertible via GPU brute-force or rainbow tables. This
    is an implemented and relied-upon control that is cryptographically defeated. Stored credentials can be recovered offline
    from any database dump.
  implementation: lib/insecurity.ts — MD5 password hashing used throughout auth flows
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: cross-cutting
  assessment: 'security.isAuthorized() expressJwt middleware is applied to many routes but coverage is inconsistent. At least
    8 routes lack authentication: POST /file-upload (server.ts:309), POST /profile/image/file (server.ts:310), POST /profile/image/url
    (server.ts:311), POST /rest/memories (server.ts:312), POST /api/Feedbacks (server.ts:406), GET /rest/admin/application-version
    (server.ts:606), GET /rest/admin/application-configuration (server.ts:607), and PUT /rest/continue-code-findIt/apply/:continueCode
    (server.ts:612). The boundary assumption in tb-1 that every state-changing route is protected is violated.'
  implementation: lib/insecurity.ts:52 — security.isAuthorized() wrapper; server.ts:634 — global middleware registration;
    server.ts:309-612 — unprotected routes
  rule_id: ARCH-AUTHN-001
- domain: Identity and Authentication Controls
  control: Two-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: 2FA setup, verification, and disable routes exist in routes/2fa.ts and are registered in the auth component.
    2FA is opt-in; it is not enforced for privileged accounts or admin users. The boundary enforcement in tb-2 does not gate
    on 2FA completion.
  implementation: routes/2fa.ts — TOTP setup, verify, and disable endpoints
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: Authorization is applied route-by-route with no central policy enforcement layer. More than 19 sensitive mutation
    routes carry authz=unknown at the server.ts route registration level (server.ts:370, 371, 389, 390, 426, 429, 433, 440,
    441, 450, 451, 605, 612-614, 625, 627, 633, 634). Admin role checks exist in some individual handlers but are not enforced
    systematically. No middleware-level RBAC or ABAC framework is evidenced.
  implementation: server.ts — per-route authorization; no central policy middleware
  rule_id: ARCH-AUTHZ-001
- domain: Authorization Controls
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  assessment: 'Multiple routes accepting user-controlled object IDs have authentication middleware present but no evidenced
    ownership verification. Affected routes: PUT/DELETE /api/Products/:id (server.ts:370-371), GET/PUT/DELETE /api/Recycles/:id
    (server.ts:388-390), PUT /api/BasketItems/:id (server.ts:426), DELETE /api/Quantitys/:id (server.ts:429), PUT /api/Feedbacks/:id
    (server.ts:433). Any authenticated user can manipulate objects owned by other users by supplying an arbitrary numeric
    ID.'
  implementation: server.ts:370-433 — routes with authn=middleware_present but authz=unknown
  rule_id: ARCH-BOLA-001
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Weak
  kind: mechanism
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration (server.ts:606-607) are registered
    with authn=unknown and authz=unknown. These endpoints expose version strings and application configuration to unauthenticated
    callers, aiding reconnaissance. The architecture coverage rule ARCH-MGMT-001 assigned partial confidence because unknown
    status alone does not confirm exploitation, but the authentication gap is evidenced.
  implementation: server.ts:606-607 — admin endpoints without authentication middleware
  rule_id: ARCH-MGMT-001
- domain: Input Handling Controls
  control: Schema and Allowlist Input Validation
  effectiveness: Partial
  kind: cross-cutting
  assessment: Input handling is ad-hoc. The server applies URL normalization (server.ts:204), regex-based path sanitization
    (server.ts:246), and trim() calls on registration fields (server.ts:411-413). No server-side schema validation library
    (Joi, Zod, AJV, express-validator) is evidenced. Body-parser is used without schema enforcement. The trust-boundary assumption
    in tb-1 that every request body and path parameter is schema-validated before business logic is not supported by the evidenced
    controls.
  implementation: server.ts:204, 246, 411-413 — ad-hoc normalization and trimming only
  rule_id: ARCH-INPUT-001
- domain: Input Handling Controls
  control: Parameterized Database Access (SQL Injection Prevention)
  effectiveness: Weak
  kind: mechanism
  assessment: Sequelize ORM parameter binding is the primary database access mechanism (trust boundary tb-4). However, routes/chat.ts:122
    shows direct SQL query construction that bypasses the ORM for LLM-driven product queries. Additionally, vulnCodeSnippet.ts:46
    shows user-controlled path parameters interpolated into response strings. The ORM boundary is present but bypassed in
    the LLM-driven path, which is the highest-risk surface for injection.
  implementation: data/datacreator.ts — Sequelize ORM; routes/chat.ts:122 — raw SQL with user-influenced input; routes/vulnCodeSnippet.ts:46
    — string template interpolation
  rule_id: ARCH-SQLI-001
- domain: Session and Token Management
  control: JWT Storage and Token Lifecycle
  effectiveness: Weak
  kind: mechanism
  assessment: JWT tokens are stored in localStorage (frontend/src/app/Services/request.interceptor.ts:13, basket.service.ts:64),
    making them accessible to any JavaScript executing in the page context. Token expiry is 6 hours (lib/insecurity.ts:54).
    No server-side token revocation mechanism is evidenced; logout is client-side token deletion only. The combination of
    localStorage storage and confirmed XSS sinks means token theft is a direct exploitation path.
  implementation: frontend/src/app/Services/request.interceptor.ts:13 — localStorage read/write; lib/insecurity.ts:54 — 6h
    expiry, no revocation list
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  assessment: The application's primary authentication mechanism uses JWT in localStorage rather than session cookies, reducing
    cookie-attribute attack surface. No session cookie configuration (HttpOnly, Secure, SameSite flags) is evidenced in the
    reviewed source. If any supplementary cookies are set (e.g., by third-party middleware), their hardening cannot be confirmed.
  implementation: null
  rule_id: ARCH-COOKIE-001
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: primitive
  assessment: 'Two high-value secrets are committed directly to source code: (1) the RSA private key used to sign all JWTs
    is a multiline literal in lib/insecurity.ts:21, allowing any reader to forge valid authentication tokens; (2) a BIP39
    mnemonic phrase for the Web3 wallet is a plaintext string literal in routes/checkKeys.ts:10, allowing derivation of all
    wallet private keys and on-chain asset control. Both are relied-upon secrets that are fully compromised at rest in the
    repository.'
  implementation: lib/insecurity.ts:21 — RSA private key literal; routes/checkKeys.ts:10 — BIP39 mnemonic literal
  rule_id: ARCH-SECRET-001
- domain: Transport Security
  control: Transport Encryption (TLS)
  effectiveness: Partial
  kind: mechanism
  assessment: The application server binds on port 3000 with no TLS configuration evidenced in server.ts or the Dockerfile.
    The SQLite database is an in-process file with no network transport to encrypt. TLS termination may be provided by a reverse
    proxy or load balancer at deployment, but no in-repository evidence of enforced HTTPS redirects, HSTS headers, or TLS
    certificate configuration was found.
  implementation: null
  rule_id: ARCH-TLS-001
- domain: Data Protection
  control: Output Encoding and XSS Prevention
  effectiveness: Unsafe
  kind: cross-cutting
  assessment: Angular DomSanitizer.bypassSecurityTrustHtml() is called in 8 locations, explicitly disabling Angular's built-in
    HTML sanitization and enabling direct innerHTML injection. Affected data flows include user-submitted feedback rendered
    in admin view (administration.component.ts:91) and public view (about.component.ts:119), the URL search query rendered
    as HTML (search-result.component.ts:143), server-returned product descriptions (search-result.component.ts:110), last
    login IP from the JWT payload (last-login-ip.component.ts:39), user email displayed in admin panel (administration.component.ts:73),
    CAPTCHA image HTML from server (data-export.component.ts:57), and order IDs (track-result.component.ts:48). Angular's
    protection is relied upon by the framework contract and is deliberately defeated here.
  implementation: frontend/src/app/about/about.component.ts:119; frontend/src/app/last-login-ip/last-login-ip.component.ts:39;
    frontend/src/app/administration/administration.component.ts:73,91; frontend/src/app/data-export/data-export.component.ts:57;
    frontend/src/app/search-result/search-result.component.ts:110,143; frontend/src/app/track-result/track-result.component.ts:48
  rule_id: ARCH-XSS-001
- domain: Data Protection
  control: Content Security Policy (CSP)
  effectiveness: Missing
  kind: mechanism
  assessment: No Content-Security-Policy header configuration is evidenced in server.ts, helmet middleware configuration,
    or any static response middleware. The absence of CSP leaves the application without a browser-enforced second-layer defense
    against the eight confirmed bypassSecurityTrustHtml XSS injection points.
  implementation: null
- domain: Network and Transport Controls
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  assessment: Socket.IO is configured with CORS origin 'http://localhost:4200' (lib/startup/registerWebsocketEvents.ts:20),
    a hardcoded development-environment value. Production deployment with this origin would reject legitimate cross-origin
    requests from the actual domain or require the application to run at localhost. The REST API CORS configuration was not
    evidenced in the reviewed source paths.
  implementation: lib/startup/registerWebsocketEvents.ts:20 — Socket.IO CORS origin hardcoded to localhost:4200
  rule_id: ARCH-CORS-001
- domain: Network and Transport Controls
  control: LLM Prompt Injection Filtering
  effectiveness: Weak
  kind: mechanism
  assessment: The chat route (routes/chat.ts:108-122) forwards user-supplied messages to an external LLM API. The trust boundary
    tb-6 states the assumption that nothing attacker-controlled reaches the LLM unfiltered, but no input sanitization, system-prompt
    separation, or output filtering for LLM responses is evidenced in the route handler code. The assumption is unverified;
    direct prompt injection reaching the LLM is plausible.
  implementation: routes/chat.ts:108-122 — user message forwarded to external LLM API with raw SQL fallback at line 122
- domain: Database Principal Separation
  control: Database Principal Separation
  effectiveness: Missing
  kind: mechanism
  assessment: SQLite is accessed via a single shared Sequelize instance with no separation between administrative operations
    and unprivileged user read/write operations. All application code — from seeding (data/datacreator.ts) to user-facing
    API routes — shares the same database connection with full read/write access to all tables including the Users table.
    SQLite's file-system model does not support per-user database principals, and no application-level access control layer
    compensates.
  implementation: data/datacreator.ts — single Sequelize connection for all operations including admin-level data creation
  rule_id: ARCH-DBSEP-001
- domain: Dependency Lifecycle and Supply Chain
  control: Third-Party CI/CD Action Pinning
  effectiveness: Weak
  kind: lifecycle
  assessment: 'Three GitHub Actions workflow steps reference mutable tags or branch names rather than immutable commit SHAs:
    calibreapp/image-actions@main (.github/workflows/image_actions.yml:33) references a mutable branch, peter-evans/create-pull-request@v8
    (image_actions.yml:42) references a mutable version tag, and coverallsapp/github-action@v2 (ci.yml:188) references a mutable
    version tag. A tag or branch can be silently redirected to malicious code at the upstream repository without any change
    to the workflow file.'
  implementation: .github/workflows/image_actions.yml:33 — @main reference; .github/workflows/image_actions.yml:42 — @v8 reference;
    .github/workflows/ci.yml:188 — @v2 reference
  rule_id: ARCH-SUPPLY-001
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Partial
  kind: mechanism
  assessment: No structured security event logging library or audit trail is evidenced for authentication events, authorization
    failures, or input validation rejections. Challenge completion events are tracked via the Socket.IO push mechanism (websocket-rt)
    for the scoreboard, and IP-based login tracking exists in routes/saveLoginIp.ts. Application-level security events such
    as failed login attempts, JWT validation failures, and access control denials are not evidenced as structured log entries.
  implementation: routes/saveLoginIp.ts — IP tracking on login; lib/startup/registerWebsocketEvents.ts — challenge completion
    events
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
    in place — the team is reactive rather than proactive without it.
  linked_threats: []
