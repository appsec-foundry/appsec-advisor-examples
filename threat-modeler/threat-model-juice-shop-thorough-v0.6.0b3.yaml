    - Reject the request with 401 when query.current is absent, then compare security.hash(currentPassword) against the stored
      hash unconditionally before reaching the update at routes/changePassword.ts:51.
    - Move the credentials out of the query string into a POST body so the old and new passwords stop appearing in access
      logs and browser history.
    - Add an integration test that calls the endpoint with a valid token and no current parameter and asserts the stored password
      is unchanged.
