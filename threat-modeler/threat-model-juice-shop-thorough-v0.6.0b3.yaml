  title: Secrets broadcast to job environment — ci.yml:253
  scenario: The e2e-test step exports four repository secrets as environment variables for a third-party action that then
    installs and starts the full application. Any code running anywhere inside that step - the action itself, a Cypress plugin,
    or any of the hundreds of npm packages resolved without a lockfile - can read process.env and post all four secrets to
    an attacker-controlled endpoint. The secrets are scoped to the whole step rather than to the single command that needs
    each one, so the blast radius of any one compromised package is the entire secret set.
