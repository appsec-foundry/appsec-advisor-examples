  title: Unauthenticated WebSocket Channel
  scenario: An anonymous internet client opens a Socket.IO connection to port 3000 and the connection handler attaches every
    event listener without verifying a JWT, cookie, or any handshake credential, so the attacker receives the queued push
    stream and can emit every registered state-changing event without presenting an identity.
  attack_steps:
  - I connect to ws://target:3000/socket.io/ with transports:['websocket'] and send no authentication token.
  - The server accepts my handshake and immediately replays every queued 'challenge solved' notification to my socket.
  - I emit the registered handler events to read and mutate shared server state without ever presenting a credential.
  evidence_summary: lib/startup/registerWebsocketEvents.ts:23 registers io.on('connection', ...) with no handshake verification
    and no io.use() middleware anywhere in the 56-line file; the imported security module is used only for isRedirectAllowed
    at line 46. The Socket.IO server is constructed on the raw HTTP server at line 20, so the Express expressJwt chain never
    runs for this transport.
  impact_description: Any unauthenticated party on the internet obtains a live push channel that leaks solved-challenge notifications
    including CTF flags and accepts four state-changing event handlers, defeating the stated component role of gating event
    handling behind JWT verification.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None. The controls context claims expressJwt gating at line 23, but the source at that line performs
    no verification; Socket.IO is attached below the Express middleware stack at line 20.
  mitigation_title: Authenticate Socket.IO handshakes in registerWebsocketEvents.ts
  remediation:
    effort: Medium
    steps:
    - Register an io.use() handshake middleware before io.on('connection') that reads the bearer token from socket.handshake.auth
      and verifies it with the same token-verification routine the Express expressJwt middleware uses, calling next(new Error('unauthorized'))
      when verification fails, and attach the resolved subject to socket.data for later authorization checks.
    - Add an integration test that opens a socket.io-client connection without a token and asserts a connect_error is received
      rather than a connect event, and a second test that a valid token connects successfully.
    code_example: null
    verification: 'Start the server, then run: node -e "const io=require(''socket.io-client'');const s=io(''http://localhost:3000'',{transports:[''websocket'']});s.on(''connect'',()=>{console.log(''CONNECTED'');process.exit(1)});s.on(''connect_error'',e=>{console.log(''REJECTED
      ''+e.message);process.exit(0)})" — expect ''REJECTED'' and exit code 0.'
    reference: https://cwe.mitre.org/data/definitions/306.html
