  title: NoSQL $where JavaScript injection (routes/showProductReviews.ts:36)
  scenario: An unauthenticated attacker sends `GET /rest/products/<payload>/reviews` with JavaScript in the path segment.
    When the `noSqlCommand` challenge is enabled, `routes/showProductReviews.ts:31` truncates the segment to 40 characters
    and concatenates it into a `$where` expression at line 36, executing the supplied text as JavaScript in the query engine.
    The attacker invokes the blocking sleep helper to confirm blind execution or returns all reviews regardless of product.
  evidence_summary: '`routes/showProductReviews.ts:31` passes `utils.trunc(req.params.id, 40)` rather than `Number()` when
    the challenge is enabled; line 36 builds the query as `{ $where: ''this.product == '' + id }`, making the path parameter
    part of an evaluated expression. `routes/trackOrder.ts:18` has the same pattern with a 60-character budget.'
  impact_description: An anonymous caller runs attacker-chosen JavaScript in the query evaluator, reading reviews for products
    they are not querying. Each crafted request also blocks the single-threaded Node event loop for two seconds.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Number() coercion when the challenge is disabled and a 40-character truncation when it is enabled (routes/showProductReviews.ts:31);
