- local_id: ci-cd-pipeline-003
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-829
  title: Dependency lockfile disabled by configuration (.npmrc:1)
  scenario: The repository sets package-lock=false, so no lockfile is ever generated and every npm install in CI and in the
    container build resolves the full transitive dependency graph fresh against the live npm registry. An attacker who gains
    a momentary version window on any transitive dependency through typosquatting, maintainer account takeover, or a poisoned
    new release gets that version installed into the next build with no diff, no lockfile baseline, and no integrity hash
    to reject it.
  attack_steps: null
  evidence_summary: '.npmrc:1 contains package-lock=false, which suppresses lockfile generation outright; .gitignore:10 additionally
    ignores package-lock.json, and no package-lock.json exists in the working tree. A zero-hit search for `npm ci` across
    .github/workflows/ and Dockerfile confirms no build path uses a locked install: Dockerfile:5 runs `npm install --omit=dev`
