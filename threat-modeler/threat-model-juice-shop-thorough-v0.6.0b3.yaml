    exposing the admin UI surface and turning every server endpoint that lacks its own role check into an immediate privilege
    escalation.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: AdminGuard, AccountingGuard and LoginGuard exist but run entirely in the browser against an unverified
    token; the architecture context records that all authoritative enforcement must occur server-side.
