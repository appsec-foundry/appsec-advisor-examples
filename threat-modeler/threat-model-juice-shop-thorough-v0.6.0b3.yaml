  stride: Tampering
  cwe: CWE-693
  title: No Content-Security-Policy in the SPA sources (frontend/src)
  scenario: 'A case-insensitive search of the entire frontend source tree for content-security-policy and frame-ancestors
    returns zero hits, so the application ships neither a meta-tag policy nor any client-side policy configuration. Without
    a policy there is no script-source allowlist and no frame-ancestors restriction, which is what lets the six DomSanitizer
    bypasses in this component escalate from markup injection to full token exfiltration: injected script may load and contact
    arbitrary external origins, and the application may be framed for clickjacking.'
  evidence_summary: A zero-hit absence search across frontend/src establishes that no Content-Security-Policy or frame-ancestors
    directive is declared anywhere in the shipped SPA sources; the enforcing response header is set outside this component
    and was not observed here.
  impact_description: Every markup-injection finding in this component escalates to session-token exfiltration to an attacker-controlled
    host, and the shop can be framed to trick users into privileged clicks.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no policy meta tag, no frame-ancestors directive, and no policy configuration exists in the SPA
    sources.
  mitigation_title: Introduce a script-src and frame-ancestors policy for the SPA response
  remediation:
    effort: Medium
    steps:
    - Serve a Content-Security-Policy on the SPA document response with a nonce-based script-src, object-src 'none', base-uri
      'self', and frame-ancestors 'none'.
    - Build the Angular bundle without inline scripts or styles that would force unsafe-inline, and register a report-uri
      before switching from Report-Only to enforcing.
    - Add an integration test that fetches the application root and asserts the header is present and contains no unsafe-inline
      or unsafe-eval token.
    code_example: null
    verification: curl -sI the application root and assert a Content-Security-Policy header exists whose script-src contains
      a nonce and neither unsafe-inline nor unsafe-eval, and whose frame-ancestors is 'none'.
