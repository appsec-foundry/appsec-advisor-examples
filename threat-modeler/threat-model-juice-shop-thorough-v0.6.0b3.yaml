  stride: Elevation of Privilege
  cwe: CWE-863
  title: Role read from token payload not database (lib/insecurity.ts:157)
  scenario: An operator revokes a user's accounting role in the database, but lib/insecurity.ts:157 decides the accounting
    authorisation purely from decodedToken.data.role carried inside the already-issued JWT, so the demoted user keeps passing
    the isAccounting guard until their token expires up to six hours later.
  evidence_summary: lib/insecurity.ts:157 compares decodedToken?.data?.role against roles.accounting, and lines 167 and 172
    apply the same pattern for the deluxe and customer guards, with no database lookup of the current role anywhere in the
    three guard functions.
  impact_description: Role revocation is not effective until token expiry, so a demoted or terminated user retains accounting-tier
    access to order and payment views for up to six hours, and the same stale payload feeds the identity that routes/changePassword.ts:33
    and routes/2fa.ts:107 trust.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: The token signature is checked before the role is read at lib/insecurity.ts:156, which proves the payload
    was server-issued but not that it still reflects the account's current role.
  mitigation_title: Resolve the caller's role from the database in lib/insecurity.ts guards
  remediation:
    effort: Medium
    steps:
    - Change isAccounting, isDeluxe, and isCustomer in lib/insecurity.ts to look up the current role for decodedToken.data.id
      from UserModel rather than reading it from the token payload.
    - Cache that lookup with a short time-to-live well below the six-hour token lifetime so revocation takes effect quickly
      without a query per request.
    - Add an integration test that issues a token for an accounting user, revokes the role in the database, and replays the
      token.
    code_example: null
    verification: Run the new integration test and expect the replayed token to receive 403 from an isAccounting-guarded route
      within the configured cache time-to-live.
    reference: 'CWE-863: Incorrect Authorization'
