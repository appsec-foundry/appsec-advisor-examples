  stride: Spoofing
  cwe: CWE-798
  title: Hard-coded account credentials in seed data (data/static/users.yml:3)
  scenario: 'An attacker reads `data/static/users.yml` in the public repository and finds six seeded administrator passwords
    in plaintext: admin/admi**** (8 chars) at line 3, support at line 115, J12934 at line 141, wurstbrot at line 150, testing
    at line 272, and demo at line 215. Because every deployment seeds from the same file, the attacker authenticates against
    any instance as administrator using any of these credentials.'
  attack_steps:
  - I open data/static/users.yml in the published repository and read the password and role of every seeded account.
  - I submit the literal password for the account whose role is 'admin' to the application login endpoint.
  - I operate with administrator identity over all persisted users, orders, payment cards and addresses.
  evidence_summary: data/static/users.yml:3 stores the literal password 'admi**** (8 chars)' for the account at line 2 whose
    role at line 5 is 'admin'; six further seeded accounts carry literal passwords with the same admin role.
  impact_description: An attacker achieves complete administrator takeover of the persisted application state. The database
    holds user credentials, payment cards, addresses, orders, and challenge completion records for every user.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — the seed file holds account passwords as literals with no environment gating and no per-deployment
    generation
  mitigation_title: Remove literal privileged-account passwords from data/static/users.yml
  remediation:
    effort: Medium
    steps:
    - Delete the `password:` literals for every entry in data/static/users.yml whose `role` is not 'customer', and resolve
      those credentials at startup from environment variables or a secret store so each deployment seeds a distinct value.
    - Make the seeding path fail fast when a privileged account's credential variable is unset instead of falling back to
      a built-in default.
    - Rotate the admin, support, J12934, wurstbrot, testing and demo credentials on every already-deployed instance and invalidate
      existing sessions.
    code_example: null
    verification: 'Run `grep -n "password:" data/static/users.yml` — no entry carrying `role: ''admin''` may return a literal;
      then start the application with the credential environment variables unset and confirm startup aborts instead of creating
      a default administrator.'
