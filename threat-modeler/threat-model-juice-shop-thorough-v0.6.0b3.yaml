  title: Hard-coded JWT signing key — lib/insecurity.ts:21
  scenario: An attacker reads the RSA private key literal embedded at `lib/insecurity.ts:21`, signs an arbitrary JWT payload
    with it using RS256, and presents that token to any route guarded by `isAuthorized()` (`lib/insecurity.ts:52`). The signature
    validates against the matching public key, so the attacker holds a session for any user id and any role without ever submitting
    credentials.
  attack_steps:
  - I copy the RSA private key literal embedded at lib/insecurity.ts:21 out of the published source tree.
  - I sign my own JWT payload with that key using RS256, setting data.id and data.role to the administrator account.
  - I send the forged token as the Authorization bearer header to any route registered behind isAuthorized().
  - I operate with administrator authority for the full six-hour token lifetime because no revocation list exists.
  evidence_summary: '`lib/insecurity.ts:21` assigns a complete PEM-encoded RSA private key to the module-level constant `privateKey`;
    line 54 passes it to `jwt.sign()` as the signing key for every issued session token.'
  impact_description: Full authentication bypass for every account including administrators; the attacker mints tokens offline,
    so no login attempt, lockout, or 2FA challenge is ever observed.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: RS256 signature verification via expressJwt (lib/insecurity.ts:52), rendered ineffective because the
    signing key ships in the source tree
  mitigation_title: Load the JWT signing key from runtime secret storage in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Delete the privateKey literal at lib/insecurity.ts:21 and read the signing key from an injected secret (environment
      variable or mounted secret file) at process start, failing startup when it is absent.
    - Rotate the key pair and invalidate all tokens signed with the old key by rejecting tokens whose iat predates the rotation.
    - Add a CI secret-scanning step (for example gitleaks) that fails the build on any BEGIN RSA PRIVATE KEY match in tracked
      source.
    code_example: null
    verification: Run `grep -rn 'BEGIN RSA PRIVATE KEY' lib/ routes/` and expect zero hits; then start the server without
      the key environment variable set and assert the process exits non-zero instead of serving tokens.
    reference: https://cwe.mitre.org/data/definitions/321.html
