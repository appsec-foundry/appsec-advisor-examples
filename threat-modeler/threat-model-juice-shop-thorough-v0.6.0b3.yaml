  title: SQL injection in login query
  scenario: An attacker submits `' OR 1=1--` as the login email. Because `req.body.email` is concatenated straight into the
    raw SQL string passed to `models.sequelize.query()`, the WHERE clause always matches, returning the first `Users` row,
    and line 47 issues that account a valid session token. The same primitive supports `UNION SELECT` reads of the `Users`
    and `SecurityAnswers` tables.
  attack_steps:
  - I POST to /rest/user/login with the email field set to ' OR 1=1-- and any password.
  - The handler splices my value into the raw SQL at routes/login.ts:34, so the WHERE clause matches the first Users row.
  - The response at routes/login.ts:26 hands me a signed session token for that account, which is the administrator.
  - I extend the same injection with UNION SELECT to read password hashes and security answers out of the database.
  evidence_summary: '`routes/login.ts:34` interpolates `req.body.email` and the MD5 of `req.body.password` directly into the
    SQL string, bypassing `Sequelize` parameter binding.'
