  stride: Elevation of Privilege
  cwe: CWE-620
  title: Password change without current password — routes/changePassword.ts:39
  scenario: The current-password comparison is wrapped in a truthiness guard, so a request that simply omits the current parameter
    skips verification entirely and line 51 writes the new password. Anyone holding a session token — stolen through a shared
    browser, obtained via the forgery paths in lib/insecurity.ts, or left valid because sessions are never revoked — converts
    temporary token possession into permanent ownership of the account.
  evidence_summary: routes/changePassword.ts:39 reads `if (currentPassword && security.hash(currentPassword) !== loggedInUser.data.password)`,
    which makes the whole check conditional on the attacker choosing to send the parameter.
  impact_description: Temporary possession of a session token becomes permanent account takeover, and against an administrator
    session it yields lasting administrative control with the owner locked out.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A session token must be present in the in-memory map (routes/changePassword.ts:33); the current password
    itself is optional
  mitigation_title: Require the current password unconditionally in routes/changePassword.ts
  remediation:
    effort: Low
    steps:
    - Reject the request at routes/changePassword.ts:39 when currentPassword is absent, and compare it with the stored credential
      before any update, using a constant-time comparison over the KDF output from auth-008.
    - Invalidate all other sessions of the account after a successful change, using the revocation introduced for auth-005.
    - Add a test that omits the current parameter and asserts 401 with the stored password unchanged.
    code_example: null
    verification: 'Run the new test: a change-password request without the current parameter must return 401 and the password
      column of the target user must be unchanged afterwards.'
    reference: https://cwe.mitre.org/data/definitions/620.html
  evidence:
  - file: routes/changePassword.ts
    line: 39
