  title: Open redirect to unallowlisted host (routes/redirect.ts:19)
  scenario: An attacker crafts a /redirect?to=<attacker URL> link that satisfies security.isRedirectAllowed() without matching
    any allowlist prefix, and the handler sends the victim to the attacker's site via res.redirect(toUrl) at routes/redirect.ts:19.
