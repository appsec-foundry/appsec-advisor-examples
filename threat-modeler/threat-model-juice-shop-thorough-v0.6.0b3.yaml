  title: SQL injection in login query (routes/login.ts:34)
  scenario: An unauthenticated attacker posts an email containing a quote and a comment sequence to `/rest/user/login`. Because
    `routes/login.ts:34` interpolates `req.body.email` directly into a raw `sequelize.query()` string, the crafted value terminates
    the email literal and removes the password comparison, authenticating the attacker as the first matching row without a
    password.
  attack_steps:
  - I POST {"email":"' OR 1=1--","password":"x"} to /rest/user/login.
  - routes/login.ts:34 builds SELECT * FROM Users WHERE email = '' OR 1=1--' AND password = ... and the password predicate
    is commented out.
  - The first row is returned as authenticatedUser and routes/login.ts:26 issues me a signed session token for that account.
  - I repeat with a UNION SELECT payload to read arbitrary table contents through the same statement.
  evidence_summary: '`routes/login.ts:34` passes a template literal containing `${req.body.email}` into `models.sequelize.query()`
    with no replacements or bind parameters; the returned row becomes an authenticated session at `routes/login.ts:24-26`.'
  impact_description: An anonymous caller authenticates as the administrator and reads or infers arbitrary rows from the SQLite
    database, including every user email and MD5 password hash.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None on this path; the surrounding codebase uses Sequelize model methods but this statement bypasses
    them
  mitigation_title: Replace the raw login statement at routes/login.ts:34 with a bound Sequelize query
  remediation:
    effort: Low
    steps:
    - 'Rewrite routes/login.ts:34 as UserModel.findOne({ where: { email: req.body.email, password: security.hash(req.body.password)
      } }) so Sequelize binds both values.'
    - Reject non-string or oversized email and password values before the query with a schema validator on the login route.
    - Add an API test posting "' OR 1=1--" as the email and assert HTTP 401 with no token in the response body.
    code_example: null
    verification: Run `npx jest test/api/loginApiSpec` including the new injection case and expect HTTP 401 and an empty authentication
      object for the "' OR 1=1--" payload.
    reference: https://cwe.mitre.org/data/definitions/89.html
