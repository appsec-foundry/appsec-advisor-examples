    setup at lines 20-23. The prefix .* retries at every offset and the lazy class rescans to end-of-input at each '../../..'
    anchor.
  impact_description: A single unauthenticated message stalls the Node.js event loop, making the WebSocket channel and the
    HTTP API that share the port 3000 listener unresponsive for the duration of the scan, and the message can be repeated
    at will because the channel has no authentication or rate limit.
