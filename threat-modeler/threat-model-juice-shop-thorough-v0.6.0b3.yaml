    as env for the cypress-io/github-action step, and lines 264-268 repeat the pattern for macOS. Line 238 installs the dependency
    tree with a bare 'npm install' and line 245 starts the application under that step, so untrusted package code executes
    with those variables in scope.
  impact_description: Exfiltration of GITHUB_TOKEN grants repository write within the run, the Alchemy API key allows blockchain-API
    abuse billed to the project, the Cypress record key allows tampering with recorded test evidence, and the solutions webhook
    leaks the challenge-solution notification channel.
