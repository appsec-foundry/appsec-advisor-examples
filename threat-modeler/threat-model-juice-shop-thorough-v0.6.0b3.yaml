  cwe: CWE-204
  title: Credential validity oracle before 2FA — routes/login.ts:38
  scenario: When the submitted password is correct but the account has a TOTP secret, the login endpoint answers 401 with
    the body status totp_token_required and a tmpToken, while wrong credentials produce a plain 401 text response. An attacker
    distinguishes the two responses and confirms valid email and password pairs at scale without ever passing the second factor,
    and simultaneously learns which accounts have 2FA enabled.
  evidence_summary: routes/login.ts:38-46 returns a JSON body with status totp_token_required and a signed tmpToken on correct
    credentials, whereas routes/login.ts:50 returns the generic invalid-credentials text, making the two outcomes trivially
    distinguishable.
  impact_description: Credential-stuffing campaigns can validate harvested password lists against this endpoint and select
    the accounts without a second factor for follow-up takeover.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: TOTP second factor is still enforced before a full session token is issued
  mitigation_title: Neutralise the credential-validity oracle in routes/login.ts
  remediation:
    effort: Medium
    steps:
    - Return an indistinguishable response shape for wrong credentials and for the pending-second-factor case at routes/login.ts:38,
      keeping the 2FA continuation state in a short-lived opaque handle rather than in a body that only correct credentials
      receive.
    - Count a pending-second-factor response as a failed attempt for lockout and alerting purposes so the endpoint cannot
      be used as a free oracle.
    - Add the outcome to the authentication audit events introduced for auth-007.
    code_example: null
    verification: Add a test comparing the status code, body length and timing class of a wrong-password login and a correct-password
      2FA-pending login and assert the response shapes are identical.
    reference: https://cwe.mitre.org/data/definitions/204.html
