  stride: Spoofing
  cwe: CWE-347
  title: Insecure JWT Verification
  scenario: 'An attacker reads the RSA public key from `encryptionkeys/jwt.pub` (exposed at `lib/insecurity.ts:20`) and forges
    a JWT with `alg: HS256`, using that PEM text as the HMAC secret. Because `isAuthorized()` configures `express-jwt` with
    no `algorithms` allowlist, the verifier trusts the attacker-supplied `alg` header and accepts the token as a valid server-issued
    session.'
  attack_steps:
  - I fetch the RSA public key that lib/insecurity.ts:20 loads from encryptionkeys/jwt.pub, which is distributed with the
    application.
  - I build a JWT whose header is alg HS256 and whose data claim names the administrator account.
  - I compute the HMAC signature using the public key PEM text as the shared secret and send the token to a protected route.
  - express-jwt verifies it with the same PEM as an HMAC secret and grants me the administrator session.
  evidence_summary: '`lib/insecurity.ts:52` calls `expressJwt` with the object `{ secret: publicKey }` cast to `any` and supplies
    no `algorithms` property; `lib/insecurity.ts:189` repeats the same omission in `jwt.verify(token, publicKey, callback)`.'
  impact_description: Any unauthenticated internet client can impersonate any account, including administrators, on every
    route behind the primary authentication boundary tb-2.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: express-jwt middleware is applied as the authentication gate, but it accepts attacker-selected signature
    algorithms
  mitigation_title: Pin an RS256 algorithms allowlist on every JWT verification in lib/insecurity.ts
  remediation:
    effort: Low
    steps:
    - 'Pass algorithms: [''RS256''] to the expressJwt configuration at lib/insecurity.ts:52 and to the jwt.verify call at
      lib/insecurity.ts:189, and remove the `as any` casts that currently hide the missing option from the type checker.'
