  stride: Spoofing
  cwe: CWE-522
  title: Long-lived registry publish credential — ci.yml:327
  scenario: An attacker who obtains the static `DOCKERHUB_TOKEN` secret — through a compromised action in the same workflow,
    a log leak, or maintainer account takeover — authenticates to Docker Hub as the project and pushes a backdoored image
    to `bkimminich/juice-shop:latest`. Because the credential is a long-lived password rather than a short-lived OIDC workload
    identity, the token keeps working until someone notices and rotates it, and nothing in the pull path lets a consumer distinguish
    the attacker's push from a genuine release.
  evidence_summary: '`.github/workflows/ci.yml:327` authenticates the release push with `password: ${{ secrets.DOCKERHUB_TOKEN
    }}`, a persistent registry credential; the workflow declares no `id-token: write` permission and contains no signing or
    attestation step, so OIDC Trusted Publishing is not in use.'
  impact_description: Any holder of the leaked token publishes images under the project's own Docker Hub identity, and every
    downstream `docker pull bkimminich/juice-shop` — training environments, CTF platforms, and CI systems worldwide — executes
    the attacker's code while believing it came from the maintainers.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: Publish job gated to the upstream repository and to master/develop pushes (.github/workflows/ci.yml:313);
    credential stored as a GitHub Actions secret rather than in the workflow file
  mitigation_title: Replace the DOCKERHUB_TOKEN secret with OIDC Trusted Publishing in the docker job
  remediation:
    effort: Medium
    steps:
    - 'Add ''permissions: { id-token: write, contents: read }'' to the docker job in .github/workflows/ci.yml and switch docker/login-action
      to OIDC-based registry authentication, then delete the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.'
    - Add a cosign keyless signing step after docker/build-push-action and publish the resulting signature and SLSA provenance
      attestation alongside the image.
    - Add a release smoke test that runs 'cosign verify --certificate-identity-regexp' against the freshly pushed tag and
      fails the job when no valid signature is found.
    code_example: null
    verification: Run 'cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp
      "^https://github.com/juice-shop/juice-shop/" bkimminich/juice-shop:latest'; it must exit 0 and print a verified Rekor
      entry naming the ci.yml docker job.
    reference: https://owasp.org/www-project-top-10-ci-cd-security-risks/CICD-SEC-06-Insufficient-Credential-Hygiene
