  title: Mutable image tag without build attestation — ci.yml:345
  scenario: Every master push overwrites the same bkimminich/juice-shop:latest tag, and the only provenance carried by the
    image is a set of OCI labels populated from build arguments that the publisher supplies. Nothing records which workflow
    run produced the image currently behind the tag, and the previous image is silently replaced. After a suspected compromise,
    an investigator cannot prove which commit produced a pulled image, and an attacker who published through the pipeline
    can deny having done so because a forged VCS_REF label is indistinguishable from a genuine one.
  evidence_summary: .github/workflows/ci.yml:345 pushes 'bkimminich/juice-shop:${{ env.DOCKER_TAG }}' where DOCKER_TAG is
