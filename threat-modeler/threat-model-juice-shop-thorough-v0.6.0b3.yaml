verdict:
  severity: red
  opening: The application has critical defects that let unauthenticated attackers seize any account, forge administrator
    credentials, extract the full customer database, and execute commands on the server.
  bullets:
  - title: Active login stolen
    body: Stored cross-site scripting (XSS) lets a page visitor steal session tokens from browser memory and replay them as
      the victim.
    findings:
    - F-001
    - F-002
    weaknesses: []
    verified_attack_path: true
  - title: Admin impersonation
    body: A hard-coded token signing key lets anyone forge a credential claiming full administrator rights without knowing
      any password.
    findings:
    - F-006
    - F-007
    weaknesses:
    - W-004
    verified_attack_path: false
  - title: Customer data exfiltrated
    body: SQL injection in the login form allows unauthenticated read of all user records and order history.
    findings:
    - F-008
    - F-009
    weaknesses:
    - W-001
    - W-002
    verified_attack_path: false
  - title: Server takeover
    body: Server-side code execution via a stored display name lets any logged-in user run arbitrary commands on the host.
    findings:
    - F-011
    weaknesses: []
    verified_attack_path: true
  - title: Self-granted admin account
    body: Mass assignment on account registration lets any new user include a `role` field in the request body to create their
      own administrator account.
    findings:
    - F-012
    weaknesses: []
    verified_attack_path: true
  - title: Supply chain backdoor
    body: Disabling the dependency lockfile allows a poisoned third-party package to silently replace application code at
      the next build.
    findings:
    - F-010
    weaknesses:
    - W-003
    verified_attack_path: false
  closing: All eight critical defects must be resolved before any production exposure; unaddressed, they enable account compromise,
    data breaches, and full server-level intrusion.
  bullets_intro: 'What an attacker can do today, worst first:'
