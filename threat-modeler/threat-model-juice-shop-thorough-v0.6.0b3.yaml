  title: Missing session token revocation — lib/insecurity.ts:54
  scenario: authorize() issues a six-hour RS256 token and the session store interface declares only put, get, tokenOf, from
    and updateFrom, with no removal operation. A token that an attacker stole or forged stays valid for its whole lifetime,
    and neither a password change (routes/changePassword.ts:51) nor disabling 2FA (routes/2fa.ts:162) invalidates sessions
    that were issued earlier.
  evidence_summary: lib/insecurity.ts:54 signs tokens with expiresIn six hours; the IAuthenticatedUsers interface at lines
    31-39 and its implementation at lines 70-91 expose no delete or revoke member, so nothing can retire an issued token before
    expiry.
  impact_description: 'A compromised session survives the victim''s own remediation: after a password reset the attacker keeps
    acting as the victim until the six-hour expiry elapses.'
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: Six-hour token expiry (lib/insecurity.ts:54); no revocation or denylist
