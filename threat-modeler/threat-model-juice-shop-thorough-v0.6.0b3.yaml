  cwe: CWE-1004
  title: Session cookie without HttpOnly — login.component.ts:104
  scenario: An attacker with script execution in the shop origin reads the session token a second way, because the login flow
    writes the same JWT into a cookie through the JavaScript cookie API with only an expiry set, leaving HttpOnly, Secure
    and SameSite unspecified so the value stays script-readable and is attached to cross-site requests.
  evidence_summary: login.component.ts:104 calls this.cookieService.put('token', authentication.token, { expires }) with no
    httpOnly, secure or sameSite option; oauth.component.ts:50 writes the identical cookie the same way. A cookie written
    by client JavaScript cannot carry HttpOnly, so the token remains readable by any script in the document.
  impact_description: The session token is exposed to script a second time and, without SameSite, is also sent on cross-site
    requests, widening both XSS token theft and cross-site request forgery against authenticated endpoints.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: An eight-hour expiry is set on the cookie; no HttpOnly, Secure or SameSite attribute is applied.
  mitigation_title: Set the session cookie server-side with HttpOnly, Secure and SameSite in login.component.ts
  remediation:
    effort: Medium
    steps:
    - Remove the client-side cookie write at login.component.ts:104 and the matching write at oauth.component.ts:50, and have
      the login endpoint return the session as a Set-Cookie header carrying HttpOnly, Secure and SameSite=Strict.
    - Keep the expiry policy on the server-issued cookie so session lifetime stays enforced where it cannot be edited.
    - Add a test asserting document.cookie contains no 'token' entry after a successful login.
    code_example: null
    verification: Log in and inspect the Set-Cookie response header; assert it contains HttpOnly, Secure and SameSite and
      that document.cookie does not expose the token.
    reference: 'CWE-1004: Sensitive Cookie Without HttpOnly Flag'
