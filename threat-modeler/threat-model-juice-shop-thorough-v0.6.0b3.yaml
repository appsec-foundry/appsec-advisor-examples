  title: Remote script piped to shell — ci.yml:358
  scenario: The heroku job downloads an installer script over the network and pipes it straight into a shell without pinning
    a version, checking a checksum, or verifying a signature. An attacker who compromises the cli-assets.heroku.com distribution
    point, or who can intercept the fetch, substitutes the script body and gains arbitrary command execution in a job that
    already holds the production Heroku API key.
  evidence_summary: .github/workflows/ci.yml:358 runs 'curl https://cli-assets.heroku.com/install.sh | sh' with no --fail
    flag, no pinned release, and no checksum verification; line 371 shows the same job passes secrets.HEROKU_API_KEY to the
    deploy step, and line 351 shows the job runs on every master and develop push.
  impact_description: Substituted installer content executes with the HEROKU_API_KEY in the environment, allowing the attacker
    to exfiltrate the production deploy credential and push arbitrary code to the live juice-shop Heroku application.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: HTTPS transport to the vendor host; job restricted to the upstream repository and to master/develop pushes
    (.github/workflows/ci.yml:351)
  mitigation_title: Replace the piped Heroku installer with a SHA-pinned action or checksum-verified download in ci.yml
  remediation:
