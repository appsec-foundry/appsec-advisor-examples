  title: Hard-coded JWT signing key (lib/insecurity.ts:21)
  scenario: An unauthenticated attacker copies the RSA private key literal embedded in `lib/insecurity.ts:21`, signs a JWT
    whose payload sets `data.role` to `admin` and `data.id` to any user id, and presents it to any route protected by `security.isAuthorized()`;
    `expressJwt` verifies it against `encryptionkeys/jwt.pub` and accepts the forged identity.
  attack_steps:
  - I read the RSA private key literal from lib/insecurity.ts:21 in the published source tree.
  - I mint an RS256 JWT with the payload {data:{id:1,role:'admin'},bid:1} signed with that key, matching the structure produced
    at lib/insecurity.ts:54.
  - I send the token in the Authorization header to /rest/user/authentication-details and every other isAuthorized() route
    and act as the administrator.
  evidence_summary: '`lib/insecurity.ts:21` assigns a complete PEM-encoded RSA private key to the module constant `privateKey`,
    the only signing key used by `authorize()` at `lib/insecurity.ts:54` and verified with the matching public key at `lib/insecurity.ts:52`.'
  impact_description: Any party with read access to the repository or a distributed build can impersonate arbitrary users,
    including the administrator, and access every authenticated REST endpoint — exposing order history, payment cards, and
    wallet balances for all users.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: RS256 signatures with a six-hour expiry (lib/insecurity.ts:54); no key rotation, no secret manager and
    no key material outside the source tree
  mitigation_title: Move the JWT signing key out of lib/insecurity.ts into injected secret material
  remediation:
    effort: Medium
    steps:
    - Delete the privateKey literal at lib/insecurity.ts:21 and load the signing key from an environment variable or secret
      manager at startup, failing closed when it is absent.
    - Rotate the compromised key pair and invalidate every token issued under it by clearing security.authenticatedUsers on
      deploy.
    - Add a CI check that greps the build output and source tree for 'BEGIN RSA PRIVATE KEY' and fails the pipeline on any
      hit.
    code_example: null
    verification: Run `grep -rn 'BEGIN RSA PRIVATE KEY' lib/ routes/ models/` and expect zero matches; then start the server
      without the key environment variable and expect startup to abort rather than serve tokens.
    reference: https://cwe.mitre.org/data/definitions/321.html
