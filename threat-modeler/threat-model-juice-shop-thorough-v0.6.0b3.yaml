  title: Client-trusted security decision — registerWebsocketEvents.ts:50
  scenario: An unauthenticated client emits verifyCloseNotificationsChallenge with any two-element array; the handler treats
    that client-supplied value as proof of completion and calls challengeUtils.solveIf, which persists challenge.solved =
    true and broadcasts the challenge notification to every connected socket.
  attack_steps:
  - I connect to the Socket.IO endpoint without credentials.
  - I emit 'verifyCloseNotificationsChallenge' with the payload [1,2], which satisfies the Array.isArray(data) && data.length
    > 1 test.
  - The server persists the challenge as solved and broadcasts the solved notification and its flag to every connected client.
  evidence_summary: lib/startup/registerWebsocketEvents.ts:50 decides challenge completion solely from the shape of the client-supplied
    data argument; the sibling handlers at lines 41, 42 and 46 do the same with string matching. Each calls challengeUtils.solveIf,
    which reaches challengeUtils.solve at lib/challengeUtils.ts:30-31 and writes solved = true to the database.
  impact_description: Attacker-supplied event payloads drive persisted application state and the anti-cheat and webhook side
    effects that follow it, so scoreboard and challenge-completion records no longer reflect work actually performed against
    the application.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None. The handler applies only a shape check to the client-supplied value and no server-side observation
    of the underlying event.
