  title: Unpinned container base image (Dockerfile:1)
  scenario: Both build stages resolve their base image by floating reference rather than digest, so the bytes a build consumes
    are whatever the registry serves at that moment. An attacker who compromises the upstream image or the registry path substitutes
    a backdoored layer, and the next docker job build bakes it into the published bkimminich/juice-shop image with no build-time
    signal that the base changed.
