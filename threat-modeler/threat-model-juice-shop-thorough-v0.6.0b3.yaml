  title: Open redirect — routes/redirect.ts:19
  scenario: An unauthenticated attacker requests /redirect?to=https://evil.example/?x=https://github.com/juice-shop/juice-shop.
    The allowlist gate at routes/redirect.ts:16 accepts the URL because it only requires an allowlisted string to appear somewhere
    in the destination, and line 19 issues a 302 to the attacker-controlled host, so the victim leaves the application's own
    domain and lands on a phishing page that inherits the shop's perceived trust.
  attack_steps:
  - I append an allowlisted URL as a query parameter to my own phishing host so the destination still contains an allowlisted
    string.
  - I send the victim /redirect?to=<my host>?x=<allowlisted url>, which passes the gate at routes/redirect.ts:16.
  - The victim's browser follows the 302 from routes/redirect.ts:19 to my host and submits credentials to my clone of the
    login page.
  evidence_summary: 'routes/redirect.ts:19 redirects to the unmodified query parameter. The route''s own challenge logic proves
    the gate at line 16 is not a prefix match: line 18 solves redirectChallenge exactly when isUnintendedRedirect(toUrl) is
    true, and lines 27-32 define that as a URL that starts with none of security.redirectAllowlist entries. A destination
    that passes line 16 while matching no allowlist prefix is therefore an expected, reachable state.'
  impact_description: Visitors are sent from the application's own origin to an attacker-chosen host, enabling credential
    phishing and the exfiltration of any token carried in a redirect chain; the crypto-asset framing of this component makes
    wallet-drainer landing pages a realistic destination.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: security.isRedirectAllowed(toUrl) gate at routes/redirect.ts:16, which the route's own challenge logic
    at lines 18 and 27-32 shows accepts URLs that match no allowlist prefix
  mitigation_title: Replace the containment allowlist check with exact origin matching in performRedirect
  remediation:
    effort: Low
    steps:
    - In routes/redirect.ts:16, parse toUrl with the WHATWG URL parser and compare the resulting origin (scheme plus host
      plus port) for exact equality against the entries of security.redirectAllowlist instead of relying on security.isRedirectAllowed,
      rejecting any parse failure or non-https scheme with the existing 406 path at lines 21-22.
    - Add a route test that asserts GET /redirect?to=https://evil.example/?x=https://github.com/juice-shop/juice-shop returns
      406 and emits no Location header, alongside an existing-behaviour test that an allowlisted origin still returns 302.
    code_example: null
