  cwe: CWE-522
  title: Org-admin PAT exposed to PR trigger (.github/workflows/pr-compliance.yml:438)
  scenario: Any GitHub user can open or edit a pull request and thereby start the pr-compliance workflow, which runs on pull_request_target
    in the privileged base-repository context and places the organization-administration token ORG_ADMIN_TOKEN into a step
    environment. Because the trigger is reachable by an unauthenticated internet user rather than only by trusted contributors,
    a single script-injection or action-compromise defect anywhere in this workflow exposes a credential that administers
    the whole juice-shop organization, not just this repository.
  attack_steps: null
  evidence_summary: .github/workflows/pr-compliance.yml:4 triggers on pull_request_target for opened, edited and reopened
    events, which grants the privileged base-repo context to workflow runs initiated by arbitrary pull-request authors; line
    438 injects secrets.ORG_ADMIN_TOKEN into the Block Spammer step, and lines 445-452 show it is a token with org-wide member-blocking
    authority. Attacker-controlled pull_request title and body values flow through the workflow at lines 289 and 424.
  impact_description: Compromise of this workflow yields an organization-administration credential rather than a repository-scoped
    one, letting an attacker administer every juice-shop repository and membership, far beyond the blast radius of the build
    itself.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: 'Every action in the workflow is SHA-pinned; the workflow never checks out pull-request head code; attacker-controlled
    PR fields are passed through env: variables rather than interpolated into script bodies; job permissions are narrowed
    to pull-requests: write and issues: write (.github/workflows/pr-compliance.yml:7-9).'
  mitigation_title: Move ORG_ADMIN_TOKEN out of the pull_request_target workflow in pr-compliance.yml
  remediation:
    effort: Medium
    steps:
    - Remove secrets.ORG_ADMIN_TOKEN from .github/workflows/pr-compliance.yml:438 and move the blocking action into a separate
      workflow_dispatch or repository_dispatch workflow that no externally triggered event can start, or replace the PAT with
      a GitHub App installation token scoped to the single blocking permission.
    - 'Add an environment: with required reviewers to whichever job retains the org-admin credential so its use requires an
      approval gate.'
    - Add a workflow-lint assertion (zizmor or actionlint) that fails when a pull_request_target workflow references any secret
      other than GITHUB_TOKEN.
    code_example: null
    verification: Run `grep -n 'secrets\.' .github/workflows/pr-compliance.yml`; expect only secrets.GITHUB_TOKEN and secrets.SLACK_WEBHOOK_URL
      to remain, with no ORG_ADMIN_TOKEN reference.
