  remediation:
    effort: Low
    steps:
    - Change Dockerfile:1 to `FROM node:24@sha256:<digest> AS installer` and Dockerfile:22 to `FROM gcr.io/distroless/nodejs24-debian13@sha256:<digest>`,
      recording the digests resolved at pin time.
    - Add Dependabot or Renovate coverage for the docker ecosystem so digest bumps arrive as reviewable pull requests instead
      of silent drift.
    code_example: null
    verification: 'Run `grep -n ''^FROM'' Dockerfile`; expect every line to contain an @sha256: digest.'
