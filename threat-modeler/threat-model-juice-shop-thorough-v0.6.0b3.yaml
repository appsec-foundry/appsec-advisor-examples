  evidence_summary: Dockerfile:1 declares `FROM node:24 AS installer`, a floating tag with no digest, and Dockerfile:22 declares
    `FROM gcr.io/distroless/nodejs24-debian13` with neither a tag nor a digest, so it resolves to :latest. This Dockerfile
    is the file the publish job builds from (.github/workflows/ci.yml:341). docker-compose.test.yml:7 likewise references
    bkimminich/juice-shop:latest for the docker-test job.
  impact_description: A substituted base image ships inside the container that every deployment of the project runs, giving
    the attacker code execution in the runtime image without touching the repository.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: The runtime stage uses a distroless base and drops to non-root UID 65532 (Dockerfile:39); no digest pinning
    or base-image verification is applied.
