  description: User with the admin role. Accesses administration panel, can view all users/orders/feedbacks, and reaches /rest/admin/*
    management endpoints.
  evidence:
  - file: lib/insecurity.ts
    line: 54
  - file: server.ts
    line: 606
- id: ext-google-oauth
  name: Google OAuth Provider
  kind: identity-provider
  description: Google OAuth 2.0 authorization server targeted by the frontend implicit flow. The browser redirects to Google
    with response_type=token; Google returns an access token in the URL fragment. No server-side OAuth code path is involved.
