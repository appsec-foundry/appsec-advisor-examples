  cwe: CWE-290
  title: Unverified wallet ownership claim (routes/nftMint.ts:41)
  scenario: An anonymous internet attacker reads the public Sepolia `NFTMinted` event log, copies the wallet address of a
    genuine minter, and POSTs it as `walletAddress` to the `walletNFTVerify` route. The handler at `routes/nftMint.ts:41`
    takes the address straight from `req.body` and at line 42 tests only whether that string is present in the `addressesMinted`
    set, so the attacker is credited with an NFT mint performed by a wallet he does not control.
  attack_steps: null
  evidence_summary: routes/nftMint.ts:41 assigns req.body.walletAddress directly to metamaskAddress and line 42 uses it as
    the sole input to the ownership decision; no nonce challenge, signature recovery, or session-to-wallet binding appears
    anywhere in the handler.
  impact_description: Wallet-ownership verification — the component's stated security role — is defeated. An attacker uses
    public on-chain data to claim any NFT-gated status or benefit; the legitimate minter's entry is deleted at line 43, so
    the real owner can no longer claim it.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: None — the handler performs no signature, nonce, or session-binding check on the submitted wallet address.
  mitigation_title: Require a signed wallet nonce in walletNFTVerify (routes/nftMint.ts)
  remediation:
    effort: Medium
    steps:
    - Issue a server-generated, single-use nonce per session and require the client to POST the nonce signed by the wallet's
      private key; in walletNFTVerify recover the signer with ethers verifyMessage and compare the recovered address to req.body.walletAddress
      before consulting addressesMinted.
    - Bind the verified address to the authenticated session record instead of a process-wide Set, and reject the request
      when the recovered signer differs from the claimed address or the nonce has already been consumed.
    - Add an integration test that POSTs a known minter address without a valid signature and asserts a 401 response and no
      state change to addressesMinted.
    code_example: null
    verification: 'Run the new integration test: POST /rest/web3/nftMint style verify request carrying a third party''s minter
      address and no signature must return 401 and leave addressesMinted unchanged; a request carrying a correctly signed
      nonce for that address must return 200.'
