  title: Server-side eval of stored username — routes/userProfile.ts:61
  scenario: An attacker sets their username to a `#{...}`-wrapped JavaScript payload via `POST /profile`; `routes/updateUserProfile.ts:38`
    persists it verbatim. On the next `GET /profile`, `routes/userProfile.ts:54` detects the pattern, extracts the inner text
    at line 56, and passes it to `eval()` at line 61 — running the attacker's JavaScript inside the Node process with server
    privileges instead of performing template substitution.
  attack_steps:
  - 'I register an account and post a username of #{process.mainModule.require(''child_process'').execSync(''id'')} to /profile.'
  - The update handler stores my username unchanged in the Users table.
  - I request GET /profile, and the profile renderer extracts my payload and passes it to eval, executing my command in the
    server process.
  evidence_summary: '`routes/userProfile.ts:61` calls `eval()` on the substring extracted at line 56 from the stored username,
    and `routes/updateUserProfile.ts:38` writes `req.body.username` to that column with no character or pattern restriction.'
  impact_description: An authenticated attacker executes arbitrary code inside the Node process, reading the SQLite database
    file, the hard-coded signing key, and any other secret on the training host.
  likelihood: Medium
  impact: Critical
  risk: Critical
  controls_in_place: The eval branch is reached only when the usernameXssChallenge flag is enabled (routes/userProfile.ts:54),
    which is the default configuration; no sandbox or expression allowlist applies.
  mitigation_title: Remove the eval call from the profile renderer in routes/userProfile.ts
