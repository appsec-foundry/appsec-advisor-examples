    authenticated. The notification object built at lib/challengeUtils.ts:62-70 includes flag: utils.ctfFlag(challenge.name),
    and its hidden field is derived from challenges.showSolvedNotifications, which suppresses client-side rendering only —
    the flag value is transmitted regardless.'
