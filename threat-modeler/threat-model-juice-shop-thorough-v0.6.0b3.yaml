  title: Unbounded CI matrix fan-out — ci.yml:58
  scenario: Three test jobs each fan out across three operating systems and three Node versions, and several further jobs
    run without any repository guard. The workflow declares no concurrency group, so a superseded run is never cancelled,
    and no job declares timeout-minutes, so a hung job runs to the platform maximum. An attacker who can trigger the workflow
    repeatedly - by pushing to any branch other than the two ignored ones, or by repeatedly updating a pull request - stacks
    complete matrices on top of each other and exhausts the organisation's shared Actions minutes and the metered Cypress
    Cloud recording quota, blocking every other build and release in the organisation.
  evidence_summary: .github/workflows/ci.yml:57-59 declares a 3x3 matrix repeated for the frontend-test, server-test and api-test
    jobs, and the workflow triggers on all pushes except two branches (lines 3-6) and on every pull_request (line 14). A search
    of .github/workflows found zero occurrences of job-level 'timeout-minutes:' and no 'concurrency:' key in ci.yml; the 'timeout_minutes'
    values at lines 77, 115, 155 and 207 are inputs to the nick-invision/retry action and bound only that one retry, not the
    job. The custom-config-test step at line 207 permits 30 minutes multiplied by three attempts.
  impact_description: Sustained trigger activity saturates the shared GitHub Actions runner quota and the paid Cypress Cloud
    recording plan, stalling releases and pull-request feedback for the whole project until quota resets or an administrator
    intervenes.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: paths-ignore filters skip documentation-only changes (.github/workflows/ci.yml:7-11, 15-19); the three
    matrix test jobs reduce forks to a single ubuntu/Node-24 combination (line 62)
  mitigation_title: Add a concurrency group and job timeouts to ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level ''concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true }'' block
      to .github/workflows/ci.yml so a new push cancels the superseded run.'
    - Declare an explicit 'timeout-minutes' on every job in ci.yml, sized to observed runtimes, with the custom-config-test
      and e2e-test jobs capped well below the platform default of 360 minutes.
    - Restrict the unguarded e2e-test, custom-config-test, smoke-test and docker-test jobs on fork pull requests to a single
      operating-system combination, matching the guard already applied at line 62.
