  stride: Elevation of Privilege
  cwe: CWE-321
  title: Security answers stored under embedded HMAC key — data/datacreator.ts:691
  scenario: An attacker who reads the stored SecurityAnswer digests recomputes candidate answers offline using the HMAC key
    embedded in the repository, then drives the password recovery flow to take over the matching account including the administrative
    one.
  attack_steps:
  - I read the stored answer digests from the database file and the embedded HMAC key from lib/insecurity.ts:42.
  - I recompute the keyed digest for a dictionary of plausible answers such as city and pet names until a digest matches.
  - I submit the recovered answer to the password recovery flow and set a new password for that account.
  evidence_summary: data/datacreator.ts:691 persists security answers through SecurityAnswerModel.create, whose setter applies
    security.hmac at models/securityAnswer.ts:45; that helper is defined at lib/insecurity.ts:42 as an HMAC-SHA256 under the
    literal key pa4qacea4VK9t9nGv7yZtwmj, so the digest is unsalted, uniterated, and reproducible by anyone with repository
    access.
  impact_description: Account takeover through the password recovery path for any user whose security answer is stored, defeating
    the recovery control that guards the credentials and payment card data held in this store.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: Keyed HMAC-SHA256 digest — but under a key committed to the repository, with no per-user salt and no
    iteration.
  mitigation_title: Hash security answers with bcrypt and load the key from the environment
  remediation:
    effort: Medium
    steps:
    - Replace security.hmac in the answer setter at models/securityAnswer.ts:45 with bcrypt at a cost factor of at least 12
      so that answers persisted by data/datacreator.ts:691 are salted and iterated.
    - Move the HMAC key at lib/insecurity.ts:42 out of the repository into an environment variable for its remaining non-answer
      uses, and fail startup when it is unset.
    - Add a test asserting a seeded security answer digest differs between two runs for the same plaintext answer.
    code_example: null
    verification: Seed the database twice with the same static answers and assert the stored SecurityAnswer digests differ
      between the two runs.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key'
