      download a specific pinned release tarball and verify its published SHA-256 with 'sha256sum -c' before executing anything.
    - Scope the HEROKU_API_KEY secret to the single deploy step rather than leaving it available to earlier steps in the same
      job.
    - Add a workflow lint rule that rejects any 'run:' line matching a download piped into a shell.
