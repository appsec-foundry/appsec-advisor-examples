  stride: Elevation of Privilege
  cwe: CWE-613
  title: Password change leaves issued tokens valid (routes/changePassword.ts:51)
  scenario: A victim who notices a compromise changes their password, but routes/changePassword.ts:51 writes the new value
    to the database without removing the attacker's entry from security.authenticatedUsers or invalidating their JWT, so the
    attacker's six-hour token keeps working and the stale cached password hash still satisfies the 2FA disable check at routes/2fa.ts:152.
  evidence_summary: routes/changePassword.ts:51 and routes/resetPassword.ts:44 both call user.update on the password column,
    and a search for token deletion, logout, revocation, and denylist patterns across the five credential-lifecycle files
    returned zero matches.
  impact_description: Password change and reset do not evict an attacker. The attacker retains full account authority for
    the remaining token lifetime and can disable the victim's second factor using the pre-change password cached in the session
    map, re-establishing persistent access.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Tokens carry a six-hour expiry set at lib/insecurity.ts:54, which is the only mechanism that ever ends
    a session; no server-side revocation exists.
  mitigation_title: Invalidate all sessions on password change and reset
  remediation:
    effort: Medium
    steps:
    - After the password update at routes/changePassword.ts:51 and routes/resetPassword.ts:44, delete every security.authenticatedUsers
      entry for that user id and record a per-user token epoch that lib/insecurity.ts:189 checks so older tokens fail verification.
    - Refresh the cached user record used by routes/2fa.ts:107 and routes/2fa.ts:152 from the database instead of trusting
      the session snapshot.
    - Add an integration test that authenticates, changes the password, and then replays the original token.
    code_example: null
    verification: Run the new integration test and expect the replayed pre-change token to return 401 on /rest/user/whoami
      and on /rest/2fa/disable.
    reference: 'CWE-613: Insufficient Session Expiration'
  evidence:
  - file: routes/changePassword.ts
    line: 51
