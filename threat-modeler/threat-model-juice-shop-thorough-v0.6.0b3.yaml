  stride: Tampering
  cwe: CWE-829
  title: Dependency lockfile disabled by config — .npmrc:1
  scenario: An attacker publishes a malicious version of any package in the transitive dependency tree — by typosquat, maintainer
    account takeover, or a compromised release pipeline upstream. Because `.npmrc` sets `package-lock=false`, no `package-lock.json`
    is ever generated or committed, so every `npm install` in CI and in the Docker build re-resolves the entire graph against
    the live registry and picks up the attacker's version the moment it is published. None of those installs pass `--ignore-scripts`,
    so the malicious package's lifecycle script executes on the runner with the job's full secret environment and can also
    rewrite application source before it is packaged into the released image.
  attack_steps:
  - I take over a maintainer account for a small transitive dependency of juice-shop and publish a patch version that satisfies
    the existing caret range.
  - The next CI or Docker build runs npm install with no lockfile, so npm resolves my freshly published version instead of
    the one the last build used.
  - My postinstall script runs on the runner and reads the job environment, capturing DOCKERHUB_TOKEN, HEROKU_API_KEY and
    GITHUB_TOKEN.
  - In the Dockerfile installer stage I also patch the compiled output, so the published bkimminich/juice-shop image ships
    my backdoor.
  evidence_summary: .npmrc:1 contains 'package-lock=false' and no package-lock.json exists in the repository, so dependency
    resolution is non-deterministic by configuration. .github/workflows/ci.yml:51, 71, 110, 147, 203 and 238 all run bare
    'npm install' without --ignore-scripts, and Dockerfile:5 runs 'npm install --omit=dev' in the stage whose output is copied
    into the released image.
  impact_description: A single poisoned package in the dependency graph yields arbitrary code execution inside jobs that hold
    the Docker Hub publish token and the Heroku production deploy key, and simultaneously backdoors the official Juice Shop
    container image consumed by training and CTF environments worldwide.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: The lint job alone installs with --ignore-scripts (.github/workflows/ci.yml:36, 38); no lockfile, no
    SCA gate, no Dependabot or Renovate configuration, and no minimum-release-age cooldown exist
  mitigation_title: Remove package-lock=false from .npmrc and enforce npm ci against a committed lockfile
  remediation:
    effort: Medium
    steps:
    - Delete the 'package-lock=false' line from .npmrc, run 'npm install' once locally to generate package-lock.json, and
      commit the lockfile for both the root project and frontend/.
    - Replace every 'npm install' in .github/workflows/ci.yml (lines 51, 71, 110, 147, 203, 238) and in Dockerfile:5 with
      'npm ci --ignore-scripts', adding explicit build steps for the few packages that genuinely need a lifecycle script.
    - Add a Dependabot or Renovate configuration with a minimumReleaseAge cooldown of at least one day, and add actions/dependency-review-action
      to the pull_request path so a malicious or vulnerable manifest change is blocked before merge.
    - Add a CI assertion that fails the build when package-lock.json is missing or when 'npm ci' reports the lockfile is out
      of sync with package.json.
    code_example: null
    verification: Run 'git ls-files package-lock.json' and expect the path to be listed, then run 'npm ci --ignore-scripts'
      on a clean checkout; it must succeed, and 'grep -r "npm install" .github/workflows/ci.yml' must return no hits.
    reference: https://cwe.mitre.org/data/definitions/829.html
