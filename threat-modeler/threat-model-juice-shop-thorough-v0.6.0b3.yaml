  title: Weak password recovery mechanism
  scenario: An attacker submits a target's email and a guessed or researched security answer to `POST /rest/user/reset-password`.
    The handler requires only a matching HMAC answer (keyed on the constant at `lib/insecurity.ts:42`) — no reset token, no
    proof of mailbox control — and overwrites the password immediately, giving the attacker full account access in one request.
  evidence_summary: routes/resetPassword.ts:41 compares security.hmac(answer) to the stored answer and, on match, immediately
    updates the user password at line 44; nothing in the handler binds the reset to a one-time token, a session, or a delivered
    channel.
  impact_description: Account takeover of any user whose security answer is guessable or publicly researchable, including
    administrative accounts, with the legitimate owner locked out by the password rewrite.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Security answer compared as a keyed HMAC (lib/insecurity.ts:42); the HMAC key is a literal in the same
    source file
  mitigation_title: Replace security-question reset in routes/resetPassword.ts with emailed one-time tokens
  remediation:
    effort: High
    steps:
    - Replace the answer comparison at routes/resetPassword.ts:41 with a flow that mails a single-use, time-limited, cryptographically
      random token to the stored address and accepts the new password only together with that token.
    - Persist the token hashed with an expiry and mark it consumed inside the same transaction that updates the password,
      so a token cannot be replayed.
    - Return an identical response whether or not the address exists, to keep the endpoint from confirming account existence.
