    search of the file for provenance, attest, id-token and sbom:. The VCS_REF label written at Dockerfile:35 is readable
    only from an image copy that can still be retrieved.
  impact_description: Post-incident reconstruction of which commit produced a deployed image is impossible from the registry
    alone, and there is no rollback target, so a supply-chain compromise cannot be scoped or attributed.
  likelihood: Medium
  impact: Medium
  risk: Medium
