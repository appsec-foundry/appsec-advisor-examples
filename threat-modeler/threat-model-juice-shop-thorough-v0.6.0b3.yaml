  description: Untrusted input reaches an interpreter (SQL, OS shell, template, XML/YAML parser) without parameterization
    or a strict allowlist. It is systemic when the same unsafe construction pattern recurs across handlers rather than being
    an isolated slip.
  structural_recommendation: adopt parameterized queries / safe APIs and centralised input validation as the only sanctioned
    data-access and parsing path
- id: W-012
  weakness_class: missing_authz
  kind: implementation
  title: Broken Access Control is implemented inconsistently
  statement: Missing workflow permissions block (.github/workflows/ci.yml:190)
  severity: Medium
  severity_basis: observed-practice
  observable_backing:
    practice_evidence:
    - file: .github/workflows/ci.yml
      line: 190
      id: T-040
  mechanism_id: missing-authz-cwe-732
  affected_components:
  - ci-cd-pipeline
  description: 'Authorization is not enforced consistently at the server: object-ownership and role checks are absent, client-side
    only, or scattered per-route instead of centralised, so any authenticated caller can exceed its scope.'
  structural_recommendation: introduce a centralised server-side authorization layer that enforces object-level ownership
    and role checks on every request
- id: W-013
  weakness_class: outdated_deps
  kind: implementation
  title: Vulnerable & Outdated Dependencies is implemented inconsistently
  statement: Unpinned container base image (Dockerfile:1)
  severity: Medium
  severity_basis: observed-practice
  observable_backing:
    practice_evidence:
    - file: Dockerfile
      line: 1
      id: T-047
  mechanism_id: outdated-deps-cwe-1104
  affected_components:
  - ci-cd-pipeline
  description: Dependencies with known vulnerabilities are shipped because update and advisory-tracking are not enforced in
    the pipeline.
  structural_recommendation: enforce automated dependency updates and block known-vulnerable versions in CI
- id: W-014
  weakness_class: weak_crypto
  kind: implementation
  title: Security-sensitive data uses weak cryptographic primitives
  statement: Non-cryptographic RNG for a secret/token — lib/insecurity.ts:53
  severity: Medium
  severity_basis: observed-practice
  observable_backing:
    practice_evidence:
    - file: lib/insecurity.ts
      line: 41
      id: T-033
  mechanism_id: weak-cryptographic-primitives
  affected_components:
  - auth
  - backend-api
  description: Password, token, or integrity protection uses a weak hash, predictable random source, or insufficient work
    factor. The application may use a standard library, but the selected primitive does not provide the required security
    property.
  structural_recommendation: standardise on a password KDF, a CSPRNG for secrets, and modern authenticated cryptographic primitives
    with centrally reviewed parameters
- id: W-015
  weakness_class: injection
  kind: design
  title: Frontend rendering lacks enforced output encoding
  statement: Output Encoding / Templating Autoescape is not consistently enforced.
  severity: Medium
  severity_basis: design-risk
  observable_backing:
    absent_control_signal:
    - Template Autoescape
    - Output Encoding
    - Content Security Policy
  mechanism_id: frontend-output-encoding
  description: Browser rendering paths write HTML or DOM content directly without one enforced contextual-encoding or sanitisation
    boundary. Safety depends on each individual component using the right API.
  structural_recommendation: use framework-safe rendering by default and isolate any required raw HTML behind one reviewed
    sanitisation and Trusted Types policy
- id: W-016
  weakness_class: outdated_deps
  kind: design
  title: Build pipeline trusts mutable third-party references
  statement: Dependency lockfile disabled by configuration (.npmrc:1)
  severity: Medium
  severity_basis: design-risk
  observable_backing:
    absent_control_signal:
    - Commit-SHA Action Pinning
    - Dependency Provenance Verification
    practice_evidence:
    - file: .npmrc
      line: 1
      id: T-029
    - file: .github/workflows/image_actions.yml
      line: 33
      id: T-030
  mechanism_id: build-pipeline-mutable-refs
  affected_components:
  - ci-cd-pipeline
  description: CI/CD workflows resolve third-party actions and other build dependencies to mutable tags or branches instead
    of immutable commit digests, so a retagged or compromised upstream runs inside the pipeline with its token and secret
    scope.
  structural_recommendation: pin every third-party action and build dependency to an immutable commit SHA (or a vetted internal
    mirror) and enforce SHA-pinning in CI
