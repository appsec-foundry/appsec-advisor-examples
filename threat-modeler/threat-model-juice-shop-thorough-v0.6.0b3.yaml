- local_id: ci-cd-pipeline-009
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: Missing workflow permissions block
  scenario: 'The CI/CD workflow defines eleven jobs and never declares a permissions key, so GITHUB_TOKEN in every job carries
    the repository''s default scope, which on legacy-default repositories is read-write across contents, packages, issues
    and releases. The workflow then hands that ambient token to third-party action code: coverallsapp/github-action, itself
    pinned to a movable tag, receives it directly. A single compromised step - a substituted action or a malicious package
    installed by the unlocked npm install - inherits repository write and can push commits, create releases, or publish packages
    under the project''s identity.'
  evidence_summary: '.github/workflows/ci.yml:190 passes ''github-token: ${{ secrets.GITHUB_TOKEN }}'' to the coverallsapp/github-action@v2
    step declared at line 188, and lines 253, 268 and 389 pass the same token to three further third-party steps. A search
    of ci.yml found zero occurrences of a ''permissions:'' key, while codeql-analysis.yml:11-14 shows the project applies
    least-privilege token scoping elsewhere.'
  impact_description: Compromise of any single step in the workflow escalates to repository write, letting the attacker commit
    backdoored source to master, publish a release, or alter the packages the project distributes - all attributed to the
    project's own automation.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None in this workflow; codeql-analysis.yml, lock.yml and pr-compliance.yml declare explicit permissions
    blocks, but 13 of the 16 workflows do not
  mitigation_title: Declare least-privilege permissions for every job in ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level ''permissions: { contents: read }'' block to .github/workflows/ci.yml and grant wider scopes only on
      the individual jobs that need them, following the pattern already used in .github/workflows/codeql-analysis.yml:11-14.'
    - Set the organisation or repository default workflow permission to read-only so that any workflow missing a permissions
      block fails closed rather than open.
    - Confirm the coverage-report, e2e-test and notify-slack steps still function with the reduced scope, and remove the explicit
      GITHUB_TOKEN inputs wherever the action can use the job token directly.
    code_example: null
    verification: 'Run ''grep -c "^permissions:" .github/workflows/ci.yml'' and expect 1; then inspect a completed run''s
      ''Set up job'' log and confirm the GITHUB_TOKEN permissions list shows only contents: read for the test jobs.'
    reference: https://owasp.org/www-project-top-10-ci-cd-security-risks/CICD-SEC-05-Insufficient-PBAC
  evidence:
  - file: .github/workflows/ci.yml
    line: 190
