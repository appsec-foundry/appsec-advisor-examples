  stride: Information Disclosure
  cwe: CWE-200
  title: Tool-call view gated by client cookie (chat-conversation.component.ts:68)
  scenario: 'LLM07 — System Prompt Leakage: the chatbot decides whether to reveal the assistant''s tool calls purely from
    the client-set show_tool_calls cookie at frontend/src/app/chatbot/chat-conversation/chat-conversation.component.ts:68,
    with no role check, even though the component injects LoginGuard. Line 161 stores every streamed deltaToolCalls chunk
    on the message regardless of that flag, and line 170 persists the whole conversation, so the internal tool names and raw
    arguments reach the browser unconditionally. Any authenticated shopper who writes show_tool_calls=true in their own cookie
    jar sees the view that frontend/src/app/administration/administration.component.html:96 presents as an administrator-only
    toggle.'
  evidence_summary: chat-conversation.component.ts:68 sets showToolCalls from the cookie value alone with no role comparison,
    while line 161 appends deltaToolCalls to the message irrespective of the flag — proving the concealment is presentational
    only and the data has already crossed to the client.
  impact_description: Disclosure of the chatbot's internal tool names and raw invocation arguments to any authenticated user,
    revealing the backend functions the assistant can drive and the parameters it passes, which maps the attack surface for
    prompt-injection attempts.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: The toggle is rendered only inside the admin panel at administration.component.html:96, but it writes
    an ordinary non-HttpOnly cookie and the consuming component performs no role check.
  mitigation_title: Gate tool-call streaming on the server-verified caller role instead of the cookie
  remediation:
    effort: Medium
    steps:
    - Stop emitting deltaToolCalls in the chat stream for callers whose server-verified role is not admin, so the payload
      never reaches a non-admin browser.
    - Replace the cookie read at frontend/src/app/chatbot/chat-conversation/chat-conversation.component.ts:68 with a role
      check derived from the verified session, keeping the cookie as a display preference only.
    - Add a test that requests the chat stream as a non-admin user with show_tool_calls=true set and asserts no tool-call
      chunk appears in the response.
    code_example: null
    verification: Set show_tool_calls=true as a standard user, send a message that triggers a tool call, and assert the streamed
      response contains no tool_calls payload and the UI shows none.
    reference: https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/
