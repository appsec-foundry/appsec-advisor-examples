  impact_description: Any JavaScript on the origin can read the session token, and plain HTTP exposes it in transit — one
    XSS or a downgraded connection gives an attacker a six-hour session covering everything the victim's account can reach.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: None on the cookie itself; the token's six-hour expiry at lib/insecurity.ts:54 is the only limit on how
    long a stolen cookie remains usable.
