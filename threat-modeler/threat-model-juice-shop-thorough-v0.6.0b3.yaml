  cwe: CWE-916
  title: Unsalted MD5 password hashing (lib/insecurity.ts:41)
  scenario: An attacker who obtains the Users table — through the login SQL injection at routes/login.ts:34 or a database
    backup — feeds the stored digests to a rainbow table or GPU cracker, because lib/insecurity.ts:41 derives every stored
    password with a single unsalted MD5 pass that offers no per-user salt and no work factor.
  evidence_summary: lib/insecurity.ts:41 defines hash as crypto.createHash('md5').update(data).digest('hex') with no salt
    argument and no iteration count, and routes/login.ts:34 and routes/2fa.ts:107 compare stored credentials against that
    same function.
  impact_description: Bulk recovery of customer plaintext passwords from any database disclosure, enabling credential stuffing
    against the victims' other services and direct re-login to the shop with recovered passwords.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. MD5 is applied once with no salt, no pepper, and no cost parameter.
  mitigation_title: Replace MD5 password hashing with bcrypt in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Introduce a bcrypt or argon2id hashing helper with a tuned cost factor and per-user salt, and use it at every credential
      comparison and write site that currently calls security.hash.
    - Rehash each user's password transparently on their next successful login, and force a reset for accounts that do not
      log in within the migration window.
    - Add a unit test asserting that hashing the same password twice yields different stored values.
    code_example: null
    verification: Run the new unit test and expect two hashes of the identical password to differ while both verify successfully;
      confirm `grep -rn "createHash('md5')" lib/` returns zero matches.
    reference: OWASP ASVS V6.2 — Algorithms
