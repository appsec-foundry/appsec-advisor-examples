  stride: Information Disclosure
  cwe: CWE-916
  title: Unsalted MD5 password hashing
  scenario: 'The hash helper applies a single unsalted MD5 round and is the only transform protecting stored passwords: routes/login.ts:34
    compares MD5 output during login and routes/2fa.ts:107 reuses it for password re-confirmation before 2FA changes. An attacker
    who reads the Users table, for example through the SQL injection at routes/login.ts:34, recovers plaintext passwords with
    commodity rainbow tables.'
  evidence_summary: lib/insecurity.ts:41 defines hash as crypto.createHash('md5').update(data).digest('hex') with no salt,
    no per-user parameter and no iteration count, and that value is what login compares against the stored password column.
  impact_description: Disclosure of the Users table converts directly into plaintext credentials for every account, enabling
    credential stuffing against the users' other services.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: MD5 digest only; no salt, no key-derivation work factor
  mitigation_title: Replace the MD5 hash helper in lib/insecurity.ts with a memory-hard KDF
  remediation:
    effort: Medium
    steps:
    - Replace the MD5 helper at lib/insecurity.ts:41 with argon2id or bcrypt at a tuned cost, storing the full encoded hash
      including its per-user salt.
    - Verify passwords with the library's constant-time comparison and rehash transparently on successful login so existing
      MD5 records migrate as users sign in.
    - Keep a per-record algorithm marker so the login path can distinguish legacy MD5 rows from migrated ones and force a
      reset for rows that never migrate.
    code_example: null
    verification: Add a unit test asserting that hashing the same password twice yields different stored values and that verification
      still succeeds, which fails against the current MD5 implementation.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
