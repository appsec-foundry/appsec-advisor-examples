  name: JWT Session Tokens
  classification: Confidential
  description: RS256-signed JWTs issued by lib/insecurity.ts authorize user and admin sessions for 6 hours. The SPA stores
    them in localStorage (request.interceptor.ts:13), making them accessible to any same-origin JavaScript including XSS payloads.
