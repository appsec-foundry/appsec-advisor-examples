  cwe: CWE-863
  title: Coupon discount bounded only by prompt text — routes/chat.ts:184
  scenario: 'LLM06 — Excessive Agency: an attacker injects instructions into the chat messages array so the model calls `generateCoupon`
    with a discount far above the stated maximum. The coupon policy, including the 10 percent ceiling and the damaged-order
    precondition, exists only as system-prompt text at `routes/chat.ts:98-105`. The tool''s execute body at `routes/chat.ts:184`
    passes the model-chosen discount straight to `security.generateCoupon` with no numeric bound, no order verification, and
    no caller check, and the resulting code is redeemable through `PUT /rest/basket/:id/coupon/:coupon` at `server.ts:605`.'
  evidence_summary: '`routes/chat.ts:184` passes the model-supplied value directly to `security.generateCoupon(discount)`.
    The zod schema at `routes/chat.ts:179` declares the maximum only in a describe string, imposing no runtime constraint.'
  impact_description: An attacker mints arbitrarily large discount coupons through the chat agent and redeems them at checkout
    — an economic bypass outside the defined challenge scope.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The coupon policy is stated in the system prompt at routes/chat.ts:98-105 and the discount maximum appears
    in a zod describe string at routes/chat.ts:179; neither is enforced in code.
  owasp_llm_ids:
  - LLM01
  - LLM06
  mitigation_title: Enforce the coupon ceiling and order precondition in the generateCoupon tool
  remediation:
    effort: Medium
    steps:
    - Constrain the zod schema at routes/chat.ts:179 with z.number().int().min(1).max(10) so an out-of-range discount is rejected
      before execute runs.
    - Inside the execute body at routes/chat.ts:181, resolve the caller with getUserId and verify server-side that a damaged
      order exists for that caller before calling security.generateCoupon at line 184.
    - Add an integration test that drives the model to request a 50 percent coupon and asserts the tool returns an error with
      no coupon code emitted.
    code_example: null
    verification: 'Run the new integration test: a chat exchange that induces generateCoupon with discount 50 must yield a
      tool error and no redeemable coupon code in the stream.'
