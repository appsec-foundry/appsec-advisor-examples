      fail startup when it is missing.
    - Derive stored answers with a per-user salted password hash function rather than a single keyed digest, and rotate existing
      records on next use.
    - Add a test asserting that no 20-plus character secret literal appears in lib/insecurity.ts.
    code_example: null
    verification: Run the new test and expect zero secret literals detected in lib/insecurity.ts; start the server without
      the key variable and expect a non-zero exit.
