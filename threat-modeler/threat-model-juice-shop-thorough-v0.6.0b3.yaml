  cwe: CWE-602
  title: Client-controlled wallet credit amount — routes/wallet.ts:27
  scenario: An authenticated user posts an arbitrary balance value together with the id of any card they own to PUT /rest/wallet/balance.
    routes/wallet.ts:24 confirms only that the card row belongs to the caller; no charge is attempted and no amount ceiling
    is checked. routes/wallet.ts:27 then increments the wallet by the raw req.body.balance value, so the caller decides how
    much store credit to mint and spends it at checkout through the wallet branch at routes/order.ts:148.
  evidence_summary: routes/wallet.ts:27 passes req.body.balance directly to WalletModel.increment with no bound, no server-side
    price source, and no payment capture between the card lookup at line 24 and the credit.
  impact_description: Any authenticated user mints unlimited store credit and obtains goods and deluxe membership without
    payment, corrupting the order and wallet data the training scenarios depend on.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Card ownership is verified against the caller's UserId (routes/wallet.ts:24); the credit amount itself
    is unvalidated and no payment is captured.
  mitigation_title: Derive the wallet credit from a settled payment in routes/wallet.ts
  remediation:
