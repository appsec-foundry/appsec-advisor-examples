tier_root_causes:
  edge:
  - Untrusted values passed through sanitizer bypasses into HTML sinks
  - Session token and PII held in script-readable browser storage
  - Access decisions taken in the browser from an unverified token payload
  - No script-source or frame-ancestors policy to contain injected script
  - Credentials and session binding derived from public or client-set values
  server:
  - Request data interpolated into SQL, eval, and template execution contexts
  - Authorization read from token payload or request body, not from server state
  - Signing keys, credentials, and HMAC secrets embedded as source literals
  - Endpoints accept unauthenticated requests with no rate limit or state cap
  - Build inputs unpinned and workflow tokens scoped beyond the job's need
  data:
  - Seed data ships identical account credentials and TOTP seeds to every deploy
  - Payment card data and recovery answers persisted as cleartext columns
  - Stores created with default configuration and no at-rest encryption
