  cwe: CWE-346
  title: JSONP callback enables cross-origin read (routes/currentUser.ts:58)
  scenario: An attacker page loads <script src="https://shop/rest/user/whoami?callback=leak&fields=password">; because routes/currentUser.ts:17
    authenticates from the token cookie the browser attaches automatically, and line 58 responds with res.jsonp instead of
    res.json, the victim's identity and projected fields are executed as script in the attacker's origin.
  evidence_summary: routes/currentUser.ts:54 branches on the caller-supplied callback query parameter and line 58 emits a
    JSONP response, while line 17 derives the identity from req.cookies.token, so the response is both authenticated and readable
    across origins.
  impact_description: Any site a logged-in customer visits silently harvests that customer's email address and, combined with
    the field projection at line 31, their password hash and TOTP secret, with no same-origin policy or CORS check standing
    in the way.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: Express escapes the callback identifier before emitting it, which prevents script injection into the
    callback name but does nothing to stop cross-origin reading of the payload.
  mitigation_title: Remove the JSONP response path from routes/currentUser.ts
  remediation:
    effort: Low
    steps:
    - Delete the callback branch at routes/currentUser.ts:54 and always respond with res.json, so the endpoint is readable
      only under the same-origin policy or an explicit CORS allowlist.
    - Set SameSite=Strict on the token cookie so a cross-site script include cannot carry the session even if a JSONP-style
      endpoint reappears.
    - Add an integration test requesting the endpoint with a callback parameter and asserting a JSON content type.
    code_example: null
    verification: Run the new integration test and expect Content-Type application/json with a response body that does not
      begin with the callback identifier.
    reference: 'CWE-346: Origin Validation Error'
