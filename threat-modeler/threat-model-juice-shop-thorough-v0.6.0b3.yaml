  stride: Tampering
  cwe: CWE-1104
  title: Unpinned container base image — Dockerfile:1
  scenario: The build resolves its base images by floating tag rather than by content digest, so the bytes underlying 'node:24'
    and the untagged distroless runtime image can change between any two builds. An attacker who compromises an upstream base
    image, or who can influence registry tag resolution, substitutes a backdoored layer that is inherited by the installer
    stage that compiles the application and by the runtime stage that ships to users, with no diff in this repository to signal
    the change.
  evidence_summary: Dockerfile:1 declares 'FROM node:24 AS installer' with a floating major tag and no @sha256 digest, and
    Dockerfile:22 declares 'FROM gcr.io/distroless/nodejs24-debian13' with no tag at all, which resolves to :latest. docker-compose.test.yml:7
    pulls 'bkimminich/juice-shop:latest' for the docker-test job invoked at .github/workflows/ci.yml:311.
  impact_description: A substituted base layer executes inside the build that produces the released image and inside every
    container started from it, giving the attacker code execution in the shipped artifact; builds are also not reproducible,
    so a compromised build cannot be distinguished from a clean one after the fact.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: Runtime stage uses a distroless base and drops to non-root UID 65532 (Dockerfile:39); the build generates
    a CycloneDX SBOM (Dockerfile:20)
  mitigation_title: Pin both Dockerfile base images to immutable sha256 digests
  remediation:
    effort: Low
    steps:
    - Change Dockerfile:1 to 'FROM node:24@sha256:<digest> AS installer' and Dockerfile:22 to 'FROM gcr.io/distroless/nodejs24-debian13@sha256:<digest>',
      recording the human-readable tag in a trailing comment.
    - Pin the image reference in docker-compose.test.yml:7 to the digest or to an immutable release tag instead of :latest.
    - Let Dependabot or Renovate raise pull requests that bump these digests, so updates remain visible in the diff.
    code_example: null
    verification: Run 'grep -nE "^FROM " Dockerfile'; every line must contain '@sha256:', and 'docker build .' must still
      complete successfully.
    reference: https://cwe.mitre.org/data/definitions/1104.html
  evidence:
  - file: Dockerfile
    line: 1
  evidence_check: verified
  prior_finding_ref: null
