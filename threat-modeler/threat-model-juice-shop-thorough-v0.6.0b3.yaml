  title: Unmediated data-store access control — data/mongodb.ts:10
  scenario: An attacker who reaches any consumer route backed by the orders collection obtains read and write access to every
    order document that the route's own query selects, because the collection exported at data/mongodb.ts:10 is a bare module-scope
    singleton that applies no ownership predicate, tenant scope, or authorization hook at the storage layer. Authorization
    for order and review data therefore rests entirely on each importing module repeating its own check, with no store-level
    backstop when one omits it.
