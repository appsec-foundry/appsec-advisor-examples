  title: Hard-coded HMAC key for security answers (lib/insecurity.ts:42)
  scenario: An attacker reads the HMAC key literal from `lib/insecurity.ts:42` in the source tree. Given any disclosure of
    the `SecurityAnswers` table, the attacker computes digests offline for a dictionary of likely answers until one matches.
    The attacker then replays the matching plaintext answer through the reset flow at `routes/resetPassword.ts:41` to take
    over the account.
  evidence_summary: '`lib/insecurity.ts:42` passes the literal string `pa4qacea4VK9t9nGv7yZtwmj` as the HMAC-SHA256 key. `routes/resetPassword.ts:41`
    uses that keyed digest as the sole comparison protecting password reset.'
  impact_description: The keyed hash provides no secrecy against anyone with source access, so stored security answers degrade
    to unsalted digests — crackable offline, enabling account takeover for every affected customer.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Answers are stored as HMAC-SHA256 digests rather than plaintext, but the key is a source literal and
    there is no per-user salt.
  mitigation_title: Load the security-answer HMAC key from secret storage in lib/insecurity.ts
  remediation:
    effort: Low
