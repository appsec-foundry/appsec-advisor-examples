  title: Unpinned third-party action — image_actions.yml:33
  scenario: An attacker who compromises the calibreapp/image-actions repository, or a maintainer who force-pushes it, changes
    the code at the mutable 'main' branch ref. The next image-compression run resolves that ref fresh and executes the new
    code inside the repository's CI context with GITHUB_TOKEN in hand. The same substitution works against the other tag-pinned
    actions, because a Git tag can be moved to any commit by whoever controls the action repository.
  evidence_summary: .github/workflows/image_actions.yml:33 pins calibreapp/image-actions to the mutable branch ref '@main';
    lines 30 and 42 pin actions/checkout and peter-evans/create-pull-request to movable tags '@v6' and '@v8'; .github/workflows/ci.yml:188
    uses coverallsapp/github-action@v2 and .github/workflows/codeql-analysis.yml:23, 34 and 36 use github/codeql-action/*@v3.
    The rest of ci.yml pins every action to a full 40-character commit SHA (for example line 29 and line 338), so these are
    gaps in an otherwise applied practice.
  impact_description: Malicious code in a substituted action runs with the workflow's GITHUB_TOKEN and any secrets exposed
    to that job, letting the attacker commit to the repository, alter the CodeQL results that gate security review, or pivot
    into the release jobs that hold registry and deploy credentials.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Most actions in ci.yml are pinned to full commit SHAs; image_actions.yml:25-27 restricts the job to the
    upstream repository and to non-fork pull requests
  mitigation_title: Pin every action reference in image_actions.yml, ci.yml and codeql-analysis.yml to a full commit SHA
  remediation:
    effort: Low
    steps:
    - Replace '@main', '@v6' and '@v8' in .github/workflows/image_actions.yml lines 33, 30 and 42, '@v2' in .github/workflows/ci.yml
      line 188, and '@v3' in .github/workflows/codeql-analysis.yml lines 23, 34 and 36 with the full 40-character commit SHA
      of the intended release, keeping the human-readable version in a trailing comment as the file already does elsewhere.
    - Enable the GitHub repository setting that allows only SHA-pinned actions, or add a pinactlint / zizmor step to the pull_request
      path that fails when a 'uses:' value is not a 40-character SHA.
    code_example: null
    verification: Run 'grep -rnE "uses:\s+[^ ]+@(v[0-9]|main|master)" .github/workflows/'; it must return no matches.
    reference: https://cwe.mitre.org/data/definitions/1357.html
