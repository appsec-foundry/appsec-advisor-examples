tier_root_causes:
  edge:
  - URL and fragment values rendered through explicit sanitizer-bypass calls
  - Session tokens kept in script-readable localStorage and cookies
  - Access and identity decisions taken from unverified client-held claims
  - Credentials embedded in or derived from the browser-delivered bundle
  - No delivery-time script policy to contain execution after injection
  server:
  - Request data concatenated into SQL, NoSQL, template and eval sinks
  - Identity rests on repository-embedded keys and reversible derivations
  - Authorization decided per handler, with no default-deny at registration
  - Client-supplied fields bound straight to role, balance and state writes
  - No per-caller budget; limits keyed on client-controlled request headers
  data:
  - Store singleton exposes collections with no ownership predicate
  - Collections created without capacity, retention or eviction policy
