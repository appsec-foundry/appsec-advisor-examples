threats:
- local_id: frontend-spa-004
  threat_category_id: TH-11
  additional_categories:
  - TH-01
  stride: Tampering
  cwe: CWE-79
  title: Systemic DOM XSS via Sanitizer Bypass
  scenario: filterTable() reads the q query parameter at frontend/src/app/search-result/search-result.component.ts:136, trims
    it, and passes the raw value to DomSanitizer.bypassSecurityTrustHtml at line 143. frontend/src/app/search-result/search-result.component.html:11
    binds that SafeHtml straight into [innerHTML], so a crafted search link executes attacker-supplied markup in the shop's
    own origin. Because login.component.ts:101 keeps the session JWT in localStorage and no Content-Security-Policy restricts
    script sources, the injected code reads the token and reaches any API the victim can reach.
  attack_steps:
  - 'I craft a link to the search route whose q parameter carries an iframe with a javascript: source so my markup reaches
    the search box.'
  - I send that link to a logged-in shopper, whose browser renders it through search-result.component.html:11 with no escaping
    applied.
  - My injected script reads localStorage.token, written at login.component.ts:101, and posts the JWT to a server I control.
  evidence_summary: '`search-result.component.ts:143` assigns `bypassSecurityTrustHtml(queryParam)` to `searchValue`, and
    `search-result.component.html:11` renders `searchValue` via `[innerHTML]`; the only transformation between source and
    sink is `.trim()` at line 138.'
  impact_description: Any user who follows a crafted search link has their shop session hijacked, exposing orders, addresses,
    and stored payment data to the attacker, who can then act as that user against the API.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Only queryParam.trim() at search-result.component.ts:138 — whitespace removal, with no HTML encoding
    or sanitization; Angular's default escaping is explicitly disabled at line 143.
  mitigation_title: Render the search term as text instead of trusted HTML in search-result.component
  remediation:
    effort: Low
    steps:
    - Drop the bypassSecurityTrustHtml call at frontend/src/app/search-result/search-result.component.ts:143 and assign the
      trimmed query string directly to searchValue.
    - Change frontend/src/app/search-result/search-result.component.html:11 from [innerHTML]="searchValue" to an interpolation
      so Angular escapes the value.
    - Add a component test that sets q to a script-bearing payload and asserts the rendered element contains escaped text
      and no element node.
    code_example: null
    verification: Run the search-result component test with q set to an img/onerror payload and assert element.querySelector('img')
      is null while the literal payload text is present.
    reference: https://angular.dev/best-practices/security#sanitization-and-security-contexts
