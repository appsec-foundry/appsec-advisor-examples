  stride: Spoofing
  cwe: CWE-1391
  title: Password derived from email address (oauth.component.ts:30)
  scenario: The OAuth callback derives each federated user's shop password from a public identifier. frontend/src/app/oauth/oauth.component.ts:30
    computes it as btoa(profile.email.split('').reverse().join('')) and registers the account with that value, and line 46
    submits the identical expression to userService.login as the authentication credential. An attacker who knows only a victim's
    email address reproduces the credential offline and authenticates through the ordinary login form without ever touching
    Google.
  attack_steps:
  - I harvest a target's email address from the publicly rendered feedback list or the shop's user listing.
  - I reverse the email string and base64-encode it, reproducing exactly the value oauth.component.ts:30 computes for that
    account.
  - I post the email and that derived password to the normal login endpoint, which oauth.component.ts:46 shows is the same
    credential the OAuth flow registers.
  evidence_summary: oauth.component.ts:30 builds the account password as base64 of the reversed email and passes it to userService.save;
    line 46 passes the same expression to userService.login, proving the derived string is an accepted authentication credential
    and not an internal placeholder.
  impact_description: Full account takeover of every Google-federated shopper, including accounts holding the admin or accounting
    role. The attacker gains access to the victim's orders, delivery addresses, saved payment cards, and basket, and can place
    orders in their name.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — the derived value is computed in the browser and submitted unchanged; no password policy, entropy
    check, or server-issued secret is involved in this component.
  mitigation_title: Replace the email-derived OAuth password with a server-issued credential in oauth.component.ts
  remediation:
    effort: Medium
    steps:
    - Remove the btoa(profile.email...) derivation at frontend/src/app/oauth/oauth.component.ts:30 and :46 so the OAuth callback
      never constructs or transmits a password.
    - Exchange the OAuth access token for a session at a dedicated server endpoint that provisions the account with a cryptographically
      random secret the browser never receives.
    - Add a regression test that posts base64(reverse(email)) as the password for an OAuth-provisioned account and asserts
      the login is rejected.
    code_example: null
    verification: Run the new frontend and API tests for the OAuth flow; a POST to /rest/user/login using base64(reverse(email))
      for an OAuth-provisioned account must return 401, and no request body emitted by OAuthComponent may contain a password
      field.
    reference: https://cwe.mitre.org/data/definitions/1391.html
