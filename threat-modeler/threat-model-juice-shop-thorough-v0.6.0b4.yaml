trust_boundaries:
- name: 'Internet to Express API: security.isAuthorized() expressJwt'
  kind: network
  assumption: Every state-changing or data-reading route is protected by security.isAuthorized() expressJwt middleware before
    handler execution.
  evidence:
  - file: server.ts
    line: 398
  - file: lib/insecurity.ts
    line: 52
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: express-api
  enforcement_point: security.isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body, URL parameter, and uploaded file is validated for type and format before use in route handlers.
  - leg: authentication
    condition: Every state-changing or data-reading route is registered behind security.isAuthorized() expressJwt middleware.
  - leg: authorization
    condition: Every resource operation is checked against the authenticated user's identity before data is returned or modified.
  surface: network
  transition: []
  id: tb-1
  assumption_verdict: refuted
