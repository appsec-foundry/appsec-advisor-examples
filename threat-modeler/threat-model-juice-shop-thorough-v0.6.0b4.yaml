tier_root_causes:
  edge:
  - Untrusted data reaches raw HTML sinks that bypass framework escaping
  - Authorization decided in browser code from unverified token claims
  - Bearer session credentials held in script-readable browser storage
  - OAuth callback lacks state binding and derives credentials client-side
  server:
  - Request input concatenated into SQL, NoSQL, template, or eval execution
  - Identity and ownership read from client fields, not the verified session
  - Token trust lacks pinned algorithms, signature checks, and external keys
  - Routes and sockets registered without default-deny auth middleware
  - Build pipeline consumes unpinned, unverified artifacts with broad tokens
  data:
  - Sensitive columns persisted in cleartext without field-level encryption
  - Full card numbers stored instead of provider tokens or truncated values
