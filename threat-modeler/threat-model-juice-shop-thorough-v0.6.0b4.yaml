security_controls:
- domain: Session and Token Controls
  control: JWT Token Issuance and Algorithm Enforcement
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: 'RS256 is selected for signing at lib/insecurity.ts:54, which avoids symmetric-key confusion attacks. However,
    the RSA private key is hardcoded in the same file (lib/insecurity.ts:21), making any RS256 guarantees hollow: any repository
    reader can forge valid tokens. The verification side''s algorithm whitelist cannot be confirmed from static analysis.
    An intentional alg:none or HS256 downgrade challenge is likely present given the application''s training purpose.'
  implementation: lib/insecurity.ts:54 (jwt.sign with RS256); lib/insecurity.ts:21 (private key literal); lib/insecurity.ts:52
    (expressJwt middleware)
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHN-001
  assessment: security.isAuthorized() expressJwt is applied to a substantial portion of routes (server.ts:398), but POST /file-upload
    at server.ts:309 is confirmed absent, and POST /rest/memories, POST /api/Feedbacks, and POST /api/Users have authn=unknown.
    At least one state-changing route with unauthenticated access is confirmed. Whether intentional as a training challenge
    or a coverage gap, the mechanism does not enforce a blanket pre-authentication gate.
  implementation: server.ts:398 (middleware mount); server.ts:309 (POST /file-upload — authn=absent confirmed)
- domain: Identity and Authentication Controls
  control: Multi-Factor Authentication (TOTP)
  effectiveness: Adequate
  kind: mechanism
  assessment: routes/2fa.ts uses otplib for TOTP enrollment and verification at routes/2fa.ts:16-17. A dedicated 2FA route
    exists and the library implements RFC 6238 correctly. Trust boundary tb-2 confirms the verification path. 2FA bypass challenges
    may be intentional training features.
  implementation: routes/2fa.ts:16 (otplib TOTP verifier)
- domain: Identity and Authentication Controls
  control: Password-Based Authentication and Storage
  effectiveness: Weak
