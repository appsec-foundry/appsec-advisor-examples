tier_root_causes:
  edge:
  - Authorization and credentials placed in browser code the user controls
  - Untrusted route input bound as trusted HTML via sanitizer bypass
  - Bearer session token kept in script-readable browser storage
  - OAuth callback accepts tokens without per-request state binding
  server:
  - Request input concatenated into SQL, NoSQL, template and eval interpreters
  - Client-supplied owner, author, role and IP fields trusted over session
  - Routes and generated REST endpoints lack default-deny authorization
  - Hardcoded signing/HMAC keys with weak hashing and unpinned JWT algorithms
  - Unpinned, unsigned build inputs run with inherited write-scoped tokens
  data:
  - Seed data ships static passwords, TOTP secrets and security answers
  - Seed passwords generated with non-cryptographic short randomness
  - Seeded records embed raw identifiers and HTML without output hardening
  - Seeding error paths log sensitive field values
