  primary_actor: ACT-D-06
  remediation:
    effort: Medium
    steps:
    - 'In release.yml, install sigstore/cosign-installer (SHA-pinned) and add a post-push signing step after each docker/build-push-action: `cosign sign --key env://COSIGN_PRIVATE_KEY <image>@<digest>`, storing COSIGN_PRIVATE_KEY in repository secrets with rotation instructions.'
