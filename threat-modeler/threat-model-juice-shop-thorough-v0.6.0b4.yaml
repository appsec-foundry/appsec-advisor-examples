  control: LLM System Prompt Injection Defense
  effectiveness: Unsafe
  kind: mechanism
  assessment: The system prompt (routes/chat.ts:82-106) includes a CONFIDENTIAL block with a 15% courtesy discount instruction that is protected only by the model's instruction-following behavior. The prompt is tagged as vulnerable (chatbotGreedyInjectionChallenge). User-provided chat messages flow directly into the model context via req.body.messages (chat.ts:191) without sanitization or content-policy filtering, allowing prompt injection to override COUPON POLICY rules.
  implementation: routes/chat.ts:82-106 — buildSystemPrompt() with injected CONFIDENTIAL block; chat.ts:191 — messages = req.body.messages
