abuse_case_analysis:
  status: completed
  reason: null
  cases:
  - id: AC-T-006
    title: Remote Code Execution via Server-Side Injection
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Execute arbitrary code in the application process.
    prerequisite: An input reaches a server-side interpreter / template / eval.
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-003
    blocking_mitigation_ids:
    - M-087
    steps:
    - step: 1
      outcome: Attacker-controlled input is passed to `eval`, a server-side template engine, an unsafe sandbox, or an unsafe
        deserializer.
      verdict: confirmed
      finding_id: F-003
      evidence:
        file: routes/userProfile.ts
        line: 61
      controls_found: []
      unverified: false
  - id: AC-T-003
    title: Privilege Escalation to Admin via JWT Algorithm Confusion
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge an admin-role JWT without knowledge of the signing secret.
    prerequisite: Attacker can obtain any valid JWT issued by the system (e.g. by registering a free account).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-009
    blocking_mitigation_ids:
    - M-079
    - M-092
    steps:
    - step: 1
      outcome: Verifier accepts attacker-chosen `alg` (e.g. `none` or HMAC-with-public-key), allowing token re-signing without
        the secret.
      verdict: confirmed
      finding_id: F-009
      evidence:
        file: lib/insecurity.ts
        line: 52
      controls_found: []
      unverified: false
    - step: 2
      outcome: 'Forged `role: admin` claim is accepted as authoritative because the role is not re-fetched from the database
        per request.'
      verdict: confirmed
      finding_id: null
      evidence:
        file: lib/insecurity.ts
        line: 157
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a public repo, served by an unauthenticated
      route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-024
    - F-009
    blocking_mitigation_ids:
    - M-103
    - M-079
    - M-092
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the source repository or served without authentication.
      verdict: confirmed
      finding_id: F-024
      evidence:
        file: routes/checkKeys.ts
        line: 10
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token signed with it (or the leaked credential)
        is accepted as authentic.
      verdict: confirmed
      finding_id: F-009
      evidence:
        file: lib/insecurity.ts
        line: 52
      controls_found: []
      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-029
    blocking_mitigation_ids:
    - M-084
    - M-107
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so a client-supplied `role` (or `isAdmin`)
        field is written verbatim.
      verdict: confirmed
      finding_id: F-029
      evidence:
        file: models/user.ts
        line: 97
      controls_found: []
      unverified: false
  - id: AC-T-007
    title: Privileged Action via Prompt Injection into a Tool-Calling Model
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Make the model invoke a privileged tool or return data the attacker is not entitled to, using the application's
      own authority.
    prerequisite: Attacker can place text into a conversation, document, or record that the application later sends to a language
      model.
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-041
    - F-026
    blocking_mitigation_ids:
    - M-068
    - M-105
    steps:
    - step: 1
      outcome: The handler builds the prompt by interpolating request or stored text into the same string as the system instructions,
        so attacker text is read as instruction.
      verdict: confirmed
      finding_id: F-041
      evidence:
        file: routes/chat.ts
        line: 191
      controls_found: []
      unverified: false
    - step: 2
      outcome: Tools exposed to the model run with the application's authority; a manipulated model turn therefore performs
        actions the caller could not.
      verdict: confirmed
      finding_id: F-026
      evidence:
        file: routes/chat.ts
        line: 184
      controls_found: []
      unverified: false
  - id: AC-T-001
    title: Account Takeover via XSS + Token Hijacking
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain persistent authenticated access as an arbitrary user without valid credentials.
    prerequisite: Attacker can get markup rendered in a victim's session, through stored content (e.g. feedback, comments,
      profile fields) or a crafted link.
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-001
    - F-068
    - F-069
    blocking_mitigation_ids:
    - M-085
    - M-124
    - M-125
    steps:
    - step: 1
      outcome: Attacker JavaScript executes in the victim's browser session.
      verdict: confirmed
      finding_id: F-001
      evidence:
        file: frontend/src/app/search-result/search-result.component.ts
        line: 143
      controls_found: []
      unverified: false
    - step: 2
      outcome: Token exfiltrated from local/session storage via the Step 1 payload.
      verdict: confirmed
      finding_id: F-068
      evidence:
        file: frontend/src/app/Services/basket.service.ts
        line: 64
      controls_found: []
      unverified: false
    - step: 3
      outcome: Exfiltrated token accepted for a new session; absence of token binding / PKCE removes the last server-side
        revocation opportunity.
      verdict: confirmed
      finding_id: F-069
      evidence:
        file: frontend/src/app/login/login.component.ts
        line: 148
      controls_found: []
      unverified: false
  - id: AC-T-002
    title: Bulk Data Exfiltration via Broken Object Authorization
    source: mandatory
    actor: Internet Attacker — authenticated low-privilege user
    goal: Enumerate and exfiltrate other users' records, then escalate own permissions via unguarded mass assignment.
    prerequisite: Attacker holds a valid, non-privileged user account.
    combined_risk: Critical
    chain_verdict: partially_blocked
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-004
    - F-029
    blocking_mitigation_ids:
    - M-060
    - M-084
    - M-107
    steps:
    - step: 1
      outcome: Attacker enumerates and retrieves records for arbitrary object IDs; no ownership comparison is performed.
      verdict: confirmed
      finding_id: F-004
      evidence:
        file: routes/address.ts
        line: 11
      controls_found: []
      unverified: false
    - step: 2
      outcome: Update endpoint persists an unfiltered `role` (or equivalent) field supplied in the request body.
      verdict: blocked
      finding_id: F-029
      evidence:
        file: models/user.ts
        line: 97
      controls_found:
      - security.denyAll()
      unverified: false
  catalog_evaluated: []
