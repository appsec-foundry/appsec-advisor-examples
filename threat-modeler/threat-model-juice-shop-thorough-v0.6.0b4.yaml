  effort: Medium
  steps:
  - Replace `npm install -g typescript@^6.0.3` at Dockerfile:4 with a pinned exact version (`npm install -g typescript@<exact-version> --ignore-scripts`) and ensure a lockfile is committed before changing Dockerfile:5 to `npm ci --omit=dev --ignore-scripts`; this requires first removing `package-lock=false` from .npmrc and committing both root and frontend lockfiles per T-020.
  - For any dependency that legitimately requires a lifecycle script (e.g., native bindings), document and allow-list it explicitly by running `npm rebuild <package>` in a dedicated subsequent RUN layer rather than permitting all postinstalls globally.
