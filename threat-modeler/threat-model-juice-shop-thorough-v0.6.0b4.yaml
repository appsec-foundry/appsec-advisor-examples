- name: 'External to CI/CD Pipeline: GITHUB_TOKEN scopes and branch protection'
  kind: build
  assumption: Only GitHub identities with repository write access can trigger or approve CI/CD job execution.
  evidence:
  - file: .github/workflows/ci.yml
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: ci-cd-pipeline
  enforcement_point: GITHUB_TOKEN scopes and branch protection
  assumption_legs:
  - leg: validation
    condition: All action references in CI/CD workflows are pinned to a specific commit hash before being executed in the pipeline.
  - leg: authentication
    condition: Only authenticated GitHub identities with repository write or collaborator access can trigger CI/CD job execution.
  - leg: authorization
    condition: GITHUB_TOKEN permissions per workflow are scoped to minimum required operations and prevent untrusted code from publishing artifacts.
  surface: build-pipeline
  transition:
  - operator
  id: tb-2
  assumption_verdict: refuted
security_controls:
- domain: Session and Token Controls
  control: Session Token Validation (JWT Based)
  effectiveness: Unsafe
  kind: mechanism
  assessment: expressJwt RS256 middleware is applied to protected routes (lib/insecurity.ts:52), but the RSA private key used for signing is hardcoded as a string literal in source (lib/insecurity.ts:21). Any repository reader can forge arbitrary JWT tokens, defeating the authentication gate entirely.
  implementation: lib/insecurity.ts:52-54 — isAuthorized() via expressJwt with publicKey; authorize() via jwt.sign with hardcoded privateKey
  rule_id: ARCH-JWT-001
  status_note: Signing key committed to source; JWT authentication is trivially bypassable
  audit_flags:
  - control_name_canonicalised
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  effectiveness: Unsafe
  kind: primitive
  assessment: 'Passwords are hashed with MD5 (lib/insecurity.ts:41). MD5 is not a password-hashing function: it has no work factor, is subject to precomputed rainbow-table attacks, and GPU cracking is trivial. The hashed value is compared directly in the SQL query (routes/login.ts:34).'
  implementation: lib/insecurity.ts:41 — crypto.createHash('md5').update(data).digest('hex')
  status_note: MD5 password hashing; all stored passwords recoverable via rainbow table
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware Coverage
  effectiveness: Weak
  kind: cross-cutting
  assessment: security.isAuthorized() expressJwt middleware is present on many routes, but POST /file-upload has authn=absent (server.ts:309) and multiple state-creating routes including POST /rest/memories and POST /api/Feedbacks have authn=unknown (server.ts:312, 402-408, 420-421). An unauthenticated attacker can upload files and submit feedback.
  implementation: server.ts:356 — security.isAuthorized() applied per-route; absent on server.ts:309
  rule_id: ARCH-AUTHN-001
  status_note: POST /file-upload unauthenticated; several state-changing routes lack authn gate
- domain: Identity and Authentication Controls
  control: TOTP Second-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP 2FA is implemented (routes/2fa.ts:31), but its coverage is limited to accounts that have enrolled a TOTP secret. The primary credential gate (routes/login.ts:34) contains a SQL-injection vulnerability that bypasses both the password check and the 2FA flow.
  implementation: routes/2fa.ts:31 — TOTP verification against totpSecret field
- domain: Identity and Authentication Controls
  control: OAuth Login
  effectiveness: Weak
  kind: mechanism
  assessment: OAuth callback is implemented (frontend/src/app/oauth/oauth.component.ts:30), but uses a derived-password pattern (login.component.ts:148) where the OAuth identity is mapped to a local account via a deterministic password derivation, not a proper linked-identity model. PKCE and state-parameter protections are unverified from repository evidence.
  implementation: frontend/src/app/oauth/oauth.component.ts:30; frontend/src/app/login/login.component.ts:148
- domain: Authorization Controls
  control: Object-Level Authorization / BOLA Prevention
  effectiveness: Weak
  kind: mechanism
  assessment: 'Eight or more object-addressed routes have authz=unknown: GET /rest/basket/:id, PUT/DELETE /api/BasketItems/:id, PUT/DELETE /api/Cards/:id, PUT/DELETE /api/Addresss/:id, PUT/DELETE /api/Recycles/:id (server.ts:371, 389, 390, 426, 429, 440, 441, 450, 451, 603). Authentication middleware is present on most, but ownership checks verifying the resource belongs to the requesting user are not confirmed.'
  implementation: server.ts:371,389,390,426,429,433,440,441,450,451,603 — middleware_present but authz=unknown
  rule_id: ARCH-BOLA-001
  status_note: Object-level ownership checks absent or unconfirmed on basket, card, address, and recycle routes
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: No centralized authorization policy is enforced. Route-by-route approach leaves 18+ sensitive mutation endpoints (PUT wallet balance, PUT order delivery status, PUT product reviews, PATCH reviews) with authz=unknown (server.ts:605, 612-614, 625, 627, 633-634). Any authenticated user may be able to modify resources belonging to other users.
  implementation: server.ts — per-route expressJwt only; no shared ownership-check middleware
  rule_id: ARCH-AUTHZ-001
  status_note: Route-by-route authorization with confirmed gaps on 18+ sensitive methods
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Weak
  kind: surface
  assessment: GET /rest/admin/application-version (server.ts:606) and GET /rest/admin/application-configuration (server.ts:607) have authn=unknown. GET /metrics (server.ts:676, 729) is similarly unprotected, exposing Prometheus metrics including LLM token counters. Codefixes reference the same surface (data/static/codefixes/exposedMetricsChallenge_2.ts:3).
  implementation: server.ts:606, 607, 676, 729 — management routes with authn=unknown
  rule_id: ARCH-MGMT-001
  status_note: /metrics and /rest/admin/* endpoints lack confirmed authentication
- domain: Query Construction and Data Access Controls
  control: Parameterized Database Access (SQL Injection Prevention)
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'The login query directly interpolates req.body.email and the MD5 hash of req.body.password into a raw SQL string (routes/login.ts:34): `SELECT * FROM Users WHERE email = ''${req.body.email}'' ...`. A single-quote payload in the email field bypasses authentication entirely. Sequelize parameterized bindings are used elsewhere, but this critical path is unprotected.'
  implementation: routes/login.ts:34 — models.sequelize.query with template-literal interpolation of req.body.email
  rule_id: ARCH-SQLI-001
  status_note: SQL injection in login query; authentication gate bypassed with crafted email
  audit_flags:
  - control_domain_reclassified_from_Input Handling
- domain: Input Handling
  control: NoSQL Query Sanitization
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'The getProductReviews LLM tool executes a MongoDB $where query with JavaScript execution: `db.reviewsCollection.find({ $where: ''this.product == '' + productId })` (routes/chat.ts:149). productId is derived from model-provided input without validation. The $where operator runs arbitrary JavaScript server-side, creating a NoSQL injection surface reachable through the LLM chat endpoint.'
  implementation: routes/chat.ts:149 — $where JavaScript operator with concatenated model-supplied productId
- domain: Output Encoding and Rendering Controls
  control: Output Encoding / HTML Sanitization (XSS Prevention)
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'Angular''s DomSanitizer.bypassSecurityTrustHtml() is called in 8+ locations: search-result.component.ts:110,143 (product descriptions, search query param), last-login-ip.component.ts:39 (IP from JWT payload), administration.component.ts:73,91 (user email, feedback comment), about.component.ts:119 (feedback comment), track-result.component.ts:48 (order ID), data-export.component.ts:57 (CAPTCHA image). These disable Angular''s built-in XSS prevention for user-controlled content.'
  implementation: frontend/src/app/search-result/search-result.component.ts:110,143 — bypassSecurityTrustHtml on queryParam and product descriptions
  rule_id: ARCH-XSS-001
  status_note: Angular XSS protection bypassed in 8+ components via bypassSecurityTrustHtml
  audit_flags:
  - control_domain_reclassified_from_Input Handling
- domain: Input Boundary Validation Controls
  control: Schema and Allowlist Input Validation
  effectiveness: Weak
  kind: cross-cutting
  assessment: Input handling consists only of ad-hoc string trimming (server.ts:411-413 for registration fields) and URL normalization (server.ts:204, 246). No centralized schema validation middleware (e.g. Joi, express-validator, Zod on API routes) is present. Type, range, and format checks are absent for most endpoints.
  implementation: server.ts:411-413 — req.body.email/password.trim() at registration; no schema validation middleware
  rule_id: ARCH-INPUT-001
  status_note: Only ad-hoc trimming; no schema validation on API inputs
  audit_flags:
  - control_domain_reclassified_from_Input Handling
- domain: Session and Token Controls
  control: Session Token Storage
  effectiveness: Weak
  kind: mechanism
  assessment: JWT tokens are stored in browser localStorage (evidenced by basket.service.ts:64 reading from localStorage). localStorage is accessible to any JavaScript running in the page, making tokens stealable by any XSS payload. No httpOnly cookie is used.
  implementation: frontend/src/app/Services/basket.service.ts:64; frontend/src/app/Services/request.interceptor.ts:13 — JWT read from localStorage
