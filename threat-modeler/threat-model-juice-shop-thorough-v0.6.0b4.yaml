  - file: lib/startup/registerWebsocketEvents.ts
    line: 23
  - file: frontend/src/app/Services/socket-io.service.ts
    line: 22
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth-service
  assumption_legs:
