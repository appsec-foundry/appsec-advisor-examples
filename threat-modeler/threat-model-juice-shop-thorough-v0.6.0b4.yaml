- name: 'Internet to API: security.isAuthorized() expressJwt middleware'
  kind: network
  assumption: Every state-changing route is registered behind security.isAuthorized() expressJwt middleware.
  evidence:
  - file: lib/insecurity.ts
    line: 52
  - file: server.ts
    line: 309
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: api-server
  enforcement_point: security.isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is validated for type and format before it reaches route handler logic.
  - leg: authentication
    condition: Every state-changing route is registered behind security.isAuthorized() expressJwt middleware.
  - leg: authorization
    condition: Every object reference is checked against the authenticated subject's identity before access is granted.
  surface: network
  transition: []
  id: tb-1
  assumption_verdict: refuted
- name: 'Internet to Auth Surface: login.ts credential check and jwt.sign'
  kind: identity
  assumption: A session JWT is issued only after credential verification succeeds and the TOTP second factor is verified when
    enrolled.
  evidence:
  - file: routes/login.ts
    line: 34
  - file: lib/insecurity.ts
    line: 54
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth
  enforcement_point: routes/login.ts credential check and jwt.sign issuance
  assumption_legs:
  - leg: validation
    condition: Credential inputs are validated for presence and format before the database lookup executes.
  - leg: authentication
    condition: A session JWT is issued only after credential verification succeeds and TOTP is verified when enrolled.
  - leg: authorization
    condition: Only an active user whose credentials match yields a JWT; deleted or inactive accounts are excluded.
  surface: network
  transition:
  - identity
  id: tb-3
  assumption_verdict: unconfirmed
