- name: 'External to API Backend: security.isAuthorized() expressJwt'
  kind: network
  assumption: Every protected route is wrapped with security.isAuthorized() before handling requests that access user data.
  evidence:
  - file: server.ts
    line: 356
  - file: lib/insecurity.ts
    line: 52
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: api-backend
  enforcement_point: security.isAuthorized() expressJwt
  assumption_legs:
  - leg: validation
    condition: Every request body, URL parameter, and query string is validated for type and range before reaching route business logic.
  - leg: authentication
    condition: Every protected route is wrapped with security.isAuthorized() expressJwt, which rejects requests without a valid RS256-signed JWT.
  - leg: authorization
    condition: Every object reference is resolved against the authenticated user's identity before the operation is executed.
