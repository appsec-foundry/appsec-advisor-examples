  control: LLM Tool Authorization and Parameter Binding
  effectiveness: Weak
  kind: mechanism
  assessment: The generateCoupon tool accepts a discount parameter constrained only by a Zod schema description ('maximum 10') and a model-instruction rule (routes/chat.ts:178-179). No server-side enforcement caps the discount value before coupon generation. An attacker who can inject a tool-call payload bypasses the 10% cap entirely. The getOrderById tool checks ownership (chat.ts:159-169), providing a positive model.
  implementation: routes/chat.ts:176-187 — generateCoupon tool; discount validation via Zod description only, not numeric max constraint
