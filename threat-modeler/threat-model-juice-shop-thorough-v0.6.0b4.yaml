tier_root_causes:
  edge:
  - Untrusted strings rendered as HTML via sanitizer bypass and document.write
  - Auth decisions and credentials derived in browser code, not by the server
  - Bearer token held in script-readable browser storage
  - OAuth implicit flow accepts fragment tokens without state binding
  server:
  - Request input concatenated into SQL, NoSQL, eval and template source
  - Identity and ownership taken from request fields, not the verified session
  - Committed key material and JWT verification without pinned algorithms
  - Routes and sockets registered without default-deny auth or resource bounds
  - Unpinned dependencies, actions and images run with broad CI token scope
  data:
  - Seed account credentials and TOTP secrets stored as cleartext in source data
cross_repo_dependencies: []
