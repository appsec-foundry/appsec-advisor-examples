security_controls:
- domain: Session and Token Controls
  control: JWT Signing and Verification
  effectiveness: Unsafe
  kind: mechanism
  assessment: RS256 algorithm is correctly selected at lib/insecurity.ts:54 and verification uses the RSA public key. However,
    the complete RSA private key is hardcoded as a string literal at lib/insecurity.ts:21, making it publicly known to anyone
    with source access. Additionally, expressJwt at lib/insecurity.ts:52 is called without an explicit algorithms allowlist,
    leaving algorithm negotiation to library defaults.
  implementation: lib/insecurity.ts:21 (hardcoded private key), lib/insecurity.ts:52 (expressJwt verification), lib/insecurity.ts:54
    (jwt.sign with algorithm RS256)
  rule_id: ARCH-JWT-001
  status_note: JWT private key publicly exposed in source; arbitrary token forgery possible.
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  effectiveness: Unsafe
  kind: primitive
