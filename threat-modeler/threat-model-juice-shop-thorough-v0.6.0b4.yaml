verdict:
  severity: red
  opening: Juice Shop is an intentionally vulnerable training application; attackers can take over any account, execute code
    on the server, or self-assign the administrator role. Acceptable only in an isolated training environment — every component
    is a teaching artefact and must never hold real credentials or user data.
  bullets:
  - title: Admin access via SQL injection
    body: SQL injection on the login and search endpoints lets any anonymous visitor authenticate as admin or read arbitrary
      database rows.
    findings:
    - F-002
    - F-003
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server code execution via stored username
    body: A registered user stores a script in their display name; the server evaluates it with database and host filesystem
      access.
    findings:
    - F-004
    weaknesses:
    - W-001
    verified_attack_path: true
  - title: Any user's records accessed without consent
    body: Insecure direct object reference lets a signed-in user swap any account ID into ownership fields and read or change
      another's data.
    findings:
    - F-005
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Self-registration as administrator
    body: Mass assignment on the registration form lets any visitor supply their own role value and create an admin account
      on arrival.
    findings:
    - F-036
    weaknesses: []
    verified_attack_path: true
  - title: Session credential forged from public repository
    body: The signing key committed to the repository lets any reader mint a valid session token for any account, including
      admin.
    findings:
    - F-006
    weaknesses:
    - W-008
    verified_attack_path: false
  - title: Persistent script injection via archive upload
    body: A crafted archive upload overwrites any file in the application directory, planting persistent scripts that run
      for every visitor.
    findings:
    - F-014
    weaknesses:
    - W-004
    verified_attack_path: false
  closing: The defects are intentional teaching artefacts; the platform must remain isolated and must never hold real credentials
    or personal data.
  business_context_note: 'Declared business impact: no material harm for the application under the stated use-case assumptions;
    it does not extend to the build and delivery pipeline (CI/CD Pipeline). Finding severities and the verdict retain their
    technical security concern levels; evidence of consequences outside those assumptions still requires review.'
