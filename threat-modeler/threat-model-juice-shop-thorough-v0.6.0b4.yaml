verdict:
  severity: red
  opening: An intentionally vulnerable web application for security training and CTF use, where attackers reach administrator
    takeover, server code execution, and a full database dump. Acceptable only as an isolated training target; it must never
    hold real data or be reachable outside a training network.
  bullets:
  - title: Administrator login without a password
    body: SQL injection in the login form lets an unauthenticated attacker sign in as any account, including the administrator.
    findings:
    - F-002
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Forged sessions for any account
    body: Weak token signature checking lets an unauthenticated attacker impersonate users and pass role checks.
    findings:
    - F-009
    weaknesses: []
    verified_attack_path: true
  - title: Self-registration as administrator
    body: Mass assignment on account registration lets a new visitor choose an administrator or accounting role for their
      own account.
    findings:
    - F-029
    weaknesses: []
    verified_attack_path: true
  - title: Server takeover through stored code
    body: A stored username is run as code on the profile page, so a signed-in attacker executes commands on the server.
    findings:
    - F-003
    weaknesses:
    - W-001
    verified_attack_path: true
  - title: Full database readable by anonymous users
    body: SQL injection in product search lets unauthenticated callers dump user credentials and payment data.
    findings:
    - F-005
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Another customer's records read and changed
    body: Missing ownership checks (IDOR) let any signed-in customer read and change other customers' records by swapping
      an account ID.
    findings:
    - F-004
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Wallet signing key exposed in source
    body: A hard-coded wallet recovery phrase in the source lets anyone who can read the repository sign transactions as that
      wallet.
    findings:
    - F-024
    weaknesses:
    - W-007
    verified_attack_path: true
  closing: Closing the four highest-priority gaps removes the routes to administrator access, the full database, and the server
    process.
  bullets_intro: 'Security concerns behind this assessment:'
  business_context_note: 'Declared business impact: no material harm for the application under the stated use-case assumptions.
    Finding severities and the verdict retain their technical security concern levels; evidence of consequences outside those
    assumptions still requires review.'
