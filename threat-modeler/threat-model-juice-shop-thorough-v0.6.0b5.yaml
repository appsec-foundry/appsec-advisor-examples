  kind: fix
  priority: P2
  severity: High
  effort: Low
  steps:
  - 'Replace every call to `jwt.decode(token)` and `jws.decode(token)` that produces a payload used for identity or access
    decisions with `jwt.verify(token, publicKey, { algorithms: [''RS256''] })`; catch the thrown error and return 401.'
