tier_root_causes:
  edge:
  - Request-derived strings reach the DOM via trust bypass or document.write
  - Session JWT held in script-readable storage instead of HttpOnly cookie
  - 'Auth decisions made in browser code: role guards, OAuth state, passwords'
  - Credentials compiled into the publicly served JavaScript bundle
  server:
  - Request data concatenated into SQL, NoSQL, eval and template source
  - Identity, role and amounts taken from client fields, not session state
  - Routes registered without authentication or role middleware by default
  - Hardcoded keys, unsalted MD5 and unpinned JWT algorithms in auth crypto
  - Mutable build inputs run under default-scope CI tokens and root images
  data:
  - Sensitive columns persisted in plaintext without encryption or tokenization
