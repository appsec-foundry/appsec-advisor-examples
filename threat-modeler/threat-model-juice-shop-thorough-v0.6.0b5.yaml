security_controls:
- domain: Session and Token Controls
  control: JWT Token Signing Key Management
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: RS256 JWT issuance is implemented at lib/insecurity.ts:54, but the RSA private key is hardcoded as a literal
    in the same file (lib/insecurity.ts:21). Any actor with repository read access can forge valid tokens for any user identity,
    defeating the JWT authentication guarantee across every protected route.
  implementation: lib/insecurity.ts:21 (RSA private key literal), lib/insecurity.ts:54 (jwt.sign RS256)
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  effectiveness: Unsafe
  kind: mechanism
  assessment: Passwords are stored as unsalted MD5 hashes (lib/insecurity.ts:42). MD5 without a per-user salt is reversible
    via precomputed rainbow tables for common passwords, exposing all stored user credentials on a single database read.
  implementation: lib/insecurity.ts:42
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: isAuthorized() expressJwt is present on many routes (lib/insecurity.ts:52, server.ts:356) but POST /file-upload
    (server.ts:309) carries authn=absent in the architecture scan and several state-changing routes show authn=unknown. Unauthenticated
    file upload allows any actor to exercise server-side upload logic without a valid identity.
  implementation: lib/insecurity.ts:52, server.ts:356 (present); server.ts:309 (absent)
- domain: Identity and Authentication Controls
  control: TOTP Two-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP 2FA is implemented at routes/2fa.ts:31 as a functional training target. The mechanism provides real TOTP
    verification but its protection is undermined by the hardcoded JWT signing key, which allows an attacker to forge tokens
    that bypass the 2FA gate entirely.
  implementation: routes/2fa.ts:31
- domain: Identity and Authentication Controls
  control: Password Reset via Security Question
  effectiveness: Weak
  kind: mechanism
  assessment: Account recovery uses knowledge-based security questions (routes/resetPassword.ts). Security question answers
    are frequently guessable from public information or social engineering, making this an intentionally weak recovery factor
    for training purposes.
  implementation: routes/resetPassword.ts
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHZ-001
  assessment: Multiple sensitive mutation routes — DELETE /api/Products/:id (server.ts:371), PUT and DELETE /api/Recycles/:id
    (server.ts:389-390), PUT /api/BasketItems/:id (server.ts:426), PUT/DELETE /api/Cards/:id (server.ts:440-441), PUT/DELETE
    /api/Addresss/:id (server.ts:450-451) — carry authz=unknown in the architecture scan. No centralized authorization framework
    is evidenced; route handlers implement ad-hoc or absent ownership checks.
  implementation: server.ts:371-451 (routes without verified authz)
- domain: Authorization Controls
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: Authenticated routes including GET /rest/basket/:id (server.ts:603), PUT /api/Cards/:id (server.ts:440), and
    DELETE /api/Addresss/:id (server.ts:451) have authentication middleware present but authz=unknown, indicating the route
    handler does not verify the addressed object belongs to the authenticated caller.
  implementation: server.ts:603, server.ts:440, server.ts:451 (representative)
- domain: Authorization Controls
  control: Management and Metrics Endpoint Authentication
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: GET /rest/admin/application-version (server.ts:606), GET /rest/admin/application-configuration (server.ts:607),
    and GET /metrics (server.ts:676) expose internal configuration data and Prometheus-format metrics. Authentication status
    is unknown from static analysis; no confirmed auth gate was detected at these routes.
  implementation: server.ts:606-607, server.ts:676
- domain: Input Boundary Validation Controls
  control: Schema and Allowlist Input Validation
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-INPUT-001
  assessment: Input handling is limited to whitespace trimming on registration fields (server.ts:411-413) and URL path normalization
    (server.ts:204). No JSON schema validation library is evidenced in the route pipeline; type, range, and allowlist enforcement
    are absent for most endpoints.
  implementation: server.ts:204, server.ts:411-413
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: Input Handling Controls
  control: SQL Injection Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: The login route (routes/login.ts:34) performs credential lookup via raw SQL string construction rather than
    parameterized queries, enabling authentication bypass by injection. This is an intentional training vulnerability that
    violates the parameterized-binding assumption stated in trust boundary tb-9. Sequelize parameterized queries are used
    for other routes (models/index.ts:34).
  implementation: routes/login.ts:34 (raw SQL injection sink), models/index.ts:34 (Sequelize parameterized elsewhere)
- domain: Output Encoding and Rendering Controls
  control: Output Encoding and XSS Prevention
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: 'Angular''s DomSanitizer is explicitly bypassed via bypassSecurityTrustHtml in at least eight component locations:
    about.component.ts:119, last-login-ip.component.ts:39, administration.component.ts:73,91, data-export.component.ts:57,
    search-result.component.ts:110,143, and track-result.component.ts:48. These are confirmed DOM-XSS sinks used as training
    challenge targets.'
  implementation: frontend/src/app/search-result/search-result.component.ts:110,143; frontend/src/app/about/about.component.ts:119
    (representative)
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: File Parser and Outbound Request Controls
  control: XML External Entity (XXE) Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: XML parsing is performed at lib/xml.ts:35. No evidence of XXE-safe parser configuration (disabling DOCTYPE declarations
    or external entity resolution) was found at the evidenced location. The component description identifies XML parsing as
    an intentional vulnerability sink.
  implementation: lib/xml.ts:35
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: Input Boundary Validation Controls
  control: Server-Side Code Execution Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: routes/b2bOrder.ts:23 contains a code-evaluation sink that processes attacker-controlled B2B order input. This
    is an intentional Remote Code Execution training target with no sandbox or safe execution environment.
  implementation: routes/b2bOrder.ts:23
  audit_flags:
  - control_domain_from_domain_text
- domain: File Parser and Outbound Request Controls
  control: Server-Side Request Forgery (SSRF) Prevention
  effectiveness: Unsafe
