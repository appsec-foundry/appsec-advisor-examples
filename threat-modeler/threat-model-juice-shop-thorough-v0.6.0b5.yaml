      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-007
    blocking_mitigation_ids:
    - M-096
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so a client-supplied `role` (or `isAdmin`)
        field is written verbatim.
      verdict: confirmed
      finding_id: F-007
      evidence:
        file: server.ts
        line: 501
      controls_found: []
      unverified: false
  - id: AC-T-102
    title: User gains more rights than intended
    source: descriptive
    actor: attacker
    goal: ''
    prerequisite: ''
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-007
    blocking_mitigation_ids:
    - M-096
    steps:
    - step: 1
      outcome: Check whether a user can give themselves or others a role or permission beyond what their own role or delegation
        allows.
      verdict: confirmed
      finding_id: F-007
      evidence:
        file: server.ts
        line: 484
      controls_found: []
      unverified: false
    open_questions:
    - Which roles may each administrator tier assign?
  - id: AC-T-107
    title: User misuses a privileged function for another purpose
    source: descriptive
    actor: attacker
    goal: ''
    prerequisite: ''
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-007
    blocking_mitigation_ids:
    - M-096
    steps:
    - step: 1
      outcome: Check whether a user can make a privileged function, such as support impersonation, an administrative action,
        or a background job, act on resources or perform operations outside that user's own authority.
      verdict: confirmed
      finding_id: F-007
      evidence:
        file: server.ts
        line: 484
      controls_found: []
      unverified: false
    open_questions:
    - Which operations may support staff perform while acting as a customer?
  - id: AC-T-003
    title: Privilege Escalation to Admin via JWT Algorithm Confusion
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge an admin-role JWT without knowledge of the signing secret.
    prerequisite: Attacker can obtain any valid JWT issued by the system (e.g. by registering a free account).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-010
    blocking_mitigation_ids:
    - M-098
    steps:
    - step: 1
      outcome: Verifier accepts attacker-chosen `alg` (e.g. `none` or HMAC-with-public-key), allowing token re-signing without
        the secret.
      verdict: confirmed
      finding_id: F-010
      evidence:
        file: lib/insecurity.ts
        line: 52
      controls_found: []
      unverified: false
    - step: 2
      outcome: 'Forged `role: admin` claim is accepted as authoritative because the role is not re-fetched from the database
        per request.'
      verdict: confirmed
      finding_id: null
      evidence:
        file: lib/insecurity.ts
        line: 157
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a public repo, served by an unauthenticated
      route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-008
    - F-010
    blocking_mitigation_ids:
    - M-097
    - M-098
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the source repository or served without authentication.
      verdict: confirmed
      finding_id: F-008
      evidence:
        file: lib/insecurity.ts
        line: 21
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token signed with it (or the leaked credential)
        is accepted as authentic.
      verdict: confirmed
      finding_id: F-010
      evidence:
        file: lib/insecurity.ts
        line: 52
      controls_found: []
      unverified: false
  - id: AC-T-007
    title: Privileged Action via Prompt Injection into a Tool-Calling Model
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Make the model invoke a privileged tool or return data the attacker is not entitled to, using the application's
      own authority.
    prerequisite: Attacker can place text into a conversation, document, or record that the application later sends to a language
      model.
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-042
    - F-032
    blocking_mitigation_ids:
    - M-121
    - M-075
    - M-087
    steps:
    - step: 1
      outcome: The handler builds the prompt by interpolating request or stored text into the same string as the system instructions,
        so attacker text is read as instruction.
      verdict: confirmed
      finding_id: F-042
      evidence:
        file: routes/chat.ts
