trust_boundaries:
- name: 'Internet to REST API: isAuthorized() expressJwt'
  kind: network
  assumption: Every protected route registers isAuthorized() expressJwt in its middleware chain, rejecting tokens not signed
    with the server public key.
  evidence:
  - file: lib/insecurity.ts
    line: 52
  - file: server.ts
    line: 356
  - file: routes/login.ts
    line: 34
  - file: server.ts
    line: 596
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: juice-shop-api
  enforcement_point: isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is schema-validated before it reaches route handler logic.
  - leg: authentication
    condition: Every protected route registers isAuthorized() expressJwt in its middleware chain, rejecting tokens not signed
      with the RS256 public key.
  - leg: authorization
    condition: Every resource reference is checked against the authenticated user's id and role before access is granted.
  surface: network
  transition: []
  covers_components:
