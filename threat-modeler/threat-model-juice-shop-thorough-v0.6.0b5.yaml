- id: M-069
  title: Parameterize the product search query in routes/search.ts
  threat_ids:
  - T-004
  kind: fix
  priority: P1
  severity: Critical
  effort: Low
  steps:
  - 'Replace the template literal in `models.sequelize.query(...)` with a named-placeholder form: `models.sequelize.query(''SELECT
    * FROM Products WHERE ((name LIKE :q OR description LIKE :q) AND deletedAt IS NULL) ORDER BY name'', { replacements: {
    q: ''%'' + criteria + ''%'' }, type: models.sequelize.QueryTypes.SELECT })`.'
  - Remove the 200-character truncation guard; parameterized binding makes length truncation irrelevant for injection prevention.
  - Add an API test sending `q=') UNION SELECT 1,2,3,4,5,6,7,8,9--` and asserting the response contains only valid product
    rows with no injected columns.
  verification: GET /rest/products/search?q=') OR 1=1-- returns an empty result or only products matching the literal string,
    with no extra rows from other tables.
  file: routes/search.ts:23
- id: M-070
