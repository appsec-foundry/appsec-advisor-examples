verdict:
  severity: red
  opening: Juice Shop is an intentionally vulnerable e-commerce training application — every finding is a designed challenge, not an accidental defect. Acceptable only as an isolated training target; it must never hold real user data or be reachable outside a closed training network.
  bullets:
  - title: Server-side code execution
    body: A stored username containing JavaScript runs on the server, giving full access to the host filesystem and database.
    findings:
    - F-003
    weaknesses:
    - W-001
    verified_attack_path: true
  - title: Admin login and data theft via SQL injection
    body: Unauthenticated SQL injection on the login and search routes returns admin credentials and arbitrary database rows.
    findings:
    - F-001
    - F-002
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Instant admin account creation
    body: Registration accepts an attacker-supplied role field, so anyone can create an admin account without prior access.
    findings:
    - F-005
    weaknesses: []
    verified_attack_path: true
  - title: Any customer's orders read and changed
    body: Authenticated order and profile routes trust the caller-supplied user ID, exposing every other account.
    findings:
    - F-004
    weaknesses:
    - W-003
    verified_attack_path: true
  closing: All findings are deliberate training challenges. Keep this application isolated from real data and real networks at all times.
  bullets_intro: 'Security concerns behind this assessment:'
  business_context_note: 'Declared business impact: no material harm for the application under the stated use-case assumptions; it does not extend to the build and delivery pipeline (CI/CD Pipeline). Finding severities and the verdict retain their technical security concern levels; evidence of consequences outside those assumptions still requires review.'
