verdict:
  severity: red
  opening: This intentionally vulnerable security-training application has confirmed exploits that reach full server-side
    code execution, admin account takeover, and unrestricted database access. All components are declared non-production training
    assets; deploy only in an isolated lab, free of real user data.
  bullets:
  - title: Account takeover via SQL injection
    body: SQL injection on the login and search routes lets any anonymous visitor bypass authentication or extract the full
      user table.
    findings:
    - F-003
    - F-004
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server takeover via stored script execution
    body: A stored username executed server-side gives any registered user arbitrary code execution over the application process
      and its data.
    findings:
    - F-006
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Admin access for any registrant
    body: Mass assignment at registration lets any visitor include a role field and self-assign an administrator account.
    findings:
    - F-007
    weaknesses: []
    verified_attack_path: true
  - title: Any-account impersonation via committed signing key
    body: The authentication signing key committed to the repository and unenforced algorithm checks let any caller forge
      credentials for any account.
    findings:
    - F-008
    - F-010
    weaknesses:
    - W-007
    verified_attack_path: true
  - title: Customer records read and changed by any user
    body: Missing ownership checks let a signed-in attacker place another user's ID into request fields and read or modify
      their records.
    findings:
    - F-005
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Instance shutdown via single malformed input
    body: A single malformed upload to the real-time channel stalls the server and makes the training instance unresponsive
      for all users.
    findings:
    - F-031
    weaknesses: []
    verified_attack_path: false
  closing: These training defects give participants a wide range of exploitable scenarios; isolate every deployment from real
    networks and real user data.
  business_context_note: 'Declared business impact: no material harm for the application under the stated use-case assumptions;
    it does not extend to the build and delivery pipeline (CI/CD Pipeline and Build Infrastructure). Finding severities and
    the verdict retain their technical security concern levels; evidence of consequences outside those assumptions still requires
    review.'
