tier_root_causes:
  edge:
  - Angular sanitizer bypassed on untrusted server and URL data rendered as HTML
  - Bearer session token kept in script-readable browser storage
  - Auth and role decisions made client-side from unverified token or OAuth data
  - Credentials and secrets compiled into the public SPA bundle
  server:
  - 'Untrusted input reaches interpreters: SQL, $where, eval, templates, XML, YAML'
  - Authorization trusts client-supplied identity, fields, or missing route guards
  - JWT trust rests on a hardcoded key, unpinned algorithm, or decode-only checks
  - Full model objects and secrets serialized into responses, tokens, and logs
  - Mutable, unverified CI dependencies and actions run with broad token scope
  data:
  - Sensitive payment fields persisted without field-level encryption
cross_repo_dependencies: []
weaknesses:
- id: W-001
  weakness_class: injection
  kind: implementation
  title: Application data crosses into executable code
  statement: An interpreter evaluates application values as code. The affected path mixes data processing with executable program construction instead of constraining callers to predefined operations.
  severity: Critical
  severity_basis: confirmed
  observable_backing:
    practice_evidence:
    - file: routes/userProfile.ts
      line: 61
      id: T-003
  mechanism_id: application-data-as-code
  affected_components:
  - express-api
  instances:
  - id: T-003
    file: routes/userProfile.ts
    line: 61
    basis: confirmed-exploitable
  description: An interpreter evaluates application values as code. The affected path mixes data processing with executable program construction instead of constraining callers to predefined operations.
  structural_recommendation: replace evaluation of application values with a data parser or a fixed set of operations whose arguments remain data
- id: W-002
  weakness_class: injection
  kind: design
  title: Database access relies on concatenated queries
  statement: Parameterized Database Access is not consistently enforced.
  severity: Critical
  severity_basis: confirmed
  observable_backing:
    absent_control_signal:
    - Parameterized Queries
    - ORM / Repository Layer
    - file: routes/vulnCodeSnippet.ts
      line: 46
      signal: 'res.status(404).json({ status: ''error'', error: `No code challenge for challenge key: ${req.params.challenge}` })'
    practice_evidence:
    - file: routes/login.ts
      line: 34
    - file: routes/search.ts
      line: 23
  mechanism_id: database-query-concatenation
  affected_components:
  - auth
  - express-api
  implementation_strategy: standard-misused
  instances:
  - id: T-001
    file: routes/login.ts
    line: 34
    basis: confirmed-exploitable
  - id: T-002
    file: routes/search.ts
    line: 23
    basis: confirmed-exploitable
  description: Database queries are assembled from application values instead of passing those values through an enforced parameterised data-access path. This leaves every call site responsible for preserving query structure.
  structural_recommendation: provide one parameterised repository or query-builder path and prohibit application-value interpolation in database queries
