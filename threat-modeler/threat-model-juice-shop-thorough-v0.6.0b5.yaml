security_controls:
- domain: Session and Token Controls
  control: Session Token Issuance (JWT Based)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: RS256 signing is configured at lib/insecurity.ts:54. However, the RSA private key is a hardcoded literal at lib/insecurity.ts:21, committed to version control; any reader of source history can forge tokens. The verification path uses expressJwt 0.1.3 (pre-algorithm-pinning era) with only the public key supplied — no algorithm restriction in the expressJwt config prevents algorithm confusion (e.g., 'none' or HS256 with the public key as HMAC secret). jsonwebtoken 0.4.0 predates the 2022 CVEs but lacks modern safeguards.
  implementation: lib/insecurity.ts:21 (private key literal), lib/insecurity.ts:52-54 (isAuthorized, authorize), package.json:express-jwt@0.1.3, package.json:jsonwebtoken@0.4.0
  audit_flags:
  - control_name_canonicalised
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Password-Based Login
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'The login query at routes/login.ts:34 builds raw SQL via string template interpolation: SELECT * FROM Users WHERE email = ''${req.body.email}'' ... . An attacker can inject SQL to bypass the password check entirely or enumerate all user records. The password field is pre-hashed with MD5 (lib/insecurity.ts:41) before comparison, which does not mitigate injection.'
  implementation: routes/login.ts:34 (raw SQL with interpolated email and password fields)
- domain: Identity and Authentication Controls
  control: TOTP Second-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: TOTP verification is implemented at routes/2fa.ts with a short-lived tmpToken flow. Enrollment appears optional; users without a totpSecret bypass 2FA silently (routes/login.ts:37 checks totpSecret !== ''). The 2FA gate is only meaningful when enrollment is enforced.
  implementation: routes/2fa.ts:16, routes/login.ts:37-46
- domain: Authorization Controls
  control: Route Authentication Middleware
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: security.isAuthorized() (expressJwt wrapper) is applied to many protected routes per server.ts:356. However, POST /file-upload at server.ts:309 is registered without this middleware (authn=absent). Several other state-changing routes have authn=unknown, indicating the middleware coverage is not verified to be complete.
  implementation: lib/insecurity.ts:52 (isAuthorized), server.ts:356 (middleware application), server.ts:309 (file-upload — authn absent)
- domain: Authorization Controls
  control: Object-Level Ownership Checks (BOLA)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: JWT middleware is present on basket, card, address, and product mutation routes (authn=middleware_present) but no ownership check verifying that the authenticated subject owns the addressed resource ID has been detected. Routes such as GET /rest/basket/:id (server.ts:603) and PUT /api/Cards/:id (server.ts:440) accept any authenticated token regardless of the token's UserId claim.
  implementation: server.ts:371,389,390,426,429,433,440,441,450,451,603,625
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHZ-001
  assessment: No centralized authorization framework (RBAC/ABAC policy engine) exists. Authorization is implemented per-route if at all; 18+ sensitive method registrations in server.ts carry authz=unknown (lines 371,389,390,426,429,433,440,441,450,451,605,612,613,614,625,627,633,634). Admin operations do not have a verified isAdmin claim check.
  implementation: server.ts (multiple lines per architecture coverage ARCH-AUTHZ-001 signals)
- domain: Authorization Controls
  control: Management Endpoint Access Control
  effectiveness: Weak
  kind: surface
  rule_id: ARCH-MGMT-001
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration (server.ts:606-607) as well as GET /metrics (server.ts:676,729) have authn=unknown in the architecture scan. The Prometheus metrics endpoint exposes process, memory, and request statistics to unauthenticated callers.
  implementation: server.ts:606,607,676,729
- domain: Authorization Controls
  control: Database Principal Separation
  effectiveness: Missing
  kind: lifecycle
  rule_id: ARCH-DBSEP-001
  assessment: A single SQLite connection via Sequelize handles all read and write operations including administrative seed data creation, user record management, and order processing. There is no read-only or scoped connection pool for unprivileged queries. An injection that reaches this connection can read or modify any table.
  implementation: models/index.ts (single Sequelize instance shared across all routes)
- domain: Input Boundary Validation Controls
  control: Centralized Input Schema Validation
  effectiveness: Partial
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: Only whitespace trimming is applied at the entry point (server.ts:411-413 for email/password). No JSON schema validator, Zod, Joi, or similar allowlist-based framework has been detected. Type and range checks are absent on the majority of API request fields, leaving downstream handlers to handle raw attacker-controlled input.
  implementation: server.ts:411-413 (trim only), no schema validator library detected in package.json
  audit_flags:
  - control_domain_reclassified_from_Input Validation and Injection Prevention
- domain: Query Construction and Data Access Controls
  control: Parameterized Database Queries (SQLite / Sequelize)
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'Sequelize ORM is used for most queries and provides implicit parameterization. The login path bypasses this: models.sequelize.query() at routes/login.ts:34 constructs a raw SQL string using template literals with req.body.email and req.body.password (MD5-hashed but attacker-controlled before hashing) directly interpolated. This is an unconditional SQL injection sink.'
  implementation: routes/login.ts:34 (raw SQL injection sink), models/index.ts:33 (Sequelize baseline for other routes)
  audit_flags:
  - control_domain_reclassified_from_Input Validation and Injection Prevention
- domain: Input Validation and Injection Prevention
  control: Document Query Construction (MarsDB)
  effectiveness: Unsafe
  kind: mechanism
  assessment: routes/showProductReviews.ts:36 builds a MarsDB $where expression via string concatenation with user-supplied input. MarsDB evaluates $where as JavaScript, so an attacker who controls this value can execute arbitrary JS in the query engine context.
  implementation: routes/showProductReviews.ts:36 (NoSQL injection sink via $where)
- domain: Output Encoding and Rendering Controls
  control: Angular Output Encoding (DomSanitizer)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: 'Angular''s DomSanitizer.bypassSecurityTrustHtml() disables the framework''s built-in HTML escaping. It is called with attacker-reachable data in 8 components: search-result (search query and product description), about (feedback comments), last-login-ip (IP address from JWT claim), administration (user email, feedback), data-export (CAPTCHA image), and track-result (order ID). These are confirmed stored and reflected XSS sinks.'
  implementation: frontend/src/app/search-result/search-result.component.ts:110,143; about/about.component.ts:119; last-login-ip/last-login-ip.component.ts:39; administration/administration.component.ts:73,91; data-export/data-export.component.ts:57; track-result/track-result.component.ts:48
  audit_flags:
  - control_domain_reclassified_from_Input Validation and Injection Prevention
- domain: File Parser and Outbound Request Controls
  control: XML External Entity (XXE) Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: lib/xml.ts:35 parses XML with ParseOption.XML_PARSE_NOENT and XML_PARSE_DTDLOAD explicitly enabled, making the parser resolve external entities. The comment at line 29 confirms this is intentional for challenge purposes. An attacker submitting a crafted XML body can read arbitrary server-side files reachable by the process.
  implementation: lib/xml.ts:29-35 (intentional XXE, XML_PARSE_NOENT|XML_PARSE_DTDLOAD)
  audit_flags:
  - control_domain_reclassified_from_Input Validation and Injection Prevention
- domain: Session and Token Controls
  control: JWT Client Storage and Theft Resistance
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: The JWT is written to localStorage at frontend/src/app/login/login.component.ts:101 (localStorage.setItem('token', ...)). localStorage is readable by any same-origin JavaScript, making the token unconditionally extractable via any XSS payload. There is no HttpOnly cookie path.
  implementation: frontend/src/app/login/login.component.ts:101 (localStorage.setItem), frontend/src/app/Services/request.interceptor.ts:16 (reads token from localStorage for Authorization header)
  audit_flags:
  - control_domain_reclassified_from_Session and Token Management
- domain: Session and Token Controls
  control: JWT Algorithm Whitelisting
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: expressJwt at lib/insecurity.ts:52 is initialized with only the publicKey as secret — no algorithms restriction is passed. With jsonwebtoken 0.4.0, an attacker who knows the public key can attempt an HS256 confusion attack using the public key as the HMAC secret. The library version predates the CVE-2022-23529 fix.
  implementation: 'lib/insecurity.ts:52 (expressJwt({secret: publicKey}) — no algorithm option)'
  audit_flags:
  - control_domain_reclassified_from_Session and Token Management
- domain: Session and Token Controls
  control: Server-Side Token Revocation
  effectiveness: Weak
  kind: mechanism
  assessment: Issued JWTs are tracked in an in-memory tokenMap (lib/insecurity.ts:70-77). This map is lost on process restart with no persistent revocation store. A stolen token with 6 hours of remaining validity cannot be revoked across a restart, and horizontal scaling would leave separate maps per instance.
  implementation: lib/insecurity.ts:70-90 (authenticatedUsers.tokenMap in-memory store)
  audit_flags:
  - control_domain_reclassified_from_Session and Token Management
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing Algorithm
  effectiveness: Unsafe
  kind: primitive
  assessment: 'lib/insecurity.ts:41 hashes passwords with MD5 (no salt): crypto.createHash(''md5'').update(data).digest(''hex''). MD5 is a fast, non-salted hash; precomputed rainbow tables covering common passwords defeat it. A database dump of the Users table immediately exposes most credentials.'
  implementation: lib/insecurity.ts:41 (hash = (data) => crypto.createHash('md5')...)
  audit_flags:
  - control_domain_reclassified_from_Cryptography and Secrets
- domain: Session and Token Controls
  control: JWT Signing Key Management
  effectiveness: Unsafe
  kind: lifecycle
  rule_id: ARCH-SECRET-001
  assessment: The RSA private key used to sign all JWTs is a hardcoded literal string at lib/insecurity.ts:21 and is committed to version control. Any person with repository read access can forge valid signed JWTs. Key rotation requires a code change and redeployment; there is no mechanism to invalidate existing tokens after rotation.
  implementation: lib/insecurity.ts:21 (private key literal in source), encryptionkeys/jwt.pub (public key on disk)
  audit_flags:
  - control_domain_reclassified_from_Cryptography and Secrets
- domain: Cryptography Secrets and Data Protection
  control: Secrets and Credentials in Source Code
  effectiveness: Unsafe
  kind: lifecycle
  rule_id: ARCH-SECRET-001
  assessment: 'Three high-entropy secrets are committed to source: the RSA private key (lib/insecurity.ts:21), the HMAC key ''pa4qacea4VK9t9nGv7yZtwmj'' (lib/insecurity.ts:42), and a BIP39 mnemonic phrase (routes/checkKeys.ts:10). These values are present in git history and cannot be removed by patching source alone without rewriting history.'
  implementation: lib/insecurity.ts:21 (RSA private key), lib/insecurity.ts:42 (HMAC hardcoded key), routes/checkKeys.ts:10 (BIP39 mnemonic)
  audit_flags:
  - control_domain_from_catalog
- domain: Cryptography Secrets and Data Protection
  control: HTTPS / TLS Termination
  effectiveness: Partial
  kind: surface
  rule_id: ARCH-TLS-001
  assessment: No TLS configuration is present in the repository source. The application listens on plain HTTP. Whether TLS is terminated at a reverse proxy or load balancer cannot be determined from repository evidence alone. SQLite and MarsDB are embedded in-process, so no database transport TLS applies.
  implementation: No TLS configuration in server.ts or Dockerfile; deployment-dependent
  audit_flags:
  - control_domain_from_catalog
- domain: Authorization Controls
  control: Prometheus Metrics Endpoint Access Control
  effectiveness: Weak
  kind: surface
  rule_id: ARCH-MGMT-001
  assessment: GET /metrics is registered without authentication middleware at server.ts:676 and 729. The endpoint exposes process-level metrics (CPU, memory, HTTP request rates) to anonymous callers. This aids reconnaissance for timing attacks and resource exhaustion.
  implementation: server.ts:676,729
  audit_flags:
  - control_domain_from_catalog
- domain: Operations Runtime and Supply Chain Controls
  control: Security Event Logging
  effectiveness: Partial
  kind: cross-cutting
  assessment: The application records challenge-solve events and login attempts as part of the gamification system. Structured security event logging (failed auth attempts, access-control violations, injection attempts) to an external sink has not been confirmed. IP tracking at routes/saveLoginIp.ts is present but scoped to challenge detection, not security monitoring.
  implementation: routes/saveLoginIp.ts (login IP for challenges), lib/challengeUtils.ts (challenge events)
  audit_flags:
  - control_domain_from_catalog
- domain: Dependency and Supply Chain
  control: Authentication Library Currency
  effectiveness: Weak
