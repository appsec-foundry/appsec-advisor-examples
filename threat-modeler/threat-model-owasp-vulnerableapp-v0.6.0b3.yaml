  title: OS command injection
  scenario: An attacker sends a request to Level 1 of the CommandInjection endpoint with an ipaddress parameter containing
    shell metacharacters such as '; id'. The server passes this value unmodified to ProcessBuilder with shell invocation 'sh
    -c ping -c 2 ' + ipAddress, causing the OS shell to interpret the injected characters as additional commands and execute
    them with the Spring Boot process's privileges.
  attack_steps:
  - Attacker sends GET /vulnerable/CommandInjection/LEVEL_1?ipaddress=127.0.0.1;cat+/etc/passwd to the internet-facing endpoint.
  - Server validates only that ipAddress is non-blank (StringUtils.isNotBlank) and constructs ProcessBuilder(["sh","-c","ping
    -c 2 127.0.0.1;cat /etc/passwd"]) at line 48.
  - The shell interprets the semicolon as a command separator and executes 'cat /etc/passwd' after ping, producing combined
    output.
  - Command output is streamed into the HTTP response body and returned to the attacker, confirming arbitrary OS code execution.
  evidence_summary: CommandInjection.java line 48 constructs new ProcessBuilder(new String[]{"sh","-c","ping -c 2 " + ipAddress})
    where ipAddress is the raw request parameter. The Level 1 handler at line 80-88 passes any non-blank string as the validator,
    providing no protection against shell metacharacters.
  impact_description: An attacker can execute arbitrary OS commands as the Spring Boot process user, enabling data exfiltration
    from the server filesystem, reading of application configuration and credentials, lateral movement to adjacent services,
    and establishment of a persistent reverse shell.
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: Profile='unsafe' restricts this endpoint to the unsafe Spring Boot activation profile; Level 1 applies
    only a non-blank check on ipAddress (StringUtils.isNotBlank).
  mitigation_title: Replace shell-invoked ProcessBuilder with an argument-list invocation after strict IP validation
  remediation:
    effort: Medium
    steps:
    - Validate the ipaddress parameter against the existing IP_ADDRESS_PATTERN regex (already present at line 38) before any
      ProcessBuilder invocation on all levels.
    - 'Replace the sh -c shell form with a process builder argument list: new ProcessBuilder("ping","-c","2",validatedIpAddress)
      so the OS never interprets metacharacters as shell syntax.'
    - Add a test sending ipaddress=127.0.0.1%3Bid and asserting that the response body does not contain uid= or gid=.
    code_example: null
    verification: Send GET /vulnerable/CommandInjection/LEVEL_1?ipaddress=127.0.0.1%3Bid and assert the HTTP response body
      does not include uid= indicating command injection.
    reference: https://owasp.org/www-community/attacks/Command_Injection
