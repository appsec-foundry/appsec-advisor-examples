    requests, impersonating the llmforge backend. With no credential check, the Ollama service cannot distinguish legitimate
    llmforge calls from attacker-controlled prompts.
  attack_steps:
  - Attacker enumerates Docker host port bindings and discovers Ollama API at 0.0.0.0:11434 with no authentication requirement
    by calling GET /api/tags.
  - Attacker submits POST /api/generate with attacker-crafted system and user prompts, receiving model completions without
    any credential or token.
  - Attacker iterates over adversarial prompts targeting phi3:mini to extract model behavior, bypass application-layer filters,
    and consume inference capacity without attribution.
