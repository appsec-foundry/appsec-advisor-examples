tier_root_causes:
  edge:
  - Unvalidated server data written to innerHTML DOM sinks without sanitization
  - Credentials and tokens placed in URL parameters, exposing them to logs
  - Cryptographic material stored in static web-root served over HTTP
  - Security cookies set without HttpOnly allow JavaScript credential access
  - Absent referrer policy and opener isolation on outbound navigation
  server:
  - User input concatenated into query and command interpreter calls
  - Authorization state stored in client-controlled cookies without integrity
  - Management interfaces exposed without authentication or network restriction
  - 'Session lifecycle not enforced: missing regeneration, invalidation, entropy'
  - Container and CI action references use mutable tags without digest pinning
