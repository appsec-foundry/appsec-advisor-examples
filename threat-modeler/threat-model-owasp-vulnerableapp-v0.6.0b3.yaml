- local_id: auth-001
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-347
  title: Insecure JWT Verification
  scenario: Attacker crafts a JWT with header `{"alg":"none"}` and an empty signature segment; JWTVulnerability levels 6 and
    7 call customHMACNoneAlgorithmVulnerableValidator at JWTValidator.java:104, which returns true unconditionally when alg
    equals 'none', granting access as any claimed subject without a valid cryptographic signature.
  attack_steps:
  - Attacker authenticates legitimately to obtain a valid JWT and decodes its header and payload using base64url.
  - Attacker modifies the payload claims (e.g., subject to a victim user ID or role to admin), re-encodes, sets the header
    alg field to 'none', strips the signature, producing header.payload. (trailing dot, empty signature).
  - Attacker submits the forged token to LEVEL_6 or LEVEL_7; JWTValidator.java:104 reads alg='none', enters the early-return
    true branch, bypasses HMAC verification, and the endpoint grants authenticated access.
  evidence_summary: JWTValidator.java:104 checks `JWTUtils.NONE_ALGORITHM.contentEquals(alg.toLowerCase())` and immediately
    returns true, short-circuiting all cryptographic verification when alg is 'none' in any case variant.
  impact_description: Any unauthenticated attacker can forge a JWT claiming any user identity including administrator, achieving
    complete authentication bypass on LEVEL_6 and LEVEL_7 endpoints and gaining full control over victim accounts.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  actor_ids:
  - ACT-D-01
  - ACT-D-07
  primary_actor: ACT-D-01
  mitigation_title: Reject tokens with alg:none in JWTValidator before signature check
