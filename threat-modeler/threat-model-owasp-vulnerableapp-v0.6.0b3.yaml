- local_id: vulnerableapp-backend-009
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-327
  title: AES-ECB mode reveals block-level plaintext patterns — EncryptionUtils.java:89
  scenario: EncryptionUtils.encrypt() instantiates Cipher with AES/ECB/PKCS5Padding and uses it to encrypt challenge passwords
    in CryptographicFailuresVulnerability Level 10. ECB mode encrypts each 16-byte block independently without an IV; repeated
    or structured plaintext blocks produce identical ciphertext blocks. An attacker who obtains two ciphertexts encrypted
    under the same key can detect duplicate blocks and infer plaintext structure without recovering the key.
  evidence_summary: 'EncryptionUtils.java line 89 instantiates Cipher.getInstance("AES/ECB/PKCS5Padding") as explicitly documented
    by the developer comment at lines 87-88: ''VULNERABILITY NOTE: ECB mode does not use an IV and reveals patterns (CWE-327)''.
    The encrypt() method is called by CryptographicFailuresVulnerability.getSecurePayloadLevel10() to verify challenge password
    ciphertexts.'
  impact_description: Structured or repeating plaintext inputs encrypted under ECB mode leak block-level content patterns
    in the ciphertext, enabling an attacker who holds multiple ciphertexts to detect duplicate segments and infer the structure
    or content of the original plaintext without a brute-force of the key.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: PBKDF2WithHmacSHA256 is used for key derivation in getKeyFromPassword() (line 76), which provides a strong
    key but does not compensate for ECB mode's deterministic block-by-block operation.
  mitigation_title: Replace AES/ECB with AES/GCM/NoPadding and a per-invocation random IV in EncryptionUtils.encrypt
  remediation:
    effort: Medium
    steps:
    - Change Cipher.getInstance("AES/ECB/PKCS5Padding") to Cipher.getInstance("AES/GCM/NoPadding") and generate a random 12-byte
      IV via SecureRandom on each encrypt() call.
    - Prepend the IV to the ciphertext output (IV is not secret) so decrypt() can recover it; update stored challenge ciphertexts
      in the repository accordingly.
    - Add a unit test calling encrypt() twice with identical plaintext and key and asserting the two Base64 ciphertexts are
      different.
    code_example: null
    verification: Call EncryptionUtils.encrypt(plaintext, key) twice with the same arguments and assert the two returned strings
      are not equal.
    reference: https://cwe.mitre.org/data/definitions/327.html
  evidence:
