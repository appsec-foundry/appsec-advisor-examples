  title: No file type validation on upload enables — UnrestrictedFileUpload.java:200
  scenario: Level 1 of the UnrestrictedFileUpload endpoint accepts any file type because the validator lambda always returns
    true and the original filename is passed without modification. An attacker uploads a JSP web shell to the static upload
    directory served by the embedded Tomcat. Requesting the uploaded file path causes Tomcat to compile and execute the JSP,
    granting arbitrary OS command execution under the Spring Boot process account.
  attack_steps:
  - Attacker sends POST /vulnerable/UnrestrictedFileUpload/LEVEL_1 with a multipart body containing a part named 'file', filename='shell.jsp',
    and JSP content that executes the 'cmd' request parameter.
  - Server calls genericFileUploadUtility(root, file.getOriginalFilename(), () -> true, file, false, false) at line 200; the
    always-true validator passes, and Files.copy() writes the JSP verbatim to the static/upload/ directory.
  - Response body returns the public URL path of the uploaded file, confirming the write location.
  - Attacker sends GET to the returned URL with an OS command appended; Tomcat compiles and executes the JSP, returning command
    output and granting full OS access as the Spring Boot process user.
  evidence_summary: UnrestrictedFileUpload.java line 200 calls genericFileUploadUtility(root, file.getOriginalFilename(),
    () -> true, file, false, false) where the validator lambda is a constant true, no extension or MIME type check is performed,
    and the original client-supplied filename is used as the storage key within the web-accessible upload directory.
  impact_description: 'An attacker gains arbitrary OS command execution as the Spring Boot process user, enabling full application
    compromise: reading all database credentials and application secrets, exfiltrating data, modifying application files,
    and establishing persistent access or reverse shells.'
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: Profile='unsafe' restricts this endpoint to the unsafe Spring Boot activation profile; no file type,
    MIME, magic-byte, or content inspection is applied within the endpoint logic.
  mitigation_title: Implement extension allowlist and magic-byte validation with safe storage in UnrestrictedFileUpload
  remediation:
    effort: Medium
    steps:
    - Implement an allowlist of permitted file extensions (e.g., .png, .jpeg only) and verify both the filename extension
      and the file's magic bytes (via Apache Tika or javax.activation) before accepting any upload.
    - Store uploaded files outside the web root or in a directory explicitly excluded from Tomcat's servlet mappings to prevent
      direct HTTP access and execution.
    - Rename uploaded files to a server-generated UUID with a safe extension rather than using the client-supplied filename.
    - Add a test uploading a .jsp file with a JSP payload and asserting the server returns HTTP 400 and no executable file
      appears in the upload directory.
    code_example: null
    verification: POST a file with filename=shell.jsp and JSP content to /vulnerable/UnrestrictedFileUpload/LEVEL_1; assert
      the server rejects the request and that no shell.jsp file is accessible via the returned URL.
    reference: https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload
