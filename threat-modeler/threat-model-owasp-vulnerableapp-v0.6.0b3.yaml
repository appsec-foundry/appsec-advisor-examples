  stride: Elevation of Privilege
  cwe: CWE-284
  title: Unauthenticated LDAP write access to directory — EmbeddedLDAPConfig.java:22
  scenario: An attacker with network access to the application host connects to the embedded LDAP TCP port, issues an anonymous
    LDAP modify operation changing the userPassword attribute of alice's entry to an attacker-known hash, and then authenticates
    through the application's Level 3 or Level 6 endpoint as alice with the attacker-chosen password, taking over that account
    without knowing the original credential.
  attack_steps: null
  evidence_summary: Lines 22-25 of EmbeddedLDAPConfig.startLDAPServer() construct InMemoryDirectoryServerConfig and InMemoryDirectoryServer
    without calling setAccessControlHandler(), setAuthenticationRequired(), or any equivalent, leaving the directory open
    to unauthenticated LDAP add/modify/delete operations from any connecting client.
  impact_description: An attacker overwrites the password hash of any directory user, grants themselves or denies others access
    through the application, and performs account takeover without prior credential knowledge.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: Architecture context states the server is not reachable externally; however this is an undocumented network-level
    assumption not enforced in code.
  mitigation_title: Configure LDAP access control handler to deny unauthenticated write operations
  remediation:
    effort: Medium
    steps:
    - After constructing InMemoryDirectoryServerConfig at line 22, call config.setAuthenticationRequired(true) and configure
      an InMemoryDirectoryServerConfig accessControlHandler or use UnboundID's built-in ACL plugin to restrict modify/add/delete
      operations to authenticated administrative DNs only.
    - Combine with the loopback bind restriction from the Spoofing finding (embedded-ldap-001) so external connections are
      rejected before reaching any write operation; verify by running an anonymous ldapmodify against the bound port and confirming
      it is rejected with LDAP resultCode 50 (insufficientAccessRights).
    code_example: null
    verification: Run `ldapmodify -H ldap://127.0.0.1:<port> -x` with an anonymous bind and a modify DN operation; confirm
      the server returns resultCode 50 or closes the connection.
    reference: 'CWE-284: https://cwe.mitre.org/data/definitions/284.html'
  evidence:
