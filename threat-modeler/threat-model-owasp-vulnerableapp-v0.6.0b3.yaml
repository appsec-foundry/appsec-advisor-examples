    passed at the Level 1 handler (line 201) without any path normalization, canonicalization, or parent-directory boundary
    check. The @AttackVector annotation on Level 1 (lines 148-192) explicitly marks PATH_TRAVERSAL as a vulnerability type.
  impact_description: An attacker can overwrite existing application files, JSP pages, configuration files, or other artifacts
    within the server process's write scope. Writing a malicious JSP file to a Tomcat-served directory achieves server-side
    code execution equivalent to the unrestricted file type upload finding.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The upload root directory is resolved from the classpath static/ directory at startup; however, Path.resolve()
    with a filename containing ../ sequences escapes the base directory entirely without raising an exception.
