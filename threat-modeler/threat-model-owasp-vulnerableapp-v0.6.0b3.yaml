verdict:
  severity: red
  opening: VulnerableApp is a deliberately vulnerable Java web application whose authentication can be bypassed through query
    injection, whose private signing key is publicly readable, and whose embedded AI inference service runs without any access
    control.
  bullets:
  - title: Database exposed to any caller
    body: Query injection in the login and search paths lets an unauthenticated caller read or modify all user records in
      the embedded database.
    findings:
    - F-001
    - F-007
    weaknesses: []
    verified_attack_path: false
  - title: Admin panel reachable without a credential
    body: An embedded database console and an inference model management service require no login, giving any caller direct
      control over stored records.
    findings:
    - F-005
    - F-006
    - F-011
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Session token forgeable by any caller
    body: The private signing key is served as a publicly readable file, so any caller can issue tokens the server accepts
      as legitimate.
    findings:
    - F-009
    - F-004
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server files replaced via upload
    body: The upload handler accepts any file type without content checking, letting a caller place executable files at server-controlled
      paths.
    findings:
    - F-012
    - F-017
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Arbitrary commands run on the server
    body: User input reaches a shell command builder without restriction, letting a caller run arbitrary operating system
      commands on the host machine.
    findings:
    - F-008
    weaknesses: []
    verified_attack_path: false
  - title: AI inference service open to internet
    body: The AI inference service has no authentication requirement, letting any internet caller submit unlimited prompts
      and exhaust compute capacity.
    findings:
    - F-015
    - F-035
    weaknesses:
    - W-001
    verified_attack_path: false
  closing: All Critical findings are intentional training scenarios — this codebase must not be deployed as a production service.
  bullets_intro: 'What an attacker can do today:'
