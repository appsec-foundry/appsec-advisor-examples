- local_id: vulnerableapp-web-ui-009
  threat_category_id: TH-06
  additional_categories:
  - TH-04
  stride: Elevation of Privilege
  cwe: CWE-1004
  title: Session identity cookie set without HttpOnly — CachePoisoningCommon.js:51
  scenario: The demo_user session cookie is written via document.cookie without an HttpOnly flag (CachePoisoningCommon.js
    line 51). Any JavaScript executing in the same origin — including the DOM XSS payload injected via vulnerableapp-web-ui-002
    — can read the current demo_user value and overwrite it to impersonate another user identity. Subsequent authenticated
    XHR calls made from the same browser carry the forged cookie, crossing the user-ownership authorization boundary if the
    server uses this cookie to identify the requester.
  attack_steps: null
  evidence_summary: 'Line 51 sets document.cookie with no HttpOnly attribute: `demo_user=${value}; path=/; SameSite=Lax`.
    The SameSite=Lax attribute does not prevent same-origin JavaScript from reading or rewriting the cookie. Server-side validation
    of the cookie value was not confirmed in the client-side code (missing-control-proof escape applied).'
  impact_description: An attacker who achieves JavaScript execution in the victim's browser (via the DOM XSS in vulnerableapp-web-ui-002)
    can read or rewrite the demo_user cookie to impersonate any other user, gaining that user's data access and authorization
    level.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: SameSite=Lax set (prevents cross-site cookie submission) but HttpOnly absent
  mitigation_title: Set HttpOnly flag on demo_user cookie and enforce server-side session validation in CachePoisoningCommon.js
  remediation:
    effort: Medium
    steps:
    - Remove the client-side document.cookie assignment for demo_user from CachePoisoningCommon.js. Instead, have the server
      set the cookie via Set-Cookie response header with HttpOnly; Secure; SameSite=Lax attributes.
    - On the server side, validate the demo_user cookie value against a server-maintained session store rather than trusting
      the cookie value directly.
    - Write a test that, after login, attempts to set document.cookie = 'demo_user=admin' from the browser console and then
      calls an authenticated API endpoint — the server must reject or ignore the overridden cookie value.
    code_example: null
    verification: Using browser DevTools, confirm demo_user cookie has HttpOnly flag set; running `document.cookie` must not
      reveal the demo_user value.
    reference: https://owasp.org/www-community/HttpOnly
  evidence:
  - file: src/main/resources/static/templates/CachePoisoning/Common/CachePoisoningCommon.js
    line: 51
