      profile.
    - If console access is required for development, add a Spring Security HttpSecurity rule restricting /h2/** to the loopback
      interface and requiring ADMIN-role authentication before accessing the H2 login page.
    - Remove hardcoded database credentials from application-unsafe.properties and inject them via a secrets manager or environment
      variable excluded from version control.
