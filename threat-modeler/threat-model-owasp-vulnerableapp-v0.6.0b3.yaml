  protocol: HTTP
  auth_required: false
  notes: H2 console enabled via spring.h2.console.enabled=true with web-allow-others=true in application-unsafe.properties
    (line 8-9). Provides unauthenticated SQL execution against the embedded database; reachable from any network client when
    the unsafe profile is active.
- entry_point: Ollama LLM API (port 11434)
  protocol: HTTP
  auth_required: false
  notes: Ollama container exposes port 11434 directly to the host in docker-compose.yml (line 21). No authentication on the
    Ollama REST API; accepts model inference and management requests without credentials.
- entry_point: Mailpit SMTP listener (port 1025)
  protocol: SMTP
  auth_required: false
  notes: Mailpit configured with MP_SMTP_AUTH_ACCEPT_ANY=1 and MP_SMTP_AUTH_ALLOW_INSECURE=1 in docker-compose.yml (lines
    86-87). Accepts any SMTP sender credential without validation; exposed on internal Docker network.
trust_boundaries:
- name: Internet ingress to nginx facade
  kind: network
  assumption: Every HTTP request forwarded to the backend is raw, unchecked user input; no access control runs at the nginx
    layer.
  evidence:
  - file: docker-compose.yml
    line: 106
  - file: docker-compose.yml
    line: 64
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: vulnerableapp-facade
  assumption_legs:
  - leg: validation
    condition: Every HTTP request is forwarded by nginx without content inspection or schema validation.
  - leg: authentication
    condition: No authentication check is performed at the nginx facade before forwarding requests to backend services.
  - leg: authorization
    condition: No access control decision is made at the nginx layer before requests reach any backend service.
  covers_components:
  - llmforge-backend
  - vulnerableapp-facade
  surface: network
  transition: []
