  title: RSA private key served as HTTP-reachable static resource — private_key.pem:1
  scenario: An unauthenticated attacker sends GET /VulnerableApp/JWTVulnerability/keys/private_key.pem and receives the RSA
    private key. The attacker then uses the key to sign a JWT with arbitrary claims. Backend JWT verification accepts the
    forged token because it verifies the signature using the corresponding public key, which also resides in the same directory.
    The attacker gains authenticated access as any user identity encoded in the forged token.
  attack_steps:
  - Attacker sends GET /VulnerableApp/JWTVulnerability/keys/private_key.pem and downloads the 1850-byte RSA private key from
    the application's /static/ directory.
  - Attacker uses the private key (e.g. via jwt.io or a local script) to sign a JWT payload with chosen claims such as sub=admin
    or role=ADMIN.
  - Attacker submits the forged JWT in the Authorization Bearer header on any protected API endpoint serviced by the backend.
  - Backend verifies the signature against the known public key (public_crt.pem, same directory) and grants access based on
    the forged claims, completing the authentication bypass.
  evidence_summary: The file private_key.pem (1850 bytes) exists at src/main/resources/static/templates/JWTVulnerability/keys/
    and is served verbatim as a static resource with no access control, as confirmed by the architecture context (exposed_interfaces)
    and directory listing.
  impact_description: Any internet-accessible attacker can forge JWTs for any user identity or role, achieving complete authentication
    bypass on all backend endpoints that accept JWTs signed with this key.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — file served verbatim from /static/ with no authentication requirement
  mitigation_title: Remove private key from static directory and restrict JWTVulnerability key material to server-side classpath
    only
  remediation:
    effort: Low
    steps:
    - Move private_key.pem out of src/main/resources/static/ (HTTP-served) into src/main/resources/ or a secrets manager so
      it is accessible only to backend code, not served over HTTP.
    - Configure Spring Boot to explicitly deny requests to any /JWTVulnerability/keys/ path via HttpSecurity if the directory
      must remain for educational UI purposes.
    - Verify with a curl/wget test that GET /VulnerableApp/JWTVulnerability/keys/private_key.pem returns HTTP 403 or 404 and
      does not return key material.
    code_example: null
    verification: curl -I https://<host>/VulnerableApp/JWTVulnerability/keys/private_key.pem — response must be 403 or 404,
      not 200.
    reference: https://owasp.org/www-community/vulnerabilities/Insufficient_Transport_Layer_Protection
