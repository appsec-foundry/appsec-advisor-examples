- local_id: vulnerableapp-facade-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: No nginx rate limit allows unbounded request flooding — docker-compose.yml:107
  scenario: An internet attacker sends a sustained flood of HTTP requests to port 80; the nginx facade forwards all requests
    to backend services without any rate cap, exhausting backend CPU, memory, and database connection pool capacity, degrading
    or stopping service for legitimate users across all routed backends.
  attack_steps: null
  evidence_summary: Controls context confirms 'No rate limiting or request size enforcement detected in nginx config'; docker-compose.yml
    lines 103-115 define the VulnerableApp-facade service with no limit_req or limit_conn configuration, and the nginx templates
    directory is absent from the repository (templates bundled in image), leaving no source-verifiable rate control. A grep
    of docker-compose.yml for limit_req / limit_conn / rate_limit returns zero hits.
  impact_description: All five backends — VulnerableApp-base, VulnerableApp-jsp, VulnerableApp-php, LLMForge, and Mailpit
    — are reachable via the facade without throttle; a sustained HTTP flood exhausts backend resources and causes complete
    service unavailability, including for LLM inference endpoints whose GPU compute makes them particularly expensive to spam.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: None
  mitigation_title: Add limit_req_zone and limit_req directives to the nginx template for the facade
  remediation:
    effort: Medium
    steps:
    - 'Create or update the nginx template mounted at /etc/nginx/templates/ to add in the http block: ''limit_req_zone $binary_remote_addr
      zone=global:10m rate=30r/s;'' and for LLM endpoints a stricter zone: ''limit_req_zone $binary_remote_addr zone=llm:10m
      rate=5r/s;''.'
    - 'Apply in each location block: ''limit_req zone=global burst=60 nodelay;'' and for /llmforge: ''limit_req zone=llm burst=10;''.'
    - 'Add client_max_body_size to limit oversized request payloads: ''client_max_body_size 1m;'' in the server block.'
    - 'Verify by sending 200 rapid requests: ''ab -n 200 -c 50 http://localhost/'' and confirming 429 responses appear in
      the nginx error log after the burst threshold is reached.'
    code_example: null
    verification: 'Run: for i in $(seq 1 100); do curl -s -o /dev/null -w ''%{http_code}\n'' http://localhost/; done | grep
      -c 429 — expect a non-zero count of 429 responses.'
    reference: https://cwe.mitre.org/data/definitions/400.html
