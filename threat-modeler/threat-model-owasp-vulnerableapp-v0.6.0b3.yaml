  title: Unencoded banner stored in shared — CachePoisoningVulnerability.java:182
  scenario: An attacker sends a request to Level 1 of the CachePoisoning endpoint with a banner parameter containing an HTML
    script payload. The server concatenates the raw banner into an HTML response string without encoding and stores it in
    an in-process ConcurrentHashMap keyed only on the request URI. Subsequent requests to the same URI by any user receive
    the cached poisoned response including the injected script.
  evidence_summary: CachePoisoningVulnerability.java line 182 concatenates the raw, unencoded banner variable (assigned at
    line 178 from StringUtils.defaultIfBlank(banner, DEFAULT_BANNER)) directly into an HTML response string. The buildCachedResponse()
    call at line 84 stores this HTML in the shared ConcurrentHashMap cache with a route-only cache key (line 341), so all
    users hitting the same URI receive the poisoned content.
  impact_description: An attacker who poisons the shared cache with a script payload controls the browser execution context
    of every subsequent user who receives the cached response within the 60-second TTL, enabling session token theft, phishing,
    or further exploitation via stored XSS.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None on Level 1; Level 2 strips obvious script blocks via regex but remains bypassable with alternative
    injection vectors; Level 5 uses StringEscapeUtils.escapeHtml4 and a private cache policy.
  mitigation_title: HTML-encode the banner parameter and include it in the cache key in CachePoisoningVulnerability
  remediation:
    effort: Low
    steps:
    - Wrap the banner in StringEscapeUtils.escapeHtml4(unsafeBanner) before embedding it in the HTML string in buildLevel1Response(),
      as Level 5's buildLevel5Response() already does.
    - Include the normalized banner value in the cache key from buildRouteOnlyCacheKey() so attacker-controlled content does
      not share a cache entry with the default response.
    - Add a test sending banner=<script>alert(1)</script> and asserting the response body contains &lt;script&gt; not a raw
      script tag.
