  title: Admin role injection — application-unsafe.properties:8
  scenario: An attacker with network access to port 9090 authenticates to the H2 console at /VulnerableApp/h2 using hardcoded
    admin/hacker credentials from application-unsafe.properties:1-2, then executes INSERT INTO auth_users with role='ADMIN'
    or UPDATE auth_users SET role='ADMIN' targeting an existing account; the application trusts the role field from auth_users
    without re-validating it server-side, so the attacker subsequently logs in through the application and receives unrestricted
    ADMIN-role access, bypassing all application authorization controls.
  attack_steps:
  - Attacker navigates to /VulnerableApp/h2, which Spring Security does not gate, and authenticates as admin with password
    hacker from application-unsafe.properties:1-2.
  - Attacker executes INSERT INTO auth_users VALUES(99,'attacker','pass',NULL,'PLAIN',1,'a@b.com','ADMIN') in the H2 SQL editor,
    creating a new ADMIN-role account.
  - Attacker logs into the application with username 'attacker' and receives ADMIN-role authorization from auth_users, bypassing
    all application-layer access controls.
  evidence_summary: application-unsafe.properties:8 enables the H2 console without a Spring Security gate; Authentication/db/schema.sql:15
    grants ALL operations on auth_users to the application user and the admin has full DBA access, making the role column
    in auth_users directly writable via the console.
  impact_description: An attacker gains unrestricted ADMIN role in the application by directly inserting or modifying rows
    in auth_users; all admin-restricted endpoints, user data, and configuration become accessible, enabling complete account
    takeover and application control.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Application-layer authorization checks exist for ADMIN-restricted endpoints but rely on the role value
    read from auth_users at login; no server-side re-validation occurs against an authoritative source independent of the
    H2 database
  mitigation_title: Disable H2 console in the default profile to prevent direct role modification in auth_users
  remediation:
    effort: Medium
