  evidence_summary: 'onboard_sasanlabs.yml line 4 declares ''on: pull_request_target: types: [closed]'', which GitHub documents
    as running in the privileged base-repository context with access to secrets. Lines 7-9 grant the automatic GITHUB_TOKEN
    issues: write and pull-requests: write. All four github-script steps (lines 19, 51, 83, 95) receive GH_TRAFFIC_TOKEN as
    a custom token whose full scope is not declared in the workflow file.'
