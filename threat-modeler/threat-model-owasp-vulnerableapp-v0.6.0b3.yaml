security_controls:
- domain: Session and Token Controls
  control: JWT Algorithm Whitelist
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: NONE_ALGORITHM constant defined at JWTUtils.java:33 ('none') and accept paths in JWTValidator.java:131,196 call
    verify() without algorithm restriction. The IDORLoginService.java:67 verifier likewise does not enforce an algorithm whitelist.
    An attacker can forge tokens by switching to algorithm 'none' if the validator path accepts unsigned JWTs.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/jwt/impl/JWTValidator.java, src/main/java/org/sasanlabs/service/vulnerability/jwt/bean/JWTUtils.java,
    src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginService.java
  status_note: Weak — algorithm whitelist absent; 'none' algorithm accepted as intentional demo path
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Route Authentication Gate
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: 'Multiple state-changing POST routes carry authn=unknown: POST /scanner/benchmark (BenchmarkController.java:38),
    POST /clearCache (CachePoisoningVulnerability.java:393), POST /test (EmailTestController.java:28). No authentication filter
    is active on any detected backend endpoint; the trust-boundary analysis (tb-3) confirms no auth check before business
    logic.'
  implementation: src/main/java/org/sasanlabs/benchmark/controller/BenchmarkController.java, src/main/java/org/sasanlabs/service/vulnerability/cachePoisoning/CachePoisoningVulnerability.java,
    src/main/java/org/sasanlabs/controller/EmailTestController.java
  status_note: Weak — state-changing endpoints reachable without authentication
- domain: Session Management Controls
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: Session-bearing routes and session management handlers exist (SessionManagementVulnerability.java, SessionManagementService.java)
    but no positive signal was found for Secure, HttpOnly, or SameSite cookie attributes in application properties or Spring
    Security configuration. Preconditions for session theft are present; hardening state is unconfirmed.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/sessionManagement/SessionManagementVulnerability.java,
    src/main/resources/application.properties
  status_note: Partial — session infrastructure present; cookie attribute hardening unconfirmed
- domain: Input Boundary Validation Controls
  control: Schema / Allowlist Input Validation
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: Ad-hoc null/trim checks appear at DastBenchmarkStrategy.java:226-304 and ScanType.java:19, but no centralized
    schema validation gate was found. innerHTML assignment at LDAP.js:3 ('element.innerHTML = message.replace(/\n/g, "<br>")')
    injects server response directly into the DOM. Input handling is per-endpoint with no allowlist enforcement layer.
  implementation: src/main/java/org/sasanlabs/benchmark/service/DastBenchmarkStrategy.java, src/main/java/org/sasanlabs/benchmark/model/ScanType.java
  status_note: Weak — per-endpoint ad-hoc checks only; no centralized input validation gate
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: Query Construction and Data Access Controls
  control: Parameterized Database Access
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: SQL injection handler at ErrorBasedSQLInjectionVulnerability.java:239 carries a comment '// need to use the
    parameterized query properly.' indicating raw SQL concatenation is present. Trust boundary tb-4 assumes parameterized
    binding but is confidence=inferred. The intentional design includes raw SQL construction paths that a scanner would reach
    via the same HTTP surface as the parameterized paths.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/sqlInjection/ErrorBasedSQLInjectionVulnerability.java
  status_note: Weak — raw SQL concatenation paths coexist with JPA-parameterized paths
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: Output Encoding and Rendering Controls
  control: Output Encoding / Templating Autoescape
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: Static HTML templates are served without a server-side templating engine that enforces autoescape. The LDAP
    scenario at LDAP.js:3 uses innerHTML for server response rendering. No Content Security Policy header evidence was found
    in application properties or nginx configuration. Presence of intentional XSS demo endpoints makes the surface coverage
    of output encoding incomplete.
  implementation: src/main/resources/static/
  status_note: Partial — some scenarios use innerHTML sinks; no global CSP or autoescape layer
  audit_flags:
  - control_domain_reclassified_from_Input Handling Controls
- domain: Authorization Controls
  control: Object-Level Ownership Check
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: IDOR handlers (IDORLoginController.java, IDORLoginService.java, IDORLoginDetails.java) are present and intentionally
    demonstrate object-level access control bypass. No ownership check guards object-addressing endpoints. Trust boundary
    tb-3 confirms authorization signal is unknown on all routes.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginController.java, src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginService.java
  status_note: Weak — IDOR paths present with no ownership enforcement
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: EmailTestController.java:28 exposes POST /test without confirmed authentication or authorization. BenchmarkController.java:38
    POST /scanner/benchmark is also unprotected. No evidence of Spring Security endpoint restriction or IP allowlist for management
    surfaces.
  implementation: src/main/java/org/sasanlabs/controller/EmailTestController.java, src/main/java/org/sasanlabs/benchmark/controller/BenchmarkController.java
  status_note: Partial — management POST endpoints exposed without confirmed auth gate
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-SECRET-001
  assessment: Private key PEM material is committed to source at src/main/resources/static/templates/JWTVulnerability/keys/private_key.pem.
    JWTUtils.java:65 defines BEGIN_PRIVATE_KEY_TOKEN as a constant, indicating key material is embedded in code rather than
    injected at runtime. No secrets manager or environment-variable injection pattern was detected.
  implementation: src/main/resources/static/templates/JWTVulnerability/keys/private_key.pem, src/main/java/org/sasanlabs/service/vulnerability/jwt/bean/JWTUtils.java
  status_note: Weak — JWT private key committed to source repository
- domain: Cryptography Secrets and Data Protection
  control: Transport Encryption
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-TLS-001
  assessment: No TLS configuration was detected in application.properties or the nginx docker-compose definition. The nginx
    facade listens on port 80 (HTTP) with no redirect or TLS termination signal. Inter-service communication (backend to Mailpit
