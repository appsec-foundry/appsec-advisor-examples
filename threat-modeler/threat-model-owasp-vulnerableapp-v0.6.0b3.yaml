  title: Unauth H2 console with hardcoded admin creds — application-unsafe.properties:8
  scenario: An attacker with network access to port 9090 navigates to /VulnerableApp/h2, which Spring Security provides no
    authentication gate for; the attacker enters admin/hacker credentials hardcoded in application-unsafe.properties:1-2,
    connects to jdbc:h2:mem:testdb, and queries auth_users and session_users to extract all stored credentials, enabling impersonation
    of any application user including administrators.
  attack_steps:
  - Attacker accesses /VulnerableApp/h2, which Spring Security does not gate, reaching the H2 console login page.
  - Attacker enters admin/hacker from application-unsafe.properties:1-2 and connects to jdbc:h2:mem:testdb as the DBA.
  - Attacker queries SELECT * FROM auth_users and session_users to extract plaintext and hashed credentials for all levels.
  evidence_summary: application-unsafe.properties:8 sets spring.h2.console.enabled=true and line 9 sets web-allow-others=true;
    both files are loaded by default because application.properties:15 declares spring.profiles.active=public,unsafe; lines
    1-2 hardcode admin/hacker as DB admin credentials.
  impact_description: Full credential read and write access to all H2 tables containing authentication state; an attacker
    can extract plaintext passwords for auth_users levels 1-3 and all session_users, then authenticate as any application
    user including ADMIN-role accounts.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: H2 console login form requires DB credentials as the sole gate; no Spring Security authentication or
    IP restriction on the /h2 path
