  title: SQL injection authentication bypass — AuthLoginService.java:43
  scenario: An unauthenticated attacker sends a crafted username containing SQL metacharacters to the Level 1 authentication
    endpoint; the server concatenates the input directly into a raw SQL query executed via JdbcTemplate against H2, causing
    the database to evaluate a tautological condition that matches any user row and returns a successful authentication result
    without valid credentials.
  attack_steps:
  - Attacker sends POST to /vulnerable/AuthenticationVulnerability/LEVEL_1 with username=' OR '1'='1'-- and any value for
    password.
  - Server builds 'SELECT * FROM auth_users WHERE level=1 AND username='' OR ''1''=''1''-- AND password=...' and executes
    it via JdbcTemplate at line 51.
  - H2 processes the injected tautology, returns the first auth_users row, and AuthLoginService.authenticateLevel1SQLi() returns
    AuthResult.success() for that user.
  - Endpoint returns HTTP 200 with the victim user profile including userId, username, email, and role, completing unauthenticated
    account access.
  evidence_summary: AuthLoginService.java lines 42-51 build the SQL query by string-concatenating the username and password
    request parameters directly into the WHERE clause, then execute the resulting string via jdbcTemplate.query(), enabling
    standard SQL injection bypass.
  impact_description: An attacker can authenticate as any user in the auth_users table, including accounts with elevated roles,
    without knowing their password, gaining access to whatever session state and data are bound to the targeted account.
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: None — Spring Security filter chain is not active on vulnerability endpoints; the Level 1 path has no
    input validation or parameterization.
  mitigation_title: Parameterize the authentication query in AuthLoginService.authenticateLevel1SQLi
  remediation:
    effort: Low
    steps:
    - 'Replace the string concatenation query in authenticateLevel1SQLi() with a JdbcTemplate.query() call using parameterized
      ''?'' placeholders: "SELECT * FROM auth_users WHERE level=1 AND username=? AND password=?" with new Object[]{username,
      password} as the args array.'
    - Add an integration test that sends username=' OR '1'='1'-- with any password and asserts the response body contains
      isValid=false and no user profile data.
