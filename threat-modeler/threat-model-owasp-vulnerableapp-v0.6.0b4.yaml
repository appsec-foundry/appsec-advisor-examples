security_controls:
- domain: Identity and Authentication Controls
  control: Route Authentication Gate
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: 'Three state-changing POST endpoints accept requests without any authentication gate: BenchmarkController (/scanner/benchmark,
    line 38), CachePoisoningVulnerability (/clearCache, line 393), and EmailTestController (/test, line 28). No Spring Security
    filter chain configuration is evidenced in the repository.'
  implementation: Spring Boot controllers without session or token checks on state-changing routes; no centralized security
    filter in configuration
- domain: Session and Token Controls
  control: JWT Algorithm Enforcement
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: NONE algorithm constant defined at JWTUtils.java:33 and accepted by JWTValidator.java:131,196 which calls signedJWT.verify()
    without an algorithm whitelist. IDORLoginService.java:67 uses the same verify pattern. JWT token forgery without a signing
    key is the intended demonstration. Deliberately unsafe.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/jwt/bean/JWTUtils.java:33 NONE_ALGORITHM; src/main/java/org/sasanlabs/service/vulnerability/jwt/impl/JWTValidator.java:131,196
  audit_flags:
  - control_domain_reclassified_from_Identity and Authentication Controls
- domain: Identity and Authentication Controls
  control: Credential Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: Authentication scenario data loads plaintext passwords into H2 alongside BCrypt-hashed entries. AuthUser.java:19
    and SessionUser.java:15 carry password fields populated from seed SQL. Deliberately unsafe as training material demonstrating
    plaintext credential storage.
  implementation: src/main/resources/scripts/Authentication/db/schema.sql; src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthUser.java:19;
    SessionUser.java:15
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: No HttpOnly, Secure, or SameSite cookie flag configuration found in application.properties or any Spring Security
    configuration file. Session fixation is deliberately demonstrated by SessionManagementVulnerability. No positive or exculpatory
    signal found.
  implementation: No cookie attribute configuration evidenced in application.properties; SessionManagementVulnerability.java
    demonstrates fixation
- domain: Authorization Controls
  control: Management Endpoint Authorization
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: EmailTestController POST /test (line 28) has unknown authentication status. BenchmarkController accepts unauthenticated
    scanner submissions on /scanner/benchmark. H2 console is accessible at /VulnerableApp/h2 without any documented access
    restriction. No Spring Security restriction configuration found.
  implementation: src/main/java/org/sasanlabs/controller/EmailTestController.java:28; src/main/java/org/sasanlabs/benchmark/controller/BenchmarkController.java:38;
    H2 console enabled in application.properties
- domain: Authorization Controls
  control: Object-Level Ownership Enforcement
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: IDORLoginService.java:67 verifies a JWT for the caller but returns data for any requested user ID without checking
    ownership. IDORLoginController explicitly implements BOLA as a training scenario. Deliberately unsafe.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginService.java:67; IDORLoginController.java
- domain: Query Construction and Data Access Controls
