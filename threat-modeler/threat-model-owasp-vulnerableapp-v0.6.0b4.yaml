    reads). IAC-040 config-scan signals at all three files (Medium severity) confirm this. Controls-context explicitly states:
    ''No explicit permissions declaration found — defaults to write-all on public repository''. The architecture context confirms
    GITHUB_TOKEN write-all as a security dependency risk.'
  impact_description: A compromised CI step inherits write access to repository contents, packages, deployments, and issues.
    This allows pushing commits to master, creating releases, modifying workflow files, or deleting branches — all appearing
    as authenticated actions by the CI bot identity.
  likelihood: Medium
  impact: High
  risk: High
