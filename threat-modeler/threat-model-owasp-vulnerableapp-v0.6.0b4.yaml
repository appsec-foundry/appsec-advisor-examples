  title: Session fixation ID not rotated on login — SessionManagementService.java:74
  scenario: An attacker pre-sets a known value as the VAPP_SESSION_LEVEL1 cookie, then tricks a victim into authenticating
    via the Level 1 login endpoint; SessionManagementService.level1Login preserves the attacker-supplied session ID at line
    74 without generating a fresh one, allowing the attacker to immediately use the known value to access the victim's authenticated
    session.
  attack_steps:
  - Attacker sets a known session ID value in the VAPP_SESSION_LEVEL1 cookie on the victim's browser via social engineering
    or a prior XSS.
  - Victim submits credentials to the Level 1 login endpoint; level1Login receives the attacker-supplied sessionId via the
    @CookieValue parameter.
  - SessionManagementService.level1Login assigns `sessionId = incomingSessionId` at line 74 without generating a new session
    identifier.
  - Attacker uses the same pre-set session ID to access the victim's authenticated session through the Level 1 profile endpoint.
  evidence_summary: SessionManagementService.java:74 assigns the caller-supplied session ID to the active session variable
    without generating a new random identifier, confirming session fixation; line 87-88 even explicitly records sessionFixationConfirmed:true
    in the response.
  impact_description: Attacker hijacks any victim session they can prime with a known ID, gaining authenticated access as
    that victim. Under stated training-app conditions no material business harm; the mechanism is fully functional.
