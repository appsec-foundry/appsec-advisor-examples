  impact: High
  risk: High
  controls_in_place: No HMAC, signing, or server-side session binding on the role cookie; Level 4 applies Base64 encoding
    only
  mitigation_title: Store role in server-side session keyed by a signed token instead of a client cookie in IDORLoginController
  remediation:
    effort: Medium
    steps:
    - Remove the `role_level3` and `role_level4` cookies from IDORLoginController.java:141 and line 153; store the role in
      the server-side `sessions` map keyed by the JWT token's subject claim.
    - Any downstream role check must read the role from the server-side session, not from the cookie.
    - Add a test that modifies the role cookie to `admin` and asserts admin actions are still rejected.
