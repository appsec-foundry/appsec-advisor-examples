  title: Mutable-tag actions allow arbitrary code execution in CI runner — docker.yml:37
  scenario: An attacker who compromises the gittools/actions GitHub repository (or forces v0.9.7 to point to a malicious commit)
    causes the next push to master to execute attacker-controlled code in the CI runner. The malicious step has access to
    DOCKER_PASSWORD, CODECOV_TOKEN, and the write-all GITHUB_TOKEN, enabling injection of a backdoor into the Gradle build
    before the jib push step publishes to DockerHub.
  attack_steps:
  - Attacker compromises the gittools/actions repository or re-tags v0.9.7 to a malicious commit containing a secrets-exfiltration
    or build-tampering payload.
  - The next push to master triggers docker.yml, which downloads and executes the malicious gittools/actions/gitversion/setup@v0.9.7
    step with full runner access.
  - Malicious step reads DOCKER_PASSWORD and GITHUB_TOKEN from the runner environment, or modifies build.gradle / gradlew
    to embed a backdoor that is packaged into the Docker image by the subsequent jib push step.
  evidence_summary: 'docker.yml:37 uses `gittools/actions/gitversion/setup@v0.9.7` (mutable semver tag). Recon signals `unpinned-github-action`
    at docker.yml:20,34,37,43,46,55, gradle.yml:15,31, create-release.yml:18,29 confirm no SHA-pinning across any of the three
    admitted workflow files. Controls-context states: ''No SHA-pinned actions; all third-party actions use mutable major-version
    or semver tags''.'
  impact_description: Arbitrary code executed in the CI runner can tamper with build artifacts, exfiltrate all CI secrets,
    publish a poisoned Docker image to DockerHub under the project's official namespace, and create git tags or releases —
    directly threatening every operator who pulls and runs the training environment image.
