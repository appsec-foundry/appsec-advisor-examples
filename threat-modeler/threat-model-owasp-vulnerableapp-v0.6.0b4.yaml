  cwe: CWE-306
  title: Missing authentication on H2 web console — application.properties:13
  scenario: An unauthenticated internet attacker navigates to /VulnerableApp/h2; Spring Security has no rule protecting this
    path, so the request reaches the H2 console login page without an HTTP session. The attacker connects using JDBC URL jdbc:h2:mem:testdb
    with default H2 SA credentials (username 'sa', empty password) and submits arbitrary SQL queries against all H2 tables,
    acting as the database system administrator without any application-level identity check.
  attack_steps:
  - Attacker sends GET /VulnerableApp/h2 without a session cookie; no Spring Security filter intercepts the request and the
    H2 console login page is returned.
  - Attacker submits the H2 login form with JDBC URL jdbc:h2:mem:testdb, username 'sa', and empty password, establishing an
    SA-level database session through the console.
  - Attacker executes SELECT * FROM auth_users to retrieve all usernames, hashed and plaintext passwords, and roles without
    any application authentication having occurred.
  evidence_summary: application.properties:13 sets spring.h2.console.path=/h2, enabling the H2 web console at /VulnerableApp/h2;
    no Spring Security configuration restricts this path, and the H2 in-memory database accepts SA login with an empty password,
    confirmed by the interface description that states no auth is required.
  impact_description: Any internet caller obtains full SQL read/write access to all H2 tables including auth_users (credentials,
    roles), password_reset_tokens, and session data. Business context confirms impact_is_material:false for test/synthetic
    data only; if real credentials were ever stored or the same database pattern were reused in production the impact would
    be complete database compromise.
  likelihood: High
  impact: Medium
