  title: XXE — XXEVulnerability.java:77
  scenario: An attacker POSTs XML containing <!ENTITY xxe SYSTEM 'file:///etc/passwd'> to the Level 1 XXE endpoint; the JAXB
    unmarshaller at line 77 resolves the entity because the constructor at line 59 sets javax.xml.accessExternalDTD=all, returning
    the local file contents in the response.
  attack_steps: null
  evidence_summary: XXEVulnerability constructor at line 59 calls System.setProperty("javax.xml.accessExternalDTD", "all")
    enabling external entity resolution globally for the JVM. Level 1 handler creates a plain JAXBContext without SAXParserFactory
    restrictions and unmarshals the raw request InputStream at line 77. The known-threats context confirms this vulnerability
    at this location.
  impact_description: 'An attacker reads arbitrary files accessible to the JVM process and can perform outbound HTTP requests
    using external entity URLs. Technical consequence: arbitrary local file read and server-side request forgery via XML entities.
    Business context: training container only; no production data per stated deployment assumptions.'
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: Levels 2-5 add SAXParserFactory feature restrictions; Level 1 has no protection and the JVM-level property
    override at line 59 affects all XML parsers in the same JVM.
  mitigation_title: Remove JVM-wide accessExternalDTD property and add SAXParserFactory restrictions to Level 1
  remediation:
    effort: Low
    steps:
    - Remove System.setProperty("javax.xml.accessExternalDTD", "all") from the constructor at line 59, or scope it only to
      the explicitly vulnerable Level 1 handler.
    - 'For Level 1, apply the same SAXParserFactory restrictions used in Level 3 (lines 175-176): spf.setFeature("http://xml.org/sax/features/external-general-entities",
      false) and spf.setFeature("http://xml.org/sax/features/external-parameter-entities", false).'
    - Write a test that POSTs an XML body with a file:/// external entity to LEVEL_1 and confirms the response body does not
      contain OS file content.
