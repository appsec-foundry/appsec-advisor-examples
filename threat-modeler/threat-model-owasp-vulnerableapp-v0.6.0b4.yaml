  title: Insecure JWT Verification
  scenario: 'An attacker crafts a JWT with `alg: none` in the header and an empty signature; customHMACNoneAlgorithmVulnerableValidator
    at JWTValidator.java:104 accepts it unconditionally, granting the attacker an authenticated session for any claimed identity
    without a valid signature.'
  attack_steps:
  - Attacker obtains any JWT token from the application's login endpoint and base64url-decodes its header.
  - Attacker replaces the `alg` field with `none`, re-encodes the header, then strips the signature leaving only the trailing
    period separator.
  - Attacker submits the modified token to an endpoint that calls customHMACNoneAlgorithmVulnerableValidator; the method reads
    `alg` from the decoded header.
  - The method matches `none` at JWTValidator.java:104 and returns true without performing any signature verification.
  evidence_summary: JWTValidator.java:104 explicitly checks whether the `alg` header field equals the NONE_ALGORITHM constant
    and returns true before any signature check is performed.
  impact_description: 'Complete authentication bypass: any identity claim encoded in the token payload is accepted as authentic.
    Under stated conditions (synthetic test data, no production operations) there is no material business harm, but the technical
    consequence is full impersonation of any user including privileged roles.'
  likelihood: High
  impact: Critical
  risk: High
  controls_in_place: HMAC signing present for non-none algorithms; no algorithm whitelist prevents alg:none acceptance
  mitigation_title: Enforce algorithm whitelist in customHMACNoneAlgorithmVulnerableValidator
  remediation:
    effort: Low
    steps:
    - 'Replace the alg:none early-return at JWTValidator.java:104 with a rejection: throw or return false when the algorithm
      header equals NONE_ALGORITHM or any variant.'
    - Add an integration test that submits a token with alg:none to the affected endpoint and asserts HTTP 401 is returned.
    code_example: null
    verification: Submit a JWT with header `{alg:none}` and empty signature to any endpoint invoking customHMACNoneAlgorithmVulnerableValidator;
      expect HTTP 401 or authentication failure, not a success response.
    reference: https://cwe.mitre.org/data/definitions/347.html
