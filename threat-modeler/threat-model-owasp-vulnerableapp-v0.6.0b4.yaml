  title: Missing Authentication for Critical Function — docker-compose.yml:65
  scenario: An anonymous attacker connects directly to LLMForge HTTP port 8000 (docker-compose.yml:65), which is bound to
    all host interfaces, bypassing any authentication the Nginx facade may enforce at the /llmforge prefix; the service processes
    the request with no credential check, allowing the attacker to impersonate any user and access the full inference and
    RAG API.
  attack_steps:
  - Attacker discovers port 8000 open on the host via network scan or knowledge of the deployment.
  - Attacker sends HTTP POST to http://host:8000/api/chat or /api/generate directly, without any session token or credential.
  - LLMForge processes the inference request and returns the model response, treating the unauthenticated caller identically
    to a legitimate user.
  evidence_summary: docker-compose.yml:65 binds port 8000 to the host on all interfaces; llmforge service environment (lines
    66-70) contains only OLLAMA_URL, OLLAMA_MODEL, OLLAMA_EMBED_MODEL, and FACADE_ROUTE_PREFIX — no authentication middleware,
    API key, or JWT secret is configured.
  impact_description: Any internet-reachable actor gains full use of the LLM inference and RAG retrieval API without authentication,
    including the ability to query the knowledge base and consume GPU/CPU resources.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None evidenced at LLMForge application level; Nginx facade may enforce auth at /llmforge prefix but is
    bypassed via direct port 8000 access
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  mitigation_title: Enforce API authentication on all LLMForge endpoints and remove direct host port binding
  remediation:
    effort: Medium
    steps:
    - Remove or bind port 8000 to localhost only (127.0.0.1:8000:8000) in docker-compose.yml so the service is reachable only
      via the Nginx facade.
    - Add a Bearer token or API-key authentication middleware to every LLMForge FastAPI route that validates credentials before
      proxying to Ollama.
    - Confirm the Nginx /llmforge location enforces authentication (session cookie or JWT) and returns 401 for unauthenticated
      requests.
    code_example: null
