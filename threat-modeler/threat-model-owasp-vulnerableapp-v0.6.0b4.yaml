  title: No Rate Limiting on Inference and Proxy Endpoints
  scenario: 'LLM10 — Unbounded Consumption: An attacker sends a flood of concurrent POST /api/generate requests to port 11434
    without authentication. Each request specifies no max_tokens limit and provides a complex prompt designed to maximise
    token output. No rate limiting, request queuing cap, or per-source throttle is configured. GPU or CPU inference capacity
    is exhausted, causing legitimate LLMForge requests to queue indefinitely and the application''s AI features to become
    unavailable.'
  attack_steps:
  - Attacker sends tens of concurrent POST /api/generate requests to port 11434, each requesting a long unbounded completion
    from phi3:mini with no max_tokens parameter.
  - Ollama queues and processes each request sequentially, exhausting available CPU/GPU cycles; LLMForge inference calls begin
    timing out.
  - Attacker sustains the flood; the application's chat and embedding features remain unavailable for legitimate users for
    the duration of the attack.
  evidence_summary: docker-compose.yml line 21 exposes port 11434 to all interfaces without authentication. No OLLAMA_MAX_QUEUE,
    OLLAMA_NUM_PARALLEL, rate-limiting proxy, or max_tokens default is configured in the ollama service environment.
  impact_description: Sustained concurrent inference requests exhaust host GPU/CPU resources. LLMForge becomes unable to serve
    inference requests, causing complete unavailability of all LLM-backed features. The attack requires no credential, no
    prior access, and is sustainable indefinitely from a botnet.
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: None
  mitigation_title: Enforce rate limiting, max_tokens default, and request queuing bounds on the Ollama inference endpoint
  remediation:
    effort: Medium
    steps:
    - Remove the host port binding (docker-compose.yml:21) so unauthenticated internet callers cannot reach port 11434 directly.
    - Set OLLAMA_MAX_QUEUE and OLLAMA_NUM_PARALLEL environment variables in the ollama service to bound the request queue
      and parallelism.
    - In LLMForge, enforce a max_tokens parameter on every inference call to Ollama, preventing unbounded completions.
    - Deploy a rate-limiting reverse proxy (nginx limit_req or an API gateway) in front of any externally exposed LLM endpoint,
      capping requests per source IP per second.
    - 'Verify: from an external host, attempt to send 50 concurrent requests to port 11434; expect connection refused. From
      llmforge, verify inference succeeds within the configured token limit.'
    code_example: null
    verification: Run a load test (e.g. `ab -n 100 -c 50 http://<host>:11434/api/generate`) from outside the Docker network;
      expect connection refused. Inside the network, verify Ollama rejects or queues requests beyond OLLAMA_MAX_QUEUE.
    reference: https://owasp.org/www-project-top-10-for-large-language-model-applications/ LLM10
