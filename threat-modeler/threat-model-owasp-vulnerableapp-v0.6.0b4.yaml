abuse_case_analysis:
  status: completed
  reason: null
  cases:
  - id: AC-T-001
    title: Account Takeover via XSS + Token Hijacking
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Obtain persistent authenticated access as an arbitrary user without valid credentials.
    prerequisite: Attacker can get markup rendered in a victim's session, through stored content (e.g. feedback, comments,
      profile fields) or a crafted link.
    combined_risk: High
    chain_verdict: inconclusive
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-058
    blocking_mitigation_ids:
    - M-054
    steps:
    - step: 1
      outcome: Attacker JavaScript executes in the victim's browser session.
      verdict: confirmed
      finding_id: null
      evidence:
        file: src/main/resources/static/templates/PersistentXSSInHTMLTagVulnerability/LEVEL_1/PersistentXSS.js
        line: 22
      controls_found: []
      unverified: false
    - step: 2
      outcome: Token exfiltrated from local/session storage via the Step 1 payload.
      verdict: confirmed
      finding_id: F-058
      evidence:
        file: bin/main/static/templates/ClickjackingVulnerability/LEVEL_4/ClickjackingVulnerability.js
        line: 31
      controls_found: []
      unverified: false
    - step: 3
      outcome: Exfiltrated token accepted for a new session; absence of token binding / PKCE removes the last server-side
        revocation opportunity.
      verdict: inconclusive
      finding_id: null
      evidence:
        file: src/main/java/org/sasanlabs/service/vulnerability/sessionManagement/SessionManagementService.java
        line: 79
      controls_found: []
      unverified: false
  - id: AC-T-003
    title: Privilege Escalation to Admin via JWT Algorithm Confusion
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Forge an admin-role JWT without knowledge of the signing secret.
    prerequisite: Attacker can obtain any valid JWT issued by the system (e.g. by registering a free account).
    combined_risk: High
    chain_verdict: inconclusive
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-009
    blocking_mitigation_ids:
    - M-021
    steps:
    - step: 1
      outcome: Verifier accepts attacker-chosen `alg` (e.g. `none` or HMAC-with-public-key), allowing token re-signing without
        the secret.
      verdict: confirmed
      finding_id: F-009
      evidence:
        file: src/main/java/org/sasanlabs/service/vulnerability/jwt/impl/JWTValidator.java
        line: 104
      controls_found: []
      unverified: false
    - step: 2
      outcome: 'Forged `role: admin` claim is accepted as authoritative because the role is not re-fetched from the database
        per request.'
      verdict: refuted
      finding_id: null
      evidence:
        file: src/main/java/org/sasanlabs/service/vulnerability/jwt/JWTVulnerability.java
        line: 85
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a public repo, served by an unauthenticated
      route, or in an exposed directory).
    combined_risk: High
    chain_verdict: inconclusive
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-019
    blocking_mitigation_ids:
    - M-031
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the source repository or served without authentication.
      verdict: confirmed
      finding_id: F-019
      evidence:
        file: src/main/java/org/sasanlabs/service/vulnerability/jwt/keys/JWTAlgorithmKMS.java
        line: 41
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token signed with it (or the leaked credential)
        is accepted as authentic.
      verdict: refuted
      finding_id: null
      evidence:
        file: src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginService.java
        line: 32
      controls_found: []
      unverified: false
