  stride: Information Disclosure
  cwe: CWE-319
  title: Cleartext HTTP exposes credentials in transit — docker-compose.yml:107
  scenario: A passive network attacker on the same ISP segment intercepts HTTP/1.1 requests on port 80 between a user's browser
    and the facade (docker-compose.yml:107); session cookies, Authorization headers, and sensitive API response bodies traverse
    the wire in cleartext, enabling session hijacking and account takeover without any active MITM.
  evidence_summary: docker-compose.yml line 107 maps only port 80 (- "80:80") for the facade; no port 443 mapping appears
    in this file or in docker-compose.prod.yml, docker-compose.local.yml, or docker-compose.without_llm.yml. All user traffic
    including authentication material is transmitted without TLS encryption.
  impact_description: Every active user session is exposed to a network attacker; intercepted session cookies grant immediate
    authenticated access to the application. Authorization headers submitted to backend APIs are exposed in cleartext, revealing
    any API keys or Bearer tokens in use.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: None
  mitigation_title: Enforce HTTPS and redirect all HTTP traffic to TLS at the Nginx facade
  remediation:
    effort: Medium
    steps:
    - Provision a TLS certificate and configure the Nginx template with a port 443 HTTPS listener.
    - Add a port 80 server block returning a 301 redirect to the https:// equivalent URL for all requests.
    - 'Set Strict-Transport-Security: max-age=31536000; includeSubDomains to prevent TLS downgrade attacks.'
    - Update all compose files to add port 443 to the facade ports mapping.
    code_example: null
    verification: 'Run `curl -v http://<host>/api/user` and confirm a 301 redirect is returned with Location: https://; confirm
      the HTTPS response includes a Strict-Transport-Security header.'
    reference: 'CWE-319: Cleartext Transmission of Sensitive Information (https://cwe.mitre.org/data/definitions/319.html)'
