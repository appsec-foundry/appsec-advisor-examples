  title: Predictable session counter — SessionManagementService.java:107
  scenario: Level 2 session IDs are generated as SESSION- followed by a counter starting at 1000 and incrementing by one per
    login; an attacker who authenticates once learns their own session ID, derives the counter value, and enumerates adjacent
    IDs to hijack concurrently active users' sessions.
  attack_steps:
  - Attacker logs in to the Level 2 endpoint and observes the issued session ID, e.g., SESSION-1042.
  - Attacker derives that the counter is currently at 1042 and guesses IDs for sessions issued close in time (SESSION-1038
    through SESSION-1041).
  - Attacker sends requests to the Level 2 profile endpoint with the guessed session IDs and receives other users' profile
    data when a valid session is found.
  evidence_summary: SessionManagementService.java:107 generates session IDs using an AtomicInteger counter initialized at
    1000, producing a deterministic, guessable sequence with no randomness.
  impact_description: 'Session hijacking: attacker impersonates any recently logged-in Level 2 user. Under stated conditions
    (synthetic test accounts) no material business harm; technically full impersonation of any concurrent session is achievable.'
