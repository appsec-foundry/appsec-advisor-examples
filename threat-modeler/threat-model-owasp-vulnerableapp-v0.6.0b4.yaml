  title: Missing Authentication for Critical Function — docker-compose.yml:21
  scenario: An anonymous internet attacker connects directly to port 11434 on the host — bound to 0.0.0.0 with no credential
    check — and calls any Ollama API endpoint (model list, inference, pull, delete) without presenting any identity. Ollama
    processes the requests identically to legitimate LLMForge calls, exposing the full inference and model-management surface
    to the internet.
  attack_steps:
  - Attacker scans the target host IP on port 11434 and receives HTTP 200 from GET /api/tags, confirming an unauthenticated
    Ollama API and obtaining the list of loaded models.
  - Attacker sends POST /api/generate or POST /api/chat to port 11434 with an arbitrary prompt and receives model inference
    output, bypassing any application-level controls enforced by LLMForge.
  - Attacker sends POST /api/pull to load an attacker-chosen model from a public registry, substituting the running inference
    target without application awareness.
  - Attacker sends DELETE /api/delete to remove the phi3:mini or nomic-embed-text model, causing all LLMForge inference and
    embedding requests to fail.
  evidence_summary: docker-compose.yml line 21 binds Ollama's port 11434 to 0.0.0.0 on the host without any authentication
    middleware, firewall rule, or reverse-proxy guard configured in this compose file.
  impact_description: 'Any internet-reachable host can invoke the complete Ollama REST API: enumerate loaded models, perform
    unrestricted inference, delete or replace models, and exhaust GPU/CPU resources. The embedding model nomic-embed-text
    is equally exposed, enabling adversarial embedding queries. No LLMForge-level rate limiting, prompt control, or authentication
    applies to direct API calls.'
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: None
  mitigation_title: Restrict Ollama port 11434 to localhost or remove the host binding in docker-compose.yml
  remediation:
    effort: Low
    steps:
    - In docker-compose.yml, change the ollama service port binding from '11434:11434' to '127.0.0.1:11434:11434', or remove
      the ports section entirely so Ollama is only reachable on the internal Docker network by llmforge.
    - If external access is required for development, place an authenticating reverse proxy (e.g. nginx with HTTP Basic Auth
      or a bearer-token check) in front of port 11434.
    - Add a network-level firewall rule (iptables/ufw/cloud security group) to block inbound TCP 11434 from all external sources
      as a defence-in-depth measure.
    - 'Verify: run `curl http://localhost:11434/api/tags` from outside the Docker host; expect connection refused or 401.'
