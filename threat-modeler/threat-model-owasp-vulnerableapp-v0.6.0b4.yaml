  stride: Repudiation
  cwe: CWE-778
  title: Missing Security Audit Logging Across Runtime Services
  scenario: No logging configuration in the Ollama service records who called the inference API, what prompts were sent, which
    model was used, or what responses were returned. After an incident — misuse, data exfiltration via the model, or model
    deletion — there is no forensic record to reconstruct the sequence of requests or attribute them to a caller.
  evidence_summary: docker-compose.yml contains no log driver configuration, no OLLAMA_LOG_LEVEL or equivalent environment
    variable for audit logging, and no sidecar log exporter for the ollama service. The controls-context confirms no access
    control or audit trail exists.
  impact_description: Inference abuse (jailbreaks, bulk data extraction via prompts, model replacement) cannot be detected
    after the fact. Security-relevant events such as DELETE /api/delete, POST /api/pull, and all inference calls are unattributed
    and irrecoverable, preventing incident response and compliance reporting.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None
  mitigation_title: Enable structured request logging for the Ollama service and forward logs to a centralised audit sink
  remediation:
    effort: Medium
    steps:
    - Set `OLLAMA_DEBUG=1` or configure a structured log driver (e.g. json-file with log rotation) in the ollama service to
      capture all API requests including model, caller IP, and operation.
    - Add a log forwarder (Fluentd, Vector, or Promtail) in docker-compose.yml to ship Ollama container logs to a centralised
      SIEM or append-only log store.
    - Instrument the llmforge service to log a correlation ID with each Ollama API call so requests can be linked to the originating
      user session.
    - 'Verify: send a test POST /api/generate and confirm a structured log entry with timestamp, endpoint, and model name
      appears in the log store.'
    code_example: null
    verification: Send a test inference request and check the centralised log store for an entry containing the request timestamp,
      endpoint path, and model identifier.
    reference: https://owasp.org/www-project-top-10-for-large-language-model-applications/ LLM09
