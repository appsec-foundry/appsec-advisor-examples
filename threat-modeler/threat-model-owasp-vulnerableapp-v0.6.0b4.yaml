    line: 107
  - file: docker-compose.yml
    line: 65
  - file: docker-compose.yml
    line: 82
  - file: docker-compose.yml
    line: 87
  - file: docker-compose.yml
    line: 21
  confidence: confirmed
  resolution_status: resolved
  sources:
