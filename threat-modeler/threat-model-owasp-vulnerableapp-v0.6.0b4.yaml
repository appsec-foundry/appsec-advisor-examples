  title: Pull_request_target uses unpinned script actions — onboard_sasanlabs.yml:4
  scenario: 'onboard_sasanlabs.yml triggers on `pull_request_target` (line 4), which runs in the privileged context of the
    base branch and has access to repository secrets. All four `actions/github-script@v7` steps (lines 19, 51, 83, 96) are
    pinned only to a mutable major-version tag. A supply-chain attacker who compromises github-script v7 can execute arbitrary
    JavaScript in this privileged context, accessing GH_TRAFFIC_TOKEN (a long-lived custom token) and using the declared `issues:
    write` and `pull-requests: write` permissions to create unauthorized repository activity under the CI identity.'
  attack_steps: null
  evidence_summary: 'onboard_sasanlabs.yml:4 uses trigger `pull_request_target` (recon signal `pull-request-target` at onboard_sasanlabs.yml:4).
    Lines 7-9 declare `permissions: issues: write, pull-requests: write` (recon signals `permissions-write` at lines 8-9).
    Lines 19, 51, 83, 96 use `actions/github-script@v7` (mutable tag). Line 21 passes GH_TRAFFIC_TOKEN to the action.'
  impact_description: A compromised github-script action in this context can exfiltrate GH_TRAFFIC_TOKEN, create unauthorized
    issues or comments under the CI bot identity, or enumerate repository data — using the granted write permissions in a
    context triggered by any external PR author.
