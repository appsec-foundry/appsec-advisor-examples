tier_root_causes:
  server:
  - Internal services bound to host ports without authentication enforcement
  - 'Defective auth primitives: alg:none, null-byte bypass, client-stored roles'
  - User input concatenated into SQL, shell commands, XML parsers, and file paths
  - Mutable CI action tags and floating image refs run with write-all GITHUB_TOKEN
  - Credentials hardcoded in source and exposed via cleartext HTTP transport
  data:
  - H2 web console accessible without authentication, enabling direct SQL execution
  - GRANT ALL on DataSource permits schema modification and data destruction
  - PLAIN algorithm stores cleartext passwords in the database schema
