attack_surface:
- entry_point: POST /scanner/benchmark
  protocol: HTTP
  auth_required: false
  notes: 'Unauthenticated scanner benchmark ingest: accepts arbitrary JSON findings and writes files to disk; missing auth
    on a data-modifying management endpoint'
  relevance_tags:
  - missing-auth
- entry_point: ANY LEVEL_{level}
  protocol: HTTP
  auth_required: false
  notes: 'Password reset vulnerability level handler: processes token-based account recovery with deliberately weak token
    generation'
- entry_point: ANY Level{level}
  protocol: HTTP
  auth_required: false
  notes: 'Password reset Level{level} variant: alternate capitalization route for the same deliberately weak reset flow'
- entry_point: ANY IDORVulnerability
  protocol: HTTP
  auth_required: false
  notes: 'IDOR vulnerability endpoint: accepts user-controlled IDs for direct object access without authorization checks'
- entry_point: POST /clearCache
  protocol: HTTP
  auth_required: false
  notes: 'Unauthenticated cache clear: state-mutating POST with no authentication; allows any caller to purge cached responses'
  relevance_tags:
  - missing-auth
- entry_point: ANY /allEndPoint
  protocol: HTTP
  auth_required: false
  notes: 'Endpoint discovery: returns full list of all vulnerability endpoints; aids attacker reconnaissance'
- entry_point: ANY /VulnerabilityDefinitions
  protocol: HTTP
  auth_required: false
  notes: 'Vulnerability definition catalog: returns structured vulnerability metadata for all modules'
- entry_point: ANY /allEndPointJson
  protocol: HTTP
  auth_required: false
  notes: 'JSON endpoint catalog: machine-readable version of all endpoint definitions'
- entry_point: ANY /scanner
  protocol: HTTP
  auth_required: false
  notes: 'Scanner integration root: entry point for scanner configuration and grading surface'
- entry_point: ANY /scanner/dast
  protocol: HTTP
  auth_required: false
  notes: 'DAST ground-truth feed: returns expected DAST findings used for benchmark grading; exposes attack surface shape'
- entry_point: ANY /scanner/sast
  protocol: HTTP
  auth_required: false
  notes: 'SAST ground-truth feed: returns expected SAST findings including source locations and CWE mappings'
- entry_point: ANY /scanner/metadata
  protocol: HTTP
  auth_required: false
  notes: 'Scanner metadata: exposes scanner configuration and supported scan types'
- entry_point: ANY /sitemap.xml
  protocol: HTTP
  auth_required: false
  notes: 'Sitemap: exposes full URL inventory of vulnerability endpoints to crawlers and scanners'
- entry_point: ANY /email
  protocol: HTTP
  auth_required: false
  notes: 'Email controller root mapping: activates the email test surface (unsafe profile)'
- entry_point: POST /test
  protocol: HTTP
  auth_required: false
  notes: 'Unauthenticated email send: POST with arbitrary recipient, subject, and body parameters; no authentication; SSRF/phishing
    relay risk'
  relevance_tags:
  - management
  - missing-auth
- entry_point: H2 database web console at /VulnerableApp/h2
  protocol: HTTP
  auth_required: false
  notes: spring.h2.console.path=/h2 in application.properties; no explicit auth guard in source; grants interactive SQL against
    the in-memory database
- entry_point: Ollama inference API on port 11434
  protocol: HTTP
  auth_required: false
  notes: docker-compose.yml line 21 exposes 11434:11434 to host; Ollama has no built-in authentication; any host-network caller
    can invoke model inference or list/pull models
- entry_point: LLMForge adapter API on port 8000
  protocol: HTTP
  auth_required: false
  notes: docker-compose.yml line 65 exposes 8000:8000 to host; no authentication configuration found in compose environment;
    proxies to Ollama without credential checks
- entry_point: Mailpit web UI on port 8025
  protocol: HTTP
  auth_required: false
  notes: docker-compose.yml line 82 exposes 8025:8025; Mailpit web UI has no password configured; all captured emails including
    password reset tokens are readable by any caller
- entry_point: Mailpit SMTP on port 1025
  protocol: SMTP
  auth_required: false
  notes: docker-compose.yml line 80 exposes port 1025; MP_SMTP_AUTH_ALLOW_INSECURE=1 set; any caller can relay email through
    this server
