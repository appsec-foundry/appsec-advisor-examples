threats:
- local_id: auth-006
  threat_category_id: TH-01
  additional_categories: []
  stride: Tampering
  cwe: CWE-89
  title: SQL Injection
  scenario: An attacker sends username `' OR '1'='1' --` and any password to the Level 1 login endpoint; AuthLoginService.authenticateLevel1SQLi
    concatenates the value into the SQL WHERE clause, turning it into an always-true predicate that bypasses credential verification
    and returns the first user record as authenticated.
  attack_steps:
  - Attacker submits username `' OR '1'='1' --` and any password string to the POST /authentication Level 1 endpoint.
  - authenticateLevel1SQLi at AuthLoginService.java:44 concatenates the value, producing `WHERE level=1 AND username='' OR
    '1'='1' --' AND password='...'`.
  - H2 evaluates the always-true OR condition; JdbcTemplate returns all users; the first row is used as the authenticated
    user.
  - Attacker receives a success response with the first user's data and gains an authenticated session without valid credentials.
  evidence_summary: AuthLoginService.java:44 builds the SQL query using direct string concatenation of the username request
    parameter; no PreparedStatement or parameterized binding is used, making the query injectable.
  impact_description: 'Authentication bypass via SQL injection: attacker authenticates as any existing user including privileged
    accounts. Under stated conditions (synthetic test data) no material business harm; technically complete credential bypass
    is achievable.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None at the sink; BCrypt is used for other levels but Level 1 uses raw concatenation
  mitigation_title: Replace string-concatenated query in authenticateLevel1SQLi with a parameterized JdbcTemplate call
  remediation:
    effort: Low
    steps:
    - Replace the string-concatenated `sql` variable at AuthLoginService.java:42-47 with a parameterized JdbcTemplate.query
      call using `?` placeholders and passing username/password as bound parameters.
    - Add a test submitting `' OR '1'='1' --` as username and asserting authentication failure is returned.
    code_example: null
    verification: POST username=`' OR '1'='1' --` and any password to the Level 1 endpoint; expect authentication failure,
      not a success response with user data.
    reference: https://cwe.mitre.org/data/definitions/89.html
  evidence:
  - file: src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthLoginService.java
    line: 44
  mechanism_trace:
    input:
      file: src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthLoginService.java
      line: 40
    sink:
      file: src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthLoginService.java
      line: 44
    connection: username request parameter received at method signature line 40 flows directly into SQL WHERE clause via Java
      string concatenation at line 44 with no sanitization or parameterization
    control:
      status: absent-at-sink
      location:
        file: src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthLoginService.java
        line: 44
      explanation: No PreparedStatement, parameterized binding, or input validation is present at the concatenation sink;
        the complete SQL string including untrusted username is passed directly to jdbcTemplate.query
