    any downstream role check that trusts the cookie without server-side re-validation grants elevated privileges.
  evidence_summary: IDORLoginController.java:141 sets a `role_level3` cookie with the user's role as a plain unprotected string
    with no HMAC or signing; level 4 at line 153 applies only Base64 encoding (IDORLoginController.java:153-156), which is
    trivially reversible, providing no integrity guarantee.
  impact_description: Authenticated attacker elevates their own role to admin by modifying the client-side cookie. Under stated
    conditions only synthetic roles in a training app are affected; no material business harm. Technically any role claim
    in the cookie can be tampered to gain administrative privileges.
