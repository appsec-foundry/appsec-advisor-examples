  title: JWT null-byte truncation bypasses HMAC signature — JWTValidator.java:76
  scenario: An attacker appends a URL-encoded null byte to a JWT signature; customHMACNullByteVulnerableValidator detects
    the null byte at JWTValidator.java:76, truncates the signature string at that position, then compares the truncated signature
    against the HMAC of the same token, allowing forged signatures that share only a matching prefix with the legitimate signature.
  attack_steps:
  - Attacker possesses a valid JWT and computes the HMAC of a modified payload to obtain a partial signature prefix that matches
    the first N bytes of a legitimate signature.
  - Attacker appends a URL-encoded null byte (%00) after the matching prefix in the signature field.
  - customHMACNullByteVulnerableValidator finds the null byte at JWTValidator.java:72-74, truncates the signature at the null
    byte index at line 76.
  - The truncated signature string is passed to customHMACValidator, which may match if the prefix collision is achieved or
    the truncation removes the mismatch.
  evidence_summary: JWTValidator.java:76 truncates the signature to the position of a null byte found in the third JWT part,
    reducing the effective signature comparison length and enabling partial-signature bypass attacks.
  impact_description: 'JWT signature integrity weakened: an attacker who can craft a signature prefix matching the truncated
    comparison has a higher success probability in signature bypass. Under stated conditions no material business harm; technically
    partial signature forgery is feasible.'
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: HMAC validation is performed after truncation; no check that the signature is free of null bytes before
    comparison
  mitigation_title: Reject JWT signatures containing null bytes in customHMACNullByteVulnerableValidator
  remediation:
    effort: Low
    steps:
    - Replace the null byte truncation block at JWTValidator.java:72-76 with a validation step that returns false whenever
      any part of the token contains a URL-encoded null byte.
    - Add a test submitting a signature with an embedded %00 and asserting validation fails.
    code_example: null
    verification: Submit a JWT whose third part contains %00 followed by additional characters; expect validation failure,
      not success.
    reference: https://cwe.mitre.org/data/definitions/20.html
